openapi: 3.1.0
info:
  title: Pawloop API
  version: 0.1.0
  description: |
    Pawloop(포루프) — 반려동물 산책·동반장소·커뮤니티 앱의 REST API 계약.

    이 문서는 **design-first(계약 우선)** 로 작성되었습니다. 프론트엔드(Flutter)가 먼저 만들어졌고,
    프론트가 실제로 필요로 하는 데이터를 기준으로 이 계약을 정의합니다. 백엔드(Spring Boot + MySQL 공간형)는
    이 계약을 구현합니다.

    **이 파일이 API 계약의 단일 출처(SSOT)입니다.** 같은 폴더의 `api-spec.md` 는 사람이 읽는 요약이며,
    두 문서의 값이 충돌하면 **언제나 이 파일이 우선**합니다.

    - 인증: JWT Bearer(HS256). `sub` 는 서버가 발급한 **불투명 사용자 키**입니다.
      이메일이라고 가정하거나 문자열을 파싱하지 마세요. 사용자 식별 정보가 필요하면 `GET /auth/me` 로 조회합니다.
      (발급 규칙은 서버 내부 사항이며 예고 없이 바뀝니다. 클라이언트 계약은 어느 쪽이든
       "파싱하지 않는 불투명 키"입니다.)
    - 소셜 로그인 계정과 이메일 가입 계정은 **같은 경로로 동작합니다.** 어느 쪽 토큰으로든
      `GET /auth/me`·`PUT /auth/me`·`DELETE /auth/me`·`POST /auth/logout` 이 200/204 입니다.
      (2026-08 이전에는 소셜 계정에서 400 이었습니다. #5 에서 해소되었습니다.)
    - 인증 요구 여부는 **각 오퍼레이션의 `security` 선언이 정본**입니다. 아래 한 줄은 요약일 뿐입니다:
      MVP에선 읽기(장소 조회 등)는 비인증 허용, 쓰기(산책 저장·글 작성)는 인증 필요.
    - **오류 응답 규약** (#44 · #10)
      - `401` 은 **본문이 없습니다.** 인증 계층이 상태 코드만 돌려줍니다 — 토큰 없음·위조·만료·
        탈퇴한 계정의 살아 있는 토큰·이메일 로그인의 자격증명 실패가 전부 같은 모양입니다.
      - 그 밖의 오류는 **전부** `Error` 스키마(`{ error: { code, message, traceId } }`)입니다.
        `code` 는 HTTP 상태 하나당 하나로 고정된 닫힌 목록입니다(`Error.code` 의 enum 참조).
        (2026-08 이전에는 `{status, error, message, path, timestamp}` 였고, `SocialController` 는
         또 다른 `{ "error": "문자열" }` 을 돌려줬습니다. #10 이 하나로 합쳤습니다.)
      - **알 수 없는 경로는 `404`** 입니다. `message` 는 `요청한 경로를 찾을 수 없습니다.`
      - `500` 의 `message` 에는 **원인이 실리지 않습니다.** 고정 문구이고, 이 요청을 지목하는
        열쇠는 `error.traceId`(= `X-Correlation-Id` 응답 헤더)입니다. 서버 로그에서 그 ID 로
        원인을 찾습니다 — 예외 메시지를 그대로 실으면 SQL 조각·경로·이메일이 새어 나갑니다.
      - 컨트롤러가 `403`·`404`·`409` 를 명시적으로 정해 던지면 그 코드가 그대로 나갑니다.
        (2026-08 이전에는 전부 `500` 이었습니다.)
    - **목록의 기본은 커서 봉투**(`items`/`nextCursor`/`hasMore`)입니다. 예외는 셋뿐이고
      전부 **상한이 코드에 있는 목록**입니다 — `GET /api/dogs`(`DogService.MAX_PETS`),
      `GET /api/chat/rooms`(사용자가 든 방), `GET /api/groups/{groupId}/care-logs`(하루치).
      사용자가 **계속 쌓는** 목록은 봉투여야 합니다. 배열로 내보낸 뒤 봉투로 바꾸는 것은
      파괴적 변경이라, 구현이 붙기 전이 유일하게 공짜인 시점입니다. (ADR-0017 규약 2)
      채팅 메시지만 `ChatMessagePage`(`roomSeq` 기반)라는 다른 봉투를 씁니다 — ADR-0011 이
      정한 의도된 예외입니다.
    - **남의 것과 없는 것은 구별되지 않습니다.** 둘이 다른 코드를 받으면 id 를 훑어
      "있는 것/없는 것" 을 가려낼 수 있습니다. **어느 코드로 합칠지는 도메인이 정하고
      그 이유를 여기 적습니다** — 지금 이 계약에는 두 선택이 다 있고 둘 다 옳습니다.
      (ADR-0017 규약 3)
      - **Dogs·Walks 는 `404` 로 합칩니다.** 남의 산책·남의 반려동물은 없는 것과
        바이트까지 같습니다.
      - **Chat·Groups 는 `403` 으로 합칩니다.** 없는 방·없는 그룹도 비멤버와 같은 403 입니다.
        여기서 404 를 주면 id 를 훑어 "있는 가족/없는 가족" 을 가려낼 수 있고, 가족의 존재
        여부는 그 가족에게만 의미가 있습니다.
    - 전역 `security` 를 상속하는 오퍼레이션은 **반드시 `401` 을 선언**합니다. 형제끼리
      어긋나면 그건 설계가 아니라 누락입니다. (ADR-0017 규약 3)
    - **인증이 선택인 경로**는 `security: []` 가 아니라 `security: [{}, {bearerAuth: []}]`
      입니다. `security: []` 는 인증을 계약에서 **제거**하므로 서버가 토큰을 읽지 않아야 하고,
      그러면 개인화 필드는 영원히 `null` 인 죽은 필드가 됩니다. (ADR-0017 규약 6)
    - **부분 수정은 생성 스키마를 재사용하지 않습니다.** 전용 `*Patch` 스키마에
      `minProperties: 1` 을 걸고 `requestBody.required: true` 를 둡니다. (ADR-0017 규약 4)
    - **사람 참조는 `PersonRef`** (`userId`+`nickname`) 하나입니다. `ChatMessage` 만
      `senderUserId`/`senderName` 평평한 쌍을 쓰며, 이는 명시적 예외입니다. (ADR-0017 규약 5)
    - **응답에 쓰이는 모든 객체 스키마는 `required` 를 선언**합니다. `required` 는 "서버가
      **항상** 채우는 필드" 의 최소집합입니다 — 넣지 말아야 할 것을 넣으면 그 순간부터 서버가
      계약 위반이고, 빼야 할 것을 빼면 계약이 아무것도 보장하지 않습니다. (ADR-0017 규약 1)
    - **시각과 하루 경계** (ADR-0017 없음 — 이슈 #209 `Groups-medium-6` 이 정한 것입니다)
      - **`format: date-time` 필드는 RFC3339 오프셋을 포함합니다** — `2026-09-03T00:30:00Z`
        처럼 `Z` 또는 `+09:00` 이 붙습니다. 오프셋 없는 문자열(`2026-09-03T00:30:00`)을
        받으면 앱의 `DateTime.parse` 가 그것을 **기기 지역 시각**으로 읽으므로, 해외에 있는
        가족이 보면 그 차이만큼 어긋난 시각이 그려집니다.
      - **"오늘" 은 `Asia/Seoul` 입니다.** 하루 경계가 여기서 정해집니다 — 한국 반려인을 위한
        앱이라 사용자가 해외에 있어도 "오늘의 케어" 는 집의 하루를 뜻합니다(가족이 나눠 보는
        기록이기 때문입니다). 서버의 `ClockConfig.SERVICE_ZONE` 이 이 존을 **빈에 박습니다** —
        `systemDefaultZone()` 이면 배포의 `TZ` 환경변수 하나로 조용히 바뀌고, 그러면 KST
        00:00~08:59 의 케어 기록이 '어제' 가 되어 **이중 급여 방지 화면에서 사라집니다.**
      - **이제 전부 오프셋을 답니다** (2026-09-03, 이슈 #248). 그전까지 열 필드가 오프셋 없이
        나갔습니다 — `ChatMessage.createdAt`·`deletedAt`, `ChatRoom.createdAt`,
        `Group.createdAt`, `GroupMember.joinedAt`, `User.createdAt`·`updatedAt`,
        `ChatInvite.createdAt`·`expiresAt`, 그리고 채팅 신고 접수 응답의 `createdAt` 입니다.
        (뒤의 셋은 이슈가 세던 일곱에 없었습니다 — 응답 DTO 가 아니라 뷰라서 목록에서
        빠졌습니다.)
      - **표에 담기는 값은 UTC 입니다.** `LocalDateTime.now()` 는 JVM 기본 존을 읽는데 개발
        기계는 KST 고 배포 컨테이너는 UTC 라, 같은 코드가 환경마다 다른 값을 넣었습니다 —
        dev DB 에 실제로 두 존이 섞여 있었습니다. 이제 `ChatTime`·`UserTime`·`CommunityTime`
        이 UTC 로 눕혀 넣고, 응답에서 `Instant` 로 세웁니다. `DateTimeFieldsAreInstantTest`
        가 **이 계약 파일을 목록의 출처로 삼아** 빠진 필드가 없는지 지킵니다.
    - 좌표: `lat`(위도), `lng`(경도). (관광공사 원본은 mapy=위도, mapx=경도)
    - **거리 단위** (#209 `Walks-medium-5`): 저장·전송은 **미터 정수**(`Walk.distanceM`), 통계만
      **km 실수, 소수 둘째 자리에서 반올림**(`WalkStats` 의 `*Km`). 목록 합계와 통계가 어긋나면
      통계(서버 반올림)가 정본입니다. `Place.distM` 은 성격이 다릅니다 — 기준점으로부터의 거리라
      미터 실수이고 `/nearby` 에서만 채워집니다.
    - **201 에 `Location` 헤더를 붙이지 않습니다** (#209 `Dogs-low-1`). 만든 것의 id 는 응답 본문에
      있고 앱은 그것을 씁니다(`POST /api/dogs`·`/api/walks`·`/api/groups`·케어 기록·게시글 전부 같습니다).
      인증 리다이렉트의 `Location` 은 302 의 것이라 별개입니다.
    - 리네임 진행 중: 제품명은 Pawloop, 도메인·딥링크 스킴은 당분간 heattrip 을 유지합니다
      (`https://api.heattrip.link`, `heattrip://login-callback`).
    - `미구현` 이라고 적힌 오퍼레이션은 계약만 있고 백엔드 핸들러가 없습니다(2026-08 기준).
      Prism 목 서버로는 통과하지만 실서버에서는 404 입니다.
servers:
  - url: https://api.heattrip.link
    description: 운영(예정 — 패키지/도메인 리네임 전까지 기존 유지)
  - url: http://localhost:4010
    description: Prism 목 서버 (design-first mock)
  - url: http://10.0.2.2:8080
    description: 로컬 백엔드 (안드로이드 에뮬레이터 → 호스트)

tags:
  - name: Auth
    description: |
      소셜 로그인(카카오·구글) · 이메일 가입/로그인 · 토큰 · 내 정보.
      네이버는 백엔드 설정이 남아 있으나 제품 결정상 **보류**입니다(#15).
      지원 공급자의 단일 출처는 `components.parameters.Provider` 의 enum 입니다.

      **인가 경계** — 비인증 허용은 `/auth/signup`, `/auth/login`, `/auth/oauth/**`,
      `/auth/token/refresh`, 그리고 Spring Security 가 처리하는 `/oauth2/**`·`/login/oauth2/**` 뿐입니다.
      (그 밖의 비인증 GET — 장소 `/api/places/*`, 커뮤니티 읽기, 산책 안전 지수 `/api/walk-safety/now` — 는
      각 태그 설명에 이유가 있습니다.)
      `/auth/me`(GET·PUT·DELETE)와 `/auth/logout` 은 **반드시 bearerAuth 검증을 거쳐야 합니다.**
      (구현 참조: `SecurityConfig` 의 permitAll 목록에 `/auth/**` 를 통째로 넣지 말 것 — 이슈 #23)
  - name: Courses
    description: |
      내가 걸은 길 중에 "여기 좋다" 고 남긴 것(#339). 선은 **서버가 그 산책에서 베껴 와**
      양 끝 100m 를 자릅니다 — 앱이 보낸 선을 믿으면 안 자르는 옛 앱 하나가 그 사람의 집 앞을
      공개합니다. 기본은 비공개이고, 공개는 사용자가 명시적으로 합니다.
  - name: WalkSafety
    description: |
      산책 안전 지수의 재료(#336) — 기상청 초단기실황과 에어코리아 미세먼지를 **서버가 대신** 부릅니다.
      앱은 5km 격자 번호(nx, ny)만 보내고 위경도는 보내지 않습니다. **인증이 없습니다** — 누구의
      격자인지 서버가 모르게 두는 것이 위치를 서버에 안 보내는 A안(#235)의 뜻에 가깝습니다. 판정
      (좋아요·짧게·피하세요·추워요)은 앱이 합니다.
  - name: Dogs
    description: |
      반려견 프로필. **주인은 등록한 계정 하나**이고(`dog.user_id`), 목록·상세·수정·삭제가 전부 그
      사람의 것만 봅니다.

      **남의 반려동물과 없는 반려동물은 바이트까지 같은 `404`** 입니다(ADR-0017 규약 3). `403` 을 주면
      "그 id 는 존재한다" 를 알려 주는 셈이라, id 를 훑으면 남이 몇 마리를 키우는지 셀 수 있습니다.
      그래서 Dogs 오퍼레이션에는 `403` 이 없습니다.

      **가족 공유 가시성은 아직 정하지 않았습니다** (#209 `Dogs-high-3`). 초대받아 들어온 가족은
      서로의 반려동물을 이 API 로 볼 수 없고, `Group` 에도 반려동물이 없습니다. 정하는 날
      `GET /api/groups/{groupId}/dogs`(그룹 구성원의 반려동물)를 열고, 케어 기록이 `dogId` 를 받기
      시작합니다(`CareLogInput` — #154 가 FK 만 먼저 걸어 뒀습니다). 그 전까지 `CareLog.dogId` 는 항상 `null` 입니다.
  - name: Consents
    description: |
      약관 동의의 기록 (이슈 #190). 서버는 "누가 어느 문서의 어느 버전에 언제 동의(철회)했는가" 만
      적습니다. 문서와 그 최신 버전은 앱이 들고 있고, 재동의가 필요한지도 앱이 정합니다.
  - name: Push
    description: |
      푸시 알림 (이슈 #83). 기기 토큰 원장과 전체 끄기. 방별 음소거는 멤버십의 속성이라 `Chat` 의
      `PUT /api/chat/rooms/{roomId}/mute` 다. 발송은 메시지 저장이 **커밋된 뒤 다른 스레드에서** 나가고,
      Firebase 키가 없으면 서버는 발송만 끈 채로 뜬다 — 등록·설정은 그대로 저장된다.
  - name: Places
    description: 반려동반 장소(관광공사) · 동물병원/펫샵/산책로 레이어
  - name: Walks
    description: 산책 기록(GPS 경로) · 통계
  - name: Community
  - name: Media
    description: |
      사진·영상 올리기 (#429). **업로드가 먼저고 글이 나중입니다** — 여기서 받은 `id` 를
      `PostInput.mediaIds` 에 실어 글을 만듭니다. 올려 놓고 글을 안 쓴 것은 하루 뒤 서버가
      거둡니다.

      **위치 메타데이터는 기기에서 지우고 올립니다.** 폰 카메라는 EXIF 에 촬영 좌표를 넣고,
      그대로 올리면 좌표가 단말을 떠납니다(#235 A안). 앱은 긴 변 1600px 로 다시 인코딩해
      올리며 그때 EXIF 가 통째로 사라집니다 — `UPLOAD_LOCATION` 과 무관하게 무조건입니다.

      **영상은 이 문으로 안 옵니다.** `api.heattrip.link` 앞의 Cloudflare 가 요청 본문을
      100MB 까지만 받아서, 영상은 세 단계입니다 — `POST /media/videos` 로 자리를 잡고(서명 PUT),
      앱이 S3 에 직접 올리고, `POST /media/{mediaId}/complete` 로 서버가 확인합니다. 한 글에
      영상은 하나입니다.
    description: 게시판 · 댓글 · 반응
  - name: Bookmarks
    description: 저장한 장소
  - name: Schedules
    description: |
      일정표 — 앞으로 할 일(#418, 부모 #416). 지금까지 앱은 **지나간 일만** 알았습니다
      (`care_log` 는 서버 시계라 미래를 못 넣고, `walk` 은 끝난 산책입니다). 그래서 가족은
      병원 일정을 채팅으로 조율했고 그 결정은 스크롤 위로 사라졌습니다.

      **주인이 셋입니다** — 아이(`dog`) · 가족 그룹(`group`) · 크루(`room`, #417). 셋이 한 표에
      살고, `ownerKind` 를 생략하면 **내가 볼 수 있는 전부**가 한 목록으로 옵니다. 달력의 기본이
      합쳐 보기라 화면이 두 번 부르게 만들지 않습니다. `room` 은 값만 열어 두었고 서버가 아직
      **400** 으로 거절합니다 — 확인할 멤버십이 #417 전에는 없습니다.

      **거절은 전부 404 입니다.** 남의 아이 일정도, 안 든 그룹의 일정도, 없는 id 도 같은 404 입니다.
      403 을 주면 "그 id 는 있다" 를 알려 주게 되고, 그러면 id 를 훑어 남의 가족 구성을 짐작할 수
      있습니다. 예외는 **편집 충돌(409)** 하나입니다 — 그건 권한이 아니라 "지금 값이 달라졌다" 는
      사실이라 화면이 알아야 합니다.

      **좌표가 없습니다** — 요청에도 응답에도 없고 표에도 컬럼이 없습니다(A안 #235).
  - name: Crews
    description: |
      동네 반려인 모임(#417). **방·멤버십·초대는 하나도 새로 안 만듭니다** — `chat_room` 이
      처음부터 범용 다중 방이라(`origin_kind='CREW'`), 크루가 더하는 것은 이름·소개·동네·공개
      범위·정원 다섯뿐입니다. 근거: [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)

      **`crew_member` 표가 없습니다.** 크루의 멤버는 그 크루 방의 멤버이고 그것은
      `chat_room_member` 입니다. 그래서 **크루를 나가는 것과 방을 나가는 것이 같은 동작**입니다 —
      한쪽만 남는 상태가 구조적으로 없습니다.

      **방장도 컬럼이 아닙니다** — 그 방의 `OWNER` 멤버입니다. `owner` 필드는 그것을 읽어
      돌려주는 값이고, 고치기·강퇴가 그 값으로 갈립니다.

      **동네는 행정동 코드이지 좌표가 아닙니다**(#342 · A안 [#235]) — 사용자가 스스로 고른
      값이라 위치정보가 아니고, 찾기는 **시군구 앞 다섯 자리**로 합니다. 서버는 좌표를 받지도
      저장하지도 않습니다.

      **초대 크루는 안 든 사람에게 `404`** 입니다 — `403` 이면 id 를 훑어 어느 번호에 크루가
      있는지 셀 수 있습니다(ADR-0017 규약 3 과 같은 판단). 공개 크루는 보이되 **멤버 목록은
      안 줍니다** — 인원 수까지가 공개입니다.

      **만 14세 미만은 크루를 만들지도 들어가지도 못합니다**(`403`). 미성년 계정이 들어갈 수
      있는 방은 가족방뿐입니다(#82).

      **품앗이는 약속을 적는 자리까지입니다**(#417). 부탁을 올리고 한 명이 맡으면 **크루 소유
      일정 한 줄**이 생깁니다(`owner_kind=room`) — 그 줄이 그 크루 사람 모두의 달력에 뜨는 것이
      이 기능의 알맹이입니다. **결제·평점·보증·중개는 안 합니다** — 돈이 오가면 우리가 중개자가
      되고 사고 시 배상·신고 의무가 따라옵니다.

      **방장은 크루를 나갈 수 없습니다.** 나가려면 먼저 넘기고(`PUT /api/crews/{crewId}/owner/{userId}`),
      아무도 안 남았으면 지웁니다(`DELETE /api/crews/{crewId}`) — **혼자일 때만** 지워집니다.
      대화가 함께 사라지므로 남의 대화를 지우는 버튼은 두지 않습니다.

      초대 코드 **발급·회수는 채팅 것을 그대로 씁니다** — `POST /api/chat/rooms/{roomId}/invites`.
      코드로 들어오는 것만 크루 쪽에 따로 있습니다(돌려주는 것이 방이 아니라 크루라서입니다).
  - name: Groups
    description: |
      가족 그룹 · 오늘의 케어 공유 · 산책 주의사항

      **초대와 멤버십은 이 태그에 없습니다.** 초대코드는 `chat_room_invite`, 멤버십은
      `chat_room_member` 이고 둘 다 Chat 태그의 경로가 다룹니다
      ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).
      2026-08 이전에는 `POST /api/groups/join` 과 `Group.inviteCode` 가 여기 있었습니다 —
      그룹당 코드 하나가 영구히 사는 모양이라 만료·사용횟수·회수를 걸 자리가 없었고,
      멤버십 표가 둘이면 "가족인데 방에 없는 사람" 이라는 상태가 생깁니다. 이슈 #75 가
      정리했습니다. 지금 참여는 `POST /api/chat/invites/{code}/join` 입니다.
  - name: Chat
    description: |
      범용 다중 방 채팅. **가족 그룹 전용이 아닙니다** — 방은 `chat_room` 이고,
      가족 그룹은 `origin_kind`/`origin_ref` 로 방과 이어진 여러 출처 중 하나입니다.

      **순서·델타·미읽음은 전부 방별 `roomSeq` 하나로 풉니다.** `id`(AUTO_INCREMENT)를
      커서로 쓰지 않습니다 — 배정 시점과 가시성 시점이 달라 `afterId` 폴링이 메시지를
      영구히 건너뜁니다. 그래서 이 태그의 목록 응답은 공용 `Page`(`nextCursor`)를
      쓰지 않고 `lastSeq`/`hasMore` 를 직접 돌려줍니다.

      MVP 는 **폴링**(`afterSeq`)입니다. 소켓은 실측 트리거가 걸릴 때만 엽니다(M2.9).

security:
  - bearerAuth: []

paths:
  # ── 구현 없는 오퍼레이션의 표시 ──────────────────────────────
  #
  # 이 문서는 "서버가 무엇을 약속하는가" 의 단일 출처다(#4). 그래서 핸들러가 없는
  # 경로를 아무 표시 없이 실어 두면, 그것을 보고 만든 앱이 404 를 받는다.
  #
  #   x-status: planned    아직 구현이 없다. 계약을 먼저 둔 것이다(선행 계약).
  #   x-status: framework  구현은 있지만 우리 컨트롤러가 아니다(Spring Security 필터 등).
  #                        생성본(/v3/api-docs)에는 안 나오므로 따로 구분한다.
  #   (표시 없음)          컨트롤러 매핑이 실제로 있다.
  #
  # x-status-note 에 "왜 아직 없는가" 를 한 줄로 적는다. 무엇이 막고 있는지를 적어야
  # 다음 사람이 그 순서를 다시 추론하지 않는다.
  #
  # GeneratedOpenApiSpecTest 가 이 표시를 강제한다 — 표시 없는 오퍼레이션이 생성본에
  # 없으면 빨간불이다. 반대로 구현이 붙었는데 planned 가 남아 있어도 빨간불이다.
  # ─────────────────────────── Auth ───────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: |
        `AuthController.signup` 이 처리합니다. 성공은 **201 + `User`** 입니다(이슈 #10 에서 구현).

        **앱에서는 디버그 빌드에서만 열립니다**(ADR-0022). 사용자가 쓰는 로그인은 카카오·구글뿐이고,
        이 경로는 통합 테스트와 에뮬레이터 확인이 계정을 만드는 데 씁니다. 지우지 않습니다.

        > ⚠️ **2026-08 이전에는 `200 OK` + 본문 `"회원가입 성공"`(평문)이었습니다.**
        > 상태 코드와 본문 형태가 함께 바뀌었습니다. 200 만 성공으로 보던 클라이언트는
        > 201 도 성공으로 받아야 하고, 본문을 문자열로 읽던 코드는 JSON 으로 읽어야 합니다.

        같은 이메일이 이미 있으면 **409** 입니다. 예전에는 400 이었고, 앱은 "입력이 틀렸다"와
        "이미 가입돼 있다"를 구분할 수 없었습니다. 오류 본문은 공통 `Error` 이며
        409 의 `error.code` 는 `CONFLICT` 입니다.

        **이 응답에는 토큰이 없습니다.** 가입 직후 로그인 상태로 만들려면 클라이언트가
        `POST /auth/login` 을 한 번 더 호출해야 합니다 — 가입과 인증을 한 응답에 묶지 않는 것은
        의도입니다(가입 폼의 재시도가 토큰 발급을 반복하지 않습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일/비밀번호 로그인
      description: |
        `AuthController.login` 이 처리합니다. 응답은 `AuthTokens` JSON 입니다(이슈 #10 에서 구현).

        **앱에서는 디버그 빌드에서만 열립니다**(ADR-0022) — `/auth/signup` 과 같습니다.

        > ⚠️ **2026-08 이전에는 본문이 JSON 이 아니라 JWT 원문 문자열이었습니다.**
        > `response.body` 를 그대로 토큰으로 저장하던 클라이언트는 이제 `accessToken` 필드를
        > 읽어야 합니다. 그렇게 고치지 않으면 JSON 전체가 토큰으로 저장되어 모든 요청이 401 이 됩니다.

        `refreshToken` 이 여기에 실립니다 — 서버는 #9 부터 발급·저장하고 있었지만 응답에 실을
        자리가 없어 아무에게도 전달되지 않았습니다. `isNew` 는 이 경로에서 **항상 `false`** 입니다
        (이미 있는 계정으로 들어오는 경로라 답이 정해져 있습니다).

        **자격증명 실패는 본문 없는 401 입니다.** 가입되지 않은 이메일과 비밀번호 오류를
        구분하지 않습니다 — 구분해 주면 그 자체가 가입 여부를 묻는 조회 수단이 됩니다(#6).
        예전에는 두 경우 모두 **500** 이었습니다(`IllegalAccessException` 이 전역 처리기의
        catch-all 에 잡혔습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /oauth2/authorization/{provider}:
    get:
      x-status: framework
      x-status-note: |
        Spring Security 의 OAuth2 인가 엔드포인트다. 우리 컨트롤러가 아니라 필터가 처리하므로 생성본(/v3/api-docs)에는 안 나온다.
      tags: [Auth]
      summary: 소셜 로그인 시작(302 리다이렉트) — Spring Security OAuth2 진입점
      description: |
        앱(`flutter_web_auth_2`)이 실제로 여는 URL 입니다. 공급자 인증 화면으로 302 리다이렉트됩니다.
        인증 성공 시 백엔드가 앱 딥링크로 리다이렉트합니다:
        `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` (이슈 #14).

        **딥링크에는 토큰이 없습니다.** 쿼리 파라미터는 정확히 `code` 와 `state` 둘뿐입니다.
        앱은 받은 `code` 를 `POST /auth/oauth/{provider}/callback` 으로 교환해 `AuthTokens` 를
        받습니다. 코드는 **60초 살고 한 번 쓰면 죽습니다** — 두 번째 교환은 401 입니다.

        > **2026-08 이전에는 이 딥링크가 `?token=<JWT>&refresh=<refreshToken>` 이었습니다(#9).**
        > 커스텀 스킴(`heattrip://`)은 어느 앱이든 등록할 수 있고, URL 은 302 응답의 `Location`
        > 헤더(액세스·프록시 로그)와 브라우저 히스토리에 남습니다. 그 채널로 1시간짜리 액세스
        > 토큰과 14일짜리 refresh 토큰이 함께 나가고 있었습니다. 지금 나가는 것은 60초짜리
        > 1회용 난수뿐이라, 가로채도 쓸 수 있는 창이 사실상 없습니다. 서버는 이 리다이렉트에
        > 여전히 `Cache-Control: no-store` 를 붙입니다.

        > ⚠️ **`state` 는 앱이 만들어 앱이 대조합니다.** 인증을 시작할 때
        > `GET /oauth2/authorization/{provider}?state=<난수>` 로 보내면 서버가 그 값을 왕복 동안
        > 붙들었다가 딥링크에 그대로 실어 돌려줍니다. 돌아온 값이 보낸 값과 다르면 **로그인 실패로
        > 처리하세요** — 응답 바꿔치기를 막는 장치가 그것뿐입니다. `[A-Za-z0-9_-]{1,128}` 만
        > 통과합니다(그 밖의 값은 없는 것으로 취급되어 빈 `state` 가 돌아옵니다).
        >
        > ⚠️ **`state` 없이 시작한 로그인은 교환 단계에서 401 입니다(#14).** 빈 `state` 로 발급된
        > 코드는 `POST /auth/oauth/{provider}/callback` 이 거부합니다 — 그렇지 않으면 서버쪽
        > 대조의 존재 여부를 왕복을 시작한 쪽이 정하게 되어, `state` 를 생략하기만 하면
        > 두 번째 줄이 사라집니다. **항상 `state` 를 보내세요.**

        **실패도 같은 딥링크로 돌아옵니다**: `heattrip://login-callback?error=<code>`.
        앱은 `code` 와 `error` 중 어느 쪽이 실려 있는지로 성공/실패를 가릅니다.
        현재 서버가 보내는 `code` 는 다음이 전부입니다.

        | `error` | 뜻 | 앱이 할 일 |
        |:---|:---|:---|
        | `email_already_registered` | 같은 이메일이 다른 경로로 이미 가입돼 있다 (#7) | 기존 가입 방식으로 로그인하도록 안내 |
        | `account_state_invalid` | 인증 주체에 `users.id` 가 없어 토큰을 발급할 수 없다 (#5) | 일반 오류 안내 후 재시도 |
        | `authentication_failed` | 그 밖의 모든 실패(공급자 오류·사용자 취소 등)의 기본값 | 일반 오류 안내 후 재시도 |

        공급자가 돌려준 오류 코드가 `[a-z0-9_]{1,64}` 를 만족하면 그대로 전달될 수 있습니다.
        즉 목록은 닫혀 있지 않습니다 — **모르는 `code` 는 일반 오류로 처리**하세요.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 성공 딥링크에 그대로 실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}`.
            보내지 않으면 딥링크의 `state` 는 빈 값이고, 그 코드는 교환 단계에서 401 입니다(#14).
            사실상 필수입니다 — `required: false` 인 것은 이 경로가 302 를 막지 않기 때문입니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: 공급자 로그인 페이지로 리다이렉트
          headers:
            Location:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /login/oauth2/code/{provider}:
    get:
      x-status: framework
      x-status-note: |
        Spring Security 의 리다이렉트 수신 엔드포인트다. 우리 컨트롤러가 아니라 필터가 처리하므로 생성본에는 안 나온다.
      tags: [Auth]
      summary: 공급자 리디렉션 수신(Spring Security 내부 콜백)
      description: |
        공급자 콘솔에 등록해야 하는 승인 리디렉션 URI 입니다. 값은 `{server.url}/login/oauth2/code/{provider}`.
        성공 시 앱 딥링크 `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` 로
        302 합니다(#14). 클라이언트가 직접 호출하는 경로가 아닙니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302':
          description: 앱 딥링크로 리다이렉트
          headers:
            Location:
              schema: { type: string }

  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작 — `/oauth2/authorization/{provider}` 로의 302 래퍼
      description: |
        `AuthController.startOAuth` 가 처리합니다(이슈 #10 에서 구현). **인증 로직을 다시
        구현하지 않습니다** — `Location: /oauth2/authorization/{provider}` 로 302 를 줄 뿐이고,
        공급자 왕복과 딥링크 복귀는 그쪽(Spring Security `oauth2Login`)이 그대로 처리합니다.

        > **2026-08 이전 이 절은 "백엔드에 이 경로의 핸들러가 없습니다" 라고 적었습니다. 거짓이었습니다.**
        > 핸들러는 있었고 **빈 200** 을 돌려줬습니다. 계약과 구현이 서로 다른 거짓을 말하고
        > 있었고, `AuthContractSpecTest.unimplementedOperations_areMarkedAsSuch` 가 그 거짓을
        > 초록불로 고정하고 있었습니다. 셋을 함께 고쳤습니다.

        앱은 이 경로를 쓸 필요가 없습니다 — `GET /oauth2/authorization/{provider}` 를 직접 열면
        리다이렉트 한 번을 아낍니다. 이 경로는 계약을 보고 구현한 클라이언트가 막다른 길에
        빠지지 않게 하는 호환 표면입니다.

        `provider` 가 아래 enum 에 없으면 302 가 아니라 **400** 이고, 본문은 공통 `Error`
        (`error.code` = `VALIDATION`)입니다. 302 로 넘겨 봐야 등록이 없는 공급자는 그쪽에서
        원인을 알 수 없는 오류가 됩니다. 대소문자와 앞뒤 공백은 가리지 않습니다.

        > ⚠️ **`state` 는 이 래퍼를 통과해 전달됩니다(#14).** `GET /auth/oauth/kakao?state=S` 는
        > `Location: /oauth2/authorization/kakao?state=S` 로 302 합니다. **2026-08 초에는 이 래퍼가
        > 쿼리를 옮기지 않았고**, 그래서 이 경로로 시작한 로그인은 딥링크에 빈 `state` 를 받아
        > 앱쪽 대조에서 **항상** 실패했습니다 — 계약이 이 경로를 호환 표면이라고 광고하면서
        > 따르면 반드시 실패하는 함정이었습니다.
        >
        > `[A-Za-z0-9_-]{1,128}` 를 만족하지 않는 `state` 는 **붙지 않습니다**(잘라 쓰거나
        > 인코딩하지 않습니다). 이 값은 `Location` 헤더에 그대로 들어가므로 검증 없이 이어
        > 붙이면 헤더·파라미터 주입이 됩니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 통과하면 302 대상의 쿼리로 그대로 옮겨지고, 성공 딥링크에
            실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}` 를 만족하지 않으면 붙지 않습니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: |
            Spring Security 진입점으로 리다이렉트. `Location` 은
            `/oauth2/authorization/{provider}`(소문자로 정규화된 값)이고, 화이트리스트를
            통과한 `state` 가 있으면 `?state=<값>` 이 이어 붙습니다.
          headers:
            Location:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/oauth/{provider}/callback:
    post:
      tags: [Auth]
      summary: 1회용 코드 → 토큰 교환 (소셜 로그인의 마지막 단계)
      description: |
        `AuthController.exchangeOAuthCode` 가 처리합니다(이슈 #14). **소셜 로그인에서 토큰이
        클라이언트에 도달하는 유일한 통로입니다** — 딥링크에는 `code` 와 `state` 만 실립니다.

        > **2026-08 이전 이 절은 "미구현 — 백엔드에 핸들러가 없습니다" 였고, 소셜 로그인은
        > 302 딥링크로 액세스 토큰과 refresh 토큰을 함께 전달했습니다(#9).** 그래서
        > `AuthTokens` 의 `expiresIn`·`isNew`·`user` 는 소셜 경로에서 클라이언트에 도달할
        > 방법이 없었고, 소셜 신규 가입자는 온보딩으로 가지 못했습니다. 지금은 도달합니다.

        `code` 는 딥링크로 받은 **1회용 인가 코드**입니다. 공급자가 준 인가코드가 아닙니다 —
        공급자와의 코드 교환은 백엔드(Spring Security)가 이미 끝냈습니다. 그래서 이 흐름에는
        PKCE 가 없습니다(앱이 공급자와 직접 말하게 바꾸는 날 필수가 됩니다).
        그 판단의 근거와 트리거는 `docs/99-decisions/decision-log.md` 의 **ADR-0009** 에 있습니다.

        **코드는 60초 살고 한 번 쓰면 죽습니다.** 재사용·만료·공급자 불일치·`state` 부재·
        `state` 불일치는 전부 **본문 없는 401** 입니다. 구분해 주면 그 응답 차이가 "그 코드가 존재하긴 했는가"를
        알려 주는 오라클이 됩니다. 실패한 교환도 코드를 죽입니다 — 코드 하나에 시도 한 번입니다.

        `state` 는 앱이 인증을 시작할 때 만들어 보낸 값과 같아야 합니다. 앱쪽 대조를 대신하지
        않습니다 — 코드를 그것이 시작된 인증 왕복에 묶어 두는 두 번째 줄입니다.

        > ⚠️ **빈 `state` 로 발급된 코드는 교환되지 않습니다(401).** 2026-08 초에는 "양쪽 다
        > 비어 있으면 통과" 였는데, 그러면 이 검사를 켜고 끄는 스위치를 클라이언트가 쥐게 됩니다 —
        > `state` 를 생략하기만 하면 서버쪽 두 번째 줄이 사라집니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 딥링크로 받은 1회용 코드(패딩 없는 Base64URL 43자)
                state:
                  type: string
                  description: 인증 시작 때 앱이 만들어 저장해 둔 난수
                redirectUri:
                  type: string
                  example: "heattrip://login-callback"
                  description: |
                    **리다이렉트 대상으로 쓰이지 않습니다.** 이 시점에는 리다이렉트가 이미
                    끝났고, 대상은 서버 설정(`app.security.oauth.redirect-allowlist`)이 정합니다.
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 액세스 토큰 갱신(refresh 토큰 회전)
      description: |
        `AuthController.refresh` 가 처리합니다(이슈 #9). 인증이 필요 없습니다 — 주체는 본문의
        refresh 토큰 자체가 증명합니다.

        **회전합니다.** 성공하면 옛 refresh 토큰은 그 자리에서 폐기되고 응답에 **새 refresh
        토큰**이 함께 실립니다. 클라이언트는 받은 새 값으로 반드시 교체 저장해야 합니다.

        **재사용 감지.** 이미 폐기된 refresh 토큰이 다시 오면 유출로 간주해 **그 사용자의 모든
        세션을 폐기**하고 401 을 돌려줍니다. 즉 옛 토큰으로 한 번 재시도하면 방금 정상적으로
        받았던 새 토큰도 함께 죽습니다. 만료·미존재는 그냥 401 이며 다른 세션을 끊지 않습니다.

        > ⚠️ **클라이언트는 갱신 요청을 직렬화(single-flight)해야 합니다.** 같은 refresh 토큰으로
        > 동시에 두 번 보내면 한쪽만 이기고 다른 쪽은 재사용으로 처리되어 전 기기가 끊깁니다.
        > 서버는 유예 창을 두지 않습니다 — 유예를 두면 정당한 클라이언트와 탈취자를 구분하지
        > 못한 채 탈취자에게도 유예를 주게 됩니다.

        **형식이 맞는 요청**의 실패는 원인과 무관하게 **본문 없는 401** 입니다 — 없는 토큰,
        빈 문자열, `{}`(필드 생략), 만료, 폐기, 재사용이 전부 같은 모양입니다.

        **형식 자체가 깨진 요청**은 401 이 아니라 400·415·405 입니다(이슈 #9). 읽을 수 없는
        JSON·배열 본문·`refreshToken` 이 문자열이 아닌 경우는 **400**, `Content-Type` 이
        `application/json` 이 아니면 **415**, `POST` 가 아닌 메서드는 **405** 입니다.
        이 세 응답의 본문은 공통 `Error`(`{ error: { code, message, traceId } }`)이며
        **예외 메시지를 싣지 않습니다** — 파서 메시지에 요청 본문(= refresh 토큰 원문)
        조각이 섞이기 때문입니다(#6). `message` 는 상태마다 고정 문구입니다.
        (2026-08 이전에는 `{ status, error, message, path, timestamp }` 였습니다 — #10 에서
        전역 오류 본문을 계약의 `Error` 하나로 통일했습니다.)

        > 앱에게: **400·415·405 를 401 처럼 다루지 마세요.** 그건 재로그인 사유가 아니라
        > 클라이언트 요청이 잘못됐다는 신호이고, 재시도해도 결과가 같습니다.

        refresh 토큰은 JWT 가 아니라 256bit 난수를 패딩 없는 Base64URL 로 적은 43자 불투명
        문자열이며, 서버에는 SHA-256 해시만 저장됩니다. 파싱하지 마세요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400':
          description: |
            요청 본문을 읽을 수 없음(깨진 JSON·배열 본문·타입 불일치). `message` 는 고정
            문구입니다 — 파서 메시지를 그대로 실으면 refresh 토큰 원문 조각이 새어 나갑니다(#6).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: |
            `Content-Type` 이 `application/json` 이 아님. 본문 형태는 400 과 같습니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Auth]
      summary: 내 정보 수정(부분 수정 — 보낸 필드만 반영, 생략한 필드는 유지)
      description: |
        시맨틱이 부분 수정이므로 장기적으로는 `PATCH /auth/me` 가 옳습니다.
        현행 구현이 `PUT` 이라 계약도 `PUT` 으로 적되, `PATCH` 전환은 별도 정리 이슈로 남깁니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: 회원 탈퇴
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃(전 기기 — 해당 사용자의 모든 세션을 폐기)
      description: |
        `AuthController.logout` 이 인증된 주체를 받아 204 를 돌려줍니다.
        어느 쪽 토큰(소셜·이메일 가입)으로 불러도 204 이고, 토큰이 없으면 401 입니다.

        **서버측 폐기가 실제로 일어납니다**(이슈 #9 에서 구현되었습니다). Authorization 헤더의
        액세스 토큰으로 주체를 식별해 그 사용자의 서버측 세션(refresh 토큰)을 **전부** 폐기합니다.
        범위는 **전 기기 로그아웃**입니다 — 특정 기기 하나만 끊는 요청 본문은 정의하지 않습니다.
        멱등입니다 — 이미 폐기된 상태여도 204 를 반환합니다.

        **알려진 한계: 이미 발급된 액세스 토큰은 만료(≤1시간)까지 유효합니다.** 토큰 단위
        무효화에는 `jti` 클레임과 블록리스트 저장소가 필요한데, 그것은 이 작업의 범위가
        아닙니다(아래 `bearerAuth` 참고). 그러므로 클라이언트는 저장한 토큰을 반드시 스스로
        삭제해야 합니다.

        한계: 액세스 토큰이 이미 만료된 상태에서는 이 계약으로 로그아웃을 호출할 수 없습니다.
        refresh 토큰만으로 폐기하는 경로는 정의돼 있지 않습니다 — 그 상태의 클라이언트는
        저장한 토큰을 지우기만 하면 되고, 서버의 refresh 토큰은 14일 뒤 만료됩니다.
      responses:
        '204': { description: 로그아웃됨(멱등) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Dogs ───────────────────────────
  # ─────────────────────────── Consents ───────────────────────────
  /api/consents:
    get:
      tags: [Consents]
      summary: 내 동의 상태
      description: |
        문서별 **마지막 기록**을 돌려줍니다. 한 번도 안 적은 문서는 목록에 없습니다.

        주체는 언제나 토큰의 주인입니다 — 경로에 사용자 id 가 없습니다.

        ## 재동의는 앱이 정합니다

        서버는 문서의 최신 버전을 모릅니다. 앱이 자기가 든 문서 버전(`terms_ko.md` 머리의
        `버전: v1.2` 같은 것)과 여기 `version` 을 견줘서, 다르거나 없으면 동의 화면을 띄웁니다.
        서버가 최신 버전을 알게 하면 앱의 문서와 조용히 갈립니다 (ADR-0020).
      responses:
        '200':
          description: 문서별 마지막 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Consents]
      summary: 동의 또는 철회를 남긴다
      description: |
        받은 항목을 **전부 새 행으로** 적습니다. 행을 고치지 않습니다 — 동의도 철회도 이력입니다.
        `agreed: false` 는 철회이고, 그것도 기록입니다(위치정보법 제24조 — 철회 **전** 제공분은
        그대로이므로 그 경계 시각이 남아야 합니다).

        같은 요청을 두 번 보내면 행이 둘 쌓이지만 "지금 상태" 는 같습니다 — 그 뜻에서 멱등입니다.

        `429` 는 `group-write` 버킷입니다 — 요청 한 건이 행을 만들기 때문이고 `POST /api/dogs` 와
        같은 판단입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentsInput' }
      responses:
        '200':
          description: 적은 뒤의 문서별 마지막 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/push/tokens:
    put:
      tags: [Push]
      summary: 기기 토큰 등록
      description: |
        앱이 시작할 때, 로그인할 때, FCM 이 토큰을 바꿀 때마다 부릅니다. **upsert** 입니다 — 같은 토큰을 다시
        보내면 행이 늘지 않고, 같은 기기에서 다른 계정으로 들어오면 토큰의 주인이 바뀝니다(옛 계정의 알림이
        새 사람의 기기에 오면 안 됩니다). 그래서 돌려줄 값이 없고 `204` 입니다.

        사용자당 살아 있는 토큰은 10개까지입니다 — 넘치면 가장 오래 안 보인 것부터 폐기합니다.
        로그아웃(`POST /auth/logout`, 전 기기)은 이 사용자의 토큰을 전부 폐기하고, 탈퇴는 행을 지웁니다 —
        앱이 따로 해지 요청을 보낼 필요가 없습니다.

        `429` 는 `group-write` 버킷입니다 — 요청 한 건이 행을 만들기 때문이고 `PUT /api/consents` 와 같은 판단입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenInput' }
      responses:
        '204':
          description: 등록 또는 갱신됨
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/push/settings:
    get:
      tags: [Push]
      summary: 내 알림 설정
      description: |
        전체 끄기 하나입니다. 한 번도 만진 적이 없으면 `enabled: true` 입니다 — 행이 없는 것이 켜진 것입니다.
        방별 음소거는 여기 없고 방 목록(`ChatRoom.muted`)에 실립니다.
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Push]
      summary: 알림 전체 끄기 · 켜기
      description: |
        `enabled` 가 없으면 400 입니다 — 빠진 필드를 `false` 로 채우면 `{}` 라는 본문이 "끄기" 가 됩니다.
        응답은 서버가 실제로 쓴 값입니다. `429` 는 `group-write` 버킷입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSettingsInput' }
      responses:
        '200':
          description: 적은 뒤의 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/dogs:
    get:
      tags: [Dogs]
      summary: 내 반려견 목록
      description: |
        **내가 등록한 것만** 입니다. 초대받아 들어온 가족의 반려동물은 여기 없습니다 — 가족 공유
        가시성은 아직 정하지 않았습니다(태그 설명 · #209 `Dogs-high-3`).
      responses:
        '200':
          description: 반려견 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Dogs]
      summary: 반려견 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/dogs/{dogId}:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Dogs]
      summary: 반려견 상세
      description: |
        **남의 반려동물과 없는 반려동물은 바이트까지 같은 `404`** 입니다 — `403` 을 주면
        "그 id 는 존재한다" 를 알려 주는 셈입니다(ADR-0017 규약 3).
      responses:
        '200':
          description: 반려견
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      x-status: planned
      x-status-note: |
        부분 수정은 아직 없다. `DogPatch` 를 `DogRequest` 와 어떻게 나눌지는 #24(계약 규약 ADR)가 소유한다 — `DogController` javadoc 이 같은 말을 한다.
      tags: [Dogs]
      summary: 반려견 수정(부분)
      description: |
        **부분 수정이므로 전용 `DogPatch` 를 씁니다**(ADR-0017 규약 4). 생성용 `DogInput` 은
        `required: [name, size]` 라, 그것을 재사용하면 `{"neutered": true}` 만 보내는 것이
        계약 위반이 되어 **부분 수정이 계약상 불가능**해집니다.

        남의 것과 없는 것은 같은 `404` 입니다(규약 3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogPatch' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Dogs]
      summary: 반려견 삭제(소프트 삭제)
      description: |
        **소프트 삭제입니다** — `dog.deleted_at` 을 찍고 행은 남깁니다(#156). 물리 삭제하면
        `walk.fk_walk_dog` 의 CASCADE 로 **그 아이의 산책 이력 전부가 조용히 함께 사라지고**,
        사용자는 "프로필만 지웠다" 고 생각합니다.

        지운 뒤에는 **어느 조회에도 나오지 않습니다** — 목록에서 빠지고, 상세·수정·삭제와
        산책 쪽 `?dogId=`·`POST /api/walks` 의 `dogId` 모두 404 입니다. 같은 id 로 다시
        지워도 404 입니다. 지운 아이는 계정당 상한(20마리)에 세지 않습니다.

        **그 아이의 산책은 사라지지 않고 계속 셉니다.** 산책 목록과 통계(`dogId` 생략)는 지운
        아이의 기록도 포함합니다 — 무지개다리를 건넌 아이의 거리를 빼면 총 거리가 줄어 상실을
        한 번 더 겪게 합니다. "지금 우리 아이" 만 보려면 통계의 `dogId` 로 고릅니다.

        **되살리기는 없습니다.** 그래서 앱의 확인 문구가 그만큼 분명해야 합니다 — "산책 기록은
        남고, 프로필은 되돌릴 수 없어요". 남의 것과 없는 것은 같은 `404` 입니다(ADR-0017 규약 3).
        `group-write` 버킷(rate limit)에 등록된 경로입니다 — 소프트 삭제라 지운 행이 상한에 안
        세므로 등록·삭제 반복을 속도로 막습니다.
      responses:
        '204': { description: 지워짐 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────── Places ───────────────────────────
  /api/dogs/{dogId}/avatar:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Dogs]
      summary: 프로필 사진 붙이기(갈아 끼우기)
      description: |
        먼저 `POST /media` 에 `category=PROFILE_IMAGE` 로 올리고, 그 **미디어 id** 를 보냅니다(#448).
        커뮤니티 글의 사진(#429)과 같은 두 단계라 업로드 검증(형식·크기)이 한 곳에 삽니다.

        **한 아이에 한 장입니다** — 새 것이 붙으면 옛 것은 파일까지 지워집니다. 갈아 끼우기라
        `PUT` 이고, 같은 id 를 두 번 보내도 결과가 같습니다.

        남의 미디어 · 아직 안 올라온 것(`pending`) · 이미 다른 데 붙은 것 · 영상은 `400` 입니다.
        남의 반려동물과 없는 반려동물은 바이트까지 같은 `404` 입니다(ADR-0017 규약 3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogAvatarInput' }
      responses:
        '200':
          description: 사진이 붙은 반려동물 — `avatarUrl` 이 채워져 있습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Dogs]
      summary: 프로필 사진 떼기
      description: |
        파일도 지웁니다. **없는데 떼도 `200`** 입니다(멱등). 바뀐 반려동물을 돌려줘 앱이 그대로 그립니다 —
        `avatarUrl` 은 `null` 입니다.
      responses:
        '200':
          description: 사진이 없는 반려동물
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/places/nearby:
    get:
      tags: [Places]
      summary: 내 주변 장소 조회
      description: |
        현위치 좌표 기준 주변의 반려동반 가능 장소를 거리순으로 반환합니다.

        **서버가 관광공사(KTO) `KorPetTourService2` 를 대신 호출합니다** (이슈 #40).
        앱은 서비스키를 갖지 않습니다 — 앱 바이너리 안의 키는 `strings` 한 번이면 나오고,
        폐기하려면 앱을 새로 배포해야 해서 즉시 대응이 불가능합니다.

        응답은 **좌표를 0.02° 격자로 접은 셀 단위 스냅샷**에서 나옵니다. 같은 셀의 두 번째
        이후 요청은 KTO 를 부르지 않습니다. KTO 일 한도가 1,000콜이라 그 절약이 이 경로의
        전제입니다.

        **오래된 답이 빈 지도보다 낫습니다.** 하루 호출 예산이 소진되면 갱신을 멈추고
        기존 스냅샷을 계속 줍니다. 스냅샷조차 없으면 **빈 배열**입니다(오류가 아닙니다) —
        즉 앱은 "한도 초과" 와 "이 주변에 장소가 없음" 을 구분하지 못합니다.

        `vet`/`shop`/`trail` 레이어는 **미구현**입니다. 그 값이 오면 빈 배열입니다.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: |
            위도. **범위를 벗어나면 `400` 입니다** — `radius`·`limit` 과 달리 자르지
            않습니다. 좌표는 사용자가 지금 보고 있는 곳이라, 조용히 다른 지점의 답을
            주면 그 사람은 자기 주변이 비어 있다고 읽습니다.

            `NaN`·`Infinity` 도 `400` 입니다.
          schema: { type: number, format: double, minimum: -90, maximum: 90, example: 37.5665 }
        - name: lng
          in: query
          required: true
          description: 경도. `lat` 과 같은 규칙입니다 — 범위 밖이면 `400`.
          schema: { type: number, format: double, minimum: -180, maximum: 180, example: 126.9816 }
        - name: radius
          in: query
          description: |
            반경(m). **넘겨도 400 이 아니라 잘립니다.**

            최댓값이 20,000 이 아니라 18,000 인 이유: 스냅샷을 셀 **중심**에서 20km 받아 두고
            셀 안의 어느 점에서든 서빙하므로, 보장되는 반경은 그것에서 셀 반지름(δ ≈ 1.42km)을
            뺀 18,578m 입니다. 그보다 크게 받으면 서버가 **200 으로 조용히 덜 덮인 답**을
            주게 됩니다 (이슈 #40).

            **`category=trail` 이면 반경을 보지 않습니다** — 코리아둘레길은 해안·접경에만 있어
            도심에서 8km 안은 늘 비었습니다. 대신 가까운 코스 **20개**를 거리와 함께 줍니다
            (`limit` 이 그보다 작으면 그 값). 2026-09-06 결정(#291).
          schema: { type: integer, default: 8000, maximum: 18000 }
        - name: category
          in: query
          description: |
            카테고리 필터(생략 시 전체). KTO contentTypeId 또는 레이어 키.

            `vet`/`shop`/`trail` 은 #291 부터 **실데이터**입니다 — 행정안전부 인허가(동물병원·
            동물판매업)와 두루누비(걷기여행길) 한 벌에서 거릅니다. 그 셋을 주면 서버는 KTO 셀을
            부르지 않습니다. 생략하면 KTO 셀과 레이어를 **합쳐** 거리순입니다. `trail` 만
            반경을 안 봅니다(위 `radius`).
          schema: { $ref: '#/components/schemas/PlaceCategory' }
        - name: limit
          in: query
          description: |
            **지도 전용 상한입니다** — 공통 파라미터 `Limit`(기본 20 / 최대 100)이 아니라
            여기만의 인라인 스키마이고 수가 다릅니다. 지도는 화면 한 장에 핀을 다 뿌리므로
            목록 한 쪽보다 큽니다.

            **넘겨도 400 이 아니라 잘립니다**(`radius` 와 같은 규칙). 그리고 **잘렸다는
            신호가 응답에 없습니다** — 응답이 벌거벗은 배열이라 실을 자리가 없습니다.
            지도는 '이 반경 안 상위 N' 이라 커서가 필요 없다고 봤습니다. 잘림을 알려야
            한다고 판단이 서면 응답을 봉투로 바꾸는 파괴적 변경이 됩니다.
          schema: { type: integer, default: 80, maximum: 200, minimum: 1 }
      responses:
        '200':
          description: 장소 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/courses:
    post:
      tags: [Courses]
      summary: 산책 하나를 코스로 남긴다
      description: |
        그 산책의 경로를 **서버가 베껴 와 양 끝 100m 를 자릅니다**(#339). 자르고 남은 길이가
        100m 보다 짧으면 `400` 입니다 — 결국 300m 쯤은 걸어야 코스가 됩니다. 경로가 없는
        산책(손입력·위치 거부)도 `400` 입니다.

        내 산책이 아니면 `404` — 없는 산책과 같습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201':
          description: 만들어짐. 응답의 `path` 는 **이미 잘린 선**입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400':
          description: 경로가 없거나 너무 짧습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 그런 산책이 없거나 내 산책이 아닙니다. 두 경우를 구분하지 않습니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/courses/me:
    get:
      tags: [Courses]
      summary: 내 코스 목록
      description: |
        최근 순 100개. **선은 빼고 시작점 하나만** 옵니다(`path` 의 길이가 1) — 목록에 선
        수십 개를 실을 이유가 없습니다. 선이 필요하면 상세를 부릅니다.
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/courses/public:
    get:
      tags: [Courses]
      summary: 공개 코스 한 벌 — 지도의 "이웃 코스"
      description: |
        **좌표 파라미터가 없습니다.** 가까운 것을 고르는 일은 기기에서 합니다(A안 #235) —
        장소 카탈로그(#273)와 같은 방식입니다. 최근 순 300개까지, 목록이라 선은 시작점뿐입니다.

        로그인해야 봅니다. 공개 코스라도 비인증으로 열면 그 목록이 곧 크롤링 대상입니다.
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/courses/{courseId}:
    get:
      tags: [Courses]
      summary: 코스 하나 — 선을 실어 준다
      description: 내 것이거나 공개된 것만. 남의 비공개는 **없는 것과 같은 404** 입니다.
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 코스
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 볼 수 없습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Courses]
      summary: 코스 지우기
      description: 내 코스만. 남의 것은 `404` 이고 그대로 남습니다.
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 지워짐 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 코스가 아닙니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/courses/{courseId}/visibility:
    put:
      tags: [Courses]
      summary: 공개 범위 바꾸기
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { type: string, enum: [private, public] }
      responses:
        '200':
          description: 바뀐 코스
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없거나 내 코스가 아닙니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/walk-safety/now:
    get:
      tags: [WalkSafety]
      summary: 격자 하나의 지금 관측값 — 기온·습도·강수·미세먼지
      description: |
        기상청 초단기실황(`getUltraSrtNcst`, 매시 40분 발표)과 에어코리아 실시간 측정을 **서버가**
        불러 한 묶음으로 돌려줍니다(#336). 격자 번호는 앱이 위경도에서 계산합니다(`kmaGrid()`,
        5km) — 요청에 **위경도가 없고, 인증도 없습니다.** 서버는 격자별로 10분 캐시할 뿐 누가
        어느 격자를 물었는지 남기지 않습니다.

        - `pm10`·`pm25`·`station` 은 에어코리아 두 API 의 활용신청이 승인된 뒤에만 옵니다. 그 전에는
          `null` 이고 앱은 "미세먼지 정보 없음" 으로 판정합니다.
        - 기상청 실황을 못 받으면(키 없음 포함) `503` — 반쪽 값을 주지 않습니다. 앱은 카드를 그리지 않습니다.
        - 한도: IP 기준 분당 30(`walk-safety` 버킷).
      security: []
      parameters:
        - in: query
          name: nx
          required: true
          schema: { type: integer, minimum: 1, maximum: 149, example: 61 }
          description: 기상청 격자 X
        - in: query
          name: ny
          required: true
          schema: { type: integer, minimum: 1, maximum: 253, example: 126 }
          description: 기상청 격자 Y
      responses:
        '200':
          description: 관측값 한 묶음
          headers:
            Cache-Control:
              schema: { type: string, example: 'max-age=600, public' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkSafetyNow'
        '400':
          description: 격자 번호가 범위 밖
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: IP 한도 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 기상청 실황을 못 받음(키 없음 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/places/catalog:
    get:
      tags: [Places]
      summary: 전국 장소 한 벌
      description: |
        전국의 반려동반 가능 장소를 **한 번에 전부** 반환합니다 (이슈 #273 · #235 A4).

        **요청에 아무것도 실리지 않습니다.** 좌표도 지역 코드도 없습니다.
        `GET /api/places/nearby` 는 현위치를 쿼리로 받는데, 완전 온디바이스 빌드는
        좌표를 서버로 보내지 않으므로 그 경로를 쓸 수 없고 그러면 **지도의 장소 목록이
        빕니다.** 이 경로가 그 자리를 채웁니다.

        거리 정렬·반경 필터·카테고리 필터는 **앱이 기기에서** 합니다. 응답의 `distM` 은
        항상 생략됩니다 — 서버가 그 값을 계산할 좌표를 갖고 있지 않습니다.

        ## 한 배열에 출처가 넷입니다 (#291)

        KTO 반려동반 장소(`source=kto`) 뒤에 **동물병원(`vet`)·펫샵(`shop`)** — 행정안전부
        인허가, 전국 — 과 **산책로(`trail`)** — 두루누비 걷기여행길 — 가 이어 붙습니다. 서버는
        출처별로 한 벌씩 따로 받아 두고(`place_catalog` 행 셋) 응답에서 **문자열로 잇습니다.**
        앱은 출처가 몇인지 몰라도 됩니다 — `source` 와 `category` 로 구분합니다.

        - 레이어는 **월 1회** 갱신됩니다(인허가 데이터는 느리게 바뀝니다). 아직 못 받았으면
          KTO 한 벌만 옵니다 — 공공데이터포털에 그 API 의 활용신청이 안 된 상태가 그렇습니다.
        - KTO 한 벌이 없으면 레이어가 있어도 `[]` 입니다. 병원뿐인 한 벌을 앱이 캐시하면
          KTO 가 회복해도 다음 갱신까지 지도의 대부분이 빕니다.
        - `ETag` 는 이어 붙인 벌들의 해시를 다시 해시한 값입니다. 어느 한 벌이 바뀌면 바뀝니다.
        - 산책로 항목의 좌표는 **코스의 시작점**입니다. 선은 `GET /api/places/trails/{courseId}/route`
          로 따로 받습니다 — 2,000 코스의 선을 한 벌에 실으면 16MB 입니다.

        ## 크기와 `ETag`

        전국이 9,684곳이고 응답이 2.83MB, gzip 으로 **0.44MB** 입니다(실측 2026-09-04).
        시군구 249개로 쪼개지 않은 이유가 이 숫자입니다 — 쪼개면 요청에 지역이 실리고
        (행정구역이지만 0 은 아닙니다) 한 벌 데우는 KTO 콜이 10 에서 249 로 늘어납니다.

        앱은 이 한 벌을 기기에 두고 `If-None-Match` 로 갱신만 확인합니다. 맞으면 **304**
        이고 본문이 나가지 않습니다. `ETag` 는 갱신 시각이 아니라 **내용 해시**라,
        KTO 데이터가 그대로인 날은 서버가 갱신해도 304 입니다.

        ## gzip 은 `Accept-Encoding` 을 보내야 옵니다

        0.44MB 는 **압축된** 크기입니다. `Accept-Encoding: gzip` 을 안 보내면 2.83MB 가
        그대로 옵니다. 대부분의 HTTP 클라이언트는 기본으로 보냅니다.

        ## 한 벌이 없으면 빈 배열입니다

        `nearby` 와 같은 규칙입니다. KTO 가 죽었거나 하루 호출 예산이 소진되면 **200** 에
        `[]` 를 줍니다(오류가 아닙니다). 그때는 `ETag` 를 **붙이지 않습니다** — 붙이면
        앱이 빈 목록을 캐시하고, 서버가 회복한 뒤에도 304 를 받아 계속 빈 지도를 봅니다.

        ## `429` 는 목록·상세와 또 다른 버킷입니다

        `places-catalog` 이고 분당 5 입니다. 이 경로만 응답이 MB 단위라, `places-detail`
        의 분당 30 을 그대로 주면 한 IP 가 분당 85MB 를 뽑아 갑니다. 앱은 하루 한 번쯤
        부르므로 5 로 충분하고, `429` 를 받아도 기기에 있는 한 벌을 계속 쓰면 됩니다.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            앱이 갖고 있는 한 벌의 `ETag`. 서버의 것과 같으면 **304** 입니다.
            받은 값을 **그대로** 실어 보내면 됩니다 — `W/` 접두사를 떼지 마세요.

            콤마로 여럿 보낼 수 있습니다. `W/` 가 붙은 것과 안 붙은 것 모두 맞습니다
            (약한 비교입니다).

            **`*` 는 304 를 만들지 않습니다.** 실측 결과 200 에 본문이 옵니다 —
            스프링의 조건부 요청 처리가 그 값을 다루지 않습니다. 캐시 재검증에 `*` 를
            쓰는 클라이언트는 없으므로 그대로 둡니다.
          schema: { type: string, example: 'W/"3f1c8a90b2e64d17c5a0f88e12b47d63"' }
      responses:
        '200':
          description: |
            전국 장소 목록. `ETag` 헤더가 함께 옵니다 — 단, 한 벌이 없어 `[]` 를 줄 때는
            붙지 않습니다.
          headers:
            ETag:
              description: |
                본문의 내용 해시. 다음 요청의 `If-None-Match` 에 **그대로** 실으면 됩니다.

                **약한 검증자(`W/`)입니다.** 강한 것으로 두면 톰캣이 이 응답만 압축하지
                않습니다 — gzip 은 바이트열을 바꾸는데 강한 검증자는 바이트열이 같다는
                뜻이기 때문입니다. 실측(2026-09-04)으로 이 경로만 2.97MB 가 압축 없이
                나가고 있었습니다. 우리가 재는 것은 "같은 목록인가" 이지 "같은 바이트인가"
                가 아니므로 약한 쪽이 맞습니다(RFC 9110 §8.8.1).
              schema: { type: string, example: 'W/"3f1c8a90b2e64d17c5a0f88e12b47d63"' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '304':
          description: |
            `If-None-Match` 가 서버의 `ETag` 와 같습니다. **본문이 없습니다.**
            앱은 기기에 있는 한 벌을 그대로 씁니다.
          headers:
            ETag:
              description: 서버가 갖고 있는 한 벌의 해시. 요청에 실어 보낸 것과 같습니다.
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/places/trails/{courseId}/route:
    get:
      tags: [Places]
      summary: 산책로 코스 하나의 선
      description: |
        두루누비 걷기여행길 코스의 경로 — `[[경도, 위도], …]` (이슈 #291).

        카탈로그의 산책로 항목(`source=trail`)은 **시작점 하나**만 싣습니다. 사용자가 그 산책로를
        눌렀을 때 앱이 이 경로로 선을 받아 지도에 그립니다. `courseId` 는 그 항목의 `contentId`
        에서 `trail:` 을 뗀 값입니다 — 두루누비의 `crsIdx` 그대로입니다.

        선은 원본 GPX 를 **300 점 이하로 줄인** 것입니다(Douglas–Peucker). 지도 배율 어디서도
        형태가 그대로이고, 코스 하나가 10KB 안팎입니다. `lengthM` 은 줄이기 **전** 원본의 길이입니다.

        좌표 순서는 `Walk.path` 와 같습니다 — **경도가 먼저**입니다.

        월 1회 바뀌므로 `Cache-Control: max-age=86400` 입니다. `429` 는 상세와 같은
        `places-detail` 버킷입니다.
      security: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: 두루누비 코스 번호(`crsIdx`). 카탈로그 `contentId` 의 `trail:` 뒤.
          schema: { type: string, example: "T_ROUTE_1" }
      responses:
        '200':
          description: 코스의 선
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrailRoute' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/places/{contentId}:
    get:
      tags: [Places]
      summary: 장소 상세
      description: |
        **서버가 KTO `detailCommon2`(개요) + `detailPetTour2`(반려동반 정보)를 대신
        호출합니다** (이슈 #40). 결과는 30일 캐시됩니다.

        **404 는 아웃바운드 호출 없이 납니다.** 서버가 목록에 실어 보낸 적도 없고
        `places` 표에도 없는 `contentId` 는 KTO 에 물어보지 않습니다 — 물으면 무작위 id 를
        던지는 것만으로 하루 상세 예산이 사라집니다.

        아직 상세를 못 받았어도 **200** 입니다. 기본 필드(제목·좌표·주소)는 목록에서 왔고,
        `overview` 와 `petInfo` 의 세 필드가 `null` 일 뿐입니다.

        `detailIntro2` 는 **부르지 않습니다.** 앱이 그 응답에서 쓰던 것은 추가 이미지뿐인데,
        넣으면 상세 1건이 3콜이 되어 하루 상세가 75건에서 50건으로 줄기 때문입니다.

        **`429` 는 목록과 다른 버킷입니다** — `places-detail` 이고 목록(`places`)보다 좁습니다.
        상세 1건이 KTO 를 2콜 쓰기 때문입니다. 2026-09-03 이전에는 서버가 실제로 던지는데
        계약에만 없었습니다(#210 `Places-medium-2`).
      security: []
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 장소 상세(반려동반 상세정보 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────── Walks ───────────────────────────
  /api/walks:
    get:
      tags: [Walks]
      summary: 산책 기록 목록(내 반려견)
      description: |
        **정렬은 `(createdAt, id)` 내림차순입니다** — `startedAt` 이 아닙니다.

        `startedAt` 은 클라이언트가 보낸 값이라, 오프라인에 쌓아 둔 산책이 며칠 뒤
        과거 시각으로 들어옵니다. 그걸 커서 기준으로 쓰면 **이미 발급된 커서보다
        아래 날짜의 행이 영원히 건너뛰어집니다.** 서버 시각으로 자르면 그 일이 없습니다.
        (`chat_message` 가 `room_seq` 로 피한 것과 같은 종류의 실패입니다.)

        그래서 목록 순서는 "걸은 순서" 가 아니라 **"기록된 순서"** 입니다.
      parameters:
        - name: dogId
          in: query
          description: 생략하면 내 반려동물 전체의 산책을 섞어서 줍니다.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 산책 목록(커서 페이지네이션)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Walks]
      summary: 산책 기록 저장
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkInput' }
      responses:
        '201':
          description: 새로 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '200':
          description: |
            **같은 `clientWalkId` 로 이미 저장된 산책이 있어 그것을 그대로 돌려줍니다.**
            재전송은 새 줄을 만들지 않습니다. 앱은 201 과 200 을 같게 취급하면 됩니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 그런 `dogId` 가 없거나 내 반려동물이 아닙니다. 두 경우를 구분하지 않습니다.

  /api/walks/{walkId}:
    get:
      tags: [Walks]
      summary: 산책 상세(경로 포함)
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 산책
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            **없는 산책과 남의 산책이 똑같이 404 입니다.** 403 을 주면 "그 id 는 존재한다" 를
            알려 주는 셈이라, id 를 훑어 남의 기록 수를 셀 수 있습니다. 응답 본문도 같습니다.
    delete:
      tags: [Walks]
      summary: 산책 기록 삭제
      description: |
        멱등키(`clientWalkId`)가 있어 같은 산책을 두 번 저장할 수는 없으므로,
        **잘못 저장한 것을 사용자가 지울 길이 반드시 있어야 합니다.**
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 산책과 남의 산책이 똑같이 404 입니다(위 `get` 과 같은 이유).

  /api/walks/{walkId}/memo:
    put:
      tags: [Walks]
      summary: 산책 회고 글 교체
      description: |
        산책 한 건의 회고 글을 **통째로 바꿉니다.**

        `PATCH /api/walks/{walkId}` 가 아닌 이유는 PATCH 가 *"필드를 안 보냈다"* 와
        *"null 로 지워라"* 를 구분해야 하는데, 바꿀 필드가 하나뿐이라 그 복잡도가 값을
        못 하기 때문입니다. 하위 리소스 PUT 이면 뜻이 하나입니다 — **"메모를 이 값으로
        바꾼다"**. `PUT /api/groups/{groupId}/walk-notes` 가 같은 모양이고 같은 이유입니다.

        **빈 문자열은 "다 지웠다" 는 정상 요청입니다** — 400 이 아닙니다. 서버는 그것을
        `null` 로 눕혀 저장합니다. 저장 경로(`POST /api/walks`)가 안 보낸 메모를 `null` 로
        두므로, `""` 를 그대로 두면 "안 썼다" 가 두 모양이 되어 화면이 한쪽을 빠뜨립니다.

        **거리·시간·경로는 바꿀 수 없습니다.** 실측값이거나 사용자가 저장 시점에 정한
        값이고, 여기서 열면 "회고를 쓴다" 가 "기록을 고친다" 로 번집니다.

        응답은 **바뀐 뒤의 산책**이고 경로가 실립니다 — 이 응답을 받는 곳이 상세 화면이라
        다시 조회하지 않아도 화면을 갱신할 수 있어야 합니다.

        `walk-write` 버킷(rate limit)에 등록된 경로입니다.
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkMemoInput' }
      responses:
        '200':
          description: 교체 후 최신 산책(경로 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 산책과 남의 산책이 똑같이 404 입니다(위 `get` 과 같은 이유).
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/walks/stats/weekly:
    get:
      tags: [Walks]
      summary: 산책 통계(이번 주 + 전체 기간)
      description: |
        **한 번의 호출로 두 기간을 줍니다.** 화면이 둘 다 필요합니다 —
        `me_screen` 은 "총 산책 / 총 거리 / 이번주" 를 한 카드에 나란히 놓고,
        `myrecords_screen` 은 전체 기간의 거리·횟수·시간을 셉니다.
        엔드포인트를 나누면 화면 하나가 두 번 부르고 요청 제한 항목도 하나 늘어납니다.

        경로 이름에 `weekly` 가 남아 있는 것은 이미 쓰이고 있어서입니다.

        **이번 주 고정입니다** — 지난 주를 고르는 파라미터는 없습니다(화면 요구가 없어 두지
        않았습니다, #209 `Walks-medium-2`). 대신 응답의 `weekStart`·`weekEnd` 가 어느 주인지
        말합니다 — 앱이 "서버가 이번 주를 줬겠지" 라고 가정하고 축 라벨을 그리지 않아도 됩니다.
      parameters:
        - name: dogId
          in: query
          description: 생략하면 내 반려동물 전체를 합칩니다.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 이번 주(월~일) + 전체 기간 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/walks/insights/{insightId}/feedback:
    put:
      tags: [Walks]
      summary: AI 요약 👍/👎
      description: |
        통계 응답의 `aiSummary.id` 로 평가 하나를 남깁니다(#486 후속). 요약(사용자 · 아이 · 주)마다 하나이고
        다시 누르면 바뀌며, `value: null` 이면 지웁니다. **내 요약이 아니면 404** — 남의 것과 없는 것을
        구별해 주지 않습니다. `up` · `down` 밖의 값은 400. 문장이 다시 만들어지면 평가는 비워집니다.
        `walk-write` 요청 한도 버킷입니다.
      parameters:
        - name: insightId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: [string, "null"]
                  enum: [up, down, null]
                  description: "`up` 👍 · `down` 👎 · `null` 지우기"
      responses:
        '200':
          description: 평가가 반영된 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Community ───────────────────────────
  /api/community/posts:
    get:
      tags: [Community]
      summary: 게시글 목록
      description: |
        **인증은 선택입니다.** 토큰이 없으면 공개 목록이고, 있으면 `reactions.mine` 이 채워집니다.

        2026-09 이전에는 `security: []` 였습니다. 그것은 인증을 계약에서 **제거**하는 선언이라
        서버가 토큰을 읽지 않아야 하고, 그러면 `mine` 은 영원히 `null` 인 죽은 필드가 됩니다 —
        그런데 게스트 읽기는 취향이 아니라 MVP 정의(`mvp-scope.md`)이므로, 지워야 할 것은
        `mine` 이 아니라 `security: []` 였습니다. ADR-0017 규약 6.
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - name: board
          in: query
          description: 게시판(생략 시 전체)
          schema: { $ref: '#/components/schemas/Board' }
        - name: neighborhood
          in: query
          description: |
            **우리 동네만 보기** (#342). 지금 받는 값은 `mine` 하나입니다.

            **구 코드를 직접 받지 않습니다** — 받으면 아무 구나 골라 훑을 수 있고, 그건
            "우리 동네" 가 아니라 남의 동네 구경입니다. 서버는 **보는 사람이 저장해 둔 동네**의
            시군구로만 좁힙니다.

            로그인하지 않았거나 동네를 안 골랐으면 **400** 입니다 — 조용히 전국을 주면
            화면은 "우리 동네" 라고 적힌 채 전국 글을 보여 줍니다.

            동네를 안 고른 사람의 글은 이 목록에 **안 나옵니다.**
          schema: { type: string, enum: [mine] }
        - name: dogId
          in: query
          description: |
            **찍힌 아이로 좁힙니다** (#451 5번, 아이 사진첩). 글은 공개라 남의 아이 id 를 넣어도 `400` 이
            아닙니다 — 그 아이의 글이 있으면 보입니다. `board`·`neighborhood` 와 함께 쓸 수 있습니다.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            게시글 목록(커서 페이지네이션).

            **최신순입니다** — `(createdAt, id)` 내림차순. 두 축인 이유는 같은 초에 쓰인 두 글이
            페이지 경계에 걸리면 커서가 하나를 건너뛰거나 두 번 주기 때문입니다.

            아래 댓글 목록과 **방향이 반대**인 것은 의도입니다. 피드는 새 글을 먼저 보고,
            스레드는 위에서 아래로 읽습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Community]
      summary: 게시글 작성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: 작성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/community/posts/{postId}:
    get:
      tags: [Community]
      summary: 게시글 상세
      description: 인증은 선택입니다 — 있으면 `reactions.mine` 이 채워집니다(ADR-0017 규약 6).
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 게시글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Community]
      summary: 게시글 수정
      description: |
        **내가 쓴 글만 고칩니다.** 남의 글은 `404` 가 아니라 `403` 입니다 — 삭제와 같은 이유로,
        글은 누구나 읽을 수 있어서 존재가 이미 공개입니다(아래 `delete` 설명 참조).

        보낸 키만 바뀝니다. 하나도 안 보내면 `400` 입니다 — 아무 일도 안 하면서 `200` 을
        주면 그건 "고쳐졌다" 로 읽힙니다(`PostPatch.minProperties: 1`).

        **실제로 값이 바뀐 경우에만 `updatedAt` 이 생깁니다.** 같은 값을 다시 보내는 것은
        수정이 아닙니다.

        **`board` 를 바꾸면 글이 다른 게시판으로 옮겨 갑니다.** 잘못 고른 게시판을 고치는
        것이 이 필드가 있는 이유입니다.

        응답은 `Post` 전체입니다 — 부분 수정이라도 화면은 갱신된 글 전체를 그려야 하고,
        `commentCount`·`reactions` 는 그 사이 남이 바꿨을 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostPatch' }
      responses:
        '200':
          description: 고쳐진 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: 게시글 삭제
      description: |
        **내가 쓴 글만 지웁니다.**

        **댓글과 반응이 함께 사라집니다** — `fk_comment_post`·`fk_reaction_post` 가
        `ON DELETE CASCADE` 입니다. 부모 없는 행을 남기면 어느 목록에도 안 뜨면서 자리만
        차지하고, 나중에 세면 댓글 수가 맞지 않는데 왜 안 맞는지 아무도 모릅니다
        (`14_community.sql` §D).

        남의 댓글이 함께 사라지는 것은 의도입니다 — 글이 없으면 그 댓글은 읽을 맥락이
        없습니다. `users` 로 가는 FK 가 `SET NULL` 인 것과는 다른 판단인데, 거기서는
        **글이 남아 있고** 작성자만 사라지는 것이라 남의 댓글이 읽힐 자리가 있습니다.

        **남의 글은 `404` 가 아니라 `403` 입니다.** `Dogs`·`Walks` 는 404 로 합치지만
        (ADR-0017 규약 3 — "남의 것과 없는 것이 구별되지 않는다") 커뮤니티는 반대입니다.
        글은 **누구나 읽을 수 있어서 존재가 이미 공개**라, 404 로 숨겨도 방금 `GET` 으로 본
        것을 숨기는 셈이고 아무것도 못 가립니다. 대신 사용자가 "지웠는데 사라지지 않았다" 로
        읽습니다.

        **탈퇴한 사람의 글은 아무도 못 지웁니다**(`author.userId == 0`). 주인이 없는 글을
        아무나 지울 수 있게 하면 그것이 곧 관리 권한이고, 그 결정은
        [#166](https://github.com/sanghyunbang/heattrip/issues/166) 이 갖고 있습니다.

        수정(`PATCH`)은 아직 없습니다.
      responses:
        '204':
          description: 지워짐
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/course:
    put:
      tags: [Community]
      summary: 글에 코스 붙이기
      description: |
        이미 붙어 있으면 갈아 끼웁니다(#339). 붙일 수 있는 것은 **내 것이면서 공개된 코스**
        뿐입니다.

        PATCH 본문에 넣지 않은 이유: JSON 은 "키가 없음" 과 `null` 을 구분해 주지 않아
        "안 바꿈" 과 "떼어 냄" 이 같은 모양이 됩니다. 그래서 붙이기와 떼기를 별도
        오퍼레이션으로 뒀습니다(`PUT /api/walks/{walkId}/memo` 와 같은 모양).
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: { type: integer, format: int64 }
      responses:
        '200':
          description: 붙은 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400':
          description: 내 코스가 아니거나 비공개입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 남의 글입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 그런 글이 없습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Community]
      summary: 붙은 코스 떼기
      description: 코스 자체는 그대로입니다 — 글에서 그림만 빠집니다(#339).
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 뗀 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 남의 글입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 그런 글이 없습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/community/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Community]
      summary: 댓글 목록
      description: |
        인증은 선택입니다(ADR-0017 규약 6).

        **커서 봉투입니다.** 2026-09 이전에는 벌거벗은 배열이었고 `cursor`/`limit` 파라미터조차
        없었습니다 — 댓글은 인기글에서 무한정 커지는데 한 번에 전부 내려보내는 계약이었습니다.
        배열로 내보낸 뒤 봉투로 바꾸는 것은 파괴적 변경이라, **구현이 붙기 전인 지금이 유일하게
        공짜인 시점**입니다. ADR-0017 규약 2.
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            댓글 목록(커서 페이지네이션).

            **오래된 것부터입니다** — `(createdAt, id)` 오름차순. 스레드는 위에서 아래로
            읽으므로 글 목록과 방향이 반대입니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Community]
      summary: 댓글 작성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 1000
                  example: "저도 여기 자주 가요! 정보 감사합니다 🐾"
                  description: |
                    글보다 짧습니다. 댓글은 스레드에서 다른 댓글들과 함께 읽히는 것이라,
                    한 줄이 화면을 다 먹으면 스레드가 아니게 됩니다.
      responses:
        '201':
          description: 작성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Community]
      summary: 댓글 삭제
      description: |
        **내가 쓴 댓글만 지웁니다.** 글 주인이라도 남의 댓글은 못 지웁니다 — 그건 관리이고
        그 결정은 [#166](https://github.com/sanghyunbang/heattrip/issues/166) 이 갖고 있습니다.
        여기서 미리 열면 신고·차단 모양이 정해질 때 두 벌이 됩니다.

        `commentId` 가 그 글의 댓글이 아니면 **404** 입니다 — 경로가 가리키는 것이 없다는
        뜻이지 권한 문제가 아닙니다.

        **남의 글은 `404` 가 아니라 `403` 입니다.** `Dogs`·`Walks` 는 404 로 합치지만
        (ADR-0017 규약 3 — "남의 것과 없는 것이 구별되지 않는다") 커뮤니티는 반대입니다.
        글은 **누구나 읽을 수 있어서 존재가 이미 공개**라, 404 로 숨겨도 방금 `GET` 으로 본
        것을 숨기는 셈이고 아무것도 못 가립니다. 대신 사용자가 "지웠는데 사라지지 않았다" 로
        읽습니다.
      responses:
        '204':
          description: 지워짐
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/reports:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Community]
      summary: 글 신고
      description: |
        글을 신고합니다.

        **신고 시점의 사본이 함께 저장됩니다** — 제목·본문·작성자·작성 시각까지 벱니다.
        참조만 남기면 작성자가 글을 지우는 순간 운영자가 무엇을 판단해야 하는지 알 수
        없습니다. 채팅 신고가 같은 이유로 본문 사본을 남깁니다.

        **내가 쓴 글은 신고할 수 없습니다** — `400` `REPORT_SELF`. 자기 글 신고는 실수이거나
        신고 수를 부풀리는 것이고, 둘 다 운영자가 세는 숫자를 흐립니다.

        **탈퇴한 사람의 글은 신고할 수 있습니다.** 글은 남아 있고, 그 글이 문제라는 사실은
        작성자가 떠난 것과 무관합니다.

        **같은 글을 여러 번 신고할 수 있습니다.** 글은 수정되기 때문입니다(`PATCH`, #211) —
        막으면 작성자가 신고 뒤 본문을 더 나쁜 것으로 고쳤을 때 재신고가 안 되고, 운영자에게
        남는 기록은 **고치기 전 본문**뿐입니다. 도배는 `community-report` 버킷(분당 10)이
        막습니다. 이 버킷은 커뮤니티 쓰기(60)와 **따로**입니다 — 합치면 글을 쏟아부어 신고를
        막을 수 있습니다.

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/community/posts/{postId}/comments/{commentId}/reports:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Community]
      summary: 댓글 신고
      description: |
        댓글을 신고합니다. 규칙은 글 신고와 같습니다(위 절 참조).

        **부모 글이 맥락으로 함께 저장됩니다.** 댓글 한 줄만 남으면 운영자가 무슨 글에 달린
        말인지 모르고, 글을 지우면 `fk_comment_post` 가 `ON DELETE CASCADE` 라 댓글이 함께
        사라져 되짚을 수도 없습니다. 채팅 신고가 같은 이유로 앞뒤 `roomSeq` 범위를 남깁니다.

        `commentId` 가 그 글의 댓글이 아니면 **404** 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/community/posts/{postId}/reactions/{type}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReactionType' }
    post:
      tags: [Community]
      summary: 반응 누르기(도움돼요/귀여워요/공감)
      description: |
        **셋을 동시에 누를 수 있습니다.** 도움돼요·귀여워요·공감은 서로 배타적인 개념이 아닙니다 —
        한 글이 도움도 되고 귀엽기도 합니다(ADR-0016 결정 2).

        **멱등입니다** — 이미 눌러 뒀어도 `200` 이고 집계가 늘지 않습니다.
        2026-09 이전에는 `POST .../reactions` 하나가 **토글**이었습니다. 요청에 의도가 없어서
        **네트워크 재시도 한 번이 사용자의 반응을 조용히 되돌렸습니다.**

        모양은 `POST /api/blocks` + `DELETE /api/blocks/{userId}` 와 같습니다 —
        집합 원소를 자원으로 켜고 끕니다.

        응답에 **최신 집계**를 실어 왕복을 한 번으로 줄입니다.
      responses:
        '200':
          description: 반응 반영 후 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: 반응 취소
      description: |
        **멱등입니다** — 안 눌렀던 것을 취소해도 `200` 입니다. 없던 것과 있던 것을 상태 코드로
        나누면 앱이 두 갈래를 다뤄야 하는데 **사용자에게는 결과가 같습니다.**
      responses:
        '200':
          description: 반응 반영 후 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/bookmark:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Community]
      summary: 글 저장(내 사진첩에 넣기)
      description: |
        **멱등입니다** — 이미 저장해 뒀어도 `200` 이고 행이 늘지 않습니다. 반응과 같은 모양 —
        켜기(`POST`)와 끄기(`DELETE`)가 따로라 네트워크 재시도가 저장을 되돌리지 않습니다(#451 4번).

        **세지 않습니다.** "몇 명이 저장했나" 는 어느 응답에도 없습니다 — 있으면 글쓴이에게
        남의 사진첩을 들여다보는 숫자가 됩니다. 그래서 응답은 집계가 아니라 **지금 상태** 하나입니다.
      responses:
        '200':
          description: 반영 후 상태 — 늘 `true`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: 저장 빼기
      description: |
        **멱등입니다** — 안 저장했던 것을 빼도 `200` 입니다. 없던 것과 있던 것을 상태 코드로
        나누면 앱이 두 갈래를 다뤄야 하는데 **사용자에게는 결과가 같습니다.**
      responses:
        '200':
          description: 반영 후 상태 — 늘 `false`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/bookmarks:
    get:
      tags: [Community]
      summary: 내가 저장한 글
      description: |
        **저장한 순입니다** — `post_bookmark.(createdAt, id)` 내림차순. 글이 쓰인 순이 아닙니다
        (Instagram 의 저장됨). 두 축인 이유는 글 목록과 같습니다.

        **인증 필수입니다.** 누구의 것도 아닌 목록은 없고, 경로에 사람이 없으므로 남의 목록은
        물을 길이 없습니다. 항목은 `GET /api/community/posts` 와 같은 `Post` 이고 저장한 글이라
        `bookmarked` 가 전부 `true` 입니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 저장한 글(커서 페이지네이션)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Post' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Bookmarks ───────────────────────────
  /api/bookmarks:
    get:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 heattrip 의 `/bookmarks` 는 경로도 스키마도 다른 별개 기능이고 이 계약의 범위 밖이었고, 그 레거시는 2026-09-06 에 #94 로 지웠다.
      tags: [Bookmarks]
      summary: 저장한 장소 목록
      description: |
        **커서 봉투입니다.** 2026-09 이전에는 벌거벗은 배열이었습니다 — 북마크는 사용자가
        계속 쌓는 목록이라 상한이 없고, 배열로 내보낸 뒤 봉투로 바꾸는 것은 파괴적 변경입니다.
        구현이 붙기 전인 지금이 유일하게 공짜인 시점입니다. ADR-0017 규약 2.

        **담은 순서의 역순입니다** — `(createdAt, id)` 내림차순. 두 축인 이유는 같은 초에
        둘을 담으면 한 축으로는 순서가 매 요청 달라지기 때문입니다(글 목록과 같은 규약).

        **`items` 가 `Bookmark` 가 아니라 `Place` 인 것은 의도입니다.** 목록 화면이 제목·
        사진·주소를 그리므로 식별자만 주면 앱이 장소마다 상세를 한 번씩 더 불러야 하고,
        그건 KTO 예산을 태웁니다. 담은 시각은 응답에 없습니다 — **정렬을 서버가 이미
        했으므로** 클라이언트가 다시 셀 이유가 없습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 북마크한 장소(커서 페이지네이션)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 `/bookmarks` 와 다른 기능이었고, 그 레거시는 #94 로 지웠다.
      tags: [Bookmarks]
      summary: 장소 북마크 추가
      description: |
        키는 **`contentId`** 입니다 — `Place.contentId` 와 같은 값입니다.
        2026-09 이전에는 `placeId` 라는 다른 이름이었습니다(ADR-0017 이 `contentId` 로 통일).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId]
              properties:
                contentId: { type: string }
      responses:
        '201': { description: 추가됨 }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/bookmarks/{contentId}:
    delete:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 `/bookmarks/{contentId}` 와 다른 기능이었고, 그 레거시는 #94 로 지웠다.
      tags: [Bookmarks]
      summary: 북마크 삭제
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: |
            삭제됨. **멱등입니다 — 없는 북마크를 지워도 `204`** 이고 `404` 가 아닙니다.

            하트는 토글이라 사용자가 같은 것을 두 번 누르거나, 다른 기기에서 이미 지운
            것을 다시 지웁니다. 거기서 `404` 를 주면 이미 원하는 상태(없음)인데 에러
            토스트만 뜹니다. 구현도 이미 그렇습니다(`deleteByUserAndContentId`).
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Groups ───────────────────────────
  /api/groups:
    post:
      tags: [Groups]
      summary: 가족 그룹 생성
      description: |
        가족 그룹을 만듭니다. 가족 간 케어 공유로 이중 급여(밥 두 번)·산책 누락을 막는
        기능의 시작점입니다.

        **같은 트랜잭션에서 방(`chat_room`)과 방장 멤버십(`chat_room_member`, `role=OWNER`)이
        함께 생깁니다.** 방이 없으면 초대코드를 발급할 사람이 없어 아무도 못 들어오므로,
        "방 없는 그룹" 은 만들어질 수 없는 상태입니다.

        **초대코드는 여기서 발급하지 않습니다.** 응답의 `roomId` 를 가지고
        `POST /api/chat/rooms/{roomId}/invites` 로 발급합니다. 2026-08 이전에는 이 경로가
        "그룹을 만들고 초대코드를 발급합니다" 였고 응답에 `inviteCode` 가 실렸습니다 —
        [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72) 이 초대코드를 방으로
        옮기면서 옛 모양이 되었고 이슈 #75 가 정리했습니다.

        **이미 가족 그룹에 속해 있으면 409 입니다.** 두 번 만들면 두 번째 그룹을
        `GET /api/groups/me` 가 영원히 보여주지 않아(이 경로는 참여 순서로 하나만
        돌려줍니다) 사용자가 존재도 삭제도 모르는 행이 됩니다. 생성 응답이 타임아웃돼
        클라이언트가 재시도하는 것이 이 상황이 실제로 벌어지는 모양이고, 참여 경로가
        멱등을 보장하는 것과 같은 이유로 여기도 막습니다. 방을 여럿 갖는 것이 계약이 되는
        `GET /api/chat/rooms`(M2.6)에서 이 제한을 다시 판단합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: 1~50자. 방 이름도 같은 값이 됩니다
                  example: "보리네 가족"
      responses:
        '201':
          description: 생성됨(방 id · 멤버 목록 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/groups/me:
    get:
      tags: [Groups]
      summary: 내 그룹 조회(멤버 목록 포함)
      description: |
        내가 속한 가족 그룹과 멤버 목록을 반환합니다. 속한 그룹이 없으면 404.

        멤버십의 출처는 `chat_room_member` 입니다 — `group_member` 표는 만들지 않습니다
        ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).

        **둘 이상의 가족에 속해 있으면 가장 먼저 참여한 그룹**을 돌려줍니다. 이 경로가
        단수인 것은 화면이 가족방 하나를 전제하기 때문이고, 방이 여럿인 화면은
        `GET /api/chat/rooms`(M2.6)가 답합니다.
      responses:
        '200':
          description: 내 그룹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/{groupId}/care-logs:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 오늘의 케어 조회
      description: |
        그룹의 케어 기록(물/밥/산책/투약/병원)을 조회합니다. 기본은 **오늘**이고, 누가·언제
        했는지를 가족이 함께 봅니다. 이른 것부터 오름차순입니다.

        **요청자가 그 그룹의 방 멤버가 아니면 403 입니다.** 멤버십의 유일한 원본은
        `chat_room_member` 이고([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)
        결정 1) `family_group` 에는 사용자 컬럼 자체가 없습니다. 없는 `groupId` 도 404 가
        아니라 403 입니다 — 404 로 답하면 id 를 훑어 "있는 가족/없는 가족" 을 가려낼 수 있고,
        가족의 존재 여부는 그 가족에게만 의미가 있는 정보입니다.

        **"오늘" 은 서버 시계의 로컬 날짜입니다.** 지금 운영·개발 모두 KST 라 지금은 KST 입니다.
        기록 시각(`occurredAt`)도 같은 시계에서 나오므로 둘이 어긋나지 않습니다.
      parameters:
        - name: date
          in: query
          description: 조회 날짜(생략 시 오늘)
          schema: { type: string, format: date, example: "2026-07-10" }
        - name: type
          in: query
          description: 케어 종류 필터(생략 시 전체)
          schema: { $ref: '#/components/schemas/CareType' }
      responses:
        '200':
          description: 케어 기록 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CareLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Groups]
      summary: 케어 기록 남기기
      description: |
        물/밥/산책 등을 기록합니다. **수행자(`doneBy`)와 시각(`occurredAt`)은 서버가 정합니다** —
        본문으로 받으면 남의 이름으로 기록을 남기거나 오늘 기록을 어제로 밀 수 있고, 그러면
        화면의 "아빠가 줬습니다" 를 믿을 수 없게 됩니다.

        **같은 종류를 오늘 이미 누가 찍었어도 거절하지 않습니다.** 두 번째가 실수인지 사실인지
        서버는 모릅니다 — 아침·저녁 두 번 주는 집에서 두 번째 밥은 정상이고, 막으면 실제로 한
        일이 기록에서 사라집니다. 확인 문구("오늘 14:20 아빠가 밥을 줬습니다. 그래도
        기록할까요?")는 **앱이 `GET` 응답을 보고 만듭니다** — 그 목록에 답이 이미 들어 있는데
        여기에 "이미 있음" 필드를 더하면 같은 사실의 출처가 둘이 됩니다.

        `group-write` 버킷(rate limit)에 등록된 경로입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareLogInput' }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/groups/{groupId}/care-logs/{careLogId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: careLogId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Groups]
      summary: 케어 기록 삭제(본인 기록만)
      description: |
        잘못 찍은 기록을 지웁니다 — 서버가 같은 종류의 두 번째 기록을 거절하지 않으므로(위 `POST`)
        되돌릴 문이 있어야 합니다(#209).

        **본인이 남긴 기록만 지울 수 있습니다.** 남의 기록은 403 이고 그대로 남습니다 — 지울 수
        있으면 엄마가 실제로 다녀온 산책을 아빠가 "실수겠지" 하고 지우는, 이 기능이 막으려던
        산책 누락이 그 자리에서 생깁니다. 채팅 메시지 삭제(보낸 사람만)와 같은 답입니다. 탈퇴한
        사람의 기록(`doneBy.userId` 가 0)은 누구도 못 지웁니다 — 본인 판정이 불가능하면 남는 쪽이
        안전합니다.

        **그 그룹에 없는 기록 id 는 404 입니다** — 다른 가족의 기록도, 없는 기록도 같은 404 입니다.
        403 을 주면 "그 id 는 존재한다" 를 알려 주는 셈이라 id 를 훑어 남의 가족이 하루에 몇 건을
        찍는지 셀 수 있습니다. 요청자가 그 그룹의 방 멤버가 아니면 기록 존재 여부와 무관하게 403 입니다.

        **물리 삭제라 같은 id 로 다시 부르면 404 입니다.** 메모 수정(`PATCH`)은 두지 않습니다 —
        메모는 기록의 부속이고, 잘못 적었으면 지우고 다시 찍는 쪽이 "누가 언제" 를 거짓 없이 남깁니다.

        `group-write` 버킷(rate limit)에 등록된 경로입니다 — 지우는 일은 찍는 일과 같은 빈도로 일어납니다.
      responses:
        '204': { description: 지워짐 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/groups/{groupId}/walk-notes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 산책 주의사항 조회(가족 공유 메모 한 장)
      description: |
        그룹의 산책 주의사항을 돌려줍니다. **그룹당 한 장**이라 배열이 아니라 객체입니다.

        **아직 아무도 안 썼으면 404 가 아니라 `body: ""` 입니다.** "아직 없다" 는 정상 상태이고,
        404 로 답하면 앱이 오류 화면과 빈 화면을 상태 코드로 갈라야 해서 네트워크 실패가 같은
        자리에서 만납니다. 그때 `updatedBy`·`updatedAt` 은 `null` 입니다.

        인가는 `care-logs` 와 같습니다 — 그 그룹의 방 멤버가 아니면 403.
      responses:
        '200':
          description: 주의사항 한 장(없으면 빈 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Groups]
      summary: 산책 주의사항 전체 교체
      description: |
        메모를 통째로 바꿉니다. 있으면 고치고 없으면 만듭니다. 본문·고친 사람·고친 시각이
        **함께** 바뀝니다.

        **본문은 `{"body": "..."}` 하나입니다.** 2026-08 이전 계약은 `{"notes": ["...", "..."]}`
        목록 전량 교체였는데, 그러면 PUT 때마다 행을 지우고 다시 넣게 되어 행마다 붙는
        `updatedBy` 가 아무것도 가리키지 않습니다. 이슈 #76 이 표를 **그룹당 한 장**으로
        정하면서 계약도 맞췄습니다. 앱이 줄 단위 목록으로 그리는 것은 화면의 표현이고, 보낼
        때는 편집된 전체 본문을 보냅니다.

        빈 문자열은 "다 지웠다" 는 정상 요청입니다 — 행을 지우지 않습니다. 지우면 "한 번도 안
        쓴 그룹" 과 구별되지 않습니다.

        `group-write` 버킷(rate limit)에 등록된 경로입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkNoteInput' }
      responses:
        '200':
          description: 교체 후 최신 한 장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkNote' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────── Chat ───────────────────────────
  /api/schedules:
    get:
      tags: [Schedules]
      summary: 기간 안의 일정
      description: |
        달력이 묻는 것은 늘 "이 기간" 이라 **페이지 커서를 두지 않습니다** — 한 달치가 수십 건이라
        자를 것이 없고, 커서를 두면 화면이 달을 넘길 때마다 커서를 버려야 합니다.

        **`ownerKind` 를 생략하면 내가 볼 수 있는 전부**가 옵니다 — 내 아이들 것과 우리 가족 것이
        한 목록입니다. 주면 `ownerRef` 도 있어야 하고, 그 주인을 못 보는 사람에게는 **404** 입니다.

        `dogId` 는 `ownerKind` 와 **겹쳐 쓸 수 있습니다** — "우리 가족 일정 중 보리 것". 아이에 안
        묶인 일정("사료 주문")은 이 필터에 안 걸립니다.

        **정렬은 날짜 → 시각 → id 이고, 시각 없는 것("하루 종일")이 그날의 뒤입니다.** 두 주인의
        목록을 이어 붙이면 순서가 종류순이 되므로 서버가 다시 세웁니다.

        **기간이 92일을 넘으면 400** 입니다. 상한이 없으면 한 요청이 몇 년치를 끌어오고, 그건 느린
        것이 아니라 메모리를 먹는 문제입니다. 92일이면 "이번 달 ± 한 달" 이 한 번에 들어옵니다.
      parameters:
        - name: from
          in: query
          required: true
          description: 시작 날짜(포함)
          schema: { type: string, format: date, example: "2026-10-01" }
        - name: to
          in: query
          required: true
          description: 끝 날짜(포함). `from` 보다 앞이거나 92일을 넘으면 400
          schema: { type: string, format: date, example: "2026-10-31" }
        - name: ownerKind
          in: query
          description: 생략하면 내가 볼 수 있는 전부. 주면 `ownerRef` 도 필요합니다
          schema: { $ref: '#/components/schemas/ScheduleOwnerKind' }
        - name: ownerRef
          in: query
          description: 그 주인의 id
          schema: { type: integer, format: int64 }
        - name: dogId
          in: query
          description: 그 아이 것만. `ownerKind` 와 겹쳐 쓸 수 있습니다
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 기간 안의 일정
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Schedules]
      summary: 일정 만들기
      description: |
        **`ownerKind`+`ownerRef` 의 소유권을 서버가 확인합니다** — 내 아이거나, 내가 든 가족
        그룹이어야 합니다. 아니면 404 입니다.

        `dogId` 는 `ownerRef` 와 **별개**입니다 — "가족 소유인데 보리 것" 이 흔합니다. 없어도
        됩니다("사료 주문").

        `atTime` 은 **없어도 됩니다** — "이번 주말 목욕". 0시로 채우지 않습니다.

        `assignee` 는 **그 주인을 볼 수 있는 사람**이어야 합니다. 아무나 담당으로 적으면 남의
        화면에 그 사람이 모르는 일정이 뜹니다 — 아니면 404 입니다.

        상태는 항상 `planned` 로 시작합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: 만들어짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Schedules]
      summary: 일정 고치기
      description: |
        `PUT` 이 아니라 `PATCH` 인 이유: 화면이 한 칸만 고치는 일이 흔합니다(담당자만 바꾸기,
        완료 표시만 하기).

        **`version` 이 필수입니다** — 쿼리로 받습니다. 서버의 것과 다르면 **409** 와 함께
        **최신 값**을 줍니다(`ScheduleConflict`). 조용히 덮어쓰면 아빠가 옮긴 병원 시각이
        엄마의 옛 화면으로 되돌아갑니다.

        **왜 본문이 아니라 쿼리인가.** 이 본문은 부분 수정이라 스키마에 `required` 를 둘 수
        없습니다(ADR-0017 규약 4 — 생성 스키마를 재사용하면 부분 수정이 계약대로는 불가능해진
        사고에서 나온 규약입니다). 그런데 잠금 값은 반드시 있어야 합니다 — 선택으로 두면 앱이
        안 보내는 순간 잠금이 사라집니다. 둘 중 필수인 쪽을 본문 밖으로 냈습니다.

        **`memo`·`atTime`·`dogId`·`assignee` 는 안 보내면 비웁니다.** "비우는 것" 과 "안 바꾸는
        것" 이 둘 다 `null` 로 오기 때문입니다 — 담당자를 뗄 길이 없는 쪽이 더 나쁘고, 화면은
        늘 전체를 보냅니다. `kind`·`title`·`onDate` 는 반대로 **안 보내면 안 바꿉니다**(비울 수
        없는 값들입니다).

        **주인은 못 바꿉니다.** `ownerKind`·`ownerRef` 가 이 본문에 없습니다 — 아이 일정을 가족
        일정으로 옮기는 것은 권한이 바뀌는 일이라, 고치기와 같은 문으로 두면 그 검사를 빠뜨리기
        쉽습니다.

        `status` 를 `done`·`skipped` 로 바꾸면 `doneAt` 이 찍히고, `planned` 로 되돌리면
        **지워집니다** — 안 지우면 "아직 안 한 일" 에 완료 시각이 붙어 있게 됩니다.

        **완료로 바꾸면 오늘의 케어에도 한 줄이 생깁니다**(#420). 가족 소유이고 종류가
        `walk`·`vet`·`med` 일 때만입니다 — 나머지는 케어 종류가 아닙니다. 되돌리면 그 줄을
        거둡니다. 일정을 **지우는** 것은 다릅니다 — 그때는 케어 기록이 남습니다.
      parameters:
        - name: version
          in: query
          required: true
          description: 마지막으로 본 `version`. 서버의 것과 다르면 409 입니다
          schema: { type: integer, example: 3 }
        - name: date
          in: query
          description: |
            주면 **그 하루만** 고칩니다(#421). 반복 규칙에만 쓰고, 그날짜용 행이 하나 생기며
            규칙은 그날을 건너뜁니다. 안 주면 규칙 자체를 고칩니다 — 앞으로 오는 날 전부가
            바뀝니다. 규칙이 안 오는 날이거나 되풀이가 아닌 일정이면 **404** 입니다.
          schema: { type: string, format: date, example: "2026-12-15" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200':
          description: 고쳐짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            다른 사람이 먼저 고쳤습니다. **`error` 봉투는 평소와 같고**(앱의 공통 오류 처리가
            `error.code` 로 분기합니다) 그 옆에 최신 값이 함께 옵니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleConflict' }
    delete:
      tags: [Schedules]
      summary: 일정 지우기
      description: |
        물리 삭제라 같은 id 로 다시 부르면 404 입니다. 남의 일정도, 없는 일정도 같은 404 입니다.

        `date` 를 주면 **그 하루만 건너뜁니다**(#421) — 규칙은 그대로입니다. "이번 주만
        안 함" 이 반복을 지우는 일이 되면 안 됩니다. 안 주면 그 일정(규칙이면 규칙 전체와
        예외, 옮겨 둔 하루까지)이 사라집니다.
      parameters:
        - name: date
          in: query
          description: 그 하루만 건너뜁니다. 규칙이 안 오는 날이면 404 입니다
          schema: { type: string, format: date, example: "2026-12-15" }
      responses:
        '204': { description: 지워짐 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media:
    post:
      tags: [Media]
      summary: 사진 올리기 (multipart)
      description: |
        글에 붙일 사진을 올립니다. 돌아온 `id` 를 `PostInput.mediaIds` 에 싣습니다.

        **한 요청에 한 장**이 기본입니다 — 앱이 순서대로 올리고, 글의 사진 순서는 `id` 순
        (= 올린 순)입니다. `width`·`height` 는 파일이 하나일 때만 줄 수 있고 둘을 함께 줍니다.
        서버는 이미지를 열어 재지 않습니다 — Mac mini 한 대의 CPU 입니다.

        **10MB 를 넘으면 400** 입니다. 2026-09-13 이전에는 Spring 기본값(1MB)이라 폰 사진 한 장도
        못 받았습니다 — 이 경로가 실제 사진으로 쓰인 적이 없어서 아무도 못 봤습니다.

        `category` 가 `POST_VIDEO` 면 **400** 입니다 — 영상은 `POST /media/videos` 로 갑니다.
        나머지 카테고리(`JOURNEY_IMAGE`·`PROFILE_IMAGE`·`REVIEW_IMAGE`)는 감정 여행 시절 것이라
        서버는 받지만 앱은 안 씁니다.

        올린 것은 아직 **어디에도 안 붙은** 상태(`refType: null`)이고, 하루 안에 글에 안 붙으면
        서버가 거둡니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, category]
              properties:
                files:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
                  description: '`image/jpeg` · `image/png` · `image/webp`. 장당 10MB'
                category:
                  type: string
                  enum: [POST_IMAGE, WALK_IMAGE, CHAT_IMAGE, JOURNEY_IMAGE, PROFILE_IMAGE, REVIEW_IMAGE]
                  description: 글 사진 `POST_IMAGE` · 산책 사진 `WALK_IMAGE`(#450) · 채팅 사진 `CHAT_IMAGE`(#452) · 아이 사진 `PROFILE_IMAGE`(#448). `JOURNEY_IMAGE`·`REVIEW_IMAGE` 는 옛 값이라 앱이 안 씁니다
                width:
                  type: integer
                  minimum: 1
                  description: 픽셀 폭. 파일이 하나일 때만, `height` 와 함께
                height:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 올렸습니다. 요청의 파일 순서대로
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Media]
      summary: 올린 것 지우기 (내 것만)
      description: |
        S3 객체와 행을 함께 지웁니다. **내 것이 아니면 404** — 남의 것과 없는 것을 구별해 주지
        않습니다(ADR-0017 규약 3). 2026-09-13 이전에는 400 "권한 없음" 이었는데 그러면 id 를
        훑어 어느 번호에 남의 파일이 있는지 셀 수 있었습니다.

        글에 이미 붙은 것을 여기서 지우면 그 글의 사진이 빠집니다. 글을 고치는 길은
        `PATCH /api/community/posts/{postId}` 의 `mediaIds` 입니다 — 그쪽이 순서와 함께 다룹니다.
      responses:
        '204': { description: 지웠습니다 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/videos:
    post:
      tags: [Media]
      summary: 영상 자리 잡기 — 서명 PUT 받기 (①)
      description: |
        영상은 서버를 **안 지납니다** — `api.heattrip.link` 앞의 Cloudflare 가 요청 본문을 100MB 에서
        끊습니다. 그래서 세 단계입니다.

        1. **여기** — 형식·크기·길이·픽셀을 알리면 `pending` 행이 생기고 `uploadUrl`(서명 PUT, **15분**)이
           옵니다. 파일은 아직 없습니다.
        2. 앱이 `uploadUrl` 로 S3 에 **직접 PUT** 합니다 — 알린 것과 **같은 `Content-Type`** 으로.
           서명에 묶여 있어서 다르면 S3 가 `SignatureDoesNotMatch` 로 거절합니다.
        3. `POST /media/{mediaId}/complete` — 서버가 S3 에 HEAD 로 실제로 올라왔는지와 크기를 묻고
           `ready` 로 바꿉니다.

        **상한 — 60초 · 150MB · `video/mp4`·`video/quicktime`.** 앱이 720p 로 다시 인코딩해 올리므로
        60초짜리가 보통 수십 MB 입니다. 넘으면 **400** 입니다. `size` 는 **올릴 파일의 정확한
        바이트 수**입니다 — ③ 에서 실제 크기와 같아야 합니다. 서명 PUT 은 크기 조건을 못 걸어서
        올라온 뒤 서버가 잽니다.

        `pending` 인 것은 글에 붙지 않습니다(`PostInput.mediaIds` 가 400). 하루 안에 ③ 을 안 하면
        서버가 자리와 S3 객체를 함께 거둡니다.

        **위치 메타데이터는 기기에서 지우고 올립니다** — 사진과 같습니다(태그 설명).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoUploadRequest' }
      responses:
        '201':
          description: 자리를 잡았습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoUploadTicket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/{mediaId}/complete:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Media]
      summary: 영상 올리기 끝 — 포스터와 함께 확정 (③)
      description: |
        앱이 S3 에 PUT 을 마친 뒤 부릅니다. 서버가 S3 에 **HEAD** 로 묻습니다 — 객체가 있는가,
        크기가 ① 에서 알린 것과 같은가, 형식이 영상인가. 맞으면 포스터를 저장하고 `ready` 가 됩니다.
        그때부터 `PostInput.mediaIds` 에 실을 수 있습니다.

        **포스터(썸네일)는 앱이 만들어 여기에 싣습니다** — 서버에서 ffmpeg 를 돌리는 것보다 쌉니다
        (Mac mini 한 대). jpeg·png·webp, 10MB 까지. 피드는 이 그림과 재생 표시만 그리고 자동재생은
        없습니다.

        - **409** — 아직 S3 에 없습니다. 잘못된 요청이 아니라 **아직 그 상태가 아닌 것**입니다.
          PUT 을 다시 하고 다시 부르십시오. 행은 `pending` 으로 남습니다.
        - **400** — 크기가 알린 것과 다르거나(다른 파일을 올린 것입니다), 영상이 아니거나, 포스터가
          사진이 아니거나, `mediaId` 가 사진입니다(사진은 이 단계가 없습니다).
        - **404** — 내 것이 아닙니다. 없는 것과 구별해 주지 않습니다(ADR-0017 규약 3).

        **두 번 불러도 같습니다.** 이미 `ready` 면 그대로 돌려주고 두 번째 포스터는 안 받습니다 —
        앱이 응답을 못 받고 다시 부르는 경우를 위해서입니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [poster]
              properties:
                poster:
                  type: string
                  format: binary
                  description: 앱이 뽑은 썸네일 한 장. `image/jpeg` · `image/png` · `image/webp`
      responses:
        '200':
          description: 확정했습니다 — `status` 가 `ready` 이고 `posterUrl` 이 찼습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/crews:
    get:
      tags: [Crews]
      summary: 크루 목록
      description: |
        `scope` 하나로 질문 둘을 가릅니다. 돌아오는 것이 같은 카드라 경로를 둘로 파지
        않았습니다 — 화면도 같은 위젯으로 그립니다.

        - `mine`(기본) — **내가 든 크루**. 이 답은 `crew` 표가 아니라 `chat_room_member` 에서
          나옵니다(멤버십 표가 하나입니다).
        - `neighborhood` — **우리 동네 공개 크루**, 최근에 만든 것부터 50개까지. 시군구 앞 다섯
          자리로 훑습니다. 동네를 안 고른 사람에게는 **400** 입니다 — 좌표로 대신 찾지 않습니다.

        **멤버 목록(`members`)은 비어 있습니다.** 카드 하나에 사람 스무 명을 실어 나를 이유가
        없습니다 — 상세에서만 채웁니다.

        내가 이미 든 공개 크루도 동네 목록에 남습니다(빼면 "분명 있었는데 없어졌다" 가 됩니다).
        대신 `mine` 이 `true` 라 카드가 "들어가기" 를 그립니다.
      parameters:
        - name: scope
          in: query
          description: 안 주면 `mine` 입니다
          schema: { type: string, enum: [mine, neighborhood], default: mine }
      responses:
        '200':
          description: 크루 카드 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Crews]
      summary: 크루 만들기
      description: |
        **같은 트랜잭션에서 `chat_room` 이 함께 생기고 만든 사람이 그 방의 `OWNER` 가 됩니다.**
        방 생성이 실패하면 크루 행도 함께 롤백됩니다 — "방 없는 크루" 가 만들어질 자리가
        없습니다.

        **동네를 안 주면 내 동네**입니다(#342). 내 동네도 없으면 동네 없는 크루가 되고, 그 크루는
        어느 동네 목록에도 안 뜨고 코드로만 들어옵니다. 그래서 **공개 크루는 동네가 있어야
        합니다** — 없으면 아무도 못 찾는 공개라 **400** 입니다.

        **기본 공개 범위는 `invite`** 입니다. 처음부터 아무나 들어오면 관리가 안 됩니다.

        만 14세 미만은 **403** 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewInput' }
      responses:
        '201':
          description: 만들어짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/crews/{crewId}:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Crews]
      summary: 크루 홈
      description: |
        **초대 크루는 안 든 사람에게 `404`** 입니다 — 태그 설명 참조.

        공개 크루는 안 든 사람도 봅니다(안 그러면 들어갈지 말지 정할 수가 없습니다). 다만
        `members` 는 **빈 배열**입니다 — 인원 수까지가 공개이고 누가 있는지는 안에서만입니다.
      responses:
        '200':
          description: 크루 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Crews]
      summary: 크루 지우기 (방장이 혼자일 때만)
      description: |
        **방장만**이고, **혼자 남았을 때만**입니다 — 다른 사람이 있으면 **409** 입니다.

        방을 지우면 대화가 함께 사라집니다. **남의 대화를 지우는 버튼은 만들지 않습니다** —
        방장이 화가 난 날 누를 수 있는 버튼이 되고, 그날 사라지는 것은 다른 사람들의 기록입니다.
        사람이 있으면 넘기면 됩니다(`PUT .../owner/{userId}`).

        그 크루의 **품앗이와 그것이 만든 달력 줄까지** 함께 사라집니다 — `crew_favor` 는
        `ON DELETE CASCADE` 지만 일정은 다른 표라, 안 거두면 없는 크루의 약속이 사람들 달력에
        남습니다.
      responses:
        '204': { description: 지웠습니다 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 아직 다른 분이 있습니다. 방장을 넘기고 나가 주세요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Crews]
      summary: 크루 고치기 (방장만)
      description: |
        **방장이 아니면 `403`** 입니다.

        `PUT` 이 아니라 `PATCH` 인 이유: 화면이 한 칸만 고치는 일이 흔합니다(정원만 줄이기).
        만들기 스키마를 재사용하지 않습니다 — 그러면 정원만 줄이려는 사람이 이름을 함께 보내야
        하고, 그 이름이 그 사이 바뀐 값이면 되돌려 버립니다(ADR-0017 규약 4).

        **`null` 과 빈 문자열이 다릅니다.** 필드를 안 보내면 안 바꾸고, `""` 를 보내면
        **지웁니다**(소개를 지우거나 동네를 떼는 유일한 방법입니다).

        **이름을 고치면 방 이름도 함께 바뀝니다.** 한쪽만 바뀌면 같은 모임이 채팅 목록에서
        옛 이름으로 남습니다.

        **정원을 지금 인원보다 작게 줄이는 것은 막지 않습니다** — 이미 든 사람을 밀어낼 수
        없고, 줄인 값은 "더 안 받는다" 는 뜻으로 그대로 성립합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewPatch' }
      responses:
        '200':
          description: 고쳐짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/{crewId}/owner/{userId}:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Crews]
      summary: 방장 넘기기 (방장만)
      description: |
        **방장이 아니면 `403`**, 그 방에 없는 사람에게 넘기면 **`404`**, 자기 자신이면 **`400`** 입니다.

        `PUT` 인 이유: 방장은 **한 자리**이고 이 요청은 그 자리를 통째로 정합니다.

        **이것이 없으면 크루를 만든 사람은 갇힙니다** — `DELETE /api/crews/{crewId}/members/me`
        가 방장을 막기 때문입니다(나가면 초대코드도 못 내는 방이 남습니다). 막는 쪽만 만들고
        푸는 쪽을 안 만들면 그 사람은 영영 못 나갑니다.

        넘긴 뒤의 응답에서 `owner` 는 **`false`** 입니다.
      responses:
        '200':
          description: 넘겼습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/{crewId}/favors:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Crews]
      summary: 품앗이 목록
      description: |
        **멤버만**입니다. 공개 크루라도 안 든 사람에게는 `404` — 부탁에는 아이 이름과 "그날
        집을 비운다" 가 함께 적힙니다. 인원 수까지가 공개인 것과 같은 선입니다.

        **지난 부탁은 빠집니다.** 아무도 못 맡는 카드가 목록의 위쪽을 막습니다. 지우지는
        않습니다 — 맡은 사람에게는 지난 약속도 기록입니다.

        가까운 날짜부터 50건까지입니다.
      responses:
        '200':
          description: 부탁 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CrewFavor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Crews]
      summary: 부탁 올리기
      description: |
        **멤버만**입니다. 지난 날짜는 **400**, 남의 아이는 **404** 입니다.

        아이는 **내 아이**여야 합니다. 올릴 때 한 번 확인하고 그 행을 들어 둡니다 — 맡는 사람
        눈으로는 그 아이가 남의 것이라 나중에는 확인할 수 없습니다.

        **금액도 기간도 없습니다.** "두 시간만" 같은 말은 `note` 에 사람 말로 적습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewFavorInput' }
      responses:
        '201':
          description: 올렸습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewFavor' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/{crewId}/favors/{favorId}:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: favorId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Crews]
      summary: 부탁 거둬들이기 (올린 사람만)
      description: |
        **올린 사람만**입니다 — 맡은 사람이 무르는 것은 `DELETE .../take` 로 다릅니다.

        이미 맡은 부탁도 지울 수 있습니다 — 사정이 생겨 안 맡겨도 되는 날이 있습니다. 그때
        **달력의 줄도 함께 사라집니다.**

        상태로 "취소됨" 을 남기지 않습니다 — 목록이 안 지워지는 카드로 점점 길어집니다.
      responses:
        '204': { description: 지웠습니다 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/{crewId}/favors/{favorId}/take:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: favorId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Crews]
      summary: "제가 할게요"
      description: |
        **한 명만**입니다. 이미 맡은 것이면 **409** — 둘이 오면 부탁한 사람은 누가 오는지
        모릅니다. **내가 올린 부탁은 내가 못 맡습니다**(400).

        맡는 순간 **크루 소유 일정 한 줄**이 생기고 응답의 `scheduleId` 가 그것입니다. 그 줄은
        `owner_kind=room` 이라 그 크루 사람 **모두의 달력**에 뜹니다 — 크루 화면에만 두면
        그날 아침에 아무도 그것을 안 봅니다.

        그 줄에는 **시각이 없습니다.** 품앗이가 정하는 것은 시간대(오전·오후·저녁)이지 시각이
        아니고, 0시로 채우면 달력이 "새벽 12시" 로 그립니다. 시간대는 메모로 갑니다
        (`"오후 · 두 시간만 부탁드려요"`).
      responses:
        '200':
          description: 맡았습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewFavor' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 다른 분이 맡았습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Crews]
      summary: 맡은 것을 무르기 (맡은 사람만)
      description: |
        **맡은 사람만**입니다 — 올린 사람이 거둬들이는 것은 `DELETE .../favors/{favorId}` 로
        다릅니다. 권한도 결과도 다릅니다: 이쪽은 부탁이 **다시 열리고**, 저쪽은 부탁이 사라집니다.

        **달력의 줄도 함께 사라집니다.** 안 거두면 아무도 안 하기로 한 일이 그날 아침에 뜹니다.
      responses:
        '200':
          description: 물렀습니다. 부탁이 다시 `open` 입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrewFavor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/join/{code}:
    post:
      tags: [Crews]
      summary: 초대 코드로 크루 참여
      description: |
        코드 **발급**은 채팅 것을 그대로 씁니다(`POST /api/chat/rooms/{roomId}/invites`).
        여기가 따로 있는 것은 돌려주는 것이 방이 아니라 **크루**여서입니다.

        경로에 크루 id 가 없는 것은 **코드만 아는 사람이 부르는 경로**이기 때문입니다.

        **가족방 코드로는 이 경로를 못 지나갑니다**(`403`) — 서버가 방의 `origin_kind` 를
        대조합니다.

        **크루 정원을 넘으면 `409`** 입니다. 그때 초대코드의 사용 횟수도 안 씁니다 — 예외가
        트랜잭션을 통째로 되돌립니다. (방 정원은 서비스 전체의 상한이고 크루 정원은 방장이
        정한 값이라, 둘은 다른 숫자입니다.)

        이미 든 사람에게도 **200** 입니다(멱등).

        만 14세 미만은 **403** 입니다.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: "K7QF2M9X" }
      responses:
        '200':
          description: 들어왔습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 크루 정원이 찼거나 초대코드의 사용 횟수를 다 썼습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 만료·회수된 초대코드입니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/crews/{crewId}/members/me:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Crews]
      summary: 공개 크루에 바로 참여
      description: |
        **공개 크루만**입니다. 초대 크루면 **404** 입니다 — 안 든 사람에게는 존재 자체를
        안 흘립니다.

        **강퇴당한 사람은 공개 크루라도 다시 못 들어옵니다**(`403`). 공개는 "누구나 들어올 수
        있다" 이지 "내보낸 사람도 돌아온다" 가 아닙니다.

        정원을 넘으면 **409**, 이미 든 사람에게는 **200** 입니다(멱등).

        만 14세 미만은 **403** 입니다.
      responses:
        '200':
          description: 들어왔습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 크루 정원이 찼습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Crews]
      summary: 크루 나가기
      description: |
        **방에서도 나갑니다** — 정확히는 나갈 곳이 하나뿐입니다(`chat_room_member`). 한쪽만
        남는 상태가 구조적으로 없습니다.

        **재입장 금지를 안 겁니다**(강퇴와 다른 점이 그것뿐이고 그것이 전부입니다). 나갔다가
        다시 들어올 수 있습니다.

        **방장은 못 나갑니다**(`400`) — 나가면 초대코드도 못 내고 강퇴도 못 하는 방이 남습니다.
        넘기기·지우기는 아직 없습니다.

        이미 나가 있어도 **204** 입니다.
      responses:
        '204': { description: 나갔습니다 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/crews/{crewId}/members/{userId}:
    parameters:
      - name: crewId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Crews]
      summary: 크루에서 내보내기 (방장만)
      description: |
        **방장이 아니면 `403`** 입니다. 방장은 자기를 못 내보냅니다(`400`) — 나가기는 다른
        경로입니다.

        **재입장 금지가 걸립니다.** 나가기와 갈리는 지점이 그것입니다. 푸는 것은 방장이고
        `POST /api/chat/rooms/{roomId}/bans/{userId}` 의 `DELETE` 가 그 자리입니다.

        그 사람이 쓴 메시지는 **남습니다** — 지우면 신고 근거가 사라집니다.

        이미 나가 있어도 **204** 입니다. 그 방에 없는 사람이면 **404** 입니다.
      responses:
        '204': { description: 내보냈습니다 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/chat/rooms:
    get:
      tags: [Chat]
      summary: 내 방 목록
      description: |
        내가 속한 방을 돌려줍니다. 방마다 미읽음은 `lastSeq − lastReadSeq` **뺄셈**입니다 —
        두 값 모두 이 조회가 이미 읽어 오는 컬럼이라 추가 쿼리가 0입니다.

        방 종류를 가리지 않습니다 — 채팅은 가족 그룹 종속이 아니라 범용 다중 방입니다
        ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).
        **`roomId` 를 받지 않으므로 403 이 없습니다.** 답의 범위 자체가 내 멤버십이라
        남의 방이 섞여 들어올 문이 없고, 강퇴된(`removed_at`) 방도 빠집니다.

        `lastMessage` 는 아직 아무 말도 없는 방에서 `null` 입니다. `isDefault` 와 `members`
        는 이 응답에 **없습니다** — 앞의 것은 "가족방이 기본" 이라는 판단이라 chat 이 답할 수
        없고, 뒤의 것은 방 상세 조회에만 실립니다.
      responses:
        '200':
          description: 방 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      x-status: planned
      x-status-note: |
        방 상세 단건 조회는 아직 없다. 앱은 `GET /api/chat/rooms` 목록에서 방을 고른다.
      tags: [Chat]
      summary: 방 상세(멤버 목록 · 내 lastReadSeq · 역할)
      responses:
        '200':
          description: 방 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Chat]
      summary: 메시지 목록(폴링 · 과거 스크롤 겸용)
      description: |
        `afterSeq`(델타)와 `beforeSeq`(과거) **둘 중 하나**에 `limit` 을 붙입니다.
        둘 다 주면 400, 둘 다 없으면 **최신 `limit` 건**입니다. 응답은 공용 `Page` 가 아니라
        `{ items, lastSeq, hasMore }` 입니다 — 커서가 `roomSeq` 이고, 미읽음 계산이
        `lastSeq` 를 필요로 하기 때문입니다.

        **`items` 는 어느 방향으로 넘겼든 `roomSeq` 오름차순입니다.** 방향에 따라 순서가
        갈리면 클라이언트가 어느 파라미터를 보냈는지에 따라 정렬을 달리해야 하고, 그 분기를
        한 번 빠뜨리면 대화가 거꾸로 그려집니다.

        **삭제된 메시지도 톰스톤으로 들어 있습니다**(`deletedAt` 이 `null` 이 아닌 항목).
        거르면 그 `roomSeq` 가 클라이언트에 도달하지 않아 읽음 커서가 넘지 못하고 미읽음
        뱃지가 영원히 남습니다([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).

        ### ETag — 서버가 직접 계산합니다

        `ETag: "{roomId}:{lastSeq}"` 는 **`afterSeq` 를 보냈고 `hasMore` 가 `false` 인 응답에만**
        붙습니다. 그 응답만이 "이제 `lastSeq` 까지 전부 손에 넣었다" 를 뜻하기 때문입니다.
        첫 장(`hasMore: true`)·첫 진입(커서 없음)·과거 스크롤(`beforeSeq`) 응답에는 **ETag 가
        없습니다** — 그 응답들은 방의 끝까지 준 것이 아닌데 방의 끝을 가리키는 표를 달면
        그건 거짓말이고, 실제로 그 다음 폴링이 빈 `304` 로 막혀 **그 사이 메시지를 통째로
        잃습니다**(60줄 방에서 실측했습니다). `ShallowEtagHeaderFilter` 가 아니라 `chat_room`
        한 행만 읽어 만드는 값이라, 304 로 끝나는 폴링은 메시지 조회 자체를 하지 않습니다.

        `If-None-Match` 로 되보내면 **세 가지가 모두 참일 때만** `304` 입니다 —
        ① 인가를 통과했다(먼저 확인합니다. 순서가 뒤집히면 남의 방 `lastSeq` 를 304/200 차이로
        알아낼 수 있습니다), ② `afterSeq` 를 함께 보냈다(폴링이다), ③ `afterSeq >= lastSeq`
        다(실제로 줄 것이 없다).

        ⚠️ 서버 구현 메모: 응답에 ETag 가 붙어 있으면 **스프링 MVC 가 위 판단과 무관하게
        `If-None-Match` 를 스스로 대조해 200 을 304 로 갈아치웁니다**. 그래서 ③ 을 코드에
        적어 두는 것만으로는 부족하고, 위처럼 **부분 페이지에 ETag 를 붙이지 않는 것**이
        실제 방어입니다.
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/AfterChangeSeq'
        - $ref: '#/components/parameters/BeforeSeq'
        - $ref: '#/components/parameters/ChatLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 메시지 목록
          headers:
            ETag:
              description: |
                `"{roomId}:{lastSeq}:{lastChangeSeq}"`. 다음 폴링에 `If-None-Match` 로 그대로 되보냅니다.
                **변경 번호가 들어 있는 이유**(ADR-0023): 이미 보낸 말이 바뀌면 `lastSeq` 는 그대로라
                304 가 그 변화를 가려 버립니다.
                **`afterSeq` 를 보냈고 `hasMore` 가 `false` 인 응답에만 붙습니다** — 그
                응답만이 "`lastSeq` 까지 전부 받았다" 를 뜻합니다.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '304':
          description: |
            새 메시지가 없습니다. **본문이 없습니다** — 그게 이 최적화의 전부입니다.
            `afterSeq` 를 보낸 폴링 요청에만 나갑니다. 첫 진입(커서 없음)과 과거
            스크롤(`beforeSeq`)은 옛 ETag 를 들고 와도 `200` 입니다 — 그 응답들에는 애초에
            ETag 가 붙지 않으므로 대조할 것이 없습니다.
          headers:
            ETag:
              description: 되보낸 값과 같습니다
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chat]
      summary: 메시지 전송
      description: |
        보낸 사람의 읽음 위치(`lastReadSeq`)가 이 메시지까지 올라갑니다 — 내가 보낸 말은 내 방 목록의
        미읽음에 들지 않습니다(#330). 보낼 수 있다는 것은 방을 열어 두었다는 뜻이라 그 앞의 메시지도
        읽은 것으로 칩니다.

        `clientMsgId` 는 **멱등키**입니다. 전송은 재시도 가능한 POST 인데 사용자가 답답해
        다시 누르면 같은 메시지가 두 번 들어갑니다 — 서버가
        `UNIQUE (room_id, sender_user_id, client_msg_id)` 로 받치고, **같은 사람이** 같은
        키로 다시 보내면 처음 배정한 `roomSeq` 를 그대로 돌려줍니다.

        **범위는 방이 아니라 "이 방에서의 나" 입니다.** 같은 방의 다른 멤버가 우연히 같은
        키를 써도 서로의 메시지를 지우지 않습니다 — 범위가 방 전체이던 판에서는 뒤에 보낸
        사람이 200 과 함께 **남의 메시지**를 돌려받고 자기가 하려던 말은 어디에도 남지
        않았습니다.

        **처음이면 `201`, 재전송이면 `200`입니다. `409` 가 아닙니다** — 재시도한 클라이언트
        입장에서 그 요청은 성공했고, 실제로 그 말은 방에 들어가 있습니다. 409 를 주면 앱은
        실패 화면을 띄우면서 정작 메시지는 보이는 상태가 됩니다. 두 응답의 본문은 같습니다.

        `clientMsgId` 를 **생략하면 멱등을 요구하지 않는 전송**입니다 — 같은 본문이라도 두
        줄이 됩니다(`UNIQUE` 는 `NULL` 을 겹침으로 보지 않습니다).

        201 응답에 배정된 `roomSeq` 가 실립니다. 발급(`chat_room.last_seq` 증가)과 INSERT 는
        **하나의 트랜잭션**이라, 거절된 전송은 번호를 태우지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                body:
                  type: string
                  description: |
                    글자 메시지에서 비어 있으면 400 입니다. 사진 메시지(`mediaId` 있음, #452)에서는 **캡션**이라
                    비워도 됩니다 — 응답의 `body` 는 `""` 입니다. 길이 상한은 **문자가 아니라 UTF-8 바이트 65,535**
                    입니다 — 컬럼이 `TEXT` 라서 그렇고, 한글은 3바이트라 22,000자면 이미 넘습니다.
                    넘으면 400 입니다(예전에는 500 이 나갔습니다).
                  example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶"
                clientMsgId:
                  type: string
                  maxLength: 64
                  description: |
                    클라이언트가 만드는 멱등키. `Random.secure()` 16바이트 → base64url 이며
                    `uuid` 패키지를 쓰지 않습니다(신규 의존성 0).
                    `chat_message.client_msg_id varchar(64)` 와 같은 폭이고, 넘으면 400 입니다.
                  example: "Zm9vYmFyLWlkZW1wb3RlbmN5"
                contentType:
                  type: string
                  default: text
                  maxLength: 16
                  description: |
                    생략하면 `text`. `chat_message.content_type varchar(16)` 폭을 넘으면 400 입니다.
                    사진 메시지는 `image` 입니다(#452) — `mediaId` 가 있으면 생략해도 서버가 `image` 로 두고,
                    `image` 인데 `mediaId` 가 없거나 다른 종류에 `mediaId` 를 붙이면 400 입니다.
                replyToId:
                  type: [integer, "null"]
                  format: int64
                  description: |
                    답장(#452) — 원문 메시지의 `id`. **같은 방**의 메시지여야 하고, 다른 방의 id 나 없는 id 는
                    400 입니다(둘을 구별해 주지 않습니다). 원문이 지워졌어도 답장은 됩니다 — 응답의
                    `replyTo.deleted` 가 참입니다. 스레드가 아니라 카카오톡의 답장처럼 원문 하나입니다.
                mediaId:
                  type: [integer, "null"]
                  format: int64
                  description: |
                    사진 메시지(#452) — `POST /media` 에 `category=CHAT_IMAGE` 로 올린 것의 `id`. **사진 하나에
                    메시지 하나**입니다(여러 장은 메시지 여러 개). 내가 올렸고 `ready` 이고 아직 어디에도 안 붙은
                    것만 붙습니다 — 아니면 400 이고 **메시지도 생기지 않습니다**(번호도 안 태웁니다: INSERT 와
                    붙이기가 한 트랜잭션). 재전송(같은 `clientMsgId`)은 처음 붙인 사진을 그대로 돌려줍니다.
      responses:
        '201':
          description: 전송됨(배정된 roomSeq 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '200':
          description: |
            같은 `clientMsgId` 의 **재전송**입니다. 새로 만들지 않고 처음 만들어진 메시지를
            그대로 돌려줍니다 — `roomSeq` 도 처음 배정된 값입니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/read:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 읽음 워터마크 올리기
      description: |
        `lastReadSeq` 를 올립니다. **단조 증가만** 합니다 — 서버가
        `GREATEST(last_read_seq, :seq)` 로 쓰고 `LEAST(:seq, room.last_seq)` 로 상한을 겁니다.
        읽음 보고는 재시도·백그라운드 복귀로 순서가 뒤집혀 도착하고, 뒤늦게 온 작은 값이 큰
        값을 덮으면 이미 읽은 메시지가 다시 미읽음으로 뜹니다. 상한이 없으면 뺄셈이 음수가 됩니다.

        **응답은 보낸 값이 아니라 서버가 실제로 쓴 값입니다.** 무시됐는지(뒤로 가는 값)
        잘렸는지(방의 끝을 넘는 값) 앱이 알아야 낙관적으로 그린 뱃지를 되맞출 수 있습니다.
        `lastReadSeq` 가 없으면 400 입니다 — 빠진 필드를 0 으로 채우면 `{}` 라는 본문이
        "0 까지 읽었다" 라는 정상 요청이 됩니다. 음수도 400 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadSeq]
              properties:
                lastReadSeq: { type: integer, format: int64, example: 142 }
      responses:
        '200':
          description: 갱신된 워터마크
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastReadSeq: { type: integer, format: int64 }
                  unread: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/mute:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Chat]
      summary: 방별 음소거
      description: |
        이 방의 알림만 끄거나 켭니다 (이슈 #83). 멤버십의 속성이라 `chat_room_member.muted_at` 에 남고,
        살아 있는 멤버만 할 수 있습니다 — 아니면 `403` 입니다(없는 방도 같습니다).
        `muted` 가 없으면 400 입니다 — `{}` 가 해제로 읽히면 안 됩니다. 응답은 서버가 실제로 쓴 값입니다.
        방 목록(`GET /api/chat/rooms`)의 `muted` 로 확인합니다. `429` 는 `group-write` 버킷입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomMuteInput' }
      responses:
        '200':
          description: 적은 뒤의 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomMute' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/chat/rooms/{roomId}/invites:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 초대코드 발급
      description: |
        방장(`OWNER`)만 발급합니다. 기본값은 **7일 · 사용 횟수 무제한**입니다.
        회수(`DELETE`)하면 그 코드는 즉시 `revokedAt` 이 찍히고 **기존 멤버는 그대로
        남습니다** — 코드가 유출됐을 때의 대응 수단입니다.

        **이 경로를 다시 부르는 것(재발급)은 이전 코드를 죽이지 않습니다.** 부를 때마다
        새 코드가 하나 더 생기고, 이전 코드는 자기 TTL 동안 독립된 열쇠로 삽니다. 앱에서
        "새 코드 발급" 을 유출 대응 버튼으로 만들지 마세요 — 그 버튼은 아무것도 막지
        않습니다. 막는 것은 `DELETE` 뿐입니다.

        코드는 `SecureRandom` 으로 만들고 헷갈리는 글자(`0`·`O`·`1`·`I`)를 뺀 **32글자**
        (`23456789ABCDEFGHJKLMNPQRSTUVWXYZ`) 중에서 10글자를 뽑아 다섯 글자씩
        끊습니다(`A2C4E-F6H8K`). 손으로 옮겨 적을 수 있어야 하기 때문입니다.
        **`L` 은 들어 있습니다** — 다섯 글자를 다 빼면 31글자가 되어 "글자당 5비트"
        라는 길이 근거가 무너지고, `L` 을 헷갈리게 만드는 짝(`1`·`I`)이 이미 빠져
        있습니다. 2026-08 이전에는 이 문장이 `L` 도 뺐다고 적었는데, 그대로 입력
        검증기를 만들면 실제 코드의 약 27%가 거절됩니다(이슈 #75).

        **본문을 받지 않습니다.** 유효기간·사용 횟수를 정하는 곳은 서버의 한도 표
        하나입니다 — 클라이언트가 값을 보내기 시작하면 한도의 출처가 둘이 되고, 서버가
        "유효기간 무한" 요청을 막는 코드를 따로 써야 합니다. 그 문은 요금제가 생기는 날
        엽니다. 2026-08 이전에는 이 자리에 `expiresAt`·`maxUses` 를 받는 선택 본문이
        적혀 있었습니다(이슈 #75).

        방장이 아니거나 **이 방의 멤버가 아니면 403** 입니다. 404 가 아닌 것은 의도입니다 —
        404 로 답하면 남의 방 id 를 훑어 있는 방과 없는 방을 가려낼 수 있습니다.
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInvite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/invites/{code}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: code
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Chat]
      summary: 초대코드 폐기
      description: |
        방장만. 폐기한 `code` 는 UNIQUE 라 다시 만들어 쓰지 않습니다.

        **행을 지우지 않고 `revokedAt` 을 찍습니다.** 지우면 "회수된 코드" 와 "없던 코드" 가
        구별되지 않아 410(`INVITE_REVOKED`)과 404 가 한 덩어리가 됩니다 — 유출된 코드를
        회수한 방장이 "이 링크는 이제 안 됩니다" 를 확인할 방법도 함께 사라집니다.
        (#9 의 `refresh_token` 이 같은 이유로 폐기를 삭제로 하지 않습니다.)

        이미 회수된 코드를 다시 회수해도 204 입니다 — 최초 회수 시각을 덮어쓰지 않습니다.
      responses:
        '204': { description: 폐기됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/invites/{code}/join:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Chat]
      summary: 초대코드로 입장
      description: |
        재입장 금지 대상(`rejoinBlocked`)이면 **403** 입니다 — 강퇴가 그것을 찍습니다.

        **만 14세 미만**(`users.age_group = 'UNDER14'`)은 **가족 방에만** 참여할 수 있습니다.
        다른 종류의 방이면 403 입니다. 신청 창구는 없습니다. 나이대가 비어 있는 계정
        (소셜 로그인으로 들어온 예전 계정)은 **막지 않습니다** — 여기서 미성년으로 다루면
        그 계정들이 아무 예고 없이 방에 못 들어가게 됩니다.

        한도·상태 위반은 봉투를 새로
        만들지 않고 공통 `Error` 의 `error.code` 로 갈립니다 — `ROOM_MEMBER_LIMIT`(409) ·
        `INVITE_EXPIRED`(410) · `INVITE_REVOKED`(410) · `INVITE_USES_EXHAUSTED`(409).

        **검사 순서가 계약입니다.** ① 없는 코드 404 → ② 만료 410 → ③ 회수 410 →
        ④ **이미 멤버면 200** → ⑤ 사용 횟수 소진 409 → ⑥ 정원 409.
        ④ 가 ⑤·⑥ 보다 앞인 이유는 그 둘이 "자리를 하나 새로 쓴다" 는 요청에 대한
        검사이기 때문입니다 — 이미 방에 있는 사람은 자리를 새로 쓰지 않습니다.
        반대로 만료·회수는 코드 자체의 상태라 **이미 들어와 있던 사람에게도** 같은 답을
        줍니다(그래도 그 사람의 멤버십은 그대로 남습니다).

        **멱등입니다.** 같은 사람이 같은 코드로 두 번 들어오면 멤버 행도 `usedCount` 도
        늘지 않고 200 입니다. 입장에 실패한 요청은 `usedCount` 를 쓰지 않습니다 —
        증가와 멤버 생성이 하나의 트랜잭션이기 때문입니다.

        만 14세 미만(`users.age_group = 'UNDER14'`) 계정은 **가족방 외의 방**에 들어올 수
        없습니다(M2.7). 방 안 대화는 건드리지 않습니다.
      responses:
        '200':
          description: 입장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: 만료·회수된 초대코드(`INVITE_EXPIRED` · `INVITE_REVOKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    delete:
      x-status: planned
      x-status-note: |
        방 나가기는 아직 없다. `ChatMemberController` 가 자기 javadoc 에 "여기 없다" 고 적어 둔 그 동작이다 — 강퇴(`members/{userId}`)와 다른 규칙이 필요하다.
      tags: [Chat]
      summary: 방 나가기
      responses:
        '204': { description: 나갔음 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 강퇴
      description: |
        방장만 합니다. 멤버 행을 **지우지 않고** `removedAt` · `removedBy` · `rejoinBlocked` 를
        찍습니다 — 미읽음이 그 행의 `lastReadSeq` 뺄셈이라 지우면 되돌릴 수 없고, 무엇보다
        **재입장 금지를 걸 자리가 사라집니다.**

        강퇴당한 사람의 **메시지는 남깁니다**(지우면 신고 근거가 사라집니다).

        강퇴 = **재입장 금지**입니다. 유효한 초대코드로도 못 들어옵니다(403). 방장이
        `DELETE /api/chat/rooms/{roomId}/bans/{userId}` 로 풉니다.

        **이미 나가 있어도 204** 입니다. 있고 없고를 상태 코드로 나누면 앱이 두 갈래를
        다뤄야 하는데 방장에게는 결과가 같습니다.

        **방장은 자기를 못 내보냅니다**(400). 허용하면 방장이 없는 방이 생기고, 그 방은
        초대코드도 못 내고 강퇴도 못 합니다. 떠나는 것은 `DELETE .../members/me` 입니다.
      responses:
        '204': { description: 강퇴됨. 이미 나가 있었어도 같습니다 }
        '400':
          description: 방장이 자기를 지목했습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/bans/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 재입장 금지 해제
      description: |
        방장만 합니다. 강퇴 확인 문구가 "방 설정에서 다시 풀 수 있습니다" 라고 **약속하고**,
        이 경로가 그 약속을 지키는 자리입니다.

        **푸는 것은 금지뿐이고 멤버십은 아닙니다.** 풀어도 방에 자동으로 돌아오지 않고,
        그 사람이 초대코드로 다시 들어와야 합니다 — 자동으로 넣으면 방장이 "금지만 풀려고"
        누른 버튼이 사람을 방에 다시 넣는 버튼이 됩니다.

        금지 상태가 아니었어도 **204** 입니다.
      responses:
        '204': { description: 풀렸음 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 내 메시지 삭제
      description: |
        **소프트 삭제**입니다(#197). 행은 남고 본문만 비며 `deletedAt` 이 찍힙니다 — 행을 실제로
        지우면 뺀 자리가 `roomSeq` 빈틈이 되어 델타 폴링과 읽음 커서가 깨집니다. 앱은 `deletedAt`
        을 보고 "삭제된 메시지" 자리를 그립니다.

        **보낸 사람만** 지울 수 있습니다. 방장도 남의 메시지는 못 지웁니다 — 그건 신고(`/reports`)의
        자리입니다. 이미 지워진 메시지에 다시 부르면 그대로 **204** 입니다(첫 삭제 시각을 덮지 않음).
        신고 사본(`report_snapshot`)은 이 삭제와 무관하게 남습니다.

        rate limit 표에 없습니다(429 없음) — 초대 회수와 같은 판단으로, 반복해도 새로 생기는 것이
        없습니다.
      responses:
        '204': { description: 삭제됨 (이미 지워진 것도 같다) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/chat/messages/{messageId}/reactions/{kind}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ChatReactionKind' }
    post:
      tags: [Chat]
      summary: 반응 누르기(말풍선 아래 한 줄)
      description: |
        **멱등입니다** — 이미 눌러 뒀어도 `200` 이고 집계가 늘지 않습니다. 켜기(`POST`)와
        끄기(`DELETE`)가 따로인 이유는 토글이 재시도에 약하기 때문입니다: 요청에 의도가 없으면
        **네트워크 재시도 한 번이 사용자의 반응을 조용히 되돌립니다**(커뮤니티 반응이 2026-09 에
        같은 이유로 갈라졌습니다).

        **한 사람이 한 말에 여러 종류를 누를 수 있습니다** — 서로 배타적인 개념이 아닙니다.

        **지워진 메시지에는 못 누릅니다(`409`).** 삭제가 그 말의 반응을 이미 거둬 갔고, 톰스톤
        아래에 새 반응이 붙으면 지운 사람에게는 지워지지 않은 것처럼 보입니다.

        누르면 **방의 변경 번호가 오릅니다**([ADR-0023](https://github.com/sanghyunbang/heattrip/issues/500)) —
        그래야 그 말이 다른 사람의 다음 폴링에 `changed` 로 실립니다. 반응은 `roomSeq` 를 건드리지
        않으므로 델타만으로는 영영 오지 않습니다. 같은 이유로 **미읽음도 "새 메시지" 알약도
        올라가지 않습니다** — 반응은 새 말이 아닙니다.

        응답에 **최신 집계**를 실어 왕복을 한 번으로 줄입니다.
      responses:
        '200':
          description: 반영 후 그 말의 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReactions' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 지워진 메시지 — 반응을 새로 붙일 수 없습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Chat]
      summary: 반응 취소
      description: |
        **멱등입니다** — 안 눌렀던 것을 취소해도 `200` 입니다. 없던 것과 있던 것을 상태 코드로
        나누면 앱이 두 갈래를 다뤄야 하는데 **사용자에게는 결과가 같습니다.**

        **지워진 메시지에도 통합니다** — 지울 반응이 없을 뿐입니다. 여기서 `409` 를 내면
        "취소했는데 실패" 라는 없는 상태를 앱이 그려야 합니다.
      responses:
        '200':
          description: 반영 후 그 말의 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReactions' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/chat/rooms/{roomId}/reports:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 메시지 신고
      description: |
        신고의 단위는 **메시지**이고 한 번에 최대 3개입니다. 서버가 본문 사본·발신자·발신 시각과
        **앞뒤 각 5개의 `roomSeq` 범위**를 스냅샷으로 남깁니다 — 원본 참조만 하면 지워졌을 때
        판단이 불가능합니다.

        **경로가 바뀌었습니다** (2026-08-31, 이슈 #82). 예전 선언은
        `POST /api/chat/messages/{messageId}/reports` 였는데, 경로가 메시지 하나를 지목하는
        모양이라 **"한 번에 최대 3개" 를 표현할 수 없었습니다.** 구현된 적이 없는 초안이었고,
        신고는 방 안에서 일어나므로 방을 경로로 잡고 메시지를 본문의 목록으로 받습니다.

        메시지를 `id` 가 아니라 **`roomSeq`** 로 지목합니다. 목록 조회도 폴링 커서도 전부
        `roomSeq` 라, 신고만 `id` 를 요구하면 앱이 좌표를 두 벌 들고 다녀야 합니다.

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.** 응답에는 접수 번호와
        시각만 있습니다 — 피신고자 id 도 돌려주지 않습니다.

        **자동 차단하지 않습니다.** 예전 초안의 `alsoBlock` 은 뺐습니다 — 차단 경로가 아직
        없어서 받아도 아무 일이 일어나지 않고, 받는 척하는 필드가 계약에 있으면 앱이 그것을
        믿습니다. 차단이 생기면 앱이 `POST /api/blocks` 를 **따로** 부릅니다.

        한도: `chat-report` 버킷 분당 10회.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomSeqs, reason]
              properties:
                roomSeqs:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: integer, format: int64 }
                  description: |
                    신고할 메시지의 방 안 번호. 같은 값을 여러 번 보내도 하나로 셉니다.
                reason: { $ref: '#/components/schemas/ReportReason' }
                memo:
                  type: string
                  maxLength: 500
                  description: 덧붙이는 말. 500자를 넘기면 잘립니다.
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema:
                type: object
                required: [reportId, createdAt]
                properties:
                  reportId: { type: integer, format: int64 }
                  createdAt: { type: string, format: date-time }
        '400':
          description: |
            `REPORT_EMPTY` · `REPORT_MESSAGE_LIMIT` · `REPORT_MIXED_SENDERS` ·
            `REPORT_SELF` · `REPORT_MESSAGE_NOT_FOUND` · `REPORT_REASON_UNKNOWN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/blocks:
    post:
      tags: [Chat]
      summary: 사용자 가리기
      description: |
        차단은 **가리기**입니다 — 그 사람의 **과거·미래** 메시지에 `hiddenByBlock: true` 가
        붙습니다. **삭제가 아닙니다**: 다른 사람 화면에는 그대로 남습니다.

        **목록에서 빼지 않습니다.** 예전 설명은 "목록에서 빼고 내려줍니다" 였는데 그러면 그
        `roomSeq` 가 도달하지 않아 **미읽음 뱃지가 영원히 남습니다** — 소프트 삭제를 톰스톤으로
        내려주는 것과 같은 이유입니다(ADR-0011). 2026-08-31 에 고쳤습니다(#82).

        방 단위가 아니라 **사람 단위**입니다. 경로에 방 id 가 없습니다.

        **이미 가려 뒀어도 201** 입니다. 없던 것과 있던 것을 상태 코드로 나누면 앱이 두 갈래를
        다뤄야 하는데 사용자에게는 결과가 같습니다.

        같은 방에 있는지도, 그 계정이 실재하는지도 **확인하지 않습니다.** 확인에 성공/실패하는
        것 자체가 "그 사람과 같은 방에 있는가" · "그 계정이 있는가" 를 알려 주는 오라클이 됩니다.

        **자기 자신은 못 가립니다** (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '201': { description: 가려짐 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 가리기 해제
      description: |
        **없던 것을 풀어도 204** 입니다. 있고 없고를 상태 코드로 알려 주면 가려 뒀는지를
        응답으로 물어볼 수 있게 됩니다 — 본인만 아는 상태여야 합니다.
      responses:
        '204': { description: 해제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <JWT>`. 서명 알고리즘은 HS256.

        현재 발급되는 클레임은 다음 4개뿐입니다.

        | 클레임 | 값 | 비고 |
        |:---|:---|:---|
        | `sub` | 불투명 사용자 키 | **파싱 금지.** 이메일이라고 가정하지 마세요 |
        | `role` | 예: `ROLE_USER` | |
        | `iat` | 발급 시각 | |
        | `exp` | 만료 시각 | |

        아직 **없는** 클레임: `jti`(토큰 단위 무효화 불가 — 로그아웃해도 액세스 토큰은 만료까지 유효),
        `prv`(공급자).

        `jti` 는 이슈 #9 에서 도입하지 않기로 했습니다. 그 클레임은 **블록리스트 저장소라는
        소비자가 있어야** 의미가 있는데, MySQL 블록리스트는 모든 인증 요청마다 DB 조회를 1회
        더하면서 고작 1시간짜리 창을 줄입니다. #9 는 refresh 토큰 원장까지이며, Redis 로
        뒷받침되는 액세스 토큰 블록리스트는 M2 이후 별도 Epic 입니다.
        `prv` 는 읽는 코드가 없고, 가변 값을 불변 토큰에 복제하는 형태라 도입 계획이 없습니다
        (`provider` 는 `GET /auth/me` 가 DB 에서 돌려줍니다).

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: |
        지원 공급자는 `kakao` · `google` · `apple` 셋입니다 —
        [ADR-0010](../99-decisions/decision-log.md#adr-0010--소셜-로그인-공급자와-앱-세션-토큰-전략)
        이 정한 둘에 [ADR-0022](../99-decisions/decision-log.md#adr-0022--로그인은-소셜만이-정본이다--이메일-가입로그인은-개발qa-전용)
        결정 3 이 `apple` 을 더했습니다(#301, App Store 심사 지침 4.8). 코드의
        `OAuthLoginController.SUPPORTED_PROVIDERS` 가 **같은 목록**이어야 하고,
        `OpenApiAuthContractTest` 가 두 집합을 대조합니다. 한쪽만 넓히면 계약에 없는
        값이 302 로 통과합니다.

        **`apple` 은 다른 둘과 흐름이 같되 셋이 다릅니다.** ① Apple 은 사용자 정보 엔드포인트가
        없어 서버가 `id_token`(OIDC)으로 계정을 만듭니다 — 앱이 받는 것은 똑같이 1회용 `code` 입니다.
        ② 이름은 오지 않습니다(첫 응답의 폼 필드로 한 번만 주고, 서버는 그것을 받지 않습니다) —
        닉네임이 "반려인N" 으로 시작하고 사용자가 고칩니다. 이메일은 사용자가 가리면
        `@privaterelay.appleid.com` 릴레이 주소입니다. ③ 개발자 키가 설정되지 않은 서버에서는
        딥링크가 `error=apple_not_configured` 로 돌아옵니다 — 카카오·구글은 그와 무관합니다.
        Return URL 이 https 여야 해서 **로컬 http 서버로는 Apple 을 시험할 수 없습니다.**

        `naver` 는 **보류**입니다(ADR-0010). 다만 백엔드에는 아직 네이버 클라이언트 등록
        (`application-dev.properties`·`application-prod.properties`)과 `NaverOAuth2User`
        매핑이 남아 있어, 스프링 시큐리티 자체 진입점인 `GET /oauth2/authorization/naver`
        는 여전히 열려 있습니다. 이 계약이 광고하는 집합과 실제로 도달 가능한 집합이 아직
        같지 않다는 뜻이며, 그 구멍을 닫는 일은 **#13** 이 소유합니다.
      schema: { type: string, enum: [kakao, google, apple] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        이전 응답의 nextCursor. **Chat 은 이 파라미터를 쓰지 않습니다** —
        채팅의 커서는 방별 `roomSeq` 이고 `afterSeq`/`beforeSeq` 로 받습니다.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AfterSeq:
      name: afterSeq
      in: query
      description: |
        이 `roomSeq` **뒤에** 생긴 메시지. 폴링 델타용이며 `beforeSeq` 와 동시에 줄 수 없습니다.
        `0` 은 "아직 아무것도 못 받았다" 이고, 방의 `lastSeq` 보다 큰 값도 400 이 아니라
        **빈 델타**입니다 — 앱의 커서가 앞서 있는 것은 오류가 아니고, 그때도 응답의 `lastSeq`
        로 커서를 되맞출 수 있어야 합니다.
      schema: { type: integer, format: int64 }
    AfterChangeSeq:
      name: afterChangeSeq
      in: query
      description: |
        **이미 받은 말의 변화**를 어디까지 봤는가(ADR-0023). 응답의 `lastChangeSeq` 를 그대로 되돌려 보냅니다.
        주면 그 번호 뒤에 바뀐 말이 `changed` 에 실립니다 — 지금 그 변화는 삭제 하나이고 앞으로 반응이 붙습니다.
        생략하면 `changed` 는 빈 배열입니다(첫 진입 · 과거 스크롤은 그 장이 이미 최신입니다).
        창은 최근 200개 `roomSeq` 라 그 밖의 변화는 방을 다시 열 때 장 조회가 가져옵니다.
      schema: { type: integer, format: int64 }
    BeforeSeq:
      name: beforeSeq
      in: query
      description: |
        이 `roomSeq` **앞의** 메시지. 과거 스크롤용이며 `afterSeq` 와 동시에 줄 수 없습니다.

        **응답의 `items` 는 이때도 `roomSeq` 오름차순입니다.** 2026-08 이전에는 이 절이
        "내림차순으로" 라고 적었는데, 방향에 따라 순서가 갈리면 클라이언트가 어느 파라미터를
        보냈는지에 따라 정렬을 달리해야 합니다. 서버가 인덱스를 뒤에서부터 읽는 것은 그대로고,
        뒤집는 것은 서버가 한 번 합니다.
      schema: { type: integer, format: int64 }
    ChatLimit:
      name: limit
      in: query
      description: |
        한 장의 크기. 공용 `Limit`(기본 20)과 **다른 기본값**입니다 — 채팅 첫 진입은 최신
        50건이고, 그 값은 화면이 한 번에 그리는 양에서 왔습니다.

        상한을 넘겨 보내도 **400 이 아니라 잘립니다.** 페이지 크기는 사람이 적은 값이 아니라
        앱이 정한 값이라 잘라도 사용자가 보는 것이 달라지지 않고, 반대로 거절하면 앱의 한 줄
        실수가 채팅 전체를 멈춥니다. `1` 미만도 `1` 로 올립니다.
      schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        직전 응답의 `ETag`(`"{roomId}:{lastSeq}"`). 새 메시지가 없으면 `304` 입니다.
        **`afterSeq` 와 함께 보낼 때만** 의미가 있습니다 — 첫 진입·과거 스크롤은 창이
        달라지므로 방의 `lastSeq` 가 그대로여도 응답이 같지 않습니다.
      schema: { type: string }

  responses:
    Unauthorized:
      description: |
        인증 필요/무효. **본문이 없습니다** — 상태 코드 401 만 돌아오고 `Content-Type` 도 없습니다.

        토큰 없음·서명 위조·만료·옛 형식 subject·탈퇴한 계정의 살아 있는 토큰이 전부 같은 모양입니다.
        인증 실패의 원인을 본문으로 알려 주면 그 자체가 탐색 수단이 되기 때문입니다(#6).
        클라이언트는 `error.code` 를 읽어 분기하지 말고 **상태 코드 401 만 보고** 재로그인으로 보내세요.
        (2026-08 이전에는 이 절이 JSON `Error` 본문을 선언했지만 서버는 그때도 본문을 주지 않았습니다.
         계약 쪽을 실제 동작에 맞춥니다 — #5.)
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 요청 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 중복, 또는 아직 그 상태가 아님 — 예를 들어 S3 에 안 올라온 영상의 `complete`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        한도 초과. 두 가지 출처가 같은 응답을 씁니다.
        - 외부 데이터 한도 초과(예: KTO 1000콜/일)
        - 서버의 요청 빈도 제한(`ApiRateLimitFilter`). 인증 경로
          (`POST /auth/login`, `POST /auth/token/refresh`,
          `POST /auth/oauth/{provider}/callback`, `GET /oauth2/authorization/*`)가
          여기 걸립니다(#14). `Retry-After` 헤더에 창 길이(초)가 실립니다.

        본문은 공통 `Error` 이고 `error.code` 는 `RATE_LIMITED` 입니다. **버킷 이름이나
        한도 수치는 싣지 않습니다** — 서버 내부의 경로 분류를 그대로 노출하게 됩니다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Course:
      type: object
      description: |
        내가 걸은 길 중에 남긴 것(#339). `path` 는 **양 끝 100m 를 잘라 낸 선**이고, 원래 산책의
        선은 이 응답 어디에도 없습니다 — 받는 쪽이 집 앞을 복원할 수 없어야 합니다.
      required: [id, name, distanceM, durationS, visibility, mine, createdAt]
      properties:
        id: { type: integer, format: int64 }
        walkId:
          type: [integer, "null"]
          format: int64
          description: 어느 산책에서 왔나. **그 산책을 지우면 `null`** 이 됩니다 — 코스는 남습니다
        name: { type: string, maxLength: 60, example: "서울숲 한 바퀴" }
        note: { type: [string, "null"], maxLength: 200 }
        tags:
          type: array
          description: 반려견 관점 — `leash`(목줄 규정) · `poopbag`(배변봉투통) · `shade`(그늘·물)
          items: { type: string, enum: [leash, poopbag, shade] }
        path:
          type: [array, "null"]
          description: |
            잘라 낸 선, **`[경도, 위도]` 순서**입니다(`Walk.path` 와 같습니다).
            **목록 응답에서는 시작점 하나뿐**이고 상세에서만 전체가 옵니다.
          items:
            type: array
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
        distanceM:
          type: integer
          description: 잘라 낸 **뒤**의 길이(m). 원래 산책의 거리가 아닙니다
          example: 400
        durationS:
          type: integer
          description: 원래 산책의 소요(초). 잘라 낸 만큼을 빼지 않습니다 — 그 값은 알 수 없습니다
        visibility: { type: string, enum: [private, public], example: private }
        mine: { type: boolean, description: 내 코스인가. 공개 목록에서 내 것을 가리는 데 씁니다 }
        createdAt: { type: string, format: date-time }

    CourseInput:
      type: object
      description: |
        코스로 남기기(#339). **선을 보내지 않습니다** — 서버가 그 산책의 선을 베껴 와 자릅니다.
      required: [walkId, name]
      properties:
        walkId: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        note: { type: string, maxLength: 200 }
        tags:
          type: array
          items: { type: string, enum: [leash, poopbag, shade] }
        visibility:
          type: string
          enum: [private, public]
          description: 생략하면 `private` 입니다 — 공개는 사용자가 명시적으로 하는 일입니다

    WalkSafetyNow:
      type: object
      description: 산책 안전 지수의 재료 한 묶음(#336). 판정은 앱이 한다.
      required: [tempC, observedAt]
      properties:
        tempC: { type: number, format: double, example: 26.2, description: 기온(°C) — 기상청 T1H }
        humidity: { type: integer, nullable: true, example: 49, description: 습도(%) — REH }
        rain1hMm: { type: number, format: double, nullable: true, example: 0, description: 1시간 강수량(mm) — RN1 }
        precipType: { type: integer, nullable: true, example: 0, description: 강수형태 PTY — 0 없음 · 1 비 · 2 비/눈 · 3 눈 · 5 빗방울 · 6 빗방울눈날림 · 7 눈날림 }
        pm10: { type: integer, nullable: true, example: 31, description: 미세먼지(㎍/㎥). 에어코리아 승인 전이면 null }
        pm25: { type: integer, nullable: true, example: 18, description: 초미세먼지(㎍/㎥) }
        station: { type: string, nullable: true, example: 성수, description: 미세먼지 측정소(격자 중심에서 가장 가까운 곳) }
        observedAt: { type: string, format: date-time, example: '2026-09-07T05:10:00Z', description: 서버가 이 묶음을 만든 시각(UTC) }
    Error:
      type: object
      description: |
        4xx·5xx 오류 본문의 **유일한** 형태입니다(이슈 #10). 서버에서 이 봉투를 만드는 곳은
        `GlobalExceptionHandler` 한 곳뿐이며, 최상위 필드는 `error` 하나입니다 — 필드를
        최상위로 펼치지 마세요.

        **401 만 예외입니다 — 본문이 없습니다.** `components/responses/Unauthorized` 를 보세요.

        (2026-08 이전에는 실제 응답이 세 갈래였습니다: 이 봉투, 전역 처리기의
        `{ status, error, message, path, timestamp }`, `SocialController` 의
        `{ error: "문자열" }`. #10 이 하나로 합쳤습니다.)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
              enum: [VALIDATION, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
                     UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL,
                     ROOM_MEMBER_LIMIT, INVITE_EXPIRED, INVITE_REVOKED, INVITE_USES_EXHAUSTED,
                     REPORT_EMPTY, REPORT_MESSAGE_LIMIT, REPORT_MIXED_SENDERS, REPORT_SELF,
                     REPORT_MESSAGE_NOT_FOUND, REPORT_REASON_UNKNOWN]
              description: |
                닫힌 목록입니다. 어휘의 출처는 둘뿐이고 던지는 쪽이 문자열을 손으로 적지 않습니다.

                **① HTTP 상태에서 파생되는 여덟** (`GlobalExceptionHandler.codeOf`)
                400 `VALIDATION` · 403 `FORBIDDEN` · 404 `NOT_FOUND` · 405 `METHOD_NOT_ALLOWED` ·
                409 `CONFLICT` · 415 `UNSUPPORTED_MEDIA_TYPE` · 429 `RATE_LIMITED` ·
                그 밖의 5xx `INTERNAL`. 401 은 이 목록에 없습니다(본문 자체가 없습니다).

                **② 채팅 한도·초대 상태 넷** (`ChatErrorCode`)
                409 `ROOM_MEMBER_LIMIT` · 410 `INVITE_EXPIRED` · 410 `INVITE_REVOKED` ·
                409 `INVITE_USES_EXHAUSTED`. 이 넷은 상태에서 파생되지 않습니다 —
                `ROOM_MEMBER_LIMIT` 과 `INVITE_USES_EXHAUSTED` 가 **둘 다 409 인데 앱이
                보여줄 화면이 다르기** 때문입니다(#74 · 이슈 #75).

                **③ 신고 여섯** (`ChatErrorCode`, 이슈 #82) — **전부 400** 입니다.
                `REPORT_EMPTY`(아무것도 안 골랐다) · `REPORT_MESSAGE_LIMIT`(세 개를 넘겼다) ·
                `REPORT_MIXED_SENDERS`(고른 것의 발신자가 여럿이라 신고 대상이 하나가 아니다) ·
                `REPORT_SELF`(자기 메시지다) · `REPORT_MESSAGE_NOT_FOUND`(그 방에 없는 번호다) ·
                `REPORT_REASON_UNKNOWN`(사유 분류가 목록에 없다).
                같은 400 을 다섯으로 나눈 이유도 같습니다 — "고른 것을 줄이세요" 와
                "선택을 나누세요" 는 앱이 보여줄 안내도 다음 동작도 다릅니다.
            message:
              type: string
              example: "해당 장소를 찾을 수 없습니다."
              description: |
                사람이 읽는 문구. **예외 메시지가 아닙니다** — 500 과 형식 오류(400·405·415)
                경로에서는 고정 문구를 씁니다. 예외 메시지에는 SQL 조각·파일 경로·이메일·
                토큰 조각이 섞여 들어오기 때문입니다(#6).
            traceId:
              type: string
              description: |
                이 요청의 상관관계 ID. 응답 헤더 `X-Correlation-Id` 와 같은 값이며, 서버 로그에서
                이 요청을 집는 열쇠입니다. 문의할 때 이 값을 함께 보내세요.

    Page:
      type: object
      # nextCursor 는 마지막 페이지에서 null 이므로 required 에 넣지 않는다.
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {}
        nextCursor: { type: [string, "null"], example: "eyJpZCI6MTIzfQ==" }
        hasMore: { type: boolean }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: |
            폐기 가능한 불투명 문자열(JWT 아님, 패딩 없는 Base64URL 43자). 수명은 14일이며
            `POST /auth/token/refresh` 를 쓸 때마다 회전합니다 — 응답의 새 값으로 교체 저장하세요.

            **어디에 실리는가(2026-08 현재):** `POST /auth/login` 의 200 응답,
            `POST /auth/token/refresh` 의 200 응답, 그리고 소셜 로그인 딥링크의 `refresh`
            파라미터입니다. `POST /auth/signup` 은 토큰을 발급하지 않으므로(201 + `User`)
            여기에 해당하지 않습니다 — 가입 직후에는 `POST /auth/login` 을 호출하세요.
        expiresIn: { type: integer, description: 초, example: 3600 }
        isNew:
          type: boolean
          default: false
          description: |
            이번 인증으로 계정이 새로 생성되었으면 true. **로그인 응답 1회성 이벤트 속성**이며
            사용자 프로필의 영속 속성이 아닙니다(그래서 `User` 가 아니라 여기에 있습니다).
            true 면 프론트는 온보딩(반려견 프로필 등록)으로 유도합니다.
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      # 최소 보장. id 가 없으면 클라이언트가 아무것도 할 수 없다.
      # `{}` 가 유효한 User 로 통과하던 상태를 막기 위한 것이다(이슈 #23-A).
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        email:
          type: [string, "null"]
          format: email
          description: 로그인 ID. 소셜 공급자가 이메일을 주지 않으면 null 일 수 있습니다.
        name:
          type: [string, "null"]
          maxLength: 50
        nickname:
          type: [string, "null"]
          maxLength: 20
          example: "보리아빠"
          description: |
            소셜 가입 경로에서는 설정되지 않아 null 일 수 있습니다(#7).

            **상한 20 은 컬럼이 정한 수가 아닙니다.** 컬럼은 `varchar(255)` 인데 그건 저장
            한계이지 제품이 고른 수가 아닙니다. 앱의 프로필 편집 화면이 이미 20 으로 막고
            있어서 그 수를 서버 쪽 정본으로 올렸습니다(#229).

            **이 값이 모든 도메인으로 번집니다** — `post.handle`·`comment.handle`·
            `chat_message.sender_name` 이 이것을 스냅샷하고, `GroupMember`·`CareDoer`·
            `PersonRef` 가 이것을 표시합니다. 2026-09-03 이전에는 가입에도 프로필 수정에도
            상한이 없었고(`@Valid` 조차 없어서 붙여도 안 걸렸습니다), 그래서 `post.handle`
            이 `VARCHAR(50)` 이던 시절 51자 닉네임을 가진 사람의 **모든 글쓰기가 영구히
            500** 이 됐습니다(#170).

            **소셜 로그인은 자르고 거절하지 않습니다.** 그 경로는 앱을 안 지나므로 여기서
            `400` 을 주면 이름이 긴 사람은 **로그인 자체가 안 됩니다** — 자른 뒤 사용자가
            프로필에서 고칠 수 있습니다. 가입뿐 아니라 **매 로그인의 프로필 갱신에서도**
            자릅니다.
        gender: { type: [string, "null"], enum: [MALE, FEMALE, OTHER, null] }
        age: { type: [integer, "null"] }
        travelType: { type: [string, "null"], description: 현재 스키마는 단일 문자열 }
        imageUrl: { type: [string, "null"], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        neighborhood:
          type: [object, "null"]
          description: |
            사용자가 **스스로 고른** 동네입니다(#342). 안 골랐으면 `null` 입니다.

            **위치정보가 아닙니다.** 단말이 잰 좌표가 아니라 사람이 목록에서 고른 값이라,
            위치기반서비스사업 신고 전(#235, A안)에도 서버가 듭니다. 개인정보이긴 하므로
            개인정보처리방침의 수집 항목에 있고 탈퇴하면 함께 사라집니다.

            **좌표가 없습니다.** 지도의 중심 좌표는 앱이 내장 자산(행정동 3,516개)에서 읽고
            서버는 받지도 저장하지도 않습니다.

            **이름은 서버가 붙입니다.** 본문으로 받으면 아무나 자기 동네를 "청와대" 라고
            적어 글 카드에 띄울 수 있습니다 — 서버는 코드만 받고 250줄짜리 시군구 표에서
            이름을 찾습니다(`NeighborhoodCatalog`).
          required: [code, sigungu]
          properties:
            code: { type: string, pattern: '^[0-9]{10}$', example: "1120052000", description: 행정동 코드(통계청 adm_cd2) }
            sido: { type: string, example: "서울특별시" }
            sigungu:
              type: string
              example: "성동구"
              description: 글 카드에 보이는 단위입니다. **동 이름은 응답에 없습니다** — 사는 곳을 그만큼 좁힙니다
        provider:
          type: [string, "null"]
          enum: [local, kakao, google, apple, null]
          description: |
            계정 출처. `local` = 이메일/비밀번호 가입.
            `users.provider` 컬럼과 `UserResponse.provider` 로 구현돼 있습니다(#7).
            소셜 계정의 식별 키는 `(provider, social_id)` 이며 이메일이 아닙니다.
            백필 SQL 이 아직 실행되지 않은 환경의 옛 행은 `null` 일 수 있습니다.

            `naver` 는 빠졌습니다 — ADR-0010 의 보류 결정입니다. `apple` 은 #301 이 더했습니다
            (`social_id` 는 Apple 의 `sub`). **enum 을 통째로 지우지 마세요**: `local` 은 이메일
            가입자를, `null` 은 백필 전 옛 행을 표현합니다.
            운영 DB 에 `provider='naver'` 인 행이 남아 있을 수 있으나, 그 계정으로 다시
            로그인할 수 있는 경로를 이 계약은 광고하지 않습니다.

    SignupInput:
      type: object
      description: >
        **약관 동의 필드가 없습니다.** 동의는 가입이 아니라 첫 로그인 뒤 `PUT /api/consents` 로
        적습니다(#190) — 가입 화면과 동의 화면이 두 번 묻던 것을 한 번으로 줄였습니다. 예전 필드
        (`agreeTos`·`agreePrivacy`·`agreeMarketing`·`*Version`)를 보내도 서버는 무시합니다.
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        nickname: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 50 }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            선택. **안 보내면 `User.gender` 가 `null`(미지정)로 저장됩니다** — '기타'와 구분됩니다.
            대소문자를 가리지 않습니다(`male` 도 됩니다). 목록에 없는 값은 **400** 입니다
            — 조용히 OTHER 로 바꾸지 않습니다(#42).
        ageGroup:
          type: string
          enum: [under14, over14]
          default: over14
          description: >
            선택. 안 보내면 `over14` 입니다. 대소문자를 가리지 않습니다.
            목록에 없는 값은 **400** 입니다 — `over14` 로 떨어뜨리면 미성년자를
            성인으로 취급하게 됩니다(#42).

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    UserUpdate:
      type: object
      # 부분 수정 — 보낸 필드만 반영한다. 빈 객체는 의미가 없으므로 최소 1개를 요구한다.
      minProperties: 1
      properties:
        name: { type: string, maxLength: 50 }
        nickname: { type: string, maxLength: 20 }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            보내면 바꿉니다. 안 보내면 그대로 둡니다(부분 수정).
            목록에 없는 값은 **400** 입니다(#42).
        age: { type: integer }
        travelType: { type: string }
        imageUrl: { type: string, format: uri }
        neighborhoodCode:
          type: string
          pattern: '^$|^[0-9]{10}$'
          example: "1120052000"
          description: |
            내가 고른 동네의 행정동 코드 열 자리입니다(#342).

            안 보내면 **안 바꿉니다**(부분 수정). **빈 문자열이면 지웁니다** — "동네 안 쓸래"
            를 표현할 방법이 있어야 합니다. 서버가 모르는 시군구면 **400** 입니다.

            이름은 안 받습니다(위 `User.neighborhood` 참고).

    DogSize:
      type: string
      enum: [small, medium, large]
      description: |
        소형/중형/대형. 리소스 이름이 `Dog` 라 "견" 으로 읽히지만 **고양이에도 씁니다**
        (`PetSpecies` 참조).

    PetSpecies:
      type: string
      enum: [dog, cat, other]
      default: dog
      description: |
        반려동물 종.

        **`Dog` 라는 리소스 이름 안에 종 축이 들어 있는 것이 어색하지만, 이름을 바꾸지
        않았습니다.** 경로(`/api/dogs`)와 `WalkInput.dogId` 가 이미 앱·계약 여러 곳에 박혀
        있어서, 이름을 바꾸면 그 전부를 같은 PR 에서 함께 옮겨야 합니다. 이름은 나중에
        `/api/pets` 로 옮기고 이 경로를 별칭으로 남기는 편이 안전합니다.

        지금 이 필드를 넣는 이유는 **없으면 고양이를 키우는 사람이 반려동물을 서버에 못
        올리고, 그 사람의 산책은 붙일 곳이 없기 때문**입니다. 앱에는 `PetSpecies` 가 이미
        있고 더미 시드에 고양이가 들어 있습니다. 지금은 컬럼 하나지만 나중엔 마이그레이션
        입니다.

    ConsentKind:
      type: string
      enum: [TERMS, PRIVACY, LOCATION, MARKETING]
      description: |
        동의를 받는 문서 넷. `MARKETING` 만 선택이고 나머지는 필수인데, **그 판정은 앱이 합니다** —
        서버는 받은 사실을 있는 그대로 적습니다.
    Consent:
      type: object
      required: [kind, version, agreed, at]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+$'
          example: v1.2
          description: 앱이 보낸 문서 버전. 문서 파일 머리의 `버전:` 과 같습니다.
        agreed:
          type: boolean
          description: "`false` 는 철회입니다 — 지운 것이 아니라 새로 적은 것입니다."
        at:
          type: string
          format: date-time
          description: 서버가 찍은 시각. 앱이 보낸 시각이 아닙니다.
    ConsentInput:
      type: object
      required: [kind, version, agreed]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+$'
          example: v1.2
        agreed: { type: boolean }
    ConsentsInput:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/ConsentInput' }
    Consents:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
    Dog:
      type: object
      required: [id, name, size, species, neutered]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리" }
        species: { $ref: '#/components/schemas/PetSpecies' }
        breed:
          type: [string, "null"]
          example: "믹스견"
          description: |
            품종. **`null` 일 수 있습니다** — `dog.breed` 컬럼이 널 가능이고 `required` 에도
            없습니다. 2026-09-03 이전에는 `type: string` 이라 서버가 낼 수 있는 값을 계약이
            표현하지 못했습니다(#209 `Dogs-medium-3` 과 같은 종류).
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date, example: "2024-01-15" }
        ageMonths:
          type: [integer, "null"]
          example: 30
          description: |
            `birth` 로부터 계산한 파생값. **저장하지 않습니다** — 저장하는 순간 낡습니다.

            **`birth` 가 없으면 `null` 입니다.** `0` 이 아닙니다 — `0` 은 "갓 태어났다" 라는
            **다른 뜻**이라, 모르는 것을 `0` 으로 눕히면 화면이 "0개월" 을 그리며 거짓말을
            합니다. 미래 생일도 `null` 입니다(`Period` 는 음수를 그대로 주는데 "-3개월" 은
            그 자체가 버그로 보입니다).

            2026-09-03 이전에는 `type: integer` 였습니다. **`birth` 가 nullable 인데 거기서
            파생되는 이 값이 non-null 이라 스키마 내부가 모순이었고**, 서버는 실제로 `null`
            을 내보내고 있었습니다 — 계약 위반이었습니다(#209 `Dogs-medium-3`).
            코드가 맞고 계약이 틀렸으므로 계약을 고칩니다.

            **입력에는 없습니다.** `DogInput` 은 `birth` 만 받습니다 — 개월 수를 받으면
            내일은 그 값이 틀립니다.
        neutered: { type: boolean }
        avatarUrl:
          type: [string, "null"]
          description: |
            프로필 사진의 공개 URL (#448). 사진이 없으면 `null` 입니다.

            입력(`DogInput`)에 대응 필드가 없는 비대칭은 **의도**입니다: 사진은
            `PUT /api/dogs/{dogId}/avatar` 에 **미디어 id** 로 붙이고(먼저 `POST /media` 의
            `PROFILE_IMAGE` 로 올립니다 — 커뮤니티 글의 사진과 같은 두 단계), `avatarUrl` 은 응답 전용
            파생값입니다 — 저장되는 것은 S3 objectKey 이고 완성된 URL 을 저장하면 버킷·CDN 을 옮길 때
            행마다 고쳐야 합니다(#209 `Dogs-medium-2`).

    DogAvatarInput:
      type: object
      required: [mediaId]
      description: 프로필 사진 붙이기의 본문 — `POST /media`(PROFILE_IMAGE) 가 돌려준 미디어 id (#448).
      properties:
        mediaId: { type: integer, format: int64 }

    DogInput:
      type: object
      required: [name, size]
      properties:
        name: { type: string, maxLength: 50 }
        species:
          $ref: '#/components/schemas/PetSpecies'
          description: 생략하면 `dog` 입니다 — 이 필드가 없던 때 만들어진 앱과 계약이 맞습니다.
        breed: { type: string, maxLength: 50 }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date }
        neutered: { type: boolean, default: false }

    DogPatch:
      type: object
      description: |
        **부분 수정 전용**입니다(ADR-0017 규약 4). 생성용 `DogInput` 을 재사용하지 않는 이유는
        그 스키마가 `required: [name, size]` 라, 재사용하면 `{"neutered": true}` 만 보내는 것이
        계약 위반이 되어 **부분 수정이 계약상 불가능**해지기 때문입니다.

        **보낸 필드만 반영합니다.** 안 보낸 필드는 그대로 둡니다 — 지우고 싶으면 `null` 을
        명시적으로 보냅니다(`birth` 만 `null` 을 받습니다).

        `PUT /auth/me` 의 `UserUpdate` 가 같은 모양입니다.
      # 빈 객체는 의미가 없으므로 최소 1개를 요구한다.
      minProperties: 1
      properties:
        name: { type: string, maxLength: 50 }
        species: { $ref: '#/components/schemas/PetSpecies' }
        breed: { type: string, maxLength: 50 }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date }
        neutered: { type: boolean }

    PersonRef:
      type: object
      description: |
        **사람 하나를 가리키는 공통 모양**입니다(ADR-0017 규약 5). 이전에는 같은 개념이
        다섯 모양으로 갈려 있었고, 그중 `Comment.author` 에는 **식별자가 아예 없어**
        "내 댓글인가" 판별·프로필 이동·차단이 계약상 불가능했습니다.

        **`nickname` 은 조회 시점의 현재 값**입니다 — 작성 시점 스냅샷이 아닙니다.
        탈퇴한 계정이면 `userId` 가 `0`, `nickname` 이 `알 수 없음` 입니다.
        (저장은 스냅샷을 함께 둘 수 있지만, **응답에 싣는 것은 현재 값**입니다.
         두 규칙이 한 화면에서 만나지 않도록 여기서 하나로 못박습니다.)

        **의도된 예외 하나** — `ChatMessage` 는 발신자를 `senderUserId`/`senderName`
        **평평한 쌍**으로 싣습니다. 이미 구현·테스트가 잠근 모양이고, 방 안의 발신자라
        중첩할 이유가 없습니다. 다음 감사가 이것을 다시 잡지 않도록 여기 적어 둡니다.
      required: [userId, nickname]
      properties:
        userId:
          type: integer
          format: int64
          description: 탈퇴한 계정이면 `0` 입니다.
        nickname:
          type: string
          description: 탈퇴한 계정이면 `알 수 없음` 입니다.

    PlaceRef:
      type: object
      description: |
        장소 **참조** — `Place` 의 식별자 셋만. 통계처럼 장소를 세기만 하는 자리에서 씁니다.
        `source`+`contentId` 로 `GET /api/places/{contentId}` 에 닿습니다.
      required: [source, contentId, title]
      properties:
        source: { type: string, enum: [kto, vet, shop, trail, playground], example: kto }
        contentId: { type: string, example: "2733967" }
        title: { type: string, example: "서울숲" }

    Place:
      type: object
      description: 지도/리스트에 뿌리는 장소(프론트 PetPlace와 대응).
      # distM 은 /nearby 에서만 채워진다 — 상세·북마크에는 기준점이 없어 null 이다.
      # category 는 KTO 가 닫힌 enum 밖의 contenttypeid 를 주면 통째로 빠진다(의도).
      # tel·image 는 KTO 가 안 주면 null 이다. title·addr 은 빈 문자열로 눕힌다.
      required: [contentId, title, source, lat, lng, addr]
      properties:
        contentId:
          type: string
          example: "2733967"
          description: |
            `kto` 면 KTO 의 `contentid` 그대로(숫자 문자열)이고 상세(`GET /api/places/{contentId}`)의
            열쇠입니다. **다른 출처는 `출처:원본키`** 입니다 — `vet:322000001020260003`(인허가
            관리번호) · `shop:…` · `trail:T_ROUTE_1`(두루누비 `crsIdx`) · `playground:<해시>`(#346).
            KTO 만 접두사가 없어 출처끼리 겹칠 수 없습니다 — ADR-0017 이 미뤄 둔 복합키는 이
            접두사로 갚혔습니다(#210). 접두사가 붙은 값에는
            상세 경로가 **없습니다**(404) — 카탈로그 항목이 곧 전부입니다. 산책로는 선을
            `GET /api/places/trails/{courseId}/route` 로 따로 받습니다(#291).
        title: { type: string, example: "서울숲" }
        source:
          type: string
          enum: [kto, vet, shop, trail, playground]
          example: kto
          description: |
            `kto` 관광공사 반려동반 · `vet` 동물병원 · `shop` 동물판매업(둘 다 행정안전부 인허가,
            전국) · `trail` 두루누비 걷기여행길. #291 부터 넷 다 실데이터입니다. `kto` 가 아니면
            `category` 가 `source` 와 같은 값이고 `contentTypeId` 는 `null` 입니다. 예외 하나(#411):
            우리 놀이터 자산과 같은 자리라 놀이터를 옮겨 단 `kto` 항목은 `category: playground` 이고
            `contentTypeId` 가 `null` 입니다 — 사진·상세는 관광공사 것, 배지는 놀이터.
        category:
          $ref: '#/components/schemas/PlaceCategory'
          description: |
            **생략될 수 있습니다.** KTO 가 위 여섯 밖의 `contenttypeid` 를 주면 이 필드를
            빼고 보냅니다 — 모르는 값을 실으면 계약을 깨고, 아무 값으로 눕히면 화면이
            엉뚱한 아이콘을 그립니다. 앱은 모르는 값을 "기타" 로 폴백합니다.
            원래 값은 `contentTypeId` 에 그대로 있습니다.

            **앱이 보는 순서: `contentTypeId` 가 있으면 그것, 없으면 이 필드.** KTO 항목은
            `contentTypeId` 로 아이콘과 필터를 정하고, `vet`/`shop`/`trail` 항목은 `contentTypeId`
            가 없어 이 필드(= `source`)를 씁니다(#291). 서버의 `PlaceDto.categoryKey()` 와 앱의
            `PetPlace.categoryKey` 가 같은 규칙입니다. KTO 항목에서 이 필드가 있으면 여섯 중
            하나이고, 없으면 KTO 가 그 밖의 값을 준 것입니다(#210 `Places-high-3`).
        contentTypeId:
          type: [string, "null"]
          example: "12"
          description: |
            KTO 콘텐츠타입(12관광지/14문화/28레포츠/32숙박/38쇼핑/39음식점).

            **앱이 실제로 보는 필드가 이것입니다.** `category` 가 아닙니다 —
            `category` 설명을 참고하세요. 놀이터를 옮겨 단 `kto` 항목(#411)에는 없습니다 —
            그때 앱은 `category`(`playground`)를 봅니다.

            **`kto` 가 아닌 출처에서는 `null` 입니다.** `vet`/`shop`/`trail` 은 KTO 체계의 값이
            없어 채울 것이 없고, 그때 앱은 `category` 를 봅니다(#291).
        lat: { type: number, format: double, example: 37.5445 }
        lng: { type: number, format: double, example: 127.0374 }
        addr: { type: string, example: "서울특별시 성동구 뚝섬로 273" }
        tel: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        distM:
          type: number
          format: double
          description: |
            조회 기준점으로부터 거리(m). **`/nearby` 에서만 채워집니다** — 상세에는
            기준점이 없어서(사용자가 어디서 눌렀는지 서버가 모릅니다) 생략됩니다.

            KTO 가 준 `dist` 를 그대로 싣지 않고 **요청 좌표로 다시 계산**합니다.
            스냅샷은 셀 중심에서 받은 것이라 그대로 실으면 같은 셀의 모든 사용자가 같은
            거리를 봅니다(최대 1.4km 틀립니다).
          example: 320
        summary:
          type: [string, "null"]
          example: "12.3km · 약 4시간 · 보통 · 순환"
          description: |
            카드에 그대로 얹는 한 줄(#291). 산책로는 "거리 · 약 시간 · 난이도 · 순환" 이고,
            동물판매업은 상세 업무 구분(동물판매업/동물미용업)입니다. KTO 항목과 동물병원에는
            없어 생략됩니다. 앱은 없으면 안 그립니다.

    # 값의 출처가 둘이다 — 이 enum 과 PlaceDto.KNOWN_CATEGORIES.
    # 갈리면 KTO 가 준 값을 서버가 실어 보내고 앱이 라벨을 못 찾는다.
    # PlacesContractSpecTest 가 둘을 대조한다 (#210 Places-low-1).
    ReportReason:
      type: string
      enum: [spam, abuse, sexual, fraud, other]
      description: |
        신고 사유. **채팅과 커뮤니티가 같은 어휘를 씁니다** — 값이 두 벌이 되면 앱이 분기를
        두 번 짜고, 운영자가 세는 숫자가 두 표에서 다른 뜻이 됩니다.

        **목록에 없는 값은 `400` `REPORT_REASON_UNKNOWN`** 이고 `other` 로 눕히지 않습니다 —
        오타가 조용히 통과하면 운영자가 세는 숫자가 소리 없이 틀어집니다.

        2026-09-03 이전에는 채팅 신고 안에 **인라인 enum** 이었습니다. 그러면 계약·서버 상수·
        DB CHECK·앱까지 어휘가 네 벌이 되는데 잠글 자리가 없습니다 — `Board`·`ReactionType` 은
        컴포넌트로 뽑아 셋을 대조합니다(#166).

    ReportInput:
      type: object
      required: [reason]
      description: |
        커뮤니티 글·댓글 신고. 대상은 **경로가 지목**합니다.
      properties:
        reason: { $ref: '#/components/schemas/ReportReason' }
        memo:
          type: string
          maxLength: 500
          description: |
            덧붙이는 말. **500자를 넘기면 `400` 이 아니라 잘립니다** — 거절하면 사용자가 쓴
            신고가 통째로 사라지는데, 잘린 메모로도 운영자의 판단에는 충분합니다.
            채팅 신고와 같은 판단입니다.

    ReportReceipt:
      type: object
      required: [reportId, createdAt]
      description: |
        접수증. **이것이 응답의 전부입니다.**

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.** 피신고자 id 도
        안 돌려줍니다 — 응답에 무엇이 더 실리면 그것으로 남의 상태를 물어볼 수 있게 됩니다.
      properties:
        reportId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, example: "2026-09-02T15:30:00Z" }

    PlaceCategory:
      type: string
      description: >
        프론트 카테고리 키. 숫자는 KTO contentTypeId. `vet`·`shop`·`trail`·`playground` 는
        공공데이터 레이어 — #291 부터 **실데이터**입니다(행정안전부 인허가 전국 · 두루누비
        걷기여행길). #282 가 가짜와 함께 내렸던 칩 셋이 그때 돌아왔습니다. 이 넷에서는
        `Place.category` 와 `Place.source` 가 같은 값입니다.


        `trail` 에는 출처가 **둘** 섞여 있습니다(#346) — 두루누비 걷기여행길과 지자체가
        올린 동네 길입니다. `contentId` 로 가릅니다: `trail:T_CRS_…` 는 두루누비(선이
        있어 `GET /places/trails/{id}/route` 가 200), `trail:lt…` 는 동네 길(선이 없어
        같은 경로가 404)입니다.


        `playground` 는 지자체 반려견 놀이터입니다(#346). **전국 표준데이터가 없어**
        시·군·구 파일을 모은 것이라 아직 지역이 성깁니다.
      enum: ['12', '14', '28', '32', '38', '39', 'vet', 'shop', 'trail', 'playground']

    TrailRoute:
      type: object
      description: 산책로 코스 하나의 선 (이슈 #291). `GET /api/places/trails/{courseId}/route` 의 본문.
      required: [courseId, name, lengthM, pointCount, points]
      properties:
        courseId: { type: string, example: "T_ROUTE_1", description: 두루누비 코스 번호(`crsIdx`) }
        name: { type: string, example: "서울숲 둘레길" }
        lengthM:
          type: integer
          example: 2600
          description: 원본 GPX 의 길이(m). 점을 줄이기 **전**에 잰 값입니다.
        pointCount: { type: integer, example: 180, description: "`points` 의 길이. 300 이하입니다." }
        points:
          type: array
          description: "`[[경도, 위도], …]` — `Walk.path` 와 같은 순서입니다."
          items:
            type: array
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0379, 37.5449]]

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            overview: { type: [string, "null"], description: 개요 }
            petInfo:
              type: object
              description: 반려동물 동반 상세(KTO detailPetTour2 — 대부분 자유텍스트)
              properties:
                acmpyPsblCpam: { type: [string, "null"], description: 동반 가능 반려동물 }
                acmpyNeedMtr: { type: [string, "null"], description: 동반 시 필요사항 }
                etcAcmpyInfo: { type: [string, "null"], description: 기타 유의사항 }

    Walk:
      type: object
      required: [id, dogId, dogIds, clientWalkId, startedAt, distanceM, durationS]
      properties:
        id: { type: integer, format: int64 }
        dogId:
          type: integer
          format: int64
          description: |
            **대표 아이.** `dogIds[0]` 과 같습니다 — 앱이 고른 목록의 첫 마리입니다.

            여러 마리가 된 뒤에도(#343) 이 필드는 남습니다. 이미 나가 있는 앱이 이 값으로
            화면을 그리고 있고, 멱등키 `(dog_id, client_walk_id)` 의 앞자리이며, 소유권이
            이 연관을 타고 `dog.user_id` 로 갑니다.
        dogIds:
          type: array
          description: |
            **함께 나간 아이들** (#343). 항상 한 개 이상이고 **첫 번째가 `dogId`** 입니다.

            한 마리만 데리고 나갔으면 원소가 하나입니다 — 빈 배열이나 `null` 이 아닙니다.
            "여러 마리일 때만 있는 필드" 로 두면 화면이 두 갈래를 만들고, 그중 하나가
            언젠가 안 그립니다.

            통계와 목록의 `dogId` 필터는 **이 목록 전체**를 봅니다. 보리와 초코를 함께
            데리고 나간 산책은 초코의 통계에도 잡힙니다.
          items: { type: integer, format: int64 }
          example: [7, 9]
        clientWalkId:
          type: string
          description: |
            앱이 이 산책에 붙인 멱등키. 되돌려 주는 이유는 앱이 **전송 대기 큐의 어느 항목이
            저장된 것인지** 맞춰 볼 수 있어야 하기 때문입니다.
          example: "6d2f8b1a-3c4e-4a7f-9b0d-1e2f3a4b5c6d"
        startedAt: { type: string, format: date-time }
        endedAt:
          type: [string, "null"]
          format: date-time
          description: |
            **`null` 은 옛 앱이 안 보낸 행이지 "진행 중" 이 아닙니다.** 서버에 진행 중인 산책은
            없습니다 — `POST /api/walks` 는 끝난 산책만 받고, 지금 앱은 `endedAt` 을 항상
            채웁니다(`WalkDraft.endedAt`). 그래서 종료·수정 오퍼레이션이 없습니다(#209 `Walks-medium-3`).
        distanceM: { type: integer, example: 2400 }
        durationS: { type: integer, example: 2280 }
        path:
          type: [array, "null"]
          description: |
            GPS 경로. **`[경도, 위도]` 순서**입니다(GeoJSON LineString 의 coordinates 와 같고,
            사람이 흔히 말하는 "위도, 경도" 와 **반대**입니다). DB 에는 `LINESTRING SRID 4326`
            으로 저장합니다.

            **`null` 일 수 있습니다.** 손으로 입력한 기록이나 위치 권한 없이 남긴 기록에는
            경로가 없습니다. 목록(`GET /api/walks`)에서는 응답 크기 때문에 **항상 `null`** 이고,
            상세(`GET /api/walks/{walkId}`)에서만 실제 경로가 옵니다.
          items:
            type: array
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0402, 37.5455]]
        memo: { type: [string, "null"] }
        place:
          description: |
            어디를 걸었나 (#338). 지도에서 "여기서 산책 시작" 으로 시작했거나 저장 화면에서
            장소를 고르면 `source`·`contentId`·`title` 셋이 다 옵니다. 카탈로그에 없는 곳을
            손으로 적었으면 **`source` 와 `contentId` 가 `null`** 이고 `title` 만 있습니다.
            아무것도 안 붙였으면 이 필드가 `null` 입니다 — 빈 객체를 주지 않습니다.

            값은 저장할 때 **베껴 둔 스냅숏**입니다. 카탈로그에서 그 장소가 사라져도
            "그날 거기를 걸었다" 는 남습니다.
          oneOf:
            - type: "null"
            - type: object
              required: [title]
              properties:
                source: { type: [string, "null"], enum: [kto, vet, shop, trail, playground, null], example: kto }
                contentId: { type: [string, "null"], example: "2733967" }
                title: { type: string, maxLength: 120, example: "서울숲" }
        weather:
          type: [string, "null"]
          example: "맑음 24°C"
          description: |
            **표시용 문자열**입니다 — 앱이 산책 시작 시점에 넣은 것을 서버가 그대로 돌려줍니다.
            해석하지 않으므로 집계·검색의 근거가 아니고, 온도 단위·형식도 정해진 것이 없습니다.
            **지금 앱은 채우지 않습니다**(항상 `null`). 구조화(`{condition, tempC}`)는 쓰는 화면이
            생길 때 합니다(#209 `Walks-low-3`).
        media:
          type: array
          description: |
            산책 중 찍은 사진(#450) — 올린 순서(`id` 순). 없으면 `[]`. 글의 `Post.media` 와 같은
            모양이라 앱이 같은 그림을 그립니다. 지금은 사진뿐이라 `kind` 는 늘 `image` 입니다.
            목록(`GET /api/walks`)에도 실립니다 — 카드의 배경이 됩니다.
          items: { $ref: '#/components/schemas/PostMedia' }

    WalkMemoInput:
      type: object
      description: |
        `PUT /api/walks/{walkId}/memo` 의 본문. 필드가 하나뿐입니다.

        **`{}` 도 지웁니다.** 서버가 `{}` 와 `{"memo": null}` 을 구분하지 않습니다(레코드 바인딩).
        이 경로에 "안 바꾼다" 는 없습니다 — 안 바꿀 거면 부르지 않습니다. 지울 때는 `""`·`null`·`{}`
        셋 다 같은 뜻입니다. 2026-09-05 까지 `required: [memo]` 였는데 코드가 그것을 지키지
        못했습니다(#209 `Walks-medium-3`) — 계약을 코드에 맞췄습니다.
      properties:
        memo:
          type: string
          nullable: true
          maxLength: 500
          description: 새 회고 글. 빈 문자열이나 `null` 이면 지웁니다.

    WalkInput:
      type: object
      description: |
        **이 값들은 전부 앱이 스스로 신고한 것입니다.** 서버는 범위를 검사하지만, 범위 검사는
        "말이 되는 값인가" 만 말하지 **"진짜 걸었는가" 는 말해 주지 않습니다.** 순위표나 보상에
        쓰려면 그때 별도의 근거가 필요합니다.
      required: [dogId, clientWalkId, startedAt, distanceM, durationS]
      properties:
        dogId: { type: integer, format: int64 }
        dogIds:
          type: array
          description: |
            **함께 나간 아이들** (#343). **안 보내도 됩니다** — 안 보내면 `dogId` 하나로 봅니다.
            이미 나가 있는 앱이 이 필드를 모르고, 그 앱의 산책이 400 이 되면 안 되기 때문입니다.

            `dogId` 가 목록에 없으면 서버가 **맨 앞에 넣습니다.** 대표 아이를 빼고 보내는 것은
            앱의 실수이지 "그 아이는 안 갔다" 는 뜻이 아닙니다 — `walk.dog_id` 는 어차피 그
            값으로 저장됩니다.

            **남의 아이가 하나라도 섞이면 404** 입니다. 통째로 거절합니다 — 일부만 저장하면
            사용자는 두 마리를 적었는데 한 마리만 남은 것을 모릅니다.

            **재전송(같은 `clientWalkId`)에서는 이 값을 다시 쓰지 않습니다.** 처음 저장한
            것이 정본입니다.
          items: { type: integer, format: int64 }
          maxItems: 10
          example: [7, 9]
        clientWalkId:
          type: string
          description: |
            **앱이 만드는 멱등키(UUID v4 권장).** 산책이 끝나는 순간 한 번 만들고, 재전송에도
            같은 값을 씁니다.

            없으면 전송이 타임아웃 났을 때 앱이 두 가지를 구분할 수 없습니다 — 서버에 안 닿은
            것인지, 저장은 됐는데 응답만 못 받은 것인지. 다시 보내면 같은 산책이 두 줄이 되고,
            안 보내면 사라집니다. **둘 다 사용자가 겪으면 안 되는 일이라 키가 필요합니다.**
          minLength: 8
          maxLength: 64
          example: "6d2f8b1a-3c4e-4a7f-9b0d-1e2f3a4b5c6d"
        startedAt:
          type: string
          format: date-time
          description: 지금보다 5분 넘게 미래면 400 입니다.
        endedAt:
          type: string
          format: date-time
          description: |
            주면 `startedAt` 보다 뒤여야 합니다. **끝난 산책만 저장합니다** — 앱은 트래킹이 끝난 뒤
            한 번 보내고 이 값을 항상 채웁니다. 생략은 옛 클라이언트 호환으로만 남아 있고, 그렇게
            저장된 행은 "진행 중" 이 아닙니다(`Walk.endedAt`).
        distanceM:
          type: integer
          minimum: 0
          maximum: 200000
          description: 총 거리(m). 상한 200km 는 하루 산책으로 말이 되는 범위의 바깥 경계입니다.
        durationS:
          type: integer
          minimum: 0
          maximum: 86400
          description: 총 소요(초). 상한은 24시간입니다.
        path:
          type: array
          description: |
            GPS 경로. **`[경도, 위도]` 순서**입니다 — 응답 `Walk.path` 와 같습니다.

            뒤집어 보내면 서버가 400 으로 거절합니다(둘째 값의 절댓값이 90 을 넘으면 위도일 수
            없습니다). 다만 **한국 안에서는 두 값이 모두 90 미만인 경우가 없어 이 검사가 걸리지만,
            적도 근처 좌표라면 뒤집혀도 통과합니다.** 검사는 그물이지 보증이 아닙니다.

            생략하거나 빈 배열이면 경로 없이 저장합니다(손입력 기록·위치 권한 거부).
            점이 하나뿐이면 선이 아니므로 경로 없이 저장합니다.
          minItems: 0
          maxItems: 20000
          items:
            type: array
            description: '[경도, 위도]'
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0402, 37.5455]]
        pathT:
          type: array
          description: |
            점별 시각 — **시작 시각 기준 델타 초**입니다. 이슈 #155.

            **`path` 와 길이가 같아야 합니다.** 다르면 400 입니다 — 짝이 안 맞는 배열은 어느
            점이 언제인지 말해 주지 못하므로 저장할 가치가 없습니다. `path` 없이 이것만 보내도
            400 입니다(경로 없는 시각은 뜻이 없습니다).

            음수이거나 뒤로 흐르면 400 입니다. 음수는 시작 전이고 뒤로 흐르는 것은 시계가
            거꾸로 간 것이라, 둘 다 이 배열로 할 수 있는 계산(구간 페이스)이 의미를 잃습니다.

            **일시정지 동안은 초가 안 흐릅니다.** 그래서 델타가 건너뛰면 그 사이가 멈춘
            구간이라는 것을 화면이 추론할 수 있습니다 — 별도 플래그를 두지 않는 이유입니다.

            > **응답에는 실리지 않습니다.** 지금 이 값을 그리는 화면이 없어서, 목록에서
            > `path` 를 뺀 것과 같은 이유로 뺐습니다. 필요해지는 날 상세 응답에 넣습니다.
            > 그때까지 **저장은 됩니다** — 시각은 그 순간에만 있는 정보라 나중에 만들 수
            > 없고, 안 받으면 쌓인 행 전체에 대해 구간 페이스·일시정지 복원·거리 재계산이
            > 영원히 불가능해집니다.
          minItems: 0
          maxItems: 20000
          items: { type: integer, minimum: 0 }
          example: [0, 3, 7]
        mediaIds:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
          description: |
            산책 중 찍은 사진(#450) — `POST /media` 에 `category=WALK_IMAGE` 로 올린 것의 `id`.
            **내가 올렸고 아직 어디에도 안 붙은 것만** 붙습니다. 남의 것 · 이미 붙은 것 · 아직
            `pending` 인 것이 섞이면 400 이고 그때 산책도 안 생깁니다(글의 `mediaIds` 와 같은 규칙).
            같은 `clientWalkId` 로 다시 보내면(200) 처음에 붙인 사진이 그대로 옵니다 — 다시 붙이지
            않습니다. 산책을 지우면 사진도 같이 사라집니다.
        memo: { type: string, maxLength: 500 }
        placeSource:
          type: string
          enum: [kto, vet, shop, trail, playground]
          description: |
            어디를 걸었나 — 카탈로그 장소의 출처 (#338). `placeContentId` 와 **짝입니다**:
            하나만 보내면 400 입니다. 반쪽짜리 참조는 이름만 있는 것과 같으면서 있는 척합니다.
          example: kto
        placeContentId:
          type: string
          maxLength: 64
          description: 카탈로그의 `contentId`. `placeSource` 와 함께 보냅니다.
          example: "2733967"
        placeName:
          type: string
          maxLength: 120
          description: |
            화면에 나갈 이름. 카탈로그에 없는 곳은 **이것만** 보냅니다(그때는 통계의
            "자주 가는 곳" 에 안 들어갑니다). 이름이 비어 있으면 출처와 id 도 버립니다 —
            이름 없는 참조는 그릴 것이 없습니다.
          example: "서울숲"
        weather:
          type: string
          maxLength: 30
          example: "맑음 24°C"
          description: 표시용 문자열. 서버는 해석하지 않고 그대로 저장합니다 — `Walk.weather` 참조. 지금 앱은 보내지 않습니다.

    WalkStats:
      type: object
      description: |
        **두 기간이 한 응답에 들어 있습니다.** `week*` 는 이번 주(월~일), `allTime*` 는 전체
        기간입니다. 주 경계는 **KST 월요일 00:00** 입니다 — 서버 타임존이 아니라 한국 시각으로
        자릅니다.
      required: [weekStart, weekEnd, weekKm, weekMinutes, totalKm, walkCount, avgKm, allTimeKm, allTimeCount, allTimeMinutes]
      properties:
        weekStart:
          type: string
          format: date
          description: |
            이번 주의 **월요일**(KST 날짜). `weekKm[0]` 이 이 날입니다. 응답이 스스로 기간을
            말합니다(#209 `Walks-medium-2`).
          example: "2026-08-31"
        weekEnd:
          type: string
          format: date
          description: 이번 주의 **일요일**(KST 날짜, 포함). 항상 `weekStart + 6일` 입니다.
          example: "2026-09-06"
        weekKm:
          type: array
          description: |
            이번 주 요일별 거리(km). **월요일부터** 길이 7. 산책이 없는 요일은 0.
            **소수 둘째 자리에서 반올림**합니다 — 거리 단위 규약은 `info.description`.
          minItems: 7
          maxItems: 7
          items: { type: number, format: double }
          example: [2.1, 2.9, 1.2, 0, 1.8, 3.1, 2.4]
        weekMinutes:
          type: array
          description: |
            같은 요일 축의 **분**. **월요일부터** 길이 7, 산책이 없는 요일은 0 (#341).

            거리만으로는 목표를 말할 수 없습니다 — 권장 운동량이 "하루 30분" 처럼 **시간**으로
            적혀 있어서입니다. 하루 안에서는 **초로 더한 뒤 분으로 내립니다**: 요일마다 분으로
            내려 더하면 7분짜리 산책 다섯 번이 0분이 됩니다.
          minItems: 7
          maxItems: 7
          items: { type: integer }
          example: [25, 40, 15, 0, 22, 45, 30]
        totalKm: { type: number, format: double, description: 이번 주 합계 거리(km). 반올림 전 합계를 소수 둘째 자리에서 반올림합니다 — `weekKm` 을 더한 값과 마지막 자리가 다를 수 있습니다, example: 13.5 }
        walkCount:
          type: integer
          description: |
            이번 주 산책 **건수**입니다. "산책한 날 수" 가 아닙니다 — 하루에 두 번 걸으면 2 입니다.
            (예전 더미 화면은 `weekKm` 에서 0 이 아닌 요일을 세어 날 수를 보여 줬습니다.)
          example: 6
        avgKm:
          type: number
          format: double
          description: '`totalKm / walkCount`. 건수가 0 이면 0 입니다(나눗셈을 하지 않습니다).'
          example: 2.3
        allTimeKm: { type: number, format: double, description: 전체 기간 누적 거리(km). 소수 둘째 자리에서 반올림, example: 128.4 }
        allTimeCount: { type: integer, description: 전체 기간 산책 건수, example: 57 }
        allTimeMinutes: { type: integer, description: 전체 기간 누적 시간(분), example: 2310 }
        topPlaces:
          type: array
          description: |
            자주 간 곳 상위 **5개**, `count` 내림차순. **전체 기간**입니다(#338).

            **카탈로그에서 고른 곳만 셉니다.** 저장 화면에서 이름을 손으로 적으면 `Walk.place`
            에는 남지만 여기에는 안 들어갑니다 — `PlaceRef` 가 `source`·`contentId` 를
            요구하고, 그것이 없으면 화면이 그 장소로 갈 수 없기 때문입니다.

            묶는 기준은 이름이 아니라 `(source, contentId)` 입니다. 카탈로그가 갱신되며 이름이
            바뀌어도 한 줄로 셉니다.

            항목의 `place` 가 문자열이 아니라 `PlaceRef` 인 것은 #209 `Walks-low-1` 이 고친
            것입니다 — 이름만 주면 `Place.contentId` 와 이어지지 않아 화면이 그 장소로 갈 수
            없습니다. 항상 빈 배열인 지금이 모양을 바꾸는 데 비용이 0 인 유일한 시점이었습니다.
          maxItems: 5
          items:
            type: object
            required: [place, count]
            properties:
              place: { $ref: '#/components/schemas/PlaceRef' }
              count: { type: integer, example: 3 }
        summary:
          allOf: [{ $ref: '#/components/schemas/WeekSummary' }]
          description: |
            "이번 주 요약" 이 쓰는 **계산 결과**입니다 (#359 1단계). **문장은 앱이 만듭니다.**

            여기 담는 것은 **앱이 스스로 못 구하는 것뿐**입니다. 빠진 요일은 이미 있는
            `weekKm`·`weekMinutes` 로 세면 되고, 달성률의 목표는 사용자가 기기에서 고치는
            값이라(#341) 서버가 모릅니다. 서버가 아는 것은 **지난주 숫자**와 **시간대별
            집계** 둘입니다 — 둘 다 이번 주 응답만으로는 만들 수 없습니다.

            **문장을 서버가 만들지 않는 이유**: 문구는 화면의 것이고 자주 바뀝니다. 서버가
            완성된 문장을 주면 문구 하나를 고치는 데 배포가 필요하고, 앱 버전마다 다른
            문장을 줘야 하는 날이 옵니다.

        aiSummary:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AiSummary' }]
          description: |
            **AI 주간 요약** (#486). 서버가 모델(OpenAI)로 만든 두 문장 + 제안 한 줄. **항상 있는 필드**이고
            값이 `null` 이면 앱은 카드도 "AI" 라벨도 그리지 않습니다 — 키가 없거나 · 실패 · 비용 상한 ·
            숫자 검사에서 버린 경우입니다.

            모델에 주는 것은 이 응답의 숫자(주간 합계 · 요일별 · 시간대별 · 지난주)와 아이의 크기 · 나이대뿐입니다.
            이름 · 좌표 · 장소 · 메모는 보내지 않습니다(개인정보처리방침 v1.8). 출력에 입력에 없는 숫자가 있으면
            서버가 버립니다 — LLM 은 말만 만들고 숫자는 규칙이 만듭니다.

            사용자 · 아이 · 주(週)마다 캐시(`weekly_insight` 표). 새 산책이 와서 입력이 바뀌면 다시 만들되
            한 주에 세 번까지, 서버 전체로는 하루 200회까지 부릅니다.

            **모델 호출은 요청 밖에서 돕니다.** 아직 문장이 없으면 `null` 에 `aiSummaryPending: true` 로 바로
            돌아오고, 앱이 잠시 뒤 한 번 더 읽습니다.
        aiSummaryPending:
          type: boolean
          default: false
          description: |
            요약을 지금 **만드는 중**입니다 — 모델 호출이 요청 밖(실행기)에서 돌고 있어 이 응답에는 아직 없습니다.
            앱은 4초쯤 뒤 한 번 더 읽습니다(세 번까지). `aiSummary` 가 있으면서 참이면 옛 문장을 새로 만드는
            중입니다 — 그때는 옛 문장을 그대로 그립니다. 없는 필드는 `false` 로 읽습니다(옛 서버).

    AiSummary:
      type: object
      required: [id, text, generatedAt]
      properties:
        id:
          type: integer
          format: int64
          description: 요약 행의 id — 👍/👎 를 `PUT /api/walks/insights/{insightId}/feedback` 로 보낼 때 씁니다
        feedback:
          type: [string, "null"]
          enum: [up, down, null]
          description: |
            내가 남긴 평가(#486 후속). `up` 👍 · `down` 👎 · `null` 은 안 누름. 문장이 다시 만들어지면(입력이 바뀌어
            새로 부르면) 옛 문장에 대한 평가라 `null` 로 돌아갑니다.
        text:
          type: string
          description: 첫 두 줄은 요약, 셋째 줄은 제안. 줄바꿈(`\n`)으로 구분. 이모지 · 머리말 없음.
          example: "이번 주는 3회 걸어 3.2km 를 채웠어요.\n아침 산책이 두 번이라 하루를 가볍게 열었네요.\n주말에 한 번 더 어떠세요?"
        generatedAt:
          type: string
          format: date-time
          example: "2026-09-14T09:30:00Z"

    WeekSummary:
      type: object
      required: [lastWeekKm, lastWeekMinutes, lastWeekCount, byPartOfDay]
      properties:
        lastWeekKm:
          type: number
          format: double
          description: 지난주 거리(km). 이번 주와 **같은 요일 기준**(KST 월~일)입니다.
          example: 8.4
        lastWeekMinutes: { type: integer, example: 120 }
        lastWeekCount: { type: integer, example: 4 }
        byPartOfDay:
          type: array
          description: |
            시간대별 **이번 주** 집계. **항상 넷**이고 순서가 고정입니다 —
            `dawn`(00~05) · `morning`(06~11) · `afternoon`(12~17) · `evening`(18~23).

            0 인 시간대도 **빠지지 않고 0 으로** 옵니다. 빠진 칸을 앱이 "없는 것" 과
            "0인 것" 으로 갈라 다루지 않게 하기 위해서입니다.

            새벽을 따로 두는 이유: 교대 근무나 더운 여름의 산책이 실제로 그 시간에 있습니다.
            그것을 "저녁" 에 합치면 "저녁에 자주 나가시네요" 라는 **틀린 문장**이 나갑니다.
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [part, count, km, minutes]
            properties:
              part:
                type: string
                enum: [dawn, morning, afternoon, evening]
              count: { type: integer, example: 3 }
              km: { type: number, format: double, example: 6.0 }
              minutes: { type: integer, example: 90 }

    Board:
      type: string
      enum: [walk_review, pet_place, health, free, brag]
      description: |
        게시판. **값은 ASCII 키이고 화면 문구는 앱이 든다.**

        | 값 | 화면 문구 |
        |---|---|
        | `walk_review` | 산책로 후기 |
        | `pet_place` | 동반장소 |
        | `health` | 건강·병원 |
        | `free` | 자유 |
        | `brag` | 자랑 |

        2026-09 이전에는 값 자체가 한글 표시 문자열이었습니다(`"산책로 후기"` 등). 그것을
        바꾼 이유가 셋입니다.

        1. **이 계약의 다른 enum 은 전부 ASCII 입니다** — `DogSize`·`PetSpecies`·`GroupRole`·
           `CareType`·`ReactionType`. `Board` 하나만 달랐습니다.
        2. **이 값이 query 파라미터로 나갑니다.** 공백과 가운뎃점(`·`)을 품은 문자열이라
           인코딩을 한 군데라도 빠뜨리면 조용히 안 걸립니다.
        3. **이 값이 DB 컬럼에 들어갑니다.** 표시 문구를 저장하면 게시판 이름을 다듬는 날
           **쌓인 행을 전부 고쳐야** 합니다. 값과 문구를 갈라 두면 문구만 바꿉니다.

        `CareType` 이 이미 같은 모양입니다 — `water|meal|walk|med|vet|poop|pee` 이고
        "물/밥/산책/투약/병원/배변/마킹" 은 앱이 붙입니다.

    ReactionType:
      type: string
      enum: [help, cute, empathy]
      description: 도움돼요/귀여워요/공감

    ReactionSummary:
      type: object
      # mine 은 required 가 아니다 — 게스트에게는 채워질 수 없다(ADR-0017 규약 1·6).
      required: [help, cute, empathy]
      properties:
        help: { type: integer }
        cute: { type: integer }
        empathy: { type: integer }
        mine:
          type: ["array", "null"]
          items: { $ref: '#/components/schemas/ReactionType' }
          description: |
            **내가 누른 반응들.** 배열인 것은 셋을 동시에 누를 수 있기 때문입니다(ADR-0016 결정 2).
            2026-09 이전에는 단수 문자열이었습니다.

            **`null` 과 `[]` 는 다릅니다.**

            | 값 | 뜻 |
            |---|---|
            | `null` | **비인증 요청**입니다. 누가 눌렀는지 물을 대상이 없습니다 |
            | `[]` | 로그인했고, **아무것도 안 눌렀습니다** |

            둘을 같게 두면 `[]` 가 "아무것도 안 눌렀다" 로 읽혀 게스트에게 거짓말을 합니다.

            이 필드가 값을 가지려면 요청에 토큰이 있어야 하고, 그래서 조회 오퍼레이션들이
            `security: [{}, {bearerAuth: []}]`(인증 선택)로 선언돼 있습니다 — ADR-0017 규약 6.
            `required` 가 아닌 이유도 이것입니다.

            **토큰이 있는데 만료됐으면 `null` 입니다.** 인증 선택 경로에서는 필터가 깨진 토큰을
            조용히 무시하므로 `401` 이 아니라 `200` 이 나갑니다. 앱은 `401` 에서만 토큰을
            갱신하므로 **그 화면에서는 세션 복구가 일어나지 않습니다** — 다만 앱을 다시 켜면
            `GET /auth/me` 가 반드시 `401` 을 주므로 창은 한 세션입니다(ADR-0016 결정 3).

    BookmarkState:
      type: object
      required: [bookmarked]
      description: |
        저장·저장 빼기의 응답 — 지금 상태 하나(#451 4번). 집계가 없는 이유는 오퍼레이션 설명에.
      properties:
        bookmarked: { type: boolean }

    Post:
      type: object
      required: [id, author, board, title, body, commentCount, reactions, createdAt, media, bookmarked]
      properties:
        id: { type: integer, format: int64 }
        author:
          $ref: '#/components/schemas/PersonRef'
          description: |
            **2026-09 이전에는 인라인 `{id, nickname}`** 이었습니다. 키 이름이 `id` 라
            같은 개념인 `CareDoer.userId`·`GroupMember.userId` 와 갈렸습니다 — ADR-0017 규약 5.
        board: { $ref: '#/components/schemas/Board' }
        loc:
          type: [string, "null"]
          example: "서울숲"
          description: |
            표시용 장소 이름. **서버가 보낸 대로 돌려줍니다.**

            `contentId` 가 있어도 서버가 이 값을 채우거나 덮지 않습니다 — 장소는 KTO 프록시
            **캐시**라 사용자가 고른 것의 행이 아직 없을 수 있고, 그때 이름을 못 찾아 조용히
            빈 값이 됩니다. 즉 **둘이 어긋나도 서버는 모릅니다.** 어긋난 값을 고치는 것은
            보낸 쪽의 일입니다.

            둘 중 이름을 그리는 데 쓰는 것은 이 값입니다 — `contentId` 로 장소를 다시 조회해
            제목을 쓰면 캐시가 없을 때 빈 칸이 됩니다.
        contentId:
          type: [string, "null"]
          description: |
            연결된 장소(선택). **`Place.contentId` 와 같은 키**입니다.

            2026-09 이전에는 `placeId` 였습니다. 같은 개념이 조회에서는 `contentId`,
            여기서는 `placeId` 로 갈려 있었습니다 — ADR-0017 이 `contentId` 로 통일했습니다.
        title: { type: string, example: "서울숲 아침 산책 코스 추천" }
        body: { type: string }
        course:
          description: |
            붙어 있는 코스(#339). 안 붙였거나, 붙인 뒤 **비공개로 되돌렸거나**, 코스를 지웠으면
            `null` 입니다 — 셋을 구분하지 않습니다. 화면에는 "그림이 없다" 로 같습니다.

            `path` 는 이미 잘라 낸 선을 **더 줄인 것**(최대 40점)입니다. 카드 크기의 그림에는
            그것으로 충분하고, 피드 응답에 300점짜리 선을 스무 개 싣지 않습니다. 온전한 선은
            `GET /api/courses/{courseId}` 가 줍니다.
          oneOf:
            - type: "null"
            - type: object
              required: [id, name, distanceM]
              properties:
                id: { type: integer, format: int64 }
                name: { type: string, example: "서울숲 한 바퀴" }
                distanceM: { type: integer, example: 400 }
                path:
                  type: [array, "null"]
                  maxItems: 40
                  items:
                    type: array
                    items: { type: number, format: double }
                    minItems: 2
                    maxItems: 2
        commentCount: { type: integer, example: 4 }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        bookmarked:
          type: boolean
          description: |
            보는 사람이 이 글을 **저장해 뒀는가**(#451 4번). 읽는 사람마다 다른 값입니다.
            게스트는 `false` 입니다 — 게스트인지는 `reactions.mine == null` 이 이미 말하므로
            여기서 셋째 값을 두지 않습니다.
        media:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/PostMedia' }
          description: |
            붙은 사진·영상 (#429). **항상 있습니다** — 없으면 `[]` 입니다. 순서는 올린 순서입니다.
            영상이면 `posterUrl` 이 썸네일이고 `url` 이 재생할 파일입니다. 피드는 썸네일만 그리고
            자동재생하지 않습니다.
        createdAt: { type: string, format: date-time }
        dog:
          description: |
            이 글에 찍힌 아이 (#451 5번). 안 골랐거나 아이를 보냈으면 `null` 입니다. 카드의 꼬리표와
            사진첩이 그리는 만큼만 — id · 이름 · 사진.
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/PostDog'
        authorDistrict:
          type: [string, "null"]
          example: "성동구"
          description: |
            글쓴이의 동네 — **구까지만** (#342). 안 골랐으면 `null` 입니다.

            **동 이름은 안 실립니다.** 남의 사는 곳을 구보다 좁히면 그것만으로 사람을
            찾아갈 수 있습니다. 이 값은 서버가 자기 시군구 표에서 붙이며, 글쓴이가 보낸
            문자열이 아닙니다.
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람이 이 작성자를 가렸는가**(#166). 읽는 사람마다 다른 값입니다.

            **목록에서 빼지 않습니다.** 빼면 커서가 그 글을 건너뛰어 페이지 경계가
            어긋나고, 가린 자리에 "보기" 를 두려면 본문이 이미 와 있어야 합니다 —
            `ChatMessage.hiddenByBlock` 과 같은 규약입니다. **접는 것은 화면의 일입니다.**

            게스트에게는 항상 `false` 입니다 — 가린 사람이 없습니다.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            마지막 수정 시각. **`null` 이면 한 번도 안 고쳤습니다.**

            `createdAt` 을 복사해 채우지 않습니다 — 그러면 "만들자마자 고쳐진 글" 과 구별이
            안 되고 화면이 모든 글에 '수정됨' 을 붙입니다.

            **같은 값을 다시 보낸 `PATCH` 는 이 값을 바꾸지 않습니다.** 아무것도 안 바뀐 글에
            '수정됨' 이 붙으면 그 표시는 읽는 사람에게 아무것도 말해 주지 않습니다.

            `Comment` 에는 없습니다 — 댓글 수정 경로가 계약에 없습니다.

    PostMediaKind:
      type: string
      enum: [image, video]
      description: 화면이 그리는 종류. 서버의 카테고리(`POST_IMAGE`·`POST_VIDEO`)에서 옵니다

    PostDog:
      type: object
      required: [id, name]
      description: 글에 찍힌 아이의 꼬리표 (#451 5번). `Dog` 전체가 아니라 카드가 그리는 셋만.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: [string, "null"] }

    PostMedia:
      type: object
      description: 글에 붙은 사진·영상 하나 — 카드에 그릴 만큼만 (#429).
      required: [id, kind, url]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/PostMediaKind' }
        url:
          type: string
          format: uri
          description: CDN 공개 URL. 사진이면 그림, 영상이면 재생할 파일
        posterUrl:
          type: [string, "null"]
          format: uri
          description: 영상의 썸네일. 사진은 `null`
        width:
          type: [integer, "null"]
          description: 픽셀 폭. 앱이 올릴 때 준 값이라 없을 수 있습니다 — 없으면 화면이 정사각형 자리를 잡습니다
        height: { type: [integer, "null"] }
        durationMs:
          type: [integer, "null"]
          description: 영상 길이. 사진은 `null`

    MediaItem:
      type: object
      description: 업로드 한 건 — `POST /media` 의 응답 (#429).
      required: [id, key, url, category, status]
      properties:
        id: { type: integer, format: int64 }
        key:
          type: string
          description: S3 object key. 앱은 이 값을 쓸 일이 없습니다 — `id` 로 글에 붙입니다
        url: { type: string, format: uri }
        contentType: { type: [string, "null"] }
        size: { type: [integer, "null"], format: int64 }
        category:
          type: string
          enum: [POST_IMAGE, POST_VIDEO, WALK_IMAGE, CHAT_IMAGE, JOURNEY_IMAGE, PROFILE_IMAGE, REVIEW_IMAGE]
        refType:
          type: [string, "null"]
          description: 어디에 붙었나. 방금 올린 것은 `null` — 글을 만들 때 채워집니다
        refId: { type: [string, "null"] }
        status:
          type: string
          enum: [pending, ready]
          description: multipart 로 올린 사진은 언제나 `ready`. `pending` 은 S3 에 직접 올리는 영상의 중간 상태 — `POST /media/{mediaId}/complete` 가 `ready` 로 바꿉니다
        posterUrl: { type: [string, "null"], format: uri }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        durationMs: { type: [integer, "null"] }

    VideoUploadRequest:
      type: object
      description: 영상 자리 잡기 — `POST /media/videos` 의 본문 (#429). 파일은 없고 파일에 대한 사실만 있습니다
      required: [contentType, size, durationMs]
      properties:
        contentType:
          type: string
          enum: [video/mp4, video/quicktime]
          description: 앱이 PUT 할 때 **같은 값**을 `Content-Type` 으로 보냅니다 — 서명에 묶입니다
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 157286400
          description: 올릴 파일의 정확한 바이트 수(150MB 까지). ③ 에서 실제 크기와 같아야 합니다
        width:
          type: integer
          minimum: 1
          description: 다시 인코딩한 뒤의 픽셀 폭. `height` 와 함께 주거나 둘 다 생략합니다
        height: { type: integer, minimum: 1 }
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000
          description: 길이. 60초까지

    VideoUploadTicket:
      type: object
      description: 자리 잡기의 답 (#429) — 어디에 올릴지와, 그것을 기다리는 행
      required: [id, key, uploadUrl]
      properties:
        id:
          type: integer
          format: int64
          description: '`complete` 에 쓰고, 그다음 `PostInput.mediaIds` 에 싣습니다'
        key:
          type: string
          description: S3 object key. 앱은 쓸 일이 없습니다 — 사람이 볼 때를 위해
        uploadUrl:
          type: string
          format: uri
          description: 서명 PUT URL. **15분** 뒤에는 S3 가 403 을 줍니다. 알린 `contentType` 과 같은 `Content-Type` 헤더로 PUT

    PostPatch:
      type: object
      minProperties: 1
      description: |
        글 부분 수정(#211). **`PostInput` 을 재사용하지 않습니다** — 그쪽은
        `required: [board, title, body]` 라, 제목만 고치려는 사람도 본문을 다시 보내야 하고
        그 사이 다른 기기에서 고친 본문을 조용히 되돌립니다(ADR-0017 규약 4).

        **키가 없으면 안 바꿉니다.** 비우기가 아닙니다. 세 필드 다 `NOT NULL` 컬럼이라
        비울 수 있어야 할 이유도 없고, 공백만 보내면 `400` 입니다.

        **`loc`·`contentId` 는 여기 없습니다.** 그 둘은 비울 수 있어야 하는데(장소 연결
        해제), 그러려면 JSON 의 "키가 없음" 과 "명시적 `null`" 을 구별해야 합니다 — 저장소
        최초의 `PATCH` 를 그 결정과 함께 들이지 않았습니다. 지금 필요한 것은 잘못 쓴 글을
        고쳐 쓰는 것이고, 장소 연결은 지우고 다시 쓰면 됩니다.
      properties:
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string, maxLength: 200, minLength: 1 }
        body: { type: string, maxLength: 5000, minLength: 1 }
        dogId:
          type: integer
          format: int64
          description: 찍힌 아이를 바꿉니다 (#451 5번). 키가 없으면 안 바꾸고, 비우는 길은 없습니다(`loc` 과 같은 이유). 내 아이만.
        mediaIds:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
          description: |
            붙은 사진·영상을 **통째로 갈아 끼웁니다** (#429). 키가 없으면 안 바꾸고, `[]` 면 전부
            뗍니다 — 위의 "키가 없으면 안 바꿉니다" 와 같은 규약입니다. 목록에서 빠진 것은
            지워집니다(S3 객체까지). 새로 든 것은 `PostInput.mediaIds` 와 같은 조건입니다.
            **영상은 여전히 하나**입니다 — 남는 것과 새로 드는 것을 합쳐 셉니다.

    PostInput:
      type: object
      required: [board, title, body]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string, maxLength: 200 }
        body:
          type: string
          maxLength: 5000
          description: |
            본문. **상한이 컬럼이 아니라 제품이 정한 수입니다.**

            `post.body` 는 `TEXT` 라 안 막으면 65535**바이트**까지 들어갑니다(한글은
            utf8mb4 에서 한 자가 3바이트라 실질 약 21,800자). 그 수는 컬럼 타입이 흘린
            것이지 제품이 고른 것이 아니고, 상한이 없으면 로그인한 사람 누구나 수십 MB 짜리
            본문을 밀어 넣을 수 있습니다.

            2026-09-03 이전에는 이 상한이 계약에도 서버에도 없었습니다(#172 에서 찾음).
        loc:
          type: string
          maxLength: 100
          description: |
            표시용 장소 이름. **서버는 받은 값을 그대로 저장합니다.**

            `contentId` 가 있어도 서버가 이 값을 채우거나 덮지 않습니다 — 장소는 KTO 프록시
            **캐시**라 사용자가 고른 것의 행이 아직 없을 수 있고(`contentId` 설명 참조),
            그때 이름을 못 찾아 조용히 빈 값이 됩니다. 둘을 함께 보낼지, 이름만 보낼지는
            앱이 정합니다.

            앱은 지도의 장소 시트에서 올 때 둘을 같은 장소에서 뽑아 함께 보냅니다.
        contentId:
          type: string
          maxLength: 64
          description: 연결된 장소(선택). `Place.contentId` 와 같은 키입니다.
        dogId:
          type: integer
          format: int64
          description: |
            이 글에 찍힌 아이 (#451 5번). **내 아이만** — 남의 아이 id 는 `400` 입니다. 글 하나에 아이 하나,
            여럿이 찍혔으면 대표 하나를 고릅니다.
        courseId:
          type: integer
          format: int64
          description: |
            붙일 코스(선택, #339). **내 것이면서 공개된 코스**만 붙습니다 — 아니면 `400` 입니다.

            비공개를 붙이면 남들에게는 빈 자리로 보입니다. 서버가 몰래 공개로 바꾸지 않고
            막습니다 — 공개는 사용자가 하는 일입니다. 앱이 "공개하고 붙이기" 를 권합니다.
        mediaIds:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
          description: |
            붙일 사진·영상 (#429). **업로드가 먼저입니다** — `POST /media` 가 돌려준 `id` 를 싣습니다.
            서버는 **내가 올렸고 · 아직 어디에도 안 붙었고 · `ready` 인 것**만 붙이고, 하나라도
            아니면 **400** 이고 글도 안 생깁니다. 판정은 조건부 UPDATE 의 영향 행 수라 같은
            사진을 두 글에 동시에 붙여도 하나만 이깁니다.

            순서는 이 목록이 아니라 **올린 순서**입니다. 없어도 됩니다 — 사진 없는 글이 여전히
            대부분입니다.

            **영상은 한 글에 하나**입니다(#429). 둘을 실으면 **400** 이고 글은 안 생깁니다.
            사진 아홉과 영상 하나까지는 됩니다.

    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author:
          $ref: '#/components/schemas/PersonRef'
          description: |
            **2026-09 이전에는 `{nickname}` 뿐이라 사용자 식별자가 아예 없었습니다.**
            그래서 "내 댓글인가" 판별·프로필 이동·차단이 계약상 불가능했고, 앱은
            `post_detail_screen.dart` 에서 문자열 `'나'` 를 내 댓글 표식으로 쓰고 있었습니다.
            ADR-0017 규약 5 가 `PersonRef` 로 통일했습니다.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람이 이 작성자를 가렸는가**(#166). 규칙은 `Post.hiddenByBlock` 과 같습니다 —
            목록에서 빼지 않고 화면이 접습니다.

    GroupRole:
      type: string
      enum: [OWNER, MEMBER]
      description: |
        그룹 내 역할(생성자 `OWNER` / 참여자 `MEMBER`). **`chat_room_member.role` 그대로입니다** —
        2026-08 이전에는 소문자 `owner`/`member` 였는데, 값의 출처가 하나인데 표기가 둘이면
        앱이 어느 쪽으로 분기해야 하는지를 매번 물어야 합니다(이슈 #75).

    GroupMember:
      type: object
      description: |
        가족 그룹 멤버. **`group_member` 테이블은 만들지 않습니다** — 멤버십 표는
        `chat_room_member` 하나이고 이 스키마는 그 한 줄을 가족 그룹의 언어로 다시 적은
        것입니다. 둘을 두면 "가족인데 방에 없는 사람" 이라는 상태가 생기고 강퇴·차단이
        어느 쪽인지를 매번 물어야 합니다.
        근거: [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)
      required: [userId, nickname, role, joinedAt]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          description: '`users` 의 현재 닉네임. 탈퇴했으면 `알 수 없음` 입니다'
          example: "보리아빠"
        role: { $ref: '#/components/schemas/GroupRole' }
        joinedAt: { type: string, format: date-time }

    Group:
      type: object
      description: |
        가족 그룹(family_group). 이름과 생성 시각만 드는 표이고, 초대코드도 멤버십도 여기
        없습니다.

        **`inviteCode` 필드가 없습니다.** 초대코드는 `chat_room_invite` 로 옮겼습니다 —
        그룹이 아니라 **방**에 붙고 만료·사용횟수·회수를 가집니다. 발급은
        `POST /api/chat/rooms/{roomId}/invites` 이고, 그 `roomId` 가 아래 필드입니다.
        근거: [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72) · 이슈 #75
      required: [id, name, roomId, members, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리네 가족" }
        roomId:
          type: integer
          format: int64
          description: 이 그룹의 방. 초대 발급·회수·채팅이 전부 이 id 로 갑니다
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        createdAt: { type: string, format: date-time }

    CareType:
      type: string
      enum: [water, meal, walk, med, vet, poop, pee]
      description: |
        물 갈아주기/밥/산책/약/병원, 그리고 배변·마킹(#340).

        앞의 다섯은 집에서 하는 일이고, `poop`·`pee` 는 **산책 중에** 트래킹 화면에서
        한 탭으로 들어옵니다. **어디서 눴는지는 안 올라옵니다** — 위치는 기기에만 남습니다
        (A안 #235). `CareLogInput` 에 좌표 필드가 없는 것이 그 약속입니다.

    CareDoer:
      type: object
      description: |
        케어를 한 사람 / 주의사항을 고친 사람.

        이름만으로는 부족해서 `userId` 를 함께 싣습니다 — 앱은 "아빠가 줬습니다" 와 "내가
        줬습니다" 를 갈라 그리고, 그 판정은 닉네임이 아니라 id 로 합니다(닉네임은 겹칠 수도
        바뀔 수도 있습니다).

        **탈퇴한 계정이면 `userId` 가 `0`, `nickname` 이 `알 수 없음` 입니다.**
        `care_log.done_by` 와 `walk_note.updated_by` 는 `ON DELETE SET NULL` 이라
        (한 사람의 탈퇴가 가족이 함께 보는 기록과 메모를 지우지 않습니다) **사람은 없는데
        기록은 있는** 상태가 정상으로 존재합니다. `0` 은 어떤 `users.id` 와도 같지 않아서
        앱의 "내가 했는가" 판정이 조용히 참이 되지 않습니다.
      required: [userId, nickname]
      properties:
        userId:
          type: integer
          format: int64
          description: 수행자의 `users.id`. 탈퇴했으면 `0`
        nickname:
          type: string
          description: 현재 닉네임. 없으면 이름, 그것도 없으면 `알 수 없음`(탈퇴한 계정 포함)
          example: "보리엄마"

    CareLog:
      type: object
      description: "케어 기록(care_log): 누가·언제 어떤 케어를 했는지 가족과 공유."
      # dogId·memo 는 선택 입력이라 비어 있을 수 있다.
      # groupId 는 group-scoped 경로에서만 채워진다.
      required: [id, type, doneBy, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        dogId:
          type: [integer, "null"]
          format: int64
          description: |
            대상 반려동물(`dog.id`). **지금은 항상 `null` 입니다** — 컬럼은 #154 에서 `dog` 에
            FK 로 이어졌지만, 이 경로가 아직 `dogId` 를 받지 않습니다. 받으려면 "가족 구성원이
            남의 반려동물 id 를 알 수 있는가" 가 먼저 정해져야 합니다(#209 Dogs-high-3). 필드를
            미리 두는 것은 그날 앱이 스키마를 바꾸지 않아도 되게 하려는 것입니다.
        groupId:
          type: [integer, "null"]
          format: int64
          description: |
            가족 그룹. **그룹 경로(`GET`/`POST /api/groups/{groupId}/care-logs`)의 응답에서는 항상
            그 `groupId` 입니다** — 그 그룹의 행만 돌려줍니다. `null` 은 가족을 해산한 뒤 개인
            기록으로 남은 행(`ON DELETE SET NULL`)이고, 그 행을 돌려주는 경로는 아직 없습니다.
            스키마를 둘로 가르지 않는 이유입니다(#209 `Groups-medium-2`).
        type: { $ref: '#/components/schemas/CareType' }
        doneBy: { $ref: '#/components/schemas/CareDoer' }
        occurredAt:
          type: string
          format: date-time
          example: "2026-09-02T15:30:00Z"
          description: |
            **오프셋이 붙습니다.** 예시의 `Z` 는 KST 2026-09-03 00:30 입니다 — 하루 경계는
            `Asia/Seoul` 이므로 이 기록은 **9월 3일의 케어**입니다(info 의 시각 규약 참조).

            2026-09-03 이전에는 오프셋 없이 나갔습니다. `format: date-time` 은 RFC3339
            오프셋을 요구하므로 계약 위반이었고, 앱은 그것을 기기 지역 시각으로 읽었습니다.
        memo: { type: [string, "null"], maxLength: 500, example: "사료 반 컵 + 습식 토핑" }

    CareLogInput:
      type: object
      description: |
        필드가 둘뿐입니다. `dogId` 는 아직 받지 않습니다(위 `CareLog.dogId` 참조) — 필수로 두면
        앱이 더미 id 를 지어내야 하고, `occurredAt`·`doneBy` 는 서버가 정합니다 — 그 둘이 곧
        "오늘 누가 했는지" 를 가르는 기준이라 클라이언트가 정하면 화면의 문구를 믿을 수 없게
        됩니다. 지난 일을 나중에 적는 화면은 M4 입니다.
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/CareType' }
        memo: { type: string, maxLength: 500 }

    PushTokenInput:
      type: object
      description: 기기 토큰 등록 본문 (이슈 #83)
      required: [token, platform]
      properties:
        token:
          type: string
          maxLength: 512
          description: FCM 등록 토큰. 앱이 `firebase_messaging` 에서 받는 값 그대로
          example: "dK3f...:APA91b..."
        platform:
          type: string
          enum: [android, ios]

    PushSettings:
      type: object
      description: 사용자별 알림 설정. 방별 음소거는 `ChatRoom.muted` 에 있습니다
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 전체 끄기의 반대. 한 번도 만진 적이 없으면 `true`

    PushSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    RoomMuteInput:
      type: object
      required: [muted]
      properties:
        muted: { type: boolean }

    RoomMute:
      type: object
      description: 방별 음소거의 결과 — 서버가 실제로 쓴 값
      required: [roomId, muted]
      properties:
        roomId: { type: integer, format: int64 }
        muted: { type: boolean }

    ChatRoom:
      type: object
      description: |
        채팅방(chat_room). **가족 그룹 전용이 아닙니다** — 출처는 `originKind`/`originRef`
        쌍이고, 가족 그룹은 그 여러 출처 중 하나입니다.
      # myRole 은 입장 응답에서 null 이 될 수 있다(내 멤버 행을 못 찾은 방어적 기본값).
      # lastMessage 는 아직 아무 말도 없는 방에서 null 이다.
      # isDefault·members 는 서버가 아예 안 싣는다 — 방 상세 조회가 미구현이다.
      required: [id, title, tag, originKind, originRef, lastSeq, lastReadSeq, unread, memberCount, muted, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: "우리 가족" }
        tag:
          type: string
          description: 화면이 방 종류를 표시할 때 쓰는 값. `originKind` 를 그대로 내려줍니다
          example: "가족"
        originKind: { type: string, example: "FAMILY" }
        originRef:
          type: string
          description: 출처 도메인의 id 를 문자열로. **FK 가 아닙니다**
          example: "12"
        isDefault:
          type: boolean
          description: |
            기본방(가족방) 표식. **서버가 아직 내려주지 않습니다** — "가족방이 기본" 이라는
            판단은 `originKind` 를 해석하는 것이라 chat 이 답할 수 없습니다(ADR-0011).
            앱은 `originKind` 로 직접 가릅니다.
        lastSeq:
          type: integer
          format: int64
          description: 방의 마지막 `room_seq`. 발급 카운터와 같은 컬럼입니다
        lastReadSeq: { type: integer, format: int64, description: 내 읽음 워터마크 }
        unread:
          type: integer
          description: |
            `lastSeq − lastReadSeq`. 서버가 뺄셈으로 냅니다 — 읽음 표를 두지 않습니다.
        memberCount: { type: integer, example: 3 }
        muted:
          type: boolean
          description: 내가 이 방을 음소거했는가 (`PUT /api/chat/rooms/{roomId}/mute`, #83). 방 목록·상세 둘 다 실립니다
        myRole: { type: string, enum: [OWNER, MEMBER] }
        lastMessage:
          description: |
            마지막 메시지 미리보기. 아직 아무 말도 없는 방과 **입장 응답**
            (`POST /api/chat/invites/{code}/join`)에서는 `null` 입니다 — 뒤의 것은 방금 들어온
            사람에게 조회를 하나 더 붙일 이유가 없어서입니다(앱은 곧바로 방 화면으로 갑니다).
          allOf:
            - $ref: '#/components/schemas/ChatMessage'
        members:
          type: array
          description: 방 상세 조회(`GET /api/chat/rooms/{roomId}`)에만 실립니다
          items: { $ref: '#/components/schemas/ChatRoomMember' }
        createdAt: { type: string, format: date-time }

    ChatRoomMember:
      type: object
      description: 방 멤버십(chat_room_member). 멤버십 표는 이것 하나입니다
      # 이 스키마를 내보내는 구현이 아직 없다(방 상세 조회가 x-status: planned).
      # 그래서 이 목록은 코드가 아니라 **의도**에서 왔다 — 같은 개념인 GroupMember 와
      # 글자까지 같게 맞춘다. 구현이 붙는 날 실제 응답 DTO 와 대조할 것.
      # removedAt·rejoinBlocked 는 강퇴된 멤버에게만 뜻이 있다.
      required: [userId, nickname, role, joinedAt]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string, example: "보리아빠" }
        role: { type: string, enum: [OWNER, MEMBER] }
        lastReadSeq: { type: integer, format: int64 }
        joinedAt: { type: string, format: date-time }
        removedAt:
          type: [string, "null"]
          format: date-time
          description: 강퇴 시각. **행은 지우지 않습니다** — 미읽음이 이 행의 뺄셈입니다
        rejoinBlocked:
          type: boolean
          description: 강퇴 = 재입장 금지. 유효한 초대코드로도 들어오지 못합니다

    ChatInvite:
      type: object
      description: 초대코드(chat_room_invite). 그룹 행의 컬럼이 아니라 별도 표입니다
      # expiresAt·maxUses 는 무제한일 수 있고, revokedAt 은 회수된 코드에만 있다.
      required: [code, roomId, usedCount, createdAt]
      properties:
        code: { type: string, example: "PAW-2K7Q" }
        roomId: { type: integer, format: int64 }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: '`null` 이면 무기한. 기본은 발급 + 7일'
        maxUses:
          type: [integer, "null"]
          description: '`null` 이면 무제한(기본)'
        usedCount: { type: integer }
        revokedAt:
          type: [string, "null"]
          format: date-time
          description: |
            회수(`DELETE`) 시각. 찍히면 이 코드는 즉시 막히고 기존 멤버는 남습니다.
            **재발급은 이전 코드를 회수하지 않습니다** — 발급을 두 번 하면 코드 둘이
            각각 TTL 동안 독립된 열쇠로 삽니다. 유출 대응은 그 코드를 지목해 `DELETE`
            하는 것입니다
        createdAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      description: |
        채팅 메시지(chat_message). 순서·델타·미읽음의 기준은 방별 `roomSeq` 하나이고,
        `id` 는 커서가 아닙니다.
      # deletedAt 은 지워진 메시지에만 있다.
      required: [id, roomId, roomSeq, senderUserId, senderName, contentType, body, createdAt, hiddenByBlock]
      properties:
        id:
          type: integer
          format: int64
          description: '**커서로 쓰지 마세요.** 배정 시점과 가시성 시점이 다릅니다'
        roomId: { type: integer, format: int64 }
        roomSeq:
          type: integer
          format: int64
          description: 방 안에서 빈틈 없이 1씩 증가. 델타·순서·미읽음의 유일한 근거
        senderUserId: { type: integer, format: int64 }
        senderName:
          type: string
          description: |
            `users` 에 있으면 현재 닉네임, 없으면(탈퇴) `알 수 없음` 입니다.
            `"익명"` 은 쓰지 않습니다 — 커뮤니티 화면에서 이미 다른 뜻으로 쓰이고 있습니다.
          example: "보리아빠"
        contentType:
          type: string
          default: text
          description: '`text` 또는 `image`(사진 메시지, #452 — 그때 `media` 가 있습니다)'
        body: { type: string, example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶" }
        createdAt: { type: string, format: date-time }
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: 소프트 삭제. 행을 지우면 뺀 자리가 `roomSeq` 빈틈이 됩니다
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람마다 다른 값입니다.** 이 요청을 보낸 사람이 발신자를 가렸으면 `true` 고,
            같은 메시지가 다른 사람에게는 `false` 입니다 — 가리기는 내 화면에서만 접는 것입니다.

            **`true` 여도 목록에서 빠지지 않고 `body` 도 그대로 옵니다.** 빼면 그 `roomSeq` 가
            도달하지 않아 미읽음 뱃지가 영원히 남고(`deletedAt` 과 같은 이유), 본문을 지워
            내리면 "보기" 를 누를 때 요청이 한 번 더 필요해집니다.

            앱은 이 자리에 **"가린 사람의 메시지입니다. 보기"** 를 그리고, "보기" 는 이미 받아
            둔 `body` 를 펼칩니다.
        media:
          description: |
            사진 메시지(`contentType: image`, #452)의 사진 하나. 글의 `PostMedia` 와 같은 모양이라 앱이
            같은 파서와 같은 그림을 씁니다 — 말풍선은 커뮤니티 카드와 같은 4:5 규칙입니다. 글자 메시지는
            `null` 이고, 사진 메시지를 지우면(`deletedAt`) 사진도 지워져 `null` 입니다. 방 목록의
            `lastMessage` 에는 싣지 않습니다 — 앱이 `contentType` 만 보고 "사진" 이라고 그립니다.
          oneOf:
            - $ref: '#/components/schemas/PostMedia'
            - type: "null"
        replyTo:
          description: |
            답장(#452)이면 원문의 미리보기, 아니면 `null`. 원문의 내용은 저장하지 않고 **응답 때마다** 읽어
            만듭니다 — 원문이 지워지면 다음 조회부터 `deleted` 이고, 보낸 사람의 이름은 지금 이름입니다.
            원문이 운영 정리로 아예 사라졌으면(SET NULL) `null` 입니다.
          oneOf:
            - $ref: '#/components/schemas/ChatReplyTo'
            - type: "null"
        reactions:
          type: array
          default: []
          description: |
            말풍선 아래 반응 줄(#452). **`null` 이 아니라 빈 배열입니다** — 아무도 안 누른 말과
            "반응을 모르는 응답" 을 구분할 이유가 없습니다. 0 인 종류는 실리지 않고, 순서는
            서버가 정합니다(앱에 맡기면 같은 말이 기기마다 다르게 그려집니다).

            **방 목록의 `lastMessage` 에는 없습니다**(빈 배열) — 목록은 미리보기라 반응을 그리지 않습니다.
          items: { $ref: '#/components/schemas/ChatReaction' }

    ChatReactionKind:
      type: string
      enum: [like, heart, laugh, sad, check]
      description: |
        좋아요 👍 · 최고예요 ❤️ · 웃겨요 😂 · 슬퍼요 😢 · **확인했어요 ✅**.

        마지막 하나가 이 앱에 있는 이유가 있습니다 — 가족 방의 "밥 줬어?" 에 필요한 답은 감정이
        아니라 **확인**이고, 그걸 말로 하면 방이 "응" 으로 채워집니다. 커뮤니티의 셋(도움돼요 ·
        귀여워요 · 공감)을 그대로 쓰지 않은 것도 같은 이유입니다 — 그건 글에 매기는 평가라
        "밥 먹었어?" 에는 뜻이 없습니다.

        DB 에 `CHECK` 가 없습니다 — 종류는 제품이 늘릴 수 있는 목록이고 **이 enum 이 단일
        출처**입니다(커뮤니티 `ReactionType` 과 같은 규약). 모르는 값은 서버가 400 으로 막습니다.

    ChatReaction:
      type: object
      description: 한 종류의 집계. 앱은 이것을 말풍선 아래 칩 하나로 그립니다.
      required: [kind, count, mine]
      properties:
        kind: { $ref: '#/components/schemas/ChatReactionKind' }
        count:
          type: integer
          description: |
            **"몇 번" 이지 "몇 명" 이 아닙니다** — 한 사람이 한 말에 여러 종류를 누를 수 있습니다.
            탈퇴한 사람의 반응도 남아서 세어집니다(그 사람의 말이 방에 남는 것과 같은 규칙).
        mine:
          type: boolean
          description: |
            **읽는 사람마다 다른 값입니다** — `hiddenByBlock` 과 같은 종류라 캐시할 수 없습니다.
            앱은 이 값으로 칩을 채움/외곽선으로 가릅니다.

    ChatReactions:
      type: object
      description: 반응을 켜고 끈 뒤의 최신 집계(#452).
      required: [messageId, reactions]
      properties:
        messageId:
          type: integer
          format: int64
          description: |
            어느 말풍선에 얹을지. 요청 경로에 이미 있는 값이지만, 응답만 들고 처리하는 자리
            (재시도 · 큐)에서 경로를 다시 꿰어 보게 만들 이유가 없습니다.
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ChatReaction' }

    ChatReplyTo:
      type: object
      description: 답장의 원문 미리보기(#452). 앱은 말풍선 위에 이름 한 줄과 미리보기 한 줄을 그립니다.
      required: [id, senderName, preview, deleted]
      properties:
        id:
          type: integer
          format: int64
          description: 원문 메시지의 id — 누르면 그 말로 스크롤합니다
        senderName:
          type: string
          description: 원문을 보낸 사람의 **지금** 이름(`ChatMessage.senderName` 과 같은 규칙)
          example: "보리아빠"
        preview:
          type: string
          description: 첫 80자(공백·줄바꿈은 한 칸, 넘으면 `…`). 캡션 없는 사진은 `사진`, 지워졌으면 `삭제된 메시지`
          example: "저녁 산책 갈까요?"
        deleted:
          type: boolean
          description: 원문이 지워졌는가 — 그러면 `preview` 는 `삭제된 메시지` 입니다

    ChatMessagePage:
      type: object
      description: |
        채팅 목록 응답. 공용 `Page`(`nextCursor`)를 쓰지 않습니다 — 커서가 `roomSeq` 이고,
        클라이언트가 미읽음을 맞추려면 방의 현재 `lastSeq` 가 함께 필요하기 때문입니다.

        **`items` 는 새 말이고 `changed` 는 옛 말의 새 모양입니다**(ADR-0023). 둘을 한 목록에 섞으면 앱이
        바뀐 말을 대화 맨 아래에 다시 그립니다 — 지워진 말이 새 말처럼 올라옵니다. 앱은 `changed` 를
        **같은 id 의 자리에 덮어쓰고** 순서는 그대로 `roomSeq` 가 정합니다.
      required: [items, lastSeq, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        lastSeq:
          type: integer
          format: int64
          description: 방의 현재 마지막 `room_seq`
        hasMore: { type: boolean }
        changed:
          type: array
          description: |
            그 커서(`afterChangeSeq`) 뒤에 **바뀐** 말들(ADR-0023). 변경 번호 오름차순이고, 커서를 안 주면
            빈 배열입니다. 지금 여기 오는 것은 **지워진 말**(`deletedAt` 이 찬 톰스톤)이고 앞으로 반응이 붙습니다.
            앱은 같은 `id` 의 자리에 덮어씁니다 — 목록 끝에 붙이면 지워진 말이 새 말처럼 올라옵니다.
          items: { $ref: '#/components/schemas/ChatMessage' }
        lastChangeSeq:
          type: integer
          format: int64
          default: 0
          description: |
            방의 현재 **변경 번호**. 다음 폴링에 `afterChangeSeq` 로 그대로 돌려보냅니다. `ETag` 도 이 값을 담아
            `"{roomId}:{lastSeq}:{lastChangeSeq}"` 입니다 — 말이 바뀌면 값이 달라져 304 가 변화를 가리지 않습니다.

    ScheduleOwnerKind:
      type: string
      enum: [dog, group, room]
      description: |
        일정의 주인이 어느 도메인인가. `chat_room.origin_kind` 와 같은 방식입니다
        ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)) — 세 도메인을 가리키는
        컬럼이라 **DB 에 FK 가 없고** 소유권은 서버가 확인합니다.

        `room`(크루, #417)은 값만 미리 열어 두었습니다. 지금 보내면 **400** 입니다 — 확인할
        멤버십이 아직 없고, 확인 없이 통과시키면 아무나 남의 크루 일정을 만들 수 있습니다.

    ScheduleKind:
      type: string
      enum: [walk, vet, med, groom, bath, food, etc]
      description: |
        일정의 종류 — 산책 · 병원 · 투약 · 미용 · 목욕 · 사료 · 그 밖. DB 의 `CHECK` 가 받는
        문자열과 **글자까지 같습니다**(`CareType` 과 같은 규약입니다).

    ScheduleRepeat:
      type: string
      enum: [none, daily, weekly, monthly]
      description: |
        얼마나 자주 되풀이하나(#421). **요일·날짜를 따로 받지 않습니다** — `weekly` 는
        `onDate` 의 요일이고 `monthly` 는 그 날짜입니다. 따로 두면 "매주 화요일인데 시작일은
        수요일" 같은 모순을 저장할 수 있게 됩니다.

        `monthly` 는 그 날짜가 없는 달을 **건너뜁니다** — 31일 규칙이 2월에 28일로 당겨지면
        사용자가 안 정한 날에 알림이 옵니다.

    ScheduleStatus:
      type: string
      enum: [planned, done, skipped]
      description: |
        `skipped` 가 `done` 과 따로 있는 이유: "건너뛰었다" 는 지운 것과 다릅니다 — 약을 안 먹인
        날이 달력에 남아야 다음에 그것을 봅니다.

    SchedulePerson:
      type: object
      description: 사람 한 명. 없거나 탈퇴했으면 이 객체 자체가 `null` 입니다
      required: [userId, nickname]
      properties:
        userId: { type: integer, format: int64, example: 7 }
        nickname: { type: string, example: "아빠" }

    Schedule:
      type: object
      description: |
        앞으로 할 일 하나(`schedule` — schema.md §33).
      required: [id, ownerKind, ownerRef, kind, title, onDate, status, version]
      properties:
        id: { type: integer, format: int64 }
        ownerKind: { $ref: '#/components/schemas/ScheduleOwnerKind' }
        ownerRef:
          type: integer
          format: int64
          description: 그 도메인의 id
        dogId:
          type: [integer, "null"]
          format: int64
          description: |
            어느 아이 것인가. **`ownerRef` 와 별개**입니다. 아이를 지워도 계획은 남으므로
            (`ON DELETE SET NULL`) 지난 일정에서 `null` 이 될 수 있습니다.
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        title: { type: string, maxLength: 100, example: "보리 병원" }
        memo: { type: [string, "null"], maxLength: 500, example: "광견병 접종" }
        onDate:
          type: string
          format: date
          example: "2026-10-03"
          description: |
            **사용자의 날짜**입니다(KST). 시각과 달리 시간대 변환을 하지 않습니다 — "10월 3일
            병원" 은 어느 시간대에서 보든 10월 3일입니다.
        atTime:
          type: [string, "null"]
          example: "10:30:00"
          description: |
            **`null` 이면 "하루 종일"** 입니다. 0시로 채우지 않습니다 — 채우면 화면이
            "00:00 목욕" 이라고 적게 되고, 그건 사용자가 안 정한 것을 정한 것처럼 보이게 합니다.
        assignee:
          oneOf:
            - $ref: '#/components/schemas/SchedulePerson'
            - type: "null"
          description: |
            맡기로 한 사람. id 가 아니라 사람인 이유는 화면이 "아빠 담당" 을 그리려면 이름이
            필요하고, id 만 주면 목록마다 한 번 더 물어야 하기 때문입니다. 정하지 않았거나
            탈퇴했으면 `null` 입니다.
        status: { $ref: '#/components/schemas/ScheduleStatus' }
        doneAt:
          type: [string, "null"]
          format: date-time
          example: "2026-10-03T01:30:00Z"
          description: 완료·건너뜀으로 바꾼 시각. `planned` 로 되돌리면 다시 `null` 입니다
        version:
          type: integer
          description: |
            고칠 때 그대로 되돌려 보내야 하는 값. 다르면 409 입니다.
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/SchedulePerson'
            - type: "null"
          description: 마지막으로 고친 사람. 화면의 "○○님이 방금 고쳤어요" 가 이 값입니다
        updatedAt: { type: [string, "null"], format: date-time }
        repeatKind: { $ref: '#/components/schemas/ScheduleRepeat' }
        repeatUntil:
          type: [string, "null"]
          format: date
          description: 되풀이가 끝나는 날. `null` 이면 끝이 없습니다
        occurrence:
          type: boolean
          description: |
            **펼쳐 낸 하루인가**(#421). `true` 면 이 줄에 해당하는 **행이 아직 없습니다** —
            `id` 는 규칙의 것이고 여럿이 그것을 나눠 씁니다. 화면은 `(id, onDate)` 를 키로
            삼아야 합니다. 고치거나 완료하면 그때 서버가 행을 만듭니다.

    ScheduleInput:
      type: object
      required: [ownerKind, ownerRef, kind, title, onDate]
      properties:
        ownerKind: { $ref: '#/components/schemas/ScheduleOwnerKind' }
        ownerRef: { type: integer, format: int64 }
        dogId:
          type: [integer, "null"]
          format: int64
          description: 없어도 됩니다 — "사료 주문" 은 아이 하나에 안 묶입니다
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        title: { type: string, maxLength: 100, example: "보리 병원" }
        memo: { type: [string, "null"], maxLength: 500 }
        onDate: { type: string, format: date, example: "2026-10-03" }
        atTime:
          type: [string, "null"]
          example: "10:30"
          description: 없어도 됩니다 — "이번 주말 목욕"
        assignee:
          type: [integer, "null"]
          format: int64
          description: |
            **그 주인을 볼 수 있는 사람**이어야 합니다. 아니면 404 입니다.
        repeatKind: { $ref: '#/components/schemas/ScheduleRepeat' }
        repeatUntil:
          type: [string, "null"]
          format: date
          description: 안 주면 **끝이 없습니다**(#421)

    ScheduleUpdate:
      type: object
      description: |
        부분 수정 본문. **잠금 값(`version`)은 여기 없고 쿼리로 갑니다** — 경로 설명 참조.

        `memo`·`atTime`·`dogId`·`assignee` 는 **안 보내면 비우고**,
        `kind`·`title`·`onDate`·`status` 는 **안 보내면 안 바꿉니다**.
      minProperties: 1
      properties:
        dogId: { type: [integer, "null"], format: int64 }
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        title: { type: string, maxLength: 100 }
        memo: { type: [string, "null"], maxLength: 500 }
        onDate: { type: string, format: date }
        atTime: { type: [string, "null"], example: "15:00" }
        assignee: { type: [integer, "null"], format: int64 }
        status: { $ref: '#/components/schemas/ScheduleStatus' }
        repeatKind:
          allOf:
            - $ref: '#/components/schemas/ScheduleRepeat'
          description: |
            안 보내면 **반복을 안 바꿉니다**(#421). `memo` 무리와 다른 답인 것이 의도입니다 —
            반복은 화면이 늘 보내는 값이 아니고, 안 보냈다고 꺼 버리면 "제목만 고쳤는데
            반복이 사라졌다" 가 됩니다.
        repeatUntil: { type: [string, "null"], format: date }

    ScheduleConflict:
      type: object
      description: |
        편집 충돌(409)의 본문. **`error` 봉투를 깨지 않습니다** — 앱의 공통 오류 처리가
        `error.code` 로 분기하므로 최신 값은 봉투 **안**이 아니라 **옆**에 붙습니다.
      required: [error, current]
      properties:
        error:
          type: object
          description: 평소와 같은 오류 봉투의 안쪽. `code` 는 `CONFLICT` 입니다
          properties:
            code: { type: string, example: "CONFLICT" }
            message: { type: string, example: "다른 사람이 먼저 고쳤습니다." }
            traceId: { type: [string, "null"] }
        current:
          allOf:
            - $ref: '#/components/schemas/Schedule'
          description: |
            **지금 서버에 있는 값**. 화면이 다시 묻지 않고 "○○님이 방금 고쳤어요" 를 그 자리에서
            그릴 수 있게 합니다 — 다시 물으면 그 사이에 또 바뀔 수 있습니다.

    CrewFavorSlot:
      type: string
      enum: [morning, afternoon, evening]
      description: |
        품앗이의 **시간대**. 부탁은 "12/24 **오후**, 보리 두 시간만" 이지 "14시 00분" 이
        아닙니다 — 시각을 받으면 부탁하는 사람이 없는 정밀도를 지어내고 맡는 사람은 그 시각에
        묶입니다. 실제 시각은 둘이 대화방에서 정합니다.

    CrewFavorStatus:
      type: string
      enum: [open, taken]
      description: |
        **둘뿐입니다.** "끝났다" 를 안 둡니다 — 끝났는지는 **일정이 압니다**(맡으면 생기는
        크루 일정의 완료 표시). 여기에 또 두면 같은 사실이 두 곳에 살고 한쪽만 고쳐집니다.

        "취소됨" 도 없습니다 — 거둬들이면 행이 사라집니다.

    CrewFavor:
      type: object
      description: |
        품앗이 한 건(`crew_favor`) — "12/24 오후, 보리 두 시간만 봐 주실 분"(#417).

        **금액도 평점도 후기도 없습니다.** 이슈가 그은 선입니다 — 돈이 오가면 우리가 중개자가
        되고 사고 시 배상·신고 의무가 따라옵니다. 여기서 하는 일은 **약속을 적는 것**까지입니다.
      required: [id, onDate, slot, status, mine, takenByMe]
      properties:
        id: { type: integer, format: int64 }
        onDate:
          type: string
          format: date
          description: 사람이 고른 날짜(KST). `schedule.onDate` 와 같은 규약입니다
        slot: { $ref: '#/components/schemas/CrewFavorSlot' }
        note:
          type: [string, "null"]
          maxLength: 200
          example: "두 시간만 부탁드려요"
        status: { $ref: '#/components/schemas/CrewFavorStatus' }
        askedBy:
          oneOf:
            - $ref: '#/components/schemas/CrewPerson'
            - type: "null"
          description: 부탁한 사람. 탈퇴했으면 `null` 입니다
        takenBy:
          oneOf:
            - $ref: '#/components/schemas/CrewPerson'
            - type: "null"
          description: 맡은 사람. 아직 아무도 안 맡았으면 `null` 입니다
        dog:
          oneOf:
            - $ref: '#/components/schemas/CrewFavorPet'
            - type: "null"
          description: |
            어느 아이를 맡기나. 없어도 됩니다 — 아이를 아직 등록 안 한 사람도 부탁할 수 있습니다
        mine:
          type: boolean
          description: 내가 올린 부탁인가. **지우기 버튼을 그릴지** 정합니다
        takenByMe:
          type: boolean
          description: 내가 맡은 것인가. "제가 할게요" 와 "무르기" 를 가릅니다
        scheduleId:
          type: [integer, "null"]
          format: int64
          description: |
            맡으면 생기는 **크루 소유 일정**의 id. 화면이 달력의 그 줄로 갈 수 있게 함께
            줍니다. 안 맡았으면 `null` 입니다
        createdAt: { type: string, format: date-time }

    CrewPerson:
      type: object
      description: 크루에서 사람 하나를 가리키는 최소한 — id 와 이름.
      required: [userId, nickname]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          description: '`users` 의 현재 닉네임. 탈퇴했으면 `알 수 없음` 입니다'

    CrewFavorPet:
      type: object
      description: |
        부탁에 걸린 아이 — **id 와 이름뿐**입니다. 품종·나이를 안 싣습니다: 카드가 말해야
        하는 것은 "누구를 맡기나" 이고, 그 이상은 남의 아이 정보를 크루 전체에 흘리는 것입니다.
      required: [dogId, name]
      properties:
        dogId: { type: integer, format: int64 }
        name: { type: string, example: "보리" }

    CrewFavorInput:
      type: object
      description: 부탁 올리기 본문. **금액도 기간도 없습니다** — 태그 설명 참조.
      required: [onDate, slot]
      properties:
        onDate:
          type: string
          format: date
          description: 지난 날짜는 **400** 입니다 — 아무도 못 맡는 부탁이 목록을 막습니다
        slot: { $ref: '#/components/schemas/CrewFavorSlot' }
        dogId:
          type: [integer, "null"]
          format: int64
          description: '**내 아이**여야 합니다 — 아니면 404 입니다. 없어도 됩니다'
        note: { type: [string, "null"], maxLength: 200 }

    CrewVisibility:
      type: string
      enum: [invite, public]
      description: |
        누가 찾을 수 있나. **기본은 `invite`** 입니다 — 처음부터 아무나 들어오면 관리가 안
        됩니다. 동네 모임은 아는 사람 몇으로 시작해서 열리는 것이지, 열어 놓고 사람을 거르는
        것이 아닙니다.

        `public` → `invite` 로 되돌려도 **이미 든 사람은 안 나갑니다.** 공개 범위는 "누가 새로
        들어올 수 있나" 이지 "누가 있나" 가 아닙니다.

    CrewMember:
      type: object
      description: |
        크루 멤버. **`crew_member` 테이블은 만들지 않습니다** — `GroupMember` 와 같은 자리이고
        같은 이유입니다. 이 스키마는 `chat_room_member` 한 줄을 크루의 언어로 다시 적은 것입니다.
      required: [userId, nickname, role]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          description: '`users` 의 현재 닉네임. 탈퇴했으면 `알 수 없음` 입니다'
          example: "성수아빠"
        role: { $ref: '#/components/schemas/GroupRole' }

    Crew:
      type: object
      description: |
        동네 반려인 모임 하나(`crew`). 이름·소개·동네·공개 범위·정원 다섯을 드는 표이고,
        멤버십도 초대코드도 여기 없습니다 — 둘 다 방(`chat_room`)의 것입니다.
      required: [id, roomId, name, visibility, capacity, memberCount, mine, owner, members, createdAt]
      properties:
        id: { type: integer, format: int64 }
        roomId:
          type: integer
          format: int64
          description: |
            이 크루의 대화방. **늘 함께 옵니다** — 크루의 알맹이가 방이라, 화면이 방으로 가려고
            한 번 더 묻게 만들지 않습니다. 초대 발급·회수·채팅이 전부 이 id 로 갑니다
        name: { type: string, maxLength: 30, example: "성수동 아침 산책" }
        intro:
          type: [string, "null"]
          maxLength: 200
          description: 한 줄 소개. 없어도 됩니다 — 이름만으로 충분한 모임이 있습니다
          example: "천천히 걷습니다. 소형견 위주예요"
        neighborhoodCode:
          type: [string, "null"]
          description: |
            행정동 코드 열 자리(#342). **좌표가 아닙니다** — 사용자가 스스로 고른 값입니다.
            찾기는 앞 다섯 자리(시군구)로 합니다. `null` 이면 어느 동네 목록에도 안 뜨고
            코드로만 들어옵니다
          example: "1120052000"
        visibility: { $ref: '#/components/schemas/CrewVisibility' }
        capacity:
          type: integer
          minimum: 2
          maximum: 100
          default: 20
          description: |
            **방장이 정한 정원**입니다. 방(`chat_room`)의 정원은 서비스 전체의 상한이라 다른
            숫자입니다 — 20명짜리 모임을 만든 사람이 21번째를 받고 싶지 않은 것은 서비스
            정책이 아니라 그 모임의 규칙입니다
        memberCount:
          type: integer
          description: 지금 든 사람 수. 나간 사람·강퇴된 사람은 안 셉니다
        mine:
          type: boolean
          description: 내가 든 크루인가. 카드가 "참여" 와 "들어가기" 를 가르는 값입니다
        owner:
          type: boolean
          description: |
            내가 방장인가. **컬럼이 아니라 그 방의 `OWNER` 멤버인지**를 읽은 값입니다.
            고치기·강퇴 버튼을 그릴지 정합니다
        members:
          type: array
          description: |
            **목록 조회에서는 빈 배열**입니다 — 카드 하나에 사람 스무 명을 실어 나를 이유가
            없습니다. 공개 크루를 안 든 사람이 볼 때도 빈 배열입니다(인원 수까지가 공개입니다)
          items: { $ref: '#/components/schemas/CrewMember' }
        createdAt: { type: string, format: date-time }

    CrewInput:
      type: object
      description: 크루 만들기 본문.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 30, example: "성수동 아침 산책" }
        intro: { type: [string, "null"], maxLength: 200 }
        neighborhoodCode:
          type: [string, "null"]
          pattern: '^[0-9]{10}$'
          description: |
            **안 주면 내 동네**입니다. 내 동네도 없으면 동네 없는 크루가 됩니다 — 그때
            `visibility: public` 이면 400 입니다(아무도 못 찾는 공개이기 때문입니다)
          example: "1120052000"
        visibility:
          allOf:
            - $ref: '#/components/schemas/CrewVisibility'
          description: 안 주면 `invite` 입니다
        capacity:
          type: [integer, "null"]
          minimum: 2
          maximum: 100
          description: 안 주면 20명입니다

    CrewPatch:
      type: object
      description: |
        부분 수정 본문. **만들기 스키마를 재사용하지 않습니다**(ADR-0017 규약 4).

        **`null` 과 빈 문자열이 다릅니다** — 안 보내면 안 바꾸고, `""` 는 지웁니다.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        intro:
          type: string
          maxLength: 200
          description: '`""` 를 보내면 소개를 지웁니다'
        neighborhoodCode:
          type: string
          pattern: '^$|^[0-9]{10}$'
          description: |
            `""` 를 보내면 동네를 뗍니다. 공개 크루에서 떼면 **400** 입니다 — 만들 때만 막고
            고칠 때 열어 두면 그 상태로 가는 문이 남습니다
        visibility: { $ref: '#/components/schemas/CrewVisibility' }
        capacity: { type: integer, minimum: 2, maximum: 100 }

    WalkNote:
      type: object
      description: |
        산책 시 주의사항(`walk_note`) — **그룹당 한 장**입니다.

        `id` 를 싣지 않습니다. 그룹당 한 장이라 그 id 로 갈 수 있는 경로가 없고, 아무 데도 못
        쓰는 식별자를 두면 앱이 그걸 키로 삼습니다. 아직 아무도 안 쓴 그룹은 `body` 가 빈
        문자열이고 `updatedBy`·`updatedAt` 이 `null` 입니다.
      required: [groupId, body]
      properties:
        groupId: { type: integer, format: int64 }
        body:
          type: string
          maxLength: 500
          description: 메모 전문. 앱은 줄바꿈으로 나눠 목록처럼 그립니다
          example: "횡단보도 앞에서 오토바이에 짖어요"
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/CareDoer'
            - type: "null"
          description: |
            마지막으로 고친 사람. **아직 아무도 안 썼으면 `null`** 입니다(그때는 `body` 도
            빈 문자열입니다). 메모는 있는데 고친 사람이 **탈퇴한** 경우는 `null` 이 아니라
            `알 수 없음` 인 `CareDoer` 입니다 — 둘을 같은 모양으로 뭉개면 "가족이 쓴 안전
            메모" 와 "빈 그룹" 이 화면에서 구별되지 않습니다.
        updatedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-09-02T15:30:00Z"
          description: |
            **오프셋이 붙습니다** — `CareLog.occurredAt` 과 같은 규약입니다(#209).
            아직 아무도 안 썼으면 `null` 입니다.

    WalkNoteInput:
      type: object
      description: |
        전체 교체 본문. 빈 문자열은 "다 지웠다" 는 정상 요청입니다.
      required: [body]
      properties:
        body:
          type: string
