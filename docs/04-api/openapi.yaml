openapi: 3.1.0
info:
  title: Pawloop API
  version: 0.1.0
  description: |
    Pawloop(포루프) — 반려동물 산책·동반장소·커뮤니티 앱의 REST API 계약.

    이 문서는 **design-first(계약 우선)** 로 작성되었습니다. 프론트엔드(Flutter)가 먼저 만들어졌고,
    프론트가 실제로 필요로 하는 데이터를 기준으로 이 계약을 정의합니다. 백엔드(Spring Boot + MySQL 공간형)는
    이 계약을 구현합니다.

    **이 파일이 API 계약의 단일 출처(SSOT)입니다.** 같은 폴더의 `api-spec.md` 는 사람이 읽는 요약이며,
    두 문서의 값이 충돌하면 **언제나 이 파일이 우선**합니다.

    - 인증: JWT Bearer(HS256). `sub` 는 서버가 발급한 **불투명 사용자 키**입니다.
      이메일이라고 가정하거나 문자열을 파싱하지 마세요. 사용자 식별 정보가 필요하면 `GET /auth/me` 로 조회합니다.
      (발급 규칙은 서버 내부 사항이며 예고 없이 바뀝니다. 클라이언트 계약은 어느 쪽이든
       "파싱하지 않는 불투명 키"입니다.)
    - 소셜 로그인 계정과 이메일 가입 계정은 **같은 경로로 동작합니다.** 어느 쪽 토큰으로든
      `GET /auth/me`·`PUT /auth/me`·`DELETE /auth/me`·`POST /auth/logout` 이 200/204 입니다.
      (2026-08 이전에는 소셜 계정에서 400 이었습니다. #5 에서 해소되었습니다.)
    - 인증 요구 여부는 **각 오퍼레이션의 `security` 선언이 정본**입니다. 아래 한 줄은 요약일 뿐입니다:
      MVP에선 읽기(장소 조회 등)는 비인증 허용, 쓰기(산책 저장·글 작성)는 인증 필요.
    - **오류 응답 규약** (#44 · #10)
      - `401` 은 **본문이 없습니다.** 인증 계층이 상태 코드만 돌려줍니다 — 토큰 없음·위조·만료·
        탈퇴한 계정의 살아 있는 토큰·이메일 로그인의 자격증명 실패가 전부 같은 모양입니다.
      - 그 밖의 오류는 **전부** `Error` 스키마(`{ error: { code, message, traceId } }`)입니다.
        `code` 는 HTTP 상태 하나당 하나로 고정된 닫힌 목록입니다(`Error.code` 의 enum 참조).
        (2026-08 이전에는 `{status, error, message, path, timestamp}` 였고, `SocialController` 는
         또 다른 `{ "error": "문자열" }` 을 돌려줬습니다. #10 이 하나로 합쳤습니다.)
      - **알 수 없는 경로는 `404`** 입니다. `message` 는 `요청한 경로를 찾을 수 없습니다.`
      - `500` 의 `message` 에는 **원인이 실리지 않습니다.** 고정 문구이고, 이 요청을 지목하는
        열쇠는 `error.traceId`(= `X-Correlation-Id` 응답 헤더)입니다. 서버 로그에서 그 ID 로
        원인을 찾습니다 — 예외 메시지를 그대로 실으면 SQL 조각·경로·이메일이 새어 나갑니다.
      - 컨트롤러가 `403`·`404`·`409` 를 명시적으로 정해 던지면 그 코드가 그대로 나갑니다.
        (2026-08 이전에는 전부 `500` 이었습니다.)
    - **목록의 기본은 커서 봉투**(`items`/`nextCursor`/`hasMore`)입니다. 예외는 셋뿐이고
      전부 **상한이 코드에 있는 목록**입니다 — `GET /api/dogs`(`DogService.MAX_PETS`),
      `GET /api/chat/rooms`(사용자가 든 방), `GET /api/groups/{groupId}/care-logs`(하루치).
      사용자가 **계속 쌓는** 목록은 봉투여야 합니다. 배열로 내보낸 뒤 봉투로 바꾸는 것은
      파괴적 변경이라, 구현이 붙기 전이 유일하게 공짜인 시점입니다. (ADR-0017 규약 2)
      채팅 메시지만 `ChatMessagePage`(`roomSeq` 기반)라는 다른 봉투를 씁니다 — ADR-0011 이
      정한 의도된 예외입니다.
    - **남의 것과 없는 것은 구별되지 않습니다.** 둘이 다른 코드를 받으면 id 를 훑어
      "있는 것/없는 것" 을 가려낼 수 있습니다. **어느 코드로 합칠지는 도메인이 정하고
      그 이유를 여기 적습니다** — 지금 이 계약에는 두 선택이 다 있고 둘 다 옳습니다.
      (ADR-0017 규약 3)
      - **Dogs·Walks 는 `404` 로 합칩니다.** 남의 산책·남의 반려동물은 없는 것과
        바이트까지 같습니다.
      - **Chat·Groups 는 `403` 으로 합칩니다.** 없는 방·없는 그룹도 비멤버와 같은 403 입니다.
        여기서 404 를 주면 id 를 훑어 "있는 가족/없는 가족" 을 가려낼 수 있고, 가족의 존재
        여부는 그 가족에게만 의미가 있습니다.
    - 전역 `security` 를 상속하는 오퍼레이션은 **반드시 `401` 을 선언**합니다. 형제끼리
      어긋나면 그건 설계가 아니라 누락입니다. (ADR-0017 규약 3)
    - **인증이 선택인 경로**는 `security: []` 가 아니라 `security: [{}, {bearerAuth: []}]`
      입니다. `security: []` 는 인증을 계약에서 **제거**하므로 서버가 토큰을 읽지 않아야 하고,
      그러면 개인화 필드는 영원히 `null` 인 죽은 필드가 됩니다. (ADR-0017 규약 6)
    - **부분 수정은 생성 스키마를 재사용하지 않습니다.** 전용 `*Patch` 스키마에
      `minProperties: 1` 을 걸고 `requestBody.required: true` 를 둡니다. (ADR-0017 규약 4)
    - **사람 참조는 `PersonRef`** (`userId`+`nickname`) 하나입니다. `ChatMessage` 만
      `senderUserId`/`senderName` 평평한 쌍을 쓰며, 이는 명시적 예외입니다. (ADR-0017 규약 5)
    - **응답에 쓰이는 모든 객체 스키마는 `required` 를 선언**합니다. `required` 는 "서버가
      **항상** 채우는 필드" 의 최소집합입니다 — 넣지 말아야 할 것을 넣으면 그 순간부터 서버가
      계약 위반이고, 빼야 할 것을 빼면 계약이 아무것도 보장하지 않습니다. (ADR-0017 규약 1)
    - **시각과 하루 경계** (ADR-0017 없음 — 이슈 #209 `Groups-medium-6` 이 정한 것입니다)
      - **`format: date-time` 필드는 RFC3339 오프셋을 포함합니다** — `2026-09-03T00:30:00Z`
        처럼 `Z` 또는 `+09:00` 이 붙습니다. 오프셋 없는 문자열(`2026-09-03T00:30:00`)을
        받으면 앱의 `DateTime.parse` 가 그것을 **기기 지역 시각**으로 읽으므로, 해외에 있는
        가족이 보면 그 차이만큼 어긋난 시각이 그려집니다.
      - **"오늘" 은 `Asia/Seoul` 입니다.** 하루 경계가 여기서 정해집니다 — 한국 반려인을 위한
        앱이라 사용자가 해외에 있어도 "오늘의 케어" 는 집의 하루를 뜻합니다(가족이 나눠 보는
        기록이기 때문입니다). 서버의 `ClockConfig.SERVICE_ZONE` 이 이 존을 **빈에 박습니다** —
        `systemDefaultZone()` 이면 배포의 `TZ` 환경변수 하나로 조용히 바뀌고, 그러면 KST
        00:00~08:59 의 케어 기록이 '어제' 가 되어 **이중 급여 방지 화면에서 사라집니다.**
      - **이제 전부 오프셋을 답니다** (2026-09-03, 이슈 #248). 그전까지 열 필드가 오프셋 없이
        나갔습니다 — `ChatMessage.createdAt`·`deletedAt`, `ChatRoom.createdAt`,
        `Group.createdAt`, `GroupMember.joinedAt`, `User.createdAt`·`updatedAt`,
        `ChatInvite.createdAt`·`expiresAt`, 그리고 채팅 신고 접수 응답의 `createdAt` 입니다.
        (뒤의 셋은 이슈가 세던 일곱에 없었습니다 — 응답 DTO 가 아니라 뷰라서 목록에서
        빠졌습니다.)
      - **표에 담기는 값은 UTC 입니다.** `LocalDateTime.now()` 는 JVM 기본 존을 읽는데 개발
        기계는 KST 고 배포 컨테이너는 UTC 라, 같은 코드가 환경마다 다른 값을 넣었습니다 —
        dev DB 에 실제로 두 존이 섞여 있었습니다. 이제 `ChatTime`·`UserTime`·`CommunityTime`
        이 UTC 로 눕혀 넣고, 응답에서 `Instant` 로 세웁니다. `DateTimeFieldsAreInstantTest`
        가 **이 계약 파일을 목록의 출처로 삼아** 빠진 필드가 없는지 지킵니다.
    - 좌표: `lat`(위도), `lng`(경도). (관광공사 원본은 mapy=위도, mapx=경도)
    - 리네임 진행 중: 제품명은 Pawloop, 도메인·딥링크 스킴은 당분간 heattrip 을 유지합니다
      (`https://api.heattrip.link`, `heattrip://login-callback`).
    - `미구현` 이라고 적힌 오퍼레이션은 계약만 있고 백엔드 핸들러가 없습니다(2026-08 기준).
      Prism 목 서버로는 통과하지만 실서버에서는 404 입니다.
servers:
  - url: https://api.heattrip.link
    description: 운영(예정 — 패키지/도메인 리네임 전까지 기존 유지)
  - url: http://localhost:4010
    description: Prism 목 서버 (design-first mock)
  - url: http://10.0.2.2:8080
    description: 로컬 백엔드 (안드로이드 에뮬레이터 → 호스트)

tags:
  - name: Auth
    description: |
      소셜 로그인(카카오·구글) · 이메일 가입/로그인 · 토큰 · 내 정보.
      네이버는 백엔드 설정이 남아 있으나 제품 결정상 **보류**입니다(#15).
      지원 공급자의 단일 출처는 `components.parameters.Provider` 의 enum 입니다.

      **인가 경계** — 비인증 허용은 `/auth/signup`, `/auth/login`, `/auth/oauth/**`,
      `/auth/token/refresh`, 그리고 Spring Security 가 처리하는 `/oauth2/**`·`/login/oauth2/**` 뿐입니다.
      `/auth/me`(GET·PUT·DELETE)와 `/auth/logout` 은 **반드시 bearerAuth 검증을 거쳐야 합니다.**
      (구현 참조: `SecurityConfig` 의 permitAll 목록에 `/auth/**` 를 통째로 넣지 말 것 — 이슈 #23)
  - name: Dogs
    description: 반려견 프로필
  - name: Consents
    description: |
      약관 동의의 기록 (이슈 #190). 서버는 "누가 어느 문서의 어느 버전에 언제 동의(철회)했는가" 만
      적습니다. 문서와 그 최신 버전은 앱이 들고 있고, 재동의가 필요한지도 앱이 정합니다.
  - name: Places
    description: 반려동반 장소(관광공사) · 동물병원/펫샵/산책로 레이어
  - name: Walks
    description: 산책 기록(GPS 경로) · 통계
  - name: Community
    description: 게시판 · 댓글 · 반응
  - name: Bookmarks
    description: 저장한 장소
  - name: Groups
    description: |
      가족 그룹 · 오늘의 케어 공유 · 산책 주의사항

      **초대와 멤버십은 이 태그에 없습니다.** 초대코드는 `chat_room_invite`, 멤버십은
      `chat_room_member` 이고 둘 다 Chat 태그의 경로가 다룹니다
      ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).
      2026-08 이전에는 `POST /api/groups/join` 과 `Group.inviteCode` 가 여기 있었습니다 —
      그룹당 코드 하나가 영구히 사는 모양이라 만료·사용횟수·회수를 걸 자리가 없었고,
      멤버십 표가 둘이면 "가족인데 방에 없는 사람" 이라는 상태가 생깁니다. 이슈 #75 가
      정리했습니다. 지금 참여는 `POST /api/chat/invites/{code}/join` 입니다.
  - name: Chat
    description: |
      범용 다중 방 채팅. **가족 그룹 전용이 아닙니다** — 방은 `chat_room` 이고,
      가족 그룹은 `origin_kind`/`origin_ref` 로 방과 이어진 여러 출처 중 하나입니다.

      **순서·델타·미읽음은 전부 방별 `roomSeq` 하나로 풉니다.** `id`(AUTO_INCREMENT)를
      커서로 쓰지 않습니다 — 배정 시점과 가시성 시점이 달라 `afterId` 폴링이 메시지를
      영구히 건너뜁니다. 그래서 이 태그의 목록 응답은 공용 `Page`(`nextCursor`)를
      쓰지 않고 `lastSeq`/`hasMore` 를 직접 돌려줍니다.

      MVP 는 **폴링**(`afterSeq`)입니다. 소켓은 실측 트리거가 걸릴 때만 엽니다(M2.9).

security:
  - bearerAuth: []

paths:
  # ── 구현 없는 오퍼레이션의 표시 ──────────────────────────────
  #
  # 이 문서는 "서버가 무엇을 약속하는가" 의 단일 출처다(#4). 그래서 핸들러가 없는
  # 경로를 아무 표시 없이 실어 두면, 그것을 보고 만든 앱이 404 를 받는다.
  #
  #   x-status: planned    아직 구현이 없다. 계약을 먼저 둔 것이다(선행 계약).
  #   x-status: framework  구현은 있지만 우리 컨트롤러가 아니다(Spring Security 필터 등).
  #                        생성본(/v3/api-docs)에는 안 나오므로 따로 구분한다.
  #   (표시 없음)          컨트롤러 매핑이 실제로 있다.
  #
  # x-status-note 에 "왜 아직 없는가" 를 한 줄로 적는다. 무엇이 막고 있는지를 적어야
  # 다음 사람이 그 순서를 다시 추론하지 않는다.
  #
  # GeneratedOpenApiSpecTest 가 이 표시를 강제한다 — 표시 없는 오퍼레이션이 생성본에
  # 없으면 빨간불이다. 반대로 구현이 붙었는데 planned 가 남아 있어도 빨간불이다.
  # ─────────────────────────── Auth ───────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: |
        `AuthController.signup` 이 처리합니다. 성공은 **201 + `User`** 입니다(이슈 #10 에서 구현).

        > ⚠️ **2026-08 이전에는 `200 OK` + 본문 `"회원가입 성공"`(평문)이었습니다.**
        > 상태 코드와 본문 형태가 함께 바뀌었습니다. 200 만 성공으로 보던 클라이언트는
        > 201 도 성공으로 받아야 하고, 본문을 문자열로 읽던 코드는 JSON 으로 읽어야 합니다.

        같은 이메일이 이미 있으면 **409** 입니다. 예전에는 400 이었고, 앱은 "입력이 틀렸다"와
        "이미 가입돼 있다"를 구분할 수 없었습니다. 오류 본문은 공통 `Error` 이며
        409 의 `error.code` 는 `CONFLICT` 입니다.

        **이 응답에는 토큰이 없습니다.** 가입 직후 로그인 상태로 만들려면 클라이언트가
        `POST /auth/login` 을 한 번 더 호출해야 합니다 — 가입과 인증을 한 응답에 묶지 않는 것은
        의도입니다(가입 폼의 재시도가 토큰 발급을 반복하지 않습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일/비밀번호 로그인
      description: |
        `AuthController.login` 이 처리합니다. 응답은 `AuthTokens` JSON 입니다(이슈 #10 에서 구현).

        > ⚠️ **2026-08 이전에는 본문이 JSON 이 아니라 JWT 원문 문자열이었습니다.**
        > `response.body` 를 그대로 토큰으로 저장하던 클라이언트는 이제 `accessToken` 필드를
        > 읽어야 합니다. 그렇게 고치지 않으면 JSON 전체가 토큰으로 저장되어 모든 요청이 401 이 됩니다.

        `refreshToken` 이 여기에 실립니다 — 서버는 #9 부터 발급·저장하고 있었지만 응답에 실을
        자리가 없어 아무에게도 전달되지 않았습니다. `isNew` 는 이 경로에서 **항상 `false`** 입니다
        (이미 있는 계정으로 들어오는 경로라 답이 정해져 있습니다).

        **자격증명 실패는 본문 없는 401 입니다.** 가입되지 않은 이메일과 비밀번호 오류를
        구분하지 않습니다 — 구분해 주면 그 자체가 가입 여부를 묻는 조회 수단이 됩니다(#6).
        예전에는 두 경우 모두 **500** 이었습니다(`IllegalAccessException` 이 전역 처리기의
        catch-all 에 잡혔습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /oauth2/authorization/{provider}:
    get:
      x-status: framework
      x-status-note: |
        Spring Security 의 OAuth2 인가 엔드포인트다. 우리 컨트롤러가 아니라 필터가 처리하므로 생성본(/v3/api-docs)에는 안 나온다.
      tags: [Auth]
      summary: 소셜 로그인 시작(302 리다이렉트) — Spring Security OAuth2 진입점
      description: |
        앱(`flutter_web_auth_2`)이 실제로 여는 URL 입니다. 공급자 인증 화면으로 302 리다이렉트됩니다.
        인증 성공 시 백엔드가 앱 딥링크로 리다이렉트합니다:
        `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` (이슈 #14).

        **딥링크에는 토큰이 없습니다.** 쿼리 파라미터는 정확히 `code` 와 `state` 둘뿐입니다.
        앱은 받은 `code` 를 `POST /auth/oauth/{provider}/callback` 으로 교환해 `AuthTokens` 를
        받습니다. 코드는 **60초 살고 한 번 쓰면 죽습니다** — 두 번째 교환은 401 입니다.

        > **2026-08 이전에는 이 딥링크가 `?token=<JWT>&refresh=<refreshToken>` 이었습니다(#9).**
        > 커스텀 스킴(`heattrip://`)은 어느 앱이든 등록할 수 있고, URL 은 302 응답의 `Location`
        > 헤더(액세스·프록시 로그)와 브라우저 히스토리에 남습니다. 그 채널로 1시간짜리 액세스
        > 토큰과 14일짜리 refresh 토큰이 함께 나가고 있었습니다. 지금 나가는 것은 60초짜리
        > 1회용 난수뿐이라, 가로채도 쓸 수 있는 창이 사실상 없습니다. 서버는 이 리다이렉트에
        > 여전히 `Cache-Control: no-store` 를 붙입니다.

        > ⚠️ **`state` 는 앱이 만들어 앱이 대조합니다.** 인증을 시작할 때
        > `GET /oauth2/authorization/{provider}?state=<난수>` 로 보내면 서버가 그 값을 왕복 동안
        > 붙들었다가 딥링크에 그대로 실어 돌려줍니다. 돌아온 값이 보낸 값과 다르면 **로그인 실패로
        > 처리하세요** — 응답 바꿔치기를 막는 장치가 그것뿐입니다. `[A-Za-z0-9_-]{1,128}` 만
        > 통과합니다(그 밖의 값은 없는 것으로 취급되어 빈 `state` 가 돌아옵니다).
        >
        > ⚠️ **`state` 없이 시작한 로그인은 교환 단계에서 401 입니다(#14).** 빈 `state` 로 발급된
        > 코드는 `POST /auth/oauth/{provider}/callback` 이 거부합니다 — 그렇지 않으면 서버쪽
        > 대조의 존재 여부를 왕복을 시작한 쪽이 정하게 되어, `state` 를 생략하기만 하면
        > 두 번째 줄이 사라집니다. **항상 `state` 를 보내세요.**

        **실패도 같은 딥링크로 돌아옵니다**: `heattrip://login-callback?error=<code>`.
        앱은 `code` 와 `error` 중 어느 쪽이 실려 있는지로 성공/실패를 가릅니다.
        현재 서버가 보내는 `code` 는 다음이 전부입니다.

        | `error` | 뜻 | 앱이 할 일 |
        |:---|:---|:---|
        | `email_already_registered` | 같은 이메일이 다른 경로로 이미 가입돼 있다 (#7) | 기존 가입 방식으로 로그인하도록 안내 |
        | `account_state_invalid` | 인증 주체에 `users.id` 가 없어 토큰을 발급할 수 없다 (#5) | 일반 오류 안내 후 재시도 |
        | `authentication_failed` | 그 밖의 모든 실패(공급자 오류·사용자 취소 등)의 기본값 | 일반 오류 안내 후 재시도 |

        공급자가 돌려준 오류 코드가 `[a-z0-9_]{1,64}` 를 만족하면 그대로 전달될 수 있습니다.
        즉 목록은 닫혀 있지 않습니다 — **모르는 `code` 는 일반 오류로 처리**하세요.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 성공 딥링크에 그대로 실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}`.
            보내지 않으면 딥링크의 `state` 는 빈 값이고, 그 코드는 교환 단계에서 401 입니다(#14).
            사실상 필수입니다 — `required: false` 인 것은 이 경로가 302 를 막지 않기 때문입니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: 공급자 로그인 페이지로 리다이렉트
          headers:
            Location:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /login/oauth2/code/{provider}:
    get:
      x-status: framework
      x-status-note: |
        Spring Security 의 리다이렉트 수신 엔드포인트다. 우리 컨트롤러가 아니라 필터가 처리하므로 생성본에는 안 나온다.
      tags: [Auth]
      summary: 공급자 리디렉션 수신(Spring Security 내부 콜백)
      description: |
        공급자 콘솔에 등록해야 하는 승인 리디렉션 URI 입니다. 값은 `{server.url}/login/oauth2/code/{provider}`.
        성공 시 앱 딥링크 `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` 로
        302 합니다(#14). 클라이언트가 직접 호출하는 경로가 아닙니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302':
          description: 앱 딥링크로 리다이렉트
          headers:
            Location:
              schema: { type: string }

  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작 — `/oauth2/authorization/{provider}` 로의 302 래퍼
      description: |
        `AuthController.startOAuth` 가 처리합니다(이슈 #10 에서 구현). **인증 로직을 다시
        구현하지 않습니다** — `Location: /oauth2/authorization/{provider}` 로 302 를 줄 뿐이고,
        공급자 왕복과 딥링크 복귀는 그쪽(Spring Security `oauth2Login`)이 그대로 처리합니다.

        > **2026-08 이전 이 절은 "백엔드에 이 경로의 핸들러가 없습니다" 라고 적었습니다. 거짓이었습니다.**
        > 핸들러는 있었고 **빈 200** 을 돌려줬습니다. 계약과 구현이 서로 다른 거짓을 말하고
        > 있었고, `AuthContractSpecTest.unimplementedOperations_areMarkedAsSuch` 가 그 거짓을
        > 초록불로 고정하고 있었습니다. 셋을 함께 고쳤습니다.

        앱은 이 경로를 쓸 필요가 없습니다 — `GET /oauth2/authorization/{provider}` 를 직접 열면
        리다이렉트 한 번을 아낍니다. 이 경로는 계약을 보고 구현한 클라이언트가 막다른 길에
        빠지지 않게 하는 호환 표면입니다.

        `provider` 가 아래 enum 에 없으면 302 가 아니라 **400** 이고, 본문은 공통 `Error`
        (`error.code` = `VALIDATION`)입니다. 302 로 넘겨 봐야 등록이 없는 공급자는 그쪽에서
        원인을 알 수 없는 오류가 됩니다. 대소문자와 앞뒤 공백은 가리지 않습니다.

        > ⚠️ **`state` 는 이 래퍼를 통과해 전달됩니다(#14).** `GET /auth/oauth/kakao?state=S` 는
        > `Location: /oauth2/authorization/kakao?state=S` 로 302 합니다. **2026-08 초에는 이 래퍼가
        > 쿼리를 옮기지 않았고**, 그래서 이 경로로 시작한 로그인은 딥링크에 빈 `state` 를 받아
        > 앱쪽 대조에서 **항상** 실패했습니다 — 계약이 이 경로를 호환 표면이라고 광고하면서
        > 따르면 반드시 실패하는 함정이었습니다.
        >
        > `[A-Za-z0-9_-]{1,128}` 를 만족하지 않는 `state` 는 **붙지 않습니다**(잘라 쓰거나
        > 인코딩하지 않습니다). 이 값은 `Location` 헤더에 그대로 들어가므로 검증 없이 이어
        > 붙이면 헤더·파라미터 주입이 됩니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 통과하면 302 대상의 쿼리로 그대로 옮겨지고, 성공 딥링크에
            실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}` 를 만족하지 않으면 붙지 않습니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: |
            Spring Security 진입점으로 리다이렉트. `Location` 은
            `/oauth2/authorization/{provider}`(소문자로 정규화된 값)이고, 화이트리스트를
            통과한 `state` 가 있으면 `?state=<값>` 이 이어 붙습니다.
          headers:
            Location:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/oauth/{provider}/callback:
    post:
      tags: [Auth]
      summary: 1회용 코드 → 토큰 교환 (소셜 로그인의 마지막 단계)
      description: |
        `AuthController.exchangeOAuthCode` 가 처리합니다(이슈 #14). **소셜 로그인에서 토큰이
        클라이언트에 도달하는 유일한 통로입니다** — 딥링크에는 `code` 와 `state` 만 실립니다.

        > **2026-08 이전 이 절은 "미구현 — 백엔드에 핸들러가 없습니다" 였고, 소셜 로그인은
        > 302 딥링크로 액세스 토큰과 refresh 토큰을 함께 전달했습니다(#9).** 그래서
        > `AuthTokens` 의 `expiresIn`·`isNew`·`user` 는 소셜 경로에서 클라이언트에 도달할
        > 방법이 없었고, 소셜 신규 가입자는 온보딩으로 가지 못했습니다. 지금은 도달합니다.

        `code` 는 딥링크로 받은 **1회용 인가 코드**입니다. 공급자가 준 인가코드가 아닙니다 —
        공급자와의 코드 교환은 백엔드(Spring Security)가 이미 끝냈습니다. 그래서 이 흐름에는
        PKCE 가 없습니다(앱이 공급자와 직접 말하게 바꾸는 날 필수가 됩니다).
        그 판단의 근거와 트리거는 `docs/99-decisions/decision-log.md` 의 **ADR-0009** 에 있습니다.

        **코드는 60초 살고 한 번 쓰면 죽습니다.** 재사용·만료·공급자 불일치·`state` 부재·
        `state` 불일치는 전부 **본문 없는 401** 입니다. 구분해 주면 그 응답 차이가 "그 코드가 존재하긴 했는가"를
        알려 주는 오라클이 됩니다. 실패한 교환도 코드를 죽입니다 — 코드 하나에 시도 한 번입니다.

        `state` 는 앱이 인증을 시작할 때 만들어 보낸 값과 같아야 합니다. 앱쪽 대조를 대신하지
        않습니다 — 코드를 그것이 시작된 인증 왕복에 묶어 두는 두 번째 줄입니다.

        > ⚠️ **빈 `state` 로 발급된 코드는 교환되지 않습니다(401).** 2026-08 초에는 "양쪽 다
        > 비어 있으면 통과" 였는데, 그러면 이 검사를 켜고 끄는 스위치를 클라이언트가 쥐게 됩니다 —
        > `state` 를 생략하기만 하면 서버쪽 두 번째 줄이 사라집니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 딥링크로 받은 1회용 코드(패딩 없는 Base64URL 43자)
                state:
                  type: string
                  description: 인증 시작 때 앱이 만들어 저장해 둔 난수
                redirectUri:
                  type: string
                  example: "heattrip://login-callback"
                  description: |
                    **리다이렉트 대상으로 쓰이지 않습니다.** 이 시점에는 리다이렉트가 이미
                    끝났고, 대상은 서버 설정(`app.security.oauth.redirect-allowlist`)이 정합니다.
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 액세스 토큰 갱신(refresh 토큰 회전)
      description: |
        `AuthController.refresh` 가 처리합니다(이슈 #9). 인증이 필요 없습니다 — 주체는 본문의
        refresh 토큰 자체가 증명합니다.

        **회전합니다.** 성공하면 옛 refresh 토큰은 그 자리에서 폐기되고 응답에 **새 refresh
        토큰**이 함께 실립니다. 클라이언트는 받은 새 값으로 반드시 교체 저장해야 합니다.

        **재사용 감지.** 이미 폐기된 refresh 토큰이 다시 오면 유출로 간주해 **그 사용자의 모든
        세션을 폐기**하고 401 을 돌려줍니다. 즉 옛 토큰으로 한 번 재시도하면 방금 정상적으로
        받았던 새 토큰도 함께 죽습니다. 만료·미존재는 그냥 401 이며 다른 세션을 끊지 않습니다.

        > ⚠️ **클라이언트는 갱신 요청을 직렬화(single-flight)해야 합니다.** 같은 refresh 토큰으로
        > 동시에 두 번 보내면 한쪽만 이기고 다른 쪽은 재사용으로 처리되어 전 기기가 끊깁니다.
        > 서버는 유예 창을 두지 않습니다 — 유예를 두면 정당한 클라이언트와 탈취자를 구분하지
        > 못한 채 탈취자에게도 유예를 주게 됩니다.

        **형식이 맞는 요청**의 실패는 원인과 무관하게 **본문 없는 401** 입니다 — 없는 토큰,
        빈 문자열, `{}`(필드 생략), 만료, 폐기, 재사용이 전부 같은 모양입니다.

        **형식 자체가 깨진 요청**은 401 이 아니라 400·415·405 입니다(이슈 #9). 읽을 수 없는
        JSON·배열 본문·`refreshToken` 이 문자열이 아닌 경우는 **400**, `Content-Type` 이
        `application/json` 이 아니면 **415**, `POST` 가 아닌 메서드는 **405** 입니다.
        이 세 응답의 본문은 공통 `Error`(`{ error: { code, message, traceId } }`)이며
        **예외 메시지를 싣지 않습니다** — 파서 메시지에 요청 본문(= refresh 토큰 원문)
        조각이 섞이기 때문입니다(#6). `message` 는 상태마다 고정 문구입니다.
        (2026-08 이전에는 `{ status, error, message, path, timestamp }` 였습니다 — #10 에서
        전역 오류 본문을 계약의 `Error` 하나로 통일했습니다.)

        > 앱에게: **400·415·405 를 401 처럼 다루지 마세요.** 그건 재로그인 사유가 아니라
        > 클라이언트 요청이 잘못됐다는 신호이고, 재시도해도 결과가 같습니다.

        refresh 토큰은 JWT 가 아니라 256bit 난수를 패딩 없는 Base64URL 로 적은 43자 불투명
        문자열이며, 서버에는 SHA-256 해시만 저장됩니다. 파싱하지 마세요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400':
          description: |
            요청 본문을 읽을 수 없음(깨진 JSON·배열 본문·타입 불일치). `message` 는 고정
            문구입니다 — 파서 메시지를 그대로 실으면 refresh 토큰 원문 조각이 새어 나갑니다(#6).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: |
            `Content-Type` 이 `application/json` 이 아님. 본문 형태는 400 과 같습니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Auth]
      summary: 내 정보 수정(부분 수정 — 보낸 필드만 반영, 생략한 필드는 유지)
      description: |
        시맨틱이 부분 수정이므로 장기적으로는 `PATCH /auth/me` 가 옳습니다.
        현행 구현이 `PUT` 이라 계약도 `PUT` 으로 적되, `PATCH` 전환은 별도 정리 이슈로 남깁니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: 회원 탈퇴
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃(전 기기 — 해당 사용자의 모든 세션을 폐기)
      description: |
        `AuthController.logout` 이 인증된 주체를 받아 204 를 돌려줍니다.
        어느 쪽 토큰(소셜·이메일 가입)으로 불러도 204 이고, 토큰이 없으면 401 입니다.

        **서버측 폐기가 실제로 일어납니다**(이슈 #9 에서 구현되었습니다). Authorization 헤더의
        액세스 토큰으로 주체를 식별해 그 사용자의 서버측 세션(refresh 토큰)을 **전부** 폐기합니다.
        범위는 **전 기기 로그아웃**입니다 — 특정 기기 하나만 끊는 요청 본문은 정의하지 않습니다.
        멱등입니다 — 이미 폐기된 상태여도 204 를 반환합니다.

        **알려진 한계: 이미 발급된 액세스 토큰은 만료(≤1시간)까지 유효합니다.** 토큰 단위
        무효화에는 `jti` 클레임과 블록리스트 저장소가 필요한데, 그것은 이 작업의 범위가
        아닙니다(아래 `bearerAuth` 참고). 그러므로 클라이언트는 저장한 토큰을 반드시 스스로
        삭제해야 합니다.

        한계: 액세스 토큰이 이미 만료된 상태에서는 이 계약으로 로그아웃을 호출할 수 없습니다.
        refresh 토큰만으로 폐기하는 경로는 정의돼 있지 않습니다 — 그 상태의 클라이언트는
        저장한 토큰을 지우기만 하면 되고, 서버의 refresh 토큰은 14일 뒤 만료됩니다.
      responses:
        '204': { description: 로그아웃됨(멱등) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Dogs ───────────────────────────
  # ─────────────────────────── Consents ───────────────────────────
  /api/consents:
    get:
      tags: [Consents]
      summary: 내 동의 상태
      description: |
        문서별 **마지막 기록**을 돌려줍니다. 한 번도 안 적은 문서는 목록에 없습니다.

        주체는 언제나 토큰의 주인입니다 — 경로에 사용자 id 가 없습니다.

        ## 재동의는 앱이 정합니다

        서버는 문서의 최신 버전을 모릅니다. 앱이 자기가 든 문서 버전(`terms_ko.md` 머리의
        `버전: v1.2` 같은 것)과 여기 `version` 을 견줘서, 다르거나 없으면 동의 화면을 띄웁니다.
        서버가 최신 버전을 알게 하면 앱의 문서와 조용히 갈립니다 (ADR-0020).
      responses:
        '200':
          description: 문서별 마지막 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Consents]
      summary: 동의 또는 철회를 남긴다
      description: |
        받은 항목을 **전부 새 행으로** 적습니다. 행을 고치지 않습니다 — 동의도 철회도 이력입니다.
        `agreed: false` 는 철회이고, 그것도 기록입니다(위치정보법 제24조 — 철회 **전** 제공분은
        그대로이므로 그 경계 시각이 남아야 합니다).

        같은 요청을 두 번 보내면 행이 둘 쌓이지만 "지금 상태" 는 같습니다 — 그 뜻에서 멱등입니다.

        `429` 는 `group-write` 버킷입니다 — 요청 한 건이 행을 만들기 때문이고 `POST /api/dogs` 와
        같은 판단입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentsInput' }
      responses:
        '200':
          description: 적은 뒤의 문서별 마지막 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consents' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/dogs:
    get:
      tags: [Dogs]
      summary: 내 반려견 목록
      responses:
        '200':
          description: 반려견 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Dogs]
      summary: 반려견 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/dogs/{dogId}:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Dogs]
      summary: 반려견 상세
      description: |
        **남의 반려동물과 없는 반려동물은 바이트까지 같은 `404`** 입니다 — `403` 을 주면
        "그 id 는 존재한다" 를 알려 주는 셈입니다(ADR-0017 규약 3).
      responses:
        '200':
          description: 반려견
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      x-status: planned
      x-status-note: |
        부분 수정은 아직 없다. `DogPatch` 를 `DogRequest` 와 어떻게 나눌지는 #24(계약 규약 ADR)가 소유한다 — `DogController` javadoc 이 같은 말을 한다.
      tags: [Dogs]
      summary: 반려견 수정(부분)
      description: |
        **부분 수정이므로 전용 `DogPatch` 를 씁니다**(ADR-0017 규약 4). 생성용 `DogInput` 은
        `required: [name, size]` 라, 그것을 재사용하면 `{"neutered": true}` 만 보내는 것이
        계약 위반이 되어 **부분 수정이 계약상 불가능**해집니다.

        남의 것과 없는 것은 같은 `404` 입니다(규약 3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DogPatch' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      x-status: planned
      x-status-note: |
        삭제는 아직 없다. 산책 기록이 매달린 반려동물을 지울 때의 규칙(#154)이 먼저다.
      tags: [Dogs]
      summary: 반려견 삭제
      description: |
        남의 것과 없는 것은 같은 `404` 입니다(ADR-0017 규약 3).
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Places ───────────────────────────
  /api/places/nearby:
    get:
      tags: [Places]
      summary: 내 주변 장소 조회
      description: |
        현위치 좌표 기준 주변의 반려동반 가능 장소를 거리순으로 반환합니다.

        **서버가 관광공사(KTO) `KorPetTourService2` 를 대신 호출합니다** (이슈 #40).
        앱은 서비스키를 갖지 않습니다 — 앱 바이너리 안의 키는 `strings` 한 번이면 나오고,
        폐기하려면 앱을 새로 배포해야 해서 즉시 대응이 불가능합니다.

        응답은 **좌표를 0.02° 격자로 접은 셀 단위 스냅샷**에서 나옵니다. 같은 셀의 두 번째
        이후 요청은 KTO 를 부르지 않습니다. KTO 일 한도가 1,000콜이라 그 절약이 이 경로의
        전제입니다.

        **오래된 답이 빈 지도보다 낫습니다.** 하루 호출 예산이 소진되면 갱신을 멈추고
        기존 스냅샷을 계속 줍니다. 스냅샷조차 없으면 **빈 배열**입니다(오류가 아닙니다) —
        즉 앱은 "한도 초과" 와 "이 주변에 장소가 없음" 을 구분하지 못합니다.

        `vet`/`shop`/`trail` 레이어는 **미구현**입니다. 그 값이 오면 빈 배열입니다.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: |
            위도. **범위를 벗어나면 `400` 입니다** — `radius`·`limit` 과 달리 자르지
            않습니다. 좌표는 사용자가 지금 보고 있는 곳이라, 조용히 다른 지점의 답을
            주면 그 사람은 자기 주변이 비어 있다고 읽습니다.

            `NaN`·`Infinity` 도 `400` 입니다.
          schema: { type: number, format: double, minimum: -90, maximum: 90, example: 37.5665 }
        - name: lng
          in: query
          required: true
          description: 경도. `lat` 과 같은 규칙입니다 — 범위 밖이면 `400`.
          schema: { type: number, format: double, minimum: -180, maximum: 180, example: 126.9816 }
        - name: radius
          in: query
          description: |
            반경(m). **넘겨도 400 이 아니라 잘립니다.**

            최댓값이 20,000 이 아니라 18,000 인 이유: 스냅샷을 셀 **중심**에서 20km 받아 두고
            셀 안의 어느 점에서든 서빙하므로, 보장되는 반경은 그것에서 셀 반지름(δ ≈ 1.42km)을
            뺀 18,578m 입니다. 그보다 크게 받으면 서버가 **200 으로 조용히 덜 덮인 답**을
            주게 됩니다 (이슈 #40).
          schema: { type: integer, default: 8000, maximum: 18000 }
        - name: category
          in: query
          description: |
            카테고리 필터(생략 시 전체). KTO contentTypeId 또는 레이어 키.
            `vet`/`shop`/`trail` 은 미구현이라 빈 배열입니다.
          schema: { $ref: '#/components/schemas/PlaceCategory' }
        - name: limit
          in: query
          description: |
            **지도 전용 상한입니다** — 공통 파라미터 `Limit`(기본 20 / 최대 100)이 아니라
            여기만의 인라인 스키마이고 수가 다릅니다. 지도는 화면 한 장에 핀을 다 뿌리므로
            목록 한 쪽보다 큽니다.

            **넘겨도 400 이 아니라 잘립니다**(`radius` 와 같은 규칙). 그리고 **잘렸다는
            신호가 응답에 없습니다** — 응답이 벌거벗은 배열이라 실을 자리가 없습니다.
            지도는 '이 반경 안 상위 N' 이라 커서가 필요 없다고 봤습니다. 잘림을 알려야
            한다고 판단이 서면 응답을 봉투로 바꾸는 파괴적 변경이 됩니다.
          schema: { type: integer, default: 80, maximum: 200, minimum: 1 }
      responses:
        '200':
          description: 장소 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/places/catalog:
    get:
      tags: [Places]
      summary: 전국 장소 한 벌
      description: |
        전국의 반려동반 가능 장소를 **한 번에 전부** 반환합니다 (이슈 #273 · #235 A4).

        **요청에 아무것도 실리지 않습니다.** 좌표도 지역 코드도 없습니다.
        `GET /api/places/nearby` 는 현위치를 쿼리로 받는데, 완전 온디바이스 빌드는
        좌표를 서버로 보내지 않으므로 그 경로를 쓸 수 없고 그러면 **지도의 장소 목록이
        빕니다.** 이 경로가 그 자리를 채웁니다.

        거리 정렬·반경 필터·카테고리 필터는 **앱이 기기에서** 합니다. 응답의 `distM` 은
        항상 생략됩니다 — 서버가 그 값을 계산할 좌표를 갖고 있지 않습니다.

        ## 크기와 `ETag`

        전국이 9,684곳이고 응답이 2.83MB, gzip 으로 **0.44MB** 입니다(실측 2026-09-04).
        시군구 249개로 쪼개지 않은 이유가 이 숫자입니다 — 쪼개면 요청에 지역이 실리고
        (행정구역이지만 0 은 아닙니다) 한 벌 데우는 KTO 콜이 10 에서 249 로 늘어납니다.

        앱은 이 한 벌을 기기에 두고 `If-None-Match` 로 갱신만 확인합니다. 맞으면 **304**
        이고 본문이 나가지 않습니다. `ETag` 는 갱신 시각이 아니라 **내용 해시**라,
        KTO 데이터가 그대로인 날은 서버가 갱신해도 304 입니다.

        ## gzip 은 `Accept-Encoding` 을 보내야 옵니다

        0.44MB 는 **압축된** 크기입니다. `Accept-Encoding: gzip` 을 안 보내면 2.83MB 가
        그대로 옵니다. 대부분의 HTTP 클라이언트는 기본으로 보냅니다.

        ## 한 벌이 없으면 빈 배열입니다

        `nearby` 와 같은 규칙입니다. KTO 가 죽었거나 하루 호출 예산이 소진되면 **200** 에
        `[]` 를 줍니다(오류가 아닙니다). 그때는 `ETag` 를 **붙이지 않습니다** — 붙이면
        앱이 빈 목록을 캐시하고, 서버가 회복한 뒤에도 304 를 받아 계속 빈 지도를 봅니다.

        ## `429` 는 목록·상세와 또 다른 버킷입니다

        `places-catalog` 이고 분당 5 입니다. 이 경로만 응답이 MB 단위라, `places-detail`
        의 분당 30 을 그대로 주면 한 IP 가 분당 85MB 를 뽑아 갑니다. 앱은 하루 한 번쯤
        부르므로 5 로 충분하고, `429` 를 받아도 기기에 있는 한 벌을 계속 쓰면 됩니다.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            앱이 갖고 있는 한 벌의 `ETag`. 서버의 것과 같으면 **304** 입니다.
            받은 값을 **그대로** 실어 보내면 됩니다 — `W/` 접두사를 떼지 마세요.

            콤마로 여럿 보낼 수 있습니다. `W/` 가 붙은 것과 안 붙은 것 모두 맞습니다
            (약한 비교입니다).

            **`*` 는 304 를 만들지 않습니다.** 실측 결과 200 에 본문이 옵니다 —
            스프링의 조건부 요청 처리가 그 값을 다루지 않습니다. 캐시 재검증에 `*` 를
            쓰는 클라이언트는 없으므로 그대로 둡니다.
          schema: { type: string, example: 'W/"3f1c8a90b2e64d17c5a0f88e12b47d63"' }
      responses:
        '200':
          description: |
            전국 장소 목록. `ETag` 헤더가 함께 옵니다 — 단, 한 벌이 없어 `[]` 를 줄 때는
            붙지 않습니다.
          headers:
            ETag:
              description: |
                본문의 내용 해시. 다음 요청의 `If-None-Match` 에 **그대로** 실으면 됩니다.

                **약한 검증자(`W/`)입니다.** 강한 것으로 두면 톰캣이 이 응답만 압축하지
                않습니다 — gzip 은 바이트열을 바꾸는데 강한 검증자는 바이트열이 같다는
                뜻이기 때문입니다. 실측(2026-09-04)으로 이 경로만 2.97MB 가 압축 없이
                나가고 있었습니다. 우리가 재는 것은 "같은 목록인가" 이지 "같은 바이트인가"
                가 아니므로 약한 쪽이 맞습니다(RFC 9110 §8.8.1).
              schema: { type: string, example: 'W/"3f1c8a90b2e64d17c5a0f88e12b47d63"' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '304':
          description: |
            `If-None-Match` 가 서버의 `ETag` 와 같습니다. **본문이 없습니다.**
            앱은 기기에 있는 한 벌을 그대로 씁니다.
          headers:
            ETag:
              description: 서버가 갖고 있는 한 벌의 해시. 요청에 실어 보낸 것과 같습니다.
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/places/{contentId}:
    get:
      tags: [Places]
      summary: 장소 상세
      description: |
        **서버가 KTO `detailCommon2`(개요) + `detailPetTour2`(반려동반 정보)를 대신
        호출합니다** (이슈 #40). 결과는 30일 캐시됩니다.

        **404 는 아웃바운드 호출 없이 납니다.** 서버가 목록에 실어 보낸 적도 없고
        `places` 표에도 없는 `contentId` 는 KTO 에 물어보지 않습니다 — 물으면 무작위 id 를
        던지는 것만으로 하루 상세 예산이 사라집니다.

        아직 상세를 못 받았어도 **200** 입니다. 기본 필드(제목·좌표·주소)는 목록에서 왔고,
        `overview` 와 `petInfo` 의 세 필드가 `null` 일 뿐입니다.

        `detailIntro2` 는 **부르지 않습니다.** 앱이 그 응답에서 쓰던 것은 추가 이미지뿐인데,
        넣으면 상세 1건이 3콜이 되어 하루 상세가 75건에서 50건으로 줄기 때문입니다.

        **`429` 는 목록과 다른 버킷입니다** — `places-detail` 이고 목록(`places`)보다 좁습니다.
        상세 1건이 KTO 를 2콜 쓰기 때문입니다. 2026-09-03 이전에는 서버가 실제로 던지는데
        계약에만 없었습니다(#210 `Places-medium-2`).
      security: []
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 장소 상세(반려동반 상세정보 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────── Walks ───────────────────────────
  /api/walks:
    get:
      tags: [Walks]
      summary: 산책 기록 목록(내 반려견)
      description: |
        **정렬은 `(createdAt, id)` 내림차순입니다** — `startedAt` 이 아닙니다.

        `startedAt` 은 클라이언트가 보낸 값이라, 오프라인에 쌓아 둔 산책이 며칠 뒤
        과거 시각으로 들어옵니다. 그걸 커서 기준으로 쓰면 **이미 발급된 커서보다
        아래 날짜의 행이 영원히 건너뛰어집니다.** 서버 시각으로 자르면 그 일이 없습니다.
        (`chat_message` 가 `room_seq` 로 피한 것과 같은 종류의 실패입니다.)

        그래서 목록 순서는 "걸은 순서" 가 아니라 **"기록된 순서"** 입니다.
      parameters:
        - name: dogId
          in: query
          description: 생략하면 내 반려동물 전체의 산책을 섞어서 줍니다.
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 산책 목록(커서 페이지네이션)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Walks]
      summary: 산책 기록 저장
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkInput' }
      responses:
        '201':
          description: 새로 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '200':
          description: |
            **같은 `clientWalkId` 로 이미 저장된 산책이 있어 그것을 그대로 돌려줍니다.**
            재전송은 새 줄을 만들지 않습니다. 앱은 201 과 200 을 같게 취급하면 됩니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 그런 `dogId` 가 없거나 내 반려동물이 아닙니다. 두 경우를 구분하지 않습니다.

  /api/walks/{walkId}:
    get:
      tags: [Walks]
      summary: 산책 상세(경로 포함)
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 산책
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            **없는 산책과 남의 산책이 똑같이 404 입니다.** 403 을 주면 "그 id 는 존재한다" 를
            알려 주는 셈이라, id 를 훑어 남의 기록 수를 셀 수 있습니다. 응답 본문도 같습니다.
    delete:
      tags: [Walks]
      summary: 산책 기록 삭제
      description: |
        멱등키(`clientWalkId`)가 있어 같은 산책을 두 번 저장할 수는 없으므로,
        **잘못 저장한 것을 사용자가 지울 길이 반드시 있어야 합니다.**
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 산책과 남의 산책이 똑같이 404 입니다(위 `get` 과 같은 이유).

  /api/walks/{walkId}/memo:
    put:
      tags: [Walks]
      summary: 산책 회고 글 교체
      description: |
        산책 한 건의 회고 글을 **통째로 바꿉니다.**

        `PATCH /api/walks/{walkId}` 가 아닌 이유는 PATCH 가 *"필드를 안 보냈다"* 와
        *"null 로 지워라"* 를 구분해야 하는데, 바꿀 필드가 하나뿐이라 그 복잡도가 값을
        못 하기 때문입니다. 하위 리소스 PUT 이면 뜻이 하나입니다 — **"메모를 이 값으로
        바꾼다"**. `PUT /api/groups/{groupId}/walk-notes` 가 같은 모양이고 같은 이유입니다.

        **빈 문자열은 "다 지웠다" 는 정상 요청입니다** — 400 이 아닙니다. 서버는 그것을
        `null` 로 눕혀 저장합니다. 저장 경로(`POST /api/walks`)가 안 보낸 메모를 `null` 로
        두므로, `""` 를 그대로 두면 "안 썼다" 가 두 모양이 되어 화면이 한쪽을 빠뜨립니다.

        **거리·시간·경로는 바꿀 수 없습니다.** 실측값이거나 사용자가 저장 시점에 정한
        값이고, 여기서 열면 "회고를 쓴다" 가 "기록을 고친다" 로 번집니다.

        응답은 **바뀐 뒤의 산책**이고 경로가 실립니다 — 이 응답을 받는 곳이 상세 화면이라
        다시 조회하지 않아도 화면을 갱신할 수 있어야 합니다.

        `walk-write` 버킷(rate limit)에 등록된 경로입니다.
      parameters:
        - name: walkId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkMemoInput' }
      responses:
        '200':
          description: 교체 후 최신 산책(경로 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Walk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 산책과 남의 산책이 똑같이 404 입니다(위 `get` 과 같은 이유).
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/walks/stats/weekly:
    get:
      tags: [Walks]
      summary: 산책 통계(이번 주 + 전체 기간)
      description: |
        **한 번의 호출로 두 기간을 줍니다.** 화면이 둘 다 필요합니다 —
        `me_screen` 은 "총 산책 / 총 거리 / 이번주" 를 한 카드에 나란히 놓고,
        `myrecords_screen` 은 전체 기간의 거리·횟수·시간을 셉니다.
        엔드포인트를 나누면 화면 하나가 두 번 부르고 요청 제한 항목도 하나 늘어납니다.

        경로 이름에 `weekly` 가 남아 있는 것은 이미 쓰이고 있어서입니다.
      parameters:
        - name: dogId
          in: query
          description: 생략하면 내 반려동물 전체를 합칩니다.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 이번 주(월~일) + 전체 기간 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Community ───────────────────────────
  /api/community/posts:
    get:
      tags: [Community]
      summary: 게시글 목록
      description: |
        **인증은 선택입니다.** 토큰이 없으면 공개 목록이고, 있으면 `reactions.mine` 이 채워집니다.

        2026-09 이전에는 `security: []` 였습니다. 그것은 인증을 계약에서 **제거**하는 선언이라
        서버가 토큰을 읽지 않아야 하고, 그러면 `mine` 은 영원히 `null` 인 죽은 필드가 됩니다 —
        그런데 게스트 읽기는 취향이 아니라 MVP 정의(`mvp-scope.md`)이므로, 지워야 할 것은
        `mine` 이 아니라 `security: []` 였습니다. ADR-0017 규약 6.
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - name: board
          in: query
          description: 게시판(생략 시 전체)
          schema: { $ref: '#/components/schemas/Board' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            게시글 목록(커서 페이지네이션).

            **최신순입니다** — `(createdAt, id)` 내림차순. 두 축인 이유는 같은 초에 쓰인 두 글이
            페이지 경계에 걸리면 커서가 하나를 건너뛰거나 두 번 주기 때문입니다.

            아래 댓글 목록과 **방향이 반대**인 것은 의도입니다. 피드는 새 글을 먼저 보고,
            스레드는 위에서 아래로 읽습니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Community]
      summary: 게시글 작성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostInput' }
      responses:
        '201':
          description: 작성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/community/posts/{postId}:
    get:
      tags: [Community]
      summary: 게시글 상세
      description: 인증은 선택입니다 — 있으면 `reactions.mine` 이 채워집니다(ADR-0017 규약 6).
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 게시글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Community]
      summary: 게시글 수정
      description: |
        **내가 쓴 글만 고칩니다.** 남의 글은 `404` 가 아니라 `403` 입니다 — 삭제와 같은 이유로,
        글은 누구나 읽을 수 있어서 존재가 이미 공개입니다(아래 `delete` 설명 참조).

        보낸 키만 바뀝니다. 하나도 안 보내면 `400` 입니다 — 아무 일도 안 하면서 `200` 을
        주면 그건 "고쳐졌다" 로 읽힙니다(`PostPatch.minProperties: 1`).

        **실제로 값이 바뀐 경우에만 `updatedAt` 이 생깁니다.** 같은 값을 다시 보내는 것은
        수정이 아닙니다.

        **`board` 를 바꾸면 글이 다른 게시판으로 옮겨 갑니다.** 잘못 고른 게시판을 고치는
        것이 이 필드가 있는 이유입니다.

        응답은 `Post` 전체입니다 — 부분 수정이라도 화면은 갱신된 글 전체를 그려야 하고,
        `commentCount`·`reactions` 는 그 사이 남이 바꿨을 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostPatch' }
      responses:
        '200':
          description: 고쳐진 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: 게시글 삭제
      description: |
        **내가 쓴 글만 지웁니다.**

        **댓글과 반응이 함께 사라집니다** — `fk_comment_post`·`fk_reaction_post` 가
        `ON DELETE CASCADE` 입니다. 부모 없는 행을 남기면 어느 목록에도 안 뜨면서 자리만
        차지하고, 나중에 세면 댓글 수가 맞지 않는데 왜 안 맞는지 아무도 모릅니다
        (`14_community.sql` §D).

        남의 댓글이 함께 사라지는 것은 의도입니다 — 글이 없으면 그 댓글은 읽을 맥락이
        없습니다. `users` 로 가는 FK 가 `SET NULL` 인 것과는 다른 판단인데, 거기서는
        **글이 남아 있고** 작성자만 사라지는 것이라 남의 댓글이 읽힐 자리가 있습니다.

        **남의 글은 `404` 가 아니라 `403` 입니다.** `Dogs`·`Walks` 는 404 로 합치지만
        (ADR-0017 규약 3 — "남의 것과 없는 것이 구별되지 않는다") 커뮤니티는 반대입니다.
        글은 **누구나 읽을 수 있어서 존재가 이미 공개**라, 404 로 숨겨도 방금 `GET` 으로 본
        것을 숨기는 셈이고 아무것도 못 가립니다. 대신 사용자가 "지웠는데 사라지지 않았다" 로
        읽습니다.

        **탈퇴한 사람의 글은 아무도 못 지웁니다**(`author.userId == 0`). 주인이 없는 글을
        아무나 지울 수 있게 하면 그것이 곧 관리 권한이고, 그 결정은
        [#166](https://github.com/sanghyunbang/heattrip/issues/166) 이 갖고 있습니다.

        수정(`PATCH`)은 아직 없습니다.
      responses:
        '204':
          description: 지워짐
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Community]
      summary: 댓글 목록
      description: |
        인증은 선택입니다(ADR-0017 규약 6).

        **커서 봉투입니다.** 2026-09 이전에는 벌거벗은 배열이었고 `cursor`/`limit` 파라미터조차
        없었습니다 — 댓글은 인기글에서 무한정 커지는데 한 번에 전부 내려보내는 계약이었습니다.
        배열로 내보낸 뒤 봉투로 바꾸는 것은 파괴적 변경이라, **구현이 붙기 전인 지금이 유일하게
        공짜인 시점**입니다. ADR-0017 규약 2.
      security:
        # 인증 선택 — 없으면 공개 목록, 있으면 reactions.mine 이 채워집니다(ADR-0017 규약 6).
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: |
            댓글 목록(커서 페이지네이션).

            **오래된 것부터입니다** — `(createdAt, id)` 오름차순. 스레드는 위에서 아래로
            읽으므로 글 목록과 방향이 반대입니다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Community]
      summary: 댓글 작성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 1000
                  example: "저도 여기 자주 가요! 정보 감사합니다 🐾"
                  description: |
                    글보다 짧습니다. 댓글은 스레드에서 다른 댓글들과 함께 읽히는 것이라,
                    한 줄이 화면을 다 먹으면 스레드가 아니게 됩니다.
      responses:
        '201':
          description: 작성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Community]
      summary: 댓글 삭제
      description: |
        **내가 쓴 댓글만 지웁니다.** 글 주인이라도 남의 댓글은 못 지웁니다 — 그건 관리이고
        그 결정은 [#166](https://github.com/sanghyunbang/heattrip/issues/166) 이 갖고 있습니다.
        여기서 미리 열면 신고·차단 모양이 정해질 때 두 벌이 됩니다.

        `commentId` 가 그 글의 댓글이 아니면 **404** 입니다 — 경로가 가리키는 것이 없다는
        뜻이지 권한 문제가 아닙니다.

        **남의 글은 `404` 가 아니라 `403` 입니다.** `Dogs`·`Walks` 는 404 로 합치지만
        (ADR-0017 규약 3 — "남의 것과 없는 것이 구별되지 않는다") 커뮤니티는 반대입니다.
        글은 **누구나 읽을 수 있어서 존재가 이미 공개**라, 404 로 숨겨도 방금 `GET` 으로 본
        것을 숨기는 셈이고 아무것도 못 가립니다. 대신 사용자가 "지웠는데 사라지지 않았다" 로
        읽습니다.
      responses:
        '204':
          description: 지워짐
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/community/posts/{postId}/reports:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Community]
      summary: 글 신고
      description: |
        글을 신고합니다.

        **신고 시점의 사본이 함께 저장됩니다** — 제목·본문·작성자·작성 시각까지 벱니다.
        참조만 남기면 작성자가 글을 지우는 순간 운영자가 무엇을 판단해야 하는지 알 수
        없습니다. 채팅 신고가 같은 이유로 본문 사본을 남깁니다.

        **내가 쓴 글은 신고할 수 없습니다** — `400` `REPORT_SELF`. 자기 글 신고는 실수이거나
        신고 수를 부풀리는 것이고, 둘 다 운영자가 세는 숫자를 흐립니다.

        **탈퇴한 사람의 글은 신고할 수 있습니다.** 글은 남아 있고, 그 글이 문제라는 사실은
        작성자가 떠난 것과 무관합니다.

        **같은 글을 여러 번 신고할 수 있습니다.** 글은 수정되기 때문입니다(`PATCH`, #211) —
        막으면 작성자가 신고 뒤 본문을 더 나쁜 것으로 고쳤을 때 재신고가 안 되고, 운영자에게
        남는 기록은 **고치기 전 본문**뿐입니다. 도배는 `community-report` 버킷(분당 10)이
        막습니다. 이 버킷은 커뮤니티 쓰기(60)와 **따로**입니다 — 합치면 글을 쏟아부어 신고를
        막을 수 있습니다.

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/community/posts/{postId}/comments/{commentId}/reports:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: commentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Community]
      summary: 댓글 신고
      description: |
        댓글을 신고합니다. 규칙은 글 신고와 같습니다(위 절 참조).

        **부모 글이 맥락으로 함께 저장됩니다.** 댓글 한 줄만 남으면 운영자가 무슨 글에 달린
        말인지 모르고, 글을 지우면 `fk_comment_post` 가 `ON DELETE CASCADE` 라 댓글이 함께
        사라져 되짚을 수도 없습니다. 채팅 신고가 같은 이유로 앞뒤 `roomSeq` 범위를 남깁니다.

        `commentId` 가 그 글의 댓글이 아니면 **404** 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReceipt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/community/posts/{postId}/reactions/{type}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReactionType' }
    post:
      tags: [Community]
      summary: 반응 누르기(도움돼요/귀여워요/공감)
      description: |
        **셋을 동시에 누를 수 있습니다.** 도움돼요·귀여워요·공감은 서로 배타적인 개념이 아닙니다 —
        한 글이 도움도 되고 귀엽기도 합니다(ADR-0016 결정 2).

        **멱등입니다** — 이미 눌러 뒀어도 `200` 이고 집계가 늘지 않습니다.
        2026-09 이전에는 `POST .../reactions` 하나가 **토글**이었습니다. 요청에 의도가 없어서
        **네트워크 재시도 한 번이 사용자의 반응을 조용히 되돌렸습니다.**

        모양은 `POST /api/blocks` + `DELETE /api/blocks/{userId}` 와 같습니다 —
        집합 원소를 자원으로 켜고 끕니다.

        응답에 **최신 집계**를 실어 왕복을 한 번으로 줄입니다.
      responses:
        '200':
          description: 반응 반영 후 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: 반응 취소
      description: |
        **멱등입니다** — 안 눌렀던 것을 취소해도 `200` 입니다. 없던 것과 있던 것을 상태 코드로
        나누면 앱이 두 갈래를 다뤄야 하는데 **사용자에게는 결과가 같습니다.**
      responses:
        '200':
          description: 반응 반영 후 최신 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Bookmarks ───────────────────────────
  /api/bookmarks:
    get:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 heattrip 의 `/bookmarks` 는 경로도 스키마도 다른 별개 기능이고 이 계약의 범위 밖이다 — #94 의 레거시 셸 결정을 기다린다.
      tags: [Bookmarks]
      summary: 저장한 장소 목록
      description: |
        **커서 봉투입니다.** 2026-09 이전에는 벌거벗은 배열이었습니다 — 북마크는 사용자가
        계속 쌓는 목록이라 상한이 없고, 배열로 내보낸 뒤 봉투로 바꾸는 것은 파괴적 변경입니다.
        구현이 붙기 전인 지금이 유일하게 공짜인 시점입니다. ADR-0017 규약 2.

        **담은 순서의 역순입니다** — `(createdAt, id)` 내림차순. 두 축인 이유는 같은 초에
        둘을 담으면 한 축으로는 순서가 매 요청 달라지기 때문입니다(글 목록과 같은 규약).

        **`items` 가 `Bookmark` 가 아니라 `Place` 인 것은 의도입니다.** 목록 화면이 제목·
        사진·주소를 그리므로 식별자만 주면 앱이 장소마다 상세를 한 번씩 더 불러야 하고,
        그건 KTO 예산을 태웁니다. 담은 시각은 응답에 없습니다 — **정렬을 서버가 이미
        했으므로** 클라이언트가 다시 셀 이유가 없습니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 북마크한 장소(커서 페이지네이션)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 `/bookmarks` 와 다른 기능이다 — #94.
      tags: [Bookmarks]
      summary: 장소 북마크 추가
      description: |
        키는 **`contentId`** 입니다 — `Place.contentId` 와 같은 값입니다.
        2026-09 이전에는 `placeId` 라는 다른 이름이었습니다(ADR-0017 이 `contentId` 로 통일).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId]
              properties:
                contentId: { type: string }
      responses:
        '201': { description: 추가됨 }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/bookmarks/{contentId}:
    delete:
      x-status: planned
      x-status-note: |
        v2(반려) 북마크는 아직 없다. 레거시 `/bookmarks/{contentId}` 와 다른 기능이다 — #94.
      tags: [Bookmarks]
      summary: 북마크 삭제
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: |
            삭제됨. **멱등입니다 — 없는 북마크를 지워도 `204`** 이고 `404` 가 아닙니다.

            하트는 토글이라 사용자가 같은 것을 두 번 누르거나, 다른 기기에서 이미 지운
            것을 다시 지웁니다. 거기서 `404` 를 주면 이미 원하는 상태(없음)인데 에러
            토스트만 뜹니다. 구현도 이미 그렇습니다(`deleteByUserAndContentId`).
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Groups ───────────────────────────
  /api/groups:
    post:
      tags: [Groups]
      summary: 가족 그룹 생성
      description: |
        가족 그룹을 만듭니다. 가족 간 케어 공유로 이중 급여(밥 두 번)·산책 누락을 막는
        기능의 시작점입니다.

        **같은 트랜잭션에서 방(`chat_room`)과 방장 멤버십(`chat_room_member`, `role=OWNER`)이
        함께 생깁니다.** 방이 없으면 초대코드를 발급할 사람이 없어 아무도 못 들어오므로,
        "방 없는 그룹" 은 만들어질 수 없는 상태입니다.

        **초대코드는 여기서 발급하지 않습니다.** 응답의 `roomId` 를 가지고
        `POST /api/chat/rooms/{roomId}/invites` 로 발급합니다. 2026-08 이전에는 이 경로가
        "그룹을 만들고 초대코드를 발급합니다" 였고 응답에 `inviteCode` 가 실렸습니다 —
        [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72) 이 초대코드를 방으로
        옮기면서 옛 모양이 되었고 이슈 #75 가 정리했습니다.

        **이미 가족 그룹에 속해 있으면 409 입니다.** 두 번 만들면 두 번째 그룹을
        `GET /api/groups/me` 가 영원히 보여주지 않아(이 경로는 참여 순서로 하나만
        돌려줍니다) 사용자가 존재도 삭제도 모르는 행이 됩니다. 생성 응답이 타임아웃돼
        클라이언트가 재시도하는 것이 이 상황이 실제로 벌어지는 모양이고, 참여 경로가
        멱등을 보장하는 것과 같은 이유로 여기도 막습니다. 방을 여럿 갖는 것이 계약이 되는
        `GET /api/chat/rooms`(M2.6)에서 이 제한을 다시 판단합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  description: 1~50자. 방 이름도 같은 값이 됩니다
                  example: "보리네 가족"
      responses:
        '201':
          description: 생성됨(방 id · 멤버 목록 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/groups/me:
    get:
      tags: [Groups]
      summary: 내 그룹 조회(멤버 목록 포함)
      description: |
        내가 속한 가족 그룹과 멤버 목록을 반환합니다. 속한 그룹이 없으면 404.

        멤버십의 출처는 `chat_room_member` 입니다 — `group_member` 표는 만들지 않습니다
        ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).

        **둘 이상의 가족에 속해 있으면 가장 먼저 참여한 그룹**을 돌려줍니다. 이 경로가
        단수인 것은 화면이 가족방 하나를 전제하기 때문이고, 방이 여럿인 화면은
        `GET /api/chat/rooms`(M2.6)가 답합니다.
      responses:
        '200':
          description: 내 그룹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/{groupId}/care-logs:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 오늘의 케어 조회
      description: |
        그룹의 케어 기록(물/밥/산책/투약/병원)을 조회합니다. 기본은 **오늘**이고, 누가·언제
        했는지를 가족이 함께 봅니다. 이른 것부터 오름차순입니다.

        **요청자가 그 그룹의 방 멤버가 아니면 403 입니다.** 멤버십의 유일한 원본은
        `chat_room_member` 이고([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)
        결정 1) `family_group` 에는 사용자 컬럼 자체가 없습니다. 없는 `groupId` 도 404 가
        아니라 403 입니다 — 404 로 답하면 id 를 훑어 "있는 가족/없는 가족" 을 가려낼 수 있고,
        가족의 존재 여부는 그 가족에게만 의미가 있는 정보입니다.

        **"오늘" 은 서버 시계의 로컬 날짜입니다.** 지금 운영·개발 모두 KST 라 지금은 KST 입니다.
        기록 시각(`occurredAt`)도 같은 시계에서 나오므로 둘이 어긋나지 않습니다.
      parameters:
        - name: date
          in: query
          description: 조회 날짜(생략 시 오늘)
          schema: { type: string, format: date, example: "2026-07-10" }
        - name: type
          in: query
          description: 케어 종류 필터(생략 시 전체)
          schema: { $ref: '#/components/schemas/CareType' }
      responses:
        '200':
          description: 케어 기록 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CareLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Groups]
      summary: 케어 기록 남기기
      description: |
        물/밥/산책 등을 기록합니다. **수행자(`doneBy`)와 시각(`occurredAt`)은 서버가 정합니다** —
        본문으로 받으면 남의 이름으로 기록을 남기거나 오늘 기록을 어제로 밀 수 있고, 그러면
        화면의 "아빠가 줬습니다" 를 믿을 수 없게 됩니다.

        **같은 종류를 오늘 이미 누가 찍었어도 거절하지 않습니다.** 두 번째가 실수인지 사실인지
        서버는 모릅니다 — 아침·저녁 두 번 주는 집에서 두 번째 밥은 정상이고, 막으면 실제로 한
        일이 기록에서 사라집니다. 확인 문구("오늘 14:20 아빠가 밥을 줬습니다. 그래도
        기록할까요?")는 **앱이 `GET` 응답을 보고 만듭니다** — 그 목록에 답이 이미 들어 있는데
        여기에 "이미 있음" 필드를 더하면 같은 사실의 출처가 둘이 됩니다.

        `group-write` 버킷(rate limit)에 등록된 경로입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareLogInput' }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/groups/{groupId}/walk-notes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 산책 주의사항 조회(가족 공유 메모 한 장)
      description: |
        그룹의 산책 주의사항을 돌려줍니다. **그룹당 한 장**이라 배열이 아니라 객체입니다.

        **아직 아무도 안 썼으면 404 가 아니라 `body: ""` 입니다.** "아직 없다" 는 정상 상태이고,
        404 로 답하면 앱이 오류 화면과 빈 화면을 상태 코드로 갈라야 해서 네트워크 실패가 같은
        자리에서 만납니다. 그때 `updatedBy`·`updatedAt` 은 `null` 입니다.

        인가는 `care-logs` 와 같습니다 — 그 그룹의 방 멤버가 아니면 403.
      responses:
        '200':
          description: 주의사항 한 장(없으면 빈 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Groups]
      summary: 산책 주의사항 전체 교체
      description: |
        메모를 통째로 바꿉니다. 있으면 고치고 없으면 만듭니다. 본문·고친 사람·고친 시각이
        **함께** 바뀝니다.

        **본문은 `{"body": "..."}` 하나입니다.** 2026-08 이전 계약은 `{"notes": ["...", "..."]}`
        목록 전량 교체였는데, 그러면 PUT 때마다 행을 지우고 다시 넣게 되어 행마다 붙는
        `updatedBy` 가 아무것도 가리키지 않습니다. 이슈 #76 이 표를 **그룹당 한 장**으로
        정하면서 계약도 맞췄습니다. 앱이 줄 단위 목록으로 그리는 것은 화면의 표현이고, 보낼
        때는 편집된 전체 본문을 보냅니다.

        빈 문자열은 "다 지웠다" 는 정상 요청입니다 — 행을 지우지 않습니다. 지우면 "한 번도 안
        쓴 그룹" 과 구별되지 않습니다.

        `group-write` 버킷(rate limit)에 등록된 경로입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkNoteInput' }
      responses:
        '200':
          description: 교체 후 최신 한 장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkNote' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────── Chat ───────────────────────────
  /api/chat/rooms:
    get:
      tags: [Chat]
      summary: 내 방 목록
      description: |
        내가 속한 방을 돌려줍니다. 방마다 미읽음은 `lastSeq − lastReadSeq` **뺄셈**입니다 —
        두 값 모두 이 조회가 이미 읽어 오는 컬럼이라 추가 쿼리가 0입니다.

        방 종류를 가리지 않습니다 — 채팅은 가족 그룹 종속이 아니라 범용 다중 방입니다
        ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).
        **`roomId` 를 받지 않으므로 403 이 없습니다.** 답의 범위 자체가 내 멤버십이라
        남의 방이 섞여 들어올 문이 없고, 강퇴된(`removed_at`) 방도 빠집니다.

        `lastMessage` 는 아직 아무 말도 없는 방에서 `null` 입니다. `isDefault` 와 `members`
        는 이 응답에 **없습니다** — 앞의 것은 "가족방이 기본" 이라는 판단이라 chat 이 답할 수
        없고, 뒤의 것은 방 상세 조회에만 실립니다.
      responses:
        '200':
          description: 방 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      x-status: planned
      x-status-note: |
        방 상세 단건 조회는 아직 없다. 앱은 `GET /api/chat/rooms` 목록에서 방을 고른다.
      tags: [Chat]
      summary: 방 상세(멤버 목록 · 내 lastReadSeq · 역할)
      responses:
        '200':
          description: 방 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Chat]
      summary: 메시지 목록(폴링 · 과거 스크롤 겸용)
      description: |
        `afterSeq`(델타)와 `beforeSeq`(과거) **둘 중 하나**에 `limit` 을 붙입니다.
        둘 다 주면 400, 둘 다 없으면 **최신 `limit` 건**입니다. 응답은 공용 `Page` 가 아니라
        `{ items, lastSeq, hasMore }` 입니다 — 커서가 `roomSeq` 이고, 미읽음 계산이
        `lastSeq` 를 필요로 하기 때문입니다.

        **`items` 는 어느 방향으로 넘겼든 `roomSeq` 오름차순입니다.** 방향에 따라 순서가
        갈리면 클라이언트가 어느 파라미터를 보냈는지에 따라 정렬을 달리해야 하고, 그 분기를
        한 번 빠뜨리면 대화가 거꾸로 그려집니다.

        **삭제된 메시지도 톰스톤으로 들어 있습니다**(`deletedAt` 이 `null` 이 아닌 항목).
        거르면 그 `roomSeq` 가 클라이언트에 도달하지 않아 읽음 커서가 넘지 못하고 미읽음
        뱃지가 영원히 남습니다([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).

        ### ETag — 서버가 직접 계산합니다

        `ETag: "{roomId}:{lastSeq}"` 는 **`afterSeq` 를 보냈고 `hasMore` 가 `false` 인 응답에만**
        붙습니다. 그 응답만이 "이제 `lastSeq` 까지 전부 손에 넣었다" 를 뜻하기 때문입니다.
        첫 장(`hasMore: true`)·첫 진입(커서 없음)·과거 스크롤(`beforeSeq`) 응답에는 **ETag 가
        없습니다** — 그 응답들은 방의 끝까지 준 것이 아닌데 방의 끝을 가리키는 표를 달면
        그건 거짓말이고, 실제로 그 다음 폴링이 빈 `304` 로 막혀 **그 사이 메시지를 통째로
        잃습니다**(60줄 방에서 실측했습니다). `ShallowEtagHeaderFilter` 가 아니라 `chat_room`
        한 행만 읽어 만드는 값이라, 304 로 끝나는 폴링은 메시지 조회 자체를 하지 않습니다.

        `If-None-Match` 로 되보내면 **세 가지가 모두 참일 때만** `304` 입니다 —
        ① 인가를 통과했다(먼저 확인합니다. 순서가 뒤집히면 남의 방 `lastSeq` 를 304/200 차이로
        알아낼 수 있습니다), ② `afterSeq` 를 함께 보냈다(폴링이다), ③ `afterSeq >= lastSeq`
        다(실제로 줄 것이 없다).

        ⚠️ 서버 구현 메모: 응답에 ETag 가 붙어 있으면 **스프링 MVC 가 위 판단과 무관하게
        `If-None-Match` 를 스스로 대조해 200 을 304 로 갈아치웁니다**. 그래서 ③ 을 코드에
        적어 두는 것만으로는 부족하고, 위처럼 **부분 페이지에 ETag 를 붙이지 않는 것**이
        실제 방어입니다.
      parameters:
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/BeforeSeq'
        - $ref: '#/components/parameters/ChatLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 메시지 목록
          headers:
            ETag:
              description: |
                `"{roomId}:{lastSeq}"`. 다음 폴링에 `If-None-Match` 로 그대로 되보냅니다.
                **`afterSeq` 를 보냈고 `hasMore` 가 `false` 인 응답에만 붙습니다** — 그
                응답만이 "`lastSeq` 까지 전부 받았다" 를 뜻합니다.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '304':
          description: |
            새 메시지가 없습니다. **본문이 없습니다** — 그게 이 최적화의 전부입니다.
            `afterSeq` 를 보낸 폴링 요청에만 나갑니다. 첫 진입(커서 없음)과 과거
            스크롤(`beforeSeq`)은 옛 ETag 를 들고 와도 `200` 입니다 — 그 응답들에는 애초에
            ETag 가 붙지 않으므로 대조할 것이 없습니다.
          headers:
            ETag:
              description: 되보낸 값과 같습니다
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chat]
      summary: 메시지 전송
      description: |
        `clientMsgId` 는 **멱등키**입니다. 전송은 재시도 가능한 POST 인데 사용자가 답답해
        다시 누르면 같은 메시지가 두 번 들어갑니다 — 서버가
        `UNIQUE (room_id, sender_user_id, client_msg_id)` 로 받치고, **같은 사람이** 같은
        키로 다시 보내면 처음 배정한 `roomSeq` 를 그대로 돌려줍니다.

        **범위는 방이 아니라 "이 방에서의 나" 입니다.** 같은 방의 다른 멤버가 우연히 같은
        키를 써도 서로의 메시지를 지우지 않습니다 — 범위가 방 전체이던 판에서는 뒤에 보낸
        사람이 200 과 함께 **남의 메시지**를 돌려받고 자기가 하려던 말은 어디에도 남지
        않았습니다.

        **처음이면 `201`, 재전송이면 `200`입니다. `409` 가 아닙니다** — 재시도한 클라이언트
        입장에서 그 요청은 성공했고, 실제로 그 말은 방에 들어가 있습니다. 409 를 주면 앱은
        실패 화면을 띄우면서 정작 메시지는 보이는 상태가 됩니다. 두 응답의 본문은 같습니다.

        `clientMsgId` 를 **생략하면 멱등을 요구하지 않는 전송**입니다 — 같은 본문이라도 두
        줄이 됩니다(`UNIQUE` 는 `NULL` 을 겹침으로 보지 않습니다).

        201 응답에 배정된 `roomSeq` 가 실립니다. 발급(`chat_room.last_seq` 증가)과 INSERT 는
        **하나의 트랜잭션**이라, 거절된 전송은 번호를 태우지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  description: |
                    비어 있으면 400 입니다. 길이 상한은 **문자가 아니라 UTF-8 바이트 65,535**
                    입니다 — 컬럼이 `TEXT` 라서 그렇고, 한글은 3바이트라 22,000자면 이미 넘습니다.
                    넘으면 400 입니다(예전에는 500 이 나갔습니다).
                  example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶"
                clientMsgId:
                  type: string
                  maxLength: 64
                  description: |
                    클라이언트가 만드는 멱등키. `Random.secure()` 16바이트 → base64url 이며
                    `uuid` 패키지를 쓰지 않습니다(신규 의존성 0).
                    `chat_message.client_msg_id varchar(64)` 와 같은 폭이고, 넘으면 400 입니다.
                  example: "Zm9vYmFyLWlkZW1wb3RlbmN5"
                contentType:
                  type: string
                  default: text
                  maxLength: 16
                  description: 생략하면 `text`. `chat_message.content_type varchar(16)` 폭을 넘으면 400 입니다
      responses:
        '201':
          description: 전송됨(배정된 roomSeq 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '200':
          description: |
            같은 `clientMsgId` 의 **재전송**입니다. 새로 만들지 않고 처음 만들어진 메시지를
            그대로 돌려줍니다 — `roomSeq` 도 처음 배정된 값입니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/read:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 읽음 워터마크 올리기
      description: |
        `lastReadSeq` 를 올립니다. **단조 증가만** 합니다 — 서버가
        `GREATEST(last_read_seq, :seq)` 로 쓰고 `LEAST(:seq, room.last_seq)` 로 상한을 겁니다.
        읽음 보고는 재시도·백그라운드 복귀로 순서가 뒤집혀 도착하고, 뒤늦게 온 작은 값이 큰
        값을 덮으면 이미 읽은 메시지가 다시 미읽음으로 뜹니다. 상한이 없으면 뺄셈이 음수가 됩니다.

        **응답은 보낸 값이 아니라 서버가 실제로 쓴 값입니다.** 무시됐는지(뒤로 가는 값)
        잘렸는지(방의 끝을 넘는 값) 앱이 알아야 낙관적으로 그린 뱃지를 되맞출 수 있습니다.
        `lastReadSeq` 가 없으면 400 입니다 — 빠진 필드를 0 으로 채우면 `{}` 라는 본문이
        "0 까지 읽었다" 라는 정상 요청이 됩니다. 음수도 400 입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadSeq]
              properties:
                lastReadSeq: { type: integer, format: int64, example: 142 }
      responses:
        '200':
          description: 갱신된 워터마크
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastReadSeq: { type: integer, format: int64 }
                  unread: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/invites:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 초대코드 발급
      description: |
        방장(`OWNER`)만 발급합니다. 기본값은 **7일 · 사용 횟수 무제한**입니다.
        회수(`DELETE`)하면 그 코드는 즉시 `revokedAt` 이 찍히고 **기존 멤버는 그대로
        남습니다** — 코드가 유출됐을 때의 대응 수단입니다.

        **이 경로를 다시 부르는 것(재발급)은 이전 코드를 죽이지 않습니다.** 부를 때마다
        새 코드가 하나 더 생기고, 이전 코드는 자기 TTL 동안 독립된 열쇠로 삽니다. 앱에서
        "새 코드 발급" 을 유출 대응 버튼으로 만들지 마세요 — 그 버튼은 아무것도 막지
        않습니다. 막는 것은 `DELETE` 뿐입니다.

        코드는 `SecureRandom` 으로 만들고 헷갈리는 글자(`0`·`O`·`1`·`I`)를 뺀 **32글자**
        (`23456789ABCDEFGHJKLMNPQRSTUVWXYZ`) 중에서 10글자를 뽑아 다섯 글자씩
        끊습니다(`A2C4E-F6H8K`). 손으로 옮겨 적을 수 있어야 하기 때문입니다.
        **`L` 은 들어 있습니다** — 다섯 글자를 다 빼면 31글자가 되어 "글자당 5비트"
        라는 길이 근거가 무너지고, `L` 을 헷갈리게 만드는 짝(`1`·`I`)이 이미 빠져
        있습니다. 2026-08 이전에는 이 문장이 `L` 도 뺐다고 적었는데, 그대로 입력
        검증기를 만들면 실제 코드의 약 27%가 거절됩니다(이슈 #75).

        **본문을 받지 않습니다.** 유효기간·사용 횟수를 정하는 곳은 서버의 한도 표
        하나입니다 — 클라이언트가 값을 보내기 시작하면 한도의 출처가 둘이 되고, 서버가
        "유효기간 무한" 요청을 막는 코드를 따로 써야 합니다. 그 문은 요금제가 생기는 날
        엽니다. 2026-08 이전에는 이 자리에 `expiresAt`·`maxUses` 를 받는 선택 본문이
        적혀 있었습니다(이슈 #75).

        방장이 아니거나 **이 방의 멤버가 아니면 403** 입니다. 404 가 아닌 것은 의도입니다 —
        404 로 답하면 남의 방 id 를 훑어 있는 방과 없는 방을 가려낼 수 있습니다.
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatInvite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/invites/{code}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: code
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Chat]
      summary: 초대코드 폐기
      description: |
        방장만. 폐기한 `code` 는 UNIQUE 라 다시 만들어 쓰지 않습니다.

        **행을 지우지 않고 `revokedAt` 을 찍습니다.** 지우면 "회수된 코드" 와 "없던 코드" 가
        구별되지 않아 410(`INVITE_REVOKED`)과 404 가 한 덩어리가 됩니다 — 유출된 코드를
        회수한 방장이 "이 링크는 이제 안 됩니다" 를 확인할 방법도 함께 사라집니다.
        (#9 의 `refresh_token` 이 같은 이유로 폐기를 삭제로 하지 않습니다.)

        이미 회수된 코드를 다시 회수해도 204 입니다 — 최초 회수 시각을 덮어쓰지 않습니다.
      responses:
        '204': { description: 폐기됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/invites/{code}/join:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Chat]
      summary: 초대코드로 입장
      description: |
        재입장 금지 대상(`rejoinBlocked`)이면 **403** 입니다 — 강퇴가 그것을 찍습니다.

        **만 14세 미만**(`users.age_group = 'UNDER14'`)은 **가족 방에만** 참여할 수 있습니다.
        다른 종류의 방이면 403 입니다. 신청 창구는 없습니다. 나이대가 비어 있는 계정
        (소셜 로그인으로 들어온 예전 계정)은 **막지 않습니다** — 여기서 미성년으로 다루면
        그 계정들이 아무 예고 없이 방에 못 들어가게 됩니다.

        한도·상태 위반은 봉투를 새로
        만들지 않고 공통 `Error` 의 `error.code` 로 갈립니다 — `ROOM_MEMBER_LIMIT`(409) ·
        `INVITE_EXPIRED`(410) · `INVITE_REVOKED`(410) · `INVITE_USES_EXHAUSTED`(409).

        **검사 순서가 계약입니다.** ① 없는 코드 404 → ② 만료 410 → ③ 회수 410 →
        ④ **이미 멤버면 200** → ⑤ 사용 횟수 소진 409 → ⑥ 정원 409.
        ④ 가 ⑤·⑥ 보다 앞인 이유는 그 둘이 "자리를 하나 새로 쓴다" 는 요청에 대한
        검사이기 때문입니다 — 이미 방에 있는 사람은 자리를 새로 쓰지 않습니다.
        반대로 만료·회수는 코드 자체의 상태라 **이미 들어와 있던 사람에게도** 같은 답을
        줍니다(그래도 그 사람의 멤버십은 그대로 남습니다).

        **멱등입니다.** 같은 사람이 같은 코드로 두 번 들어오면 멤버 행도 `usedCount` 도
        늘지 않고 200 입니다. 입장에 실패한 요청은 `usedCount` 를 쓰지 않습니다 —
        증가와 멤버 생성이 하나의 트랜잭션이기 때문입니다.

        만 14세 미만(`users.age_group = 'UNDER14'`) 계정은 **가족방 외의 방**에 들어올 수
        없습니다(M2.7). 방 안 대화는 건드리지 않습니다.
      responses:
        '200':
          description: 입장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: 만료·회수된 초대코드(`INVITE_EXPIRED` · `INVITE_REVOKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/members/me:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    delete:
      x-status: planned
      x-status-note: |
        방 나가기는 아직 없다. `ChatMemberController` 가 자기 javadoc 에 "여기 없다" 고 적어 둔 그 동작이다 — 강퇴(`members/{userId}`)와 다른 규칙이 필요하다.
      tags: [Chat]
      summary: 방 나가기
      responses:
        '204': { description: 나갔음 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 강퇴
      description: |
        방장만 합니다. 멤버 행을 **지우지 않고** `removedAt` · `removedBy` · `rejoinBlocked` 를
        찍습니다 — 미읽음이 그 행의 `lastReadSeq` 뺄셈이라 지우면 되돌릴 수 없고, 무엇보다
        **재입장 금지를 걸 자리가 사라집니다.**

        강퇴당한 사람의 **메시지는 남깁니다**(지우면 신고 근거가 사라집니다).

        강퇴 = **재입장 금지**입니다. 유효한 초대코드로도 못 들어옵니다(403). 방장이
        `DELETE /api/chat/rooms/{roomId}/bans/{userId}` 로 풉니다.

        **이미 나가 있어도 204** 입니다. 있고 없고를 상태 코드로 나누면 앱이 두 갈래를
        다뤄야 하는데 방장에게는 결과가 같습니다.

        **방장은 자기를 못 내보냅니다**(400). 허용하면 방장이 없는 방이 생기고, 그 방은
        초대코드도 못 내고 강퇴도 못 합니다. 떠나는 것은 `DELETE .../members/me` 입니다.
      responses:
        '204': { description: 강퇴됨. 이미 나가 있었어도 같습니다 }
        '400':
          description: 방장이 자기를 지목했습니다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/bans/{userId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 재입장 금지 해제
      description: |
        방장만 합니다. 강퇴 확인 문구가 "방 설정에서 다시 풀 수 있습니다" 라고 **약속하고**,
        이 경로가 그 약속을 지키는 자리입니다.

        **푸는 것은 금지뿐이고 멤버십은 아닙니다.** 풀어도 방에 자동으로 돌아오지 않고,
        그 사람이 초대코드로 다시 들어와야 합니다 — 자동으로 넣으면 방장이 "금지만 풀려고"
        누른 버튼이 사람을 방에 다시 넣는 버튼이 됩니다.

        금지 상태가 아니었어도 **204** 입니다.
      responses:
        '204': { description: 풀렸음 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      x-status: planned
      x-status-note: |
        메시지 삭제는 아직 없다. 지운 자리를 목록·커서에서 어떻게 다루는지가 먼저 정해져야 한다.
      tags: [Chat]
      summary: 메시지 삭제
      description: |
        **소프트 삭제**입니다(`deletedAt`). 행을 실제로 지우면 뺀 자리가 `roomSeq` 빈틈이 되어
        델타 폴링이 깨집니다.
      responses:
        '204': { description: 삭제됨 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/chat/rooms/{roomId}/reports:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Chat]
      summary: 메시지 신고
      description: |
        신고의 단위는 **메시지**이고 한 번에 최대 3개입니다. 서버가 본문 사본·발신자·발신 시각과
        **앞뒤 각 5개의 `roomSeq` 범위**를 스냅샷으로 남깁니다 — 원본 참조만 하면 지워졌을 때
        판단이 불가능합니다.

        **경로가 바뀌었습니다** (2026-08-31, 이슈 #82). 예전 선언은
        `POST /api/chat/messages/{messageId}/reports` 였는데, 경로가 메시지 하나를 지목하는
        모양이라 **"한 번에 최대 3개" 를 표현할 수 없었습니다.** 구현된 적이 없는 초안이었고,
        신고는 방 안에서 일어나므로 방을 경로로 잡고 메시지를 본문의 목록으로 받습니다.

        메시지를 `id` 가 아니라 **`roomSeq`** 로 지목합니다. 목록 조회도 폴링 커서도 전부
        `roomSeq` 라, 신고만 `id` 를 요구하면 앱이 좌표를 두 벌 들고 다녀야 합니다.

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.** 응답에는 접수 번호와
        시각만 있습니다 — 피신고자 id 도 돌려주지 않습니다.

        **자동 차단하지 않습니다.** 예전 초안의 `alsoBlock` 은 뺐습니다 — 차단 경로가 아직
        없어서 받아도 아무 일이 일어나지 않고, 받는 척하는 필드가 계약에 있으면 앱이 그것을
        믿습니다. 차단이 생기면 앱이 `POST /api/blocks` 를 **따로** 부릅니다.

        한도: `chat-report` 버킷 분당 10회.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomSeqs, reason]
              properties:
                roomSeqs:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: integer, format: int64 }
                  description: |
                    신고할 메시지의 방 안 번호. 같은 값을 여러 번 보내도 하나로 셉니다.
                reason: { $ref: '#/components/schemas/ReportReason' }
                memo:
                  type: string
                  maxLength: 500
                  description: 덧붙이는 말. 500자를 넘기면 잘립니다.
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema:
                type: object
                required: [reportId, createdAt]
                properties:
                  reportId: { type: integer, format: int64 }
                  createdAt: { type: string, format: date-time }
        '400':
          description: |
            `REPORT_EMPTY` · `REPORT_MESSAGE_LIMIT` · `REPORT_MIXED_SENDERS` ·
            `REPORT_SELF` · `REPORT_MESSAGE_NOT_FOUND` · `REPORT_REASON_UNKNOWN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/blocks:
    post:
      tags: [Chat]
      summary: 사용자 가리기
      description: |
        차단은 **가리기**입니다 — 그 사람의 **과거·미래** 메시지에 `hiddenByBlock: true` 가
        붙습니다. **삭제가 아닙니다**: 다른 사람 화면에는 그대로 남습니다.

        **목록에서 빼지 않습니다.** 예전 설명은 "목록에서 빼고 내려줍니다" 였는데 그러면 그
        `roomSeq` 가 도달하지 않아 **미읽음 뱃지가 영원히 남습니다** — 소프트 삭제를 톰스톤으로
        내려주는 것과 같은 이유입니다(ADR-0011). 2026-08-31 에 고쳤습니다(#82).

        방 단위가 아니라 **사람 단위**입니다. 경로에 방 id 가 없습니다.

        **이미 가려 뒀어도 201** 입니다. 없던 것과 있던 것을 상태 코드로 나누면 앱이 두 갈래를
        다뤄야 하는데 사용자에게는 결과가 같습니다.

        같은 방에 있는지도, 그 계정이 실재하는지도 **확인하지 않습니다.** 확인에 성공/실패하는
        것 자체가 "그 사람과 같은 방에 있는가" · "그 계정이 있는가" 를 알려 주는 오라클이 됩니다.

        **자기 자신은 못 가립니다** (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '201': { description: 가려짐 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/blocks/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Chat]
      summary: 가리기 해제
      description: |
        **없던 것을 풀어도 204** 입니다. 있고 없고를 상태 코드로 알려 주면 가려 뒀는지를
        응답으로 물어볼 수 있게 됩니다 — 본인만 아는 상태여야 합니다.
      responses:
        '204': { description: 해제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <JWT>`. 서명 알고리즘은 HS256.

        현재 발급되는 클레임은 다음 4개뿐입니다.

        | 클레임 | 값 | 비고 |
        |:---|:---|:---|
        | `sub` | 불투명 사용자 키 | **파싱 금지.** 이메일이라고 가정하지 마세요 |
        | `role` | 예: `ROLE_USER` | |
        | `iat` | 발급 시각 | |
        | `exp` | 만료 시각 | |

        아직 **없는** 클레임: `jti`(토큰 단위 무효화 불가 — 로그아웃해도 액세스 토큰은 만료까지 유효),
        `prv`(공급자).

        `jti` 는 이슈 #9 에서 도입하지 않기로 했습니다. 그 클레임은 **블록리스트 저장소라는
        소비자가 있어야** 의미가 있는데, MySQL 블록리스트는 모든 인증 요청마다 DB 조회를 1회
        더하면서 고작 1시간짜리 창을 줄입니다. #9 는 refresh 토큰 원장까지이며, Redis 로
        뒷받침되는 액세스 토큰 블록리스트는 M2 이후 별도 Epic 입니다.
        `prv` 는 읽는 코드가 없고, 가변 값을 불변 토큰에 복제하는 형태라 도입 계획이 없습니다
        (`provider` 는 `GET /auth/me` 가 DB 에서 돌려줍니다).

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: |
        지원 공급자는 `kakao` · `google` 둘뿐입니다 —
        [ADR-0010](../99-decisions/decision-log.md#adr-0010--소셜-로그인-공급자와-앱-세션-토큰-전략)
        이 정한 집합입니다. 코드의 `AuthController.SUPPORTED_PROVIDERS` 가 **같은 목록**이어야
        하고, `OpenApiAuthContractTest` 가 두 집합을 대조합니다. 한쪽만 넓히면 계약에 없는
        값이 302 로 통과합니다.

        `naver` 는 **보류**입니다(ADR-0010). 다만 백엔드에는 아직 네이버 클라이언트 등록
        (`application-dev.properties`·`application-prod.properties`)과 `NaverOAuth2User`
        매핑이 남아 있어, 스프링 시큐리티 자체 진입점인 `GET /oauth2/authorization/naver`
        는 여전히 열려 있습니다. 이 계약이 광고하는 집합과 실제로 도달 가능한 집합이 아직
        같지 않다는 뜻이며, 그 구멍을 닫는 일은 **#13** 이 소유합니다.
      schema: { type: string, enum: [kakao, google] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: |
        이전 응답의 nextCursor. **Chat 은 이 파라미터를 쓰지 않습니다** —
        채팅의 커서는 방별 `roomSeq` 이고 `afterSeq`/`beforeSeq` 로 받습니다.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AfterSeq:
      name: afterSeq
      in: query
      description: |
        이 `roomSeq` **뒤에** 생긴 메시지. 폴링 델타용이며 `beforeSeq` 와 동시에 줄 수 없습니다.
        `0` 은 "아직 아무것도 못 받았다" 이고, 방의 `lastSeq` 보다 큰 값도 400 이 아니라
        **빈 델타**입니다 — 앱의 커서가 앞서 있는 것은 오류가 아니고, 그때도 응답의 `lastSeq`
        로 커서를 되맞출 수 있어야 합니다.
      schema: { type: integer, format: int64 }
    BeforeSeq:
      name: beforeSeq
      in: query
      description: |
        이 `roomSeq` **앞의** 메시지. 과거 스크롤용이며 `afterSeq` 와 동시에 줄 수 없습니다.

        **응답의 `items` 는 이때도 `roomSeq` 오름차순입니다.** 2026-08 이전에는 이 절이
        "내림차순으로" 라고 적었는데, 방향에 따라 순서가 갈리면 클라이언트가 어느 파라미터를
        보냈는지에 따라 정렬을 달리해야 합니다. 서버가 인덱스를 뒤에서부터 읽는 것은 그대로고,
        뒤집는 것은 서버가 한 번 합니다.
      schema: { type: integer, format: int64 }
    ChatLimit:
      name: limit
      in: query
      description: |
        한 장의 크기. 공용 `Limit`(기본 20)과 **다른 기본값**입니다 — 채팅 첫 진입은 최신
        50건이고, 그 값은 화면이 한 번에 그리는 양에서 왔습니다.

        상한을 넘겨 보내도 **400 이 아니라 잘립니다.** 페이지 크기는 사람이 적은 값이 아니라
        앱이 정한 값이라 잘라도 사용자가 보는 것이 달라지지 않고, 반대로 거절하면 앱의 한 줄
        실수가 채팅 전체를 멈춥니다. `1` 미만도 `1` 로 올립니다.
      schema: { type: integer, default: 50, maximum: 100, minimum: 1 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: |
        직전 응답의 `ETag`(`"{roomId}:{lastSeq}"`). 새 메시지가 없으면 `304` 입니다.
        **`afterSeq` 와 함께 보낼 때만** 의미가 있습니다 — 첫 진입·과거 스크롤은 창이
        달라지므로 방의 `lastSeq` 가 그대로여도 응답이 같지 않습니다.
      schema: { type: string }

  responses:
    Unauthorized:
      description: |
        인증 필요/무효. **본문이 없습니다** — 상태 코드 401 만 돌아오고 `Content-Type` 도 없습니다.

        토큰 없음·서명 위조·만료·옛 형식 subject·탈퇴한 계정의 살아 있는 토큰이 전부 같은 모양입니다.
        인증 실패의 원인을 본문으로 알려 주면 그 자체가 탐색 수단이 되기 때문입니다(#6).
        클라이언트는 `error.code` 를 읽어 분기하지 말고 **상태 코드 401 만 보고** 재로그인으로 보내세요.
        (2026-08 이전에는 이 절이 JSON `Error` 본문을 선언했지만 서버는 그때도 본문을 주지 않았습니다.
         계약 쪽을 실제 동작에 맞춥니다 — #5.)
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 요청 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 중복
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        한도 초과. 두 가지 출처가 같은 응답을 씁니다.
        - 외부 데이터 한도 초과(예: KTO 1000콜/일)
        - 서버의 요청 빈도 제한(`ApiRateLimitFilter`). 인증 경로
          (`POST /auth/login`, `POST /auth/token/refresh`,
          `POST /auth/oauth/{provider}/callback`, `GET /oauth2/authorization/*`)가
          여기 걸립니다(#14). `Retry-After` 헤더에 창 길이(초)가 실립니다.

        본문은 공통 `Error` 이고 `error.code` 는 `RATE_LIMITED` 입니다. **버킷 이름이나
        한도 수치는 싣지 않습니다** — 서버 내부의 경로 분류를 그대로 노출하게 됩니다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: |
        4xx·5xx 오류 본문의 **유일한** 형태입니다(이슈 #10). 서버에서 이 봉투를 만드는 곳은
        `GlobalExceptionHandler` 한 곳뿐이며, 최상위 필드는 `error` 하나입니다 — 필드를
        최상위로 펼치지 마세요.

        **401 만 예외입니다 — 본문이 없습니다.** `components/responses/Unauthorized` 를 보세요.

        (2026-08 이전에는 실제 응답이 세 갈래였습니다: 이 봉투, 전역 처리기의
        `{ status, error, message, path, timestamp }`, `SocialController` 의
        `{ error: "문자열" }`. #10 이 하나로 합쳤습니다.)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
              enum: [VALIDATION, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT,
                     UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL,
                     ROOM_MEMBER_LIMIT, INVITE_EXPIRED, INVITE_REVOKED, INVITE_USES_EXHAUSTED,
                     REPORT_EMPTY, REPORT_MESSAGE_LIMIT, REPORT_MIXED_SENDERS, REPORT_SELF,
                     REPORT_MESSAGE_NOT_FOUND, REPORT_REASON_UNKNOWN]
              description: |
                닫힌 목록입니다. 어휘의 출처는 둘뿐이고 던지는 쪽이 문자열을 손으로 적지 않습니다.

                **① HTTP 상태에서 파생되는 여덟** (`GlobalExceptionHandler.codeOf`)
                400 `VALIDATION` · 403 `FORBIDDEN` · 404 `NOT_FOUND` · 405 `METHOD_NOT_ALLOWED` ·
                409 `CONFLICT` · 415 `UNSUPPORTED_MEDIA_TYPE` · 429 `RATE_LIMITED` ·
                그 밖의 5xx `INTERNAL`. 401 은 이 목록에 없습니다(본문 자체가 없습니다).

                **② 채팅 한도·초대 상태 넷** (`ChatErrorCode`)
                409 `ROOM_MEMBER_LIMIT` · 410 `INVITE_EXPIRED` · 410 `INVITE_REVOKED` ·
                409 `INVITE_USES_EXHAUSTED`. 이 넷은 상태에서 파생되지 않습니다 —
                `ROOM_MEMBER_LIMIT` 과 `INVITE_USES_EXHAUSTED` 가 **둘 다 409 인데 앱이
                보여줄 화면이 다르기** 때문입니다(#74 · 이슈 #75).

                **③ 신고 여섯** (`ChatErrorCode`, 이슈 #82) — **전부 400** 입니다.
                `REPORT_EMPTY`(아무것도 안 골랐다) · `REPORT_MESSAGE_LIMIT`(세 개를 넘겼다) ·
                `REPORT_MIXED_SENDERS`(고른 것의 발신자가 여럿이라 신고 대상이 하나가 아니다) ·
                `REPORT_SELF`(자기 메시지다) · `REPORT_MESSAGE_NOT_FOUND`(그 방에 없는 번호다) ·
                `REPORT_REASON_UNKNOWN`(사유 분류가 목록에 없다).
                같은 400 을 다섯으로 나눈 이유도 같습니다 — "고른 것을 줄이세요" 와
                "선택을 나누세요" 는 앱이 보여줄 안내도 다음 동작도 다릅니다.
            message:
              type: string
              example: "해당 장소를 찾을 수 없습니다."
              description: |
                사람이 읽는 문구. **예외 메시지가 아닙니다** — 500 과 형식 오류(400·405·415)
                경로에서는 고정 문구를 씁니다. 예외 메시지에는 SQL 조각·파일 경로·이메일·
                토큰 조각이 섞여 들어오기 때문입니다(#6).
            traceId:
              type: string
              description: |
                이 요청의 상관관계 ID. 응답 헤더 `X-Correlation-Id` 와 같은 값이며, 서버 로그에서
                이 요청을 집는 열쇠입니다. 문의할 때 이 값을 함께 보내세요.

    Page:
      type: object
      # nextCursor 는 마지막 페이지에서 null 이므로 required 에 넣지 않는다.
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {}
        nextCursor: { type: [string, "null"], example: "eyJpZCI6MTIzfQ==" }
        hasMore: { type: boolean }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: |
            폐기 가능한 불투명 문자열(JWT 아님, 패딩 없는 Base64URL 43자). 수명은 14일이며
            `POST /auth/token/refresh` 를 쓸 때마다 회전합니다 — 응답의 새 값으로 교체 저장하세요.

            **어디에 실리는가(2026-08 현재):** `POST /auth/login` 의 200 응답,
            `POST /auth/token/refresh` 의 200 응답, 그리고 소셜 로그인 딥링크의 `refresh`
            파라미터입니다. `POST /auth/signup` 은 토큰을 발급하지 않으므로(201 + `User`)
            여기에 해당하지 않습니다 — 가입 직후에는 `POST /auth/login` 을 호출하세요.
        expiresIn: { type: integer, description: 초, example: 3600 }
        isNew:
          type: boolean
          default: false
          description: |
            이번 인증으로 계정이 새로 생성되었으면 true. **로그인 응답 1회성 이벤트 속성**이며
            사용자 프로필의 영속 속성이 아닙니다(그래서 `User` 가 아니라 여기에 있습니다).
            true 면 프론트는 온보딩(반려견 프로필 등록)으로 유도합니다.
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      # 최소 보장. id 가 없으면 클라이언트가 아무것도 할 수 없다.
      # `{}` 가 유효한 User 로 통과하던 상태를 막기 위한 것이다(이슈 #23-A).
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        email:
          type: [string, "null"]
          format: email
          description: 로그인 ID. 소셜 공급자가 이메일을 주지 않으면 null 일 수 있습니다.
        name:
          type: [string, "null"]
          maxLength: 50
        nickname:
          type: [string, "null"]
          maxLength: 20
          example: "보리아빠"
          description: |
            소셜 가입 경로에서는 설정되지 않아 null 일 수 있습니다(#7).

            **상한 20 은 컬럼이 정한 수가 아닙니다.** 컬럼은 `varchar(255)` 인데 그건 저장
            한계이지 제품이 고른 수가 아닙니다. 앱의 프로필 편집 화면이 이미 20 으로 막고
            있어서 그 수를 서버 쪽 정본으로 올렸습니다(#229).

            **이 값이 모든 도메인으로 번집니다** — `post.handle`·`comment.handle`·
            `chat_message.sender_name` 이 이것을 스냅샷하고, `GroupMember`·`CareDoer`·
            `PersonRef` 가 이것을 표시합니다. 2026-09-03 이전에는 가입에도 프로필 수정에도
            상한이 없었고(`@Valid` 조차 없어서 붙여도 안 걸렸습니다), 그래서 `post.handle`
            이 `VARCHAR(50)` 이던 시절 51자 닉네임을 가진 사람의 **모든 글쓰기가 영구히
            500** 이 됐습니다(#170).

            **소셜 로그인은 자르고 거절하지 않습니다.** 그 경로는 앱을 안 지나므로 여기서
            `400` 을 주면 이름이 긴 사람은 **로그인 자체가 안 됩니다** — 자른 뒤 사용자가
            프로필에서 고칠 수 있습니다. 가입뿐 아니라 **매 로그인의 프로필 갱신에서도**
            자릅니다.
        gender: { type: [string, "null"], enum: [MALE, FEMALE, OTHER, null] }
        age: { type: [integer, "null"] }
        travelType: { type: [string, "null"], description: 현재 스키마는 단일 문자열 }
        imageUrl: { type: [string, "null"], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        provider:
          type: [string, "null"]
          enum: [local, kakao, google, null]
          description: |
            계정 출처. `local` = 이메일/비밀번호 가입.
            `users.provider` 컬럼과 `UserResponse.provider` 로 구현돼 있습니다(#7).
            소셜 계정의 식별 키는 `(provider, social_id)` 이며 이메일이 아닙니다.
            백필 SQL 이 아직 실행되지 않은 환경의 옛 행은 `null` 일 수 있습니다.

            `naver` 는 빠졌습니다 — ADR-0010 의 보류 결정입니다. **enum 을 통째로 지우지
            마세요**: `local` 은 이메일 가입자를, `null` 은 백필 전 옛 행을 표현합니다.
            운영 DB 에 `provider='naver'` 인 행이 남아 있을 수 있으나, 그 계정으로 다시
            로그인할 수 있는 경로를 이 계약은 광고하지 않습니다.

    SignupInput:
      type: object
      required: [email, password, nickname, agreeTos, agreePrivacy]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        nickname: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 50 }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            선택. **안 보내면 `User.gender` 가 `null`(미지정)로 저장됩니다** — '기타'와 구분됩니다.
            대소문자를 가리지 않습니다(`male` 도 됩니다). 목록에 없는 값은 **400** 입니다
            — 조용히 OTHER 로 바꾸지 않습니다(#42).
        ageGroup:
          type: string
          enum: [under14, over14]
          default: over14
          description: >
            선택. 안 보내면 `over14` 입니다. 대소문자를 가리지 않습니다.
            목록에 없는 값은 **400** 입니다 — `over14` 로 떨어뜨리면 미성년자를
            성인으로 취급하게 됩니다(#42).
        agreeTos: { type: boolean, description: 필수 — false/null 이면 400 }
        agreePrivacy: { type: boolean, description: 필수 — false/null 이면 400 }
        agreeMarketing: { type: boolean, description: 선택 }
        tosVersion: { type: string, default: "v1.0" }
        privacyVersion: { type: string, default: "v1.0" }
        marketingVersion: { type: string, default: "v1.0" }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    UserUpdate:
      type: object
      # 부분 수정 — 보낸 필드만 반영한다. 빈 객체는 의미가 없으므로 최소 1개를 요구한다.
      minProperties: 1
      properties:
        name: { type: string, maxLength: 50 }
        nickname: { type: string, maxLength: 20 }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            보내면 바꿉니다. 안 보내면 그대로 둡니다(부분 수정).
            목록에 없는 값은 **400** 입니다(#42).
        age: { type: integer }
        travelType: { type: string }
        imageUrl: { type: string, format: uri }
        agreeMarketing: { type: boolean }

    DogSize:
      type: string
      enum: [small, medium, large]
      description: |
        소형/중형/대형. 리소스 이름이 `Dog` 라 "견" 으로 읽히지만 **고양이에도 씁니다**
        (`PetSpecies` 참조).

    PetSpecies:
      type: string
      enum: [dog, cat, other]
      default: dog
      description: |
        반려동물 종.

        **`Dog` 라는 리소스 이름 안에 종 축이 들어 있는 것이 어색하지만, 이름을 바꾸지
        않았습니다.** 경로(`/api/dogs`)와 `WalkInput.dogId` 가 이미 앱·계약 여러 곳에 박혀
        있어서, 이름을 바꾸면 그 전부를 같은 PR 에서 함께 옮겨야 합니다. 이름은 나중에
        `/api/pets` 로 옮기고 이 경로를 별칭으로 남기는 편이 안전합니다.

        지금 이 필드를 넣는 이유는 **없으면 고양이를 키우는 사람이 반려동물을 서버에 못
        올리고, 그 사람의 산책은 붙일 곳이 없기 때문**입니다. 앱에는 `PetSpecies` 가 이미
        있고 더미 시드에 고양이가 들어 있습니다. 지금은 컬럼 하나지만 나중엔 마이그레이션
        입니다.

    ConsentKind:
      type: string
      enum: [TERMS, PRIVACY, LOCATION, MARKETING]
      description: |
        동의를 받는 문서 넷. `MARKETING` 만 선택이고 나머지는 필수인데, **그 판정은 앱이 합니다** —
        서버는 받은 사실을 있는 그대로 적습니다.
    Consent:
      type: object
      required: [kind, version, agreed, at]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+$'
          example: v1.2
          description: 앱이 보낸 문서 버전. 문서 파일 머리의 `버전:` 과 같습니다.
        agreed:
          type: boolean
          description: "`false` 는 철회입니다 — 지운 것이 아니라 새로 적은 것입니다."
        at:
          type: string
          format: date-time
          description: 서버가 찍은 시각. 앱이 보낸 시각이 아닙니다.
    ConsentInput:
      type: object
      required: [kind, version, agreed]
      properties:
        kind: { $ref: '#/components/schemas/ConsentKind' }
        version:
          type: string
          pattern: '^v[0-9]+\.[0-9]+$'
          example: v1.2
        agreed: { type: boolean }
    ConsentsInput:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/ConsentInput' }
    Consents:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
    Dog:
      type: object
      required: [id, name, size, species, neutered]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리" }
        species: { $ref: '#/components/schemas/PetSpecies' }
        breed:
          type: [string, "null"]
          example: "믹스견"
          description: |
            품종. **`null` 일 수 있습니다** — `dog.breed` 컬럼이 널 가능이고 `required` 에도
            없습니다. 2026-09-03 이전에는 `type: string` 이라 서버가 낼 수 있는 값을 계약이
            표현하지 못했습니다(#209 `Dogs-medium-3` 과 같은 종류).
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date, example: "2024-01-15" }
        ageMonths:
          type: [integer, "null"]
          example: 30
          description: |
            `birth` 로부터 계산한 파생값. **저장하지 않습니다** — 저장하는 순간 낡습니다.

            **`birth` 가 없으면 `null` 입니다.** `0` 이 아닙니다 — `0` 은 "갓 태어났다" 라는
            **다른 뜻**이라, 모르는 것을 `0` 으로 눕히면 화면이 "0개월" 을 그리며 거짓말을
            합니다. 미래 생일도 `null` 입니다(`Period` 는 음수를 그대로 주는데 "-3개월" 은
            그 자체가 버그로 보입니다).

            2026-09-03 이전에는 `type: integer` 였습니다. **`birth` 가 nullable 인데 거기서
            파생되는 이 값이 non-null 이라 스키마 내부가 모순이었고**, 서버는 실제로 `null`
            을 내보내고 있었습니다 — 계약 위반이었습니다(#209 `Dogs-medium-3`).
            코드가 맞고 계약이 틀렸으므로 계약을 고칩니다.

            **입력에는 없습니다.** `DogInput` 은 `birth` 만 받습니다 — 개월 수를 받으면
            내일은 그 값이 틀립니다.
        neutered: { type: boolean }
        avatarUrl: { type: [string, "null"] }

    DogInput:
      type: object
      required: [name, size]
      properties:
        name: { type: string, maxLength: 50 }
        species:
          $ref: '#/components/schemas/PetSpecies'
          description: 생략하면 `dog` 입니다 — 이 필드가 없던 때 만들어진 앱과 계약이 맞습니다.
        breed: { type: string, maxLength: 50 }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date }
        neutered: { type: boolean, default: false }

    DogPatch:
      type: object
      description: |
        **부분 수정 전용**입니다(ADR-0017 규약 4). 생성용 `DogInput` 을 재사용하지 않는 이유는
        그 스키마가 `required: [name, size]` 라, 재사용하면 `{"neutered": true}` 만 보내는 것이
        계약 위반이 되어 **부분 수정이 계약상 불가능**해지기 때문입니다.

        **보낸 필드만 반영합니다.** 안 보낸 필드는 그대로 둡니다 — 지우고 싶으면 `null` 을
        명시적으로 보냅니다(`birth` 만 `null` 을 받습니다).

        `PUT /auth/me` 의 `UserUpdate` 가 같은 모양입니다.
      # 빈 객체는 의미가 없으므로 최소 1개를 요구한다.
      minProperties: 1
      properties:
        name: { type: string, maxLength: 50 }
        species: { $ref: '#/components/schemas/PetSpecies' }
        breed: { type: string, maxLength: 50 }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date }
        neutered: { type: boolean }

    PersonRef:
      type: object
      description: |
        **사람 하나를 가리키는 공통 모양**입니다(ADR-0017 규약 5). 이전에는 같은 개념이
        다섯 모양으로 갈려 있었고, 그중 `Comment.author` 에는 **식별자가 아예 없어**
        "내 댓글인가" 판별·프로필 이동·차단이 계약상 불가능했습니다.

        **`nickname` 은 조회 시점의 현재 값**입니다 — 작성 시점 스냅샷이 아닙니다.
        탈퇴한 계정이면 `userId` 가 `0`, `nickname` 이 `알 수 없음` 입니다.
        (저장은 스냅샷을 함께 둘 수 있지만, **응답에 싣는 것은 현재 값**입니다.
         두 규칙이 한 화면에서 만나지 않도록 여기서 하나로 못박습니다.)

        **의도된 예외 하나** — `ChatMessage` 는 발신자를 `senderUserId`/`senderName`
        **평평한 쌍**으로 싣습니다. 이미 구현·테스트가 잠근 모양이고, 방 안의 발신자라
        중첩할 이유가 없습니다. 다음 감사가 이것을 다시 잡지 않도록 여기 적어 둡니다.
      required: [userId, nickname]
      properties:
        userId:
          type: integer
          format: int64
          description: 탈퇴한 계정이면 `0` 입니다.
        nickname:
          type: string
          description: 탈퇴한 계정이면 `알 수 없음` 입니다.

    Place:
      type: object
      description: 지도/리스트에 뿌리는 장소(프론트 PetPlace와 대응).
      # distM 은 /nearby 에서만 채워진다 — 상세·북마크에는 기준점이 없어 null 이다.
      # category 는 KTO 가 닫힌 enum 밖의 contenttypeid 를 주면 통째로 빠진다(의도).
      # tel·image 는 KTO 가 안 주면 null 이다. title·addr 은 빈 문자열로 눕힌다.
      required: [contentId, title, source, lat, lng, addr]
      properties:
        contentId: { type: string, example: "2733967" }
        title: { type: string, example: "서울숲" }
        source: { type: string, enum: [kto, vet, shop, trail], example: kto }
        category:
          $ref: '#/components/schemas/PlaceCategory'
          description: |
            **생략될 수 있습니다.** KTO 가 위 여섯 밖의 `contenttypeid` 를 주면 이 필드를
            빼고 보냅니다 — 모르는 값을 실으면 계약을 깨고, 아무 값으로 눕히면 화면이
            엉뚱한 아이콘을 그립니다. 앱은 모르는 값을 "기타" 로 폴백합니다.
            원래 값은 `contentTypeId` 에 그대로 있습니다.

            **앱은 이 필드를 안 읽습니다.** 아이콘도 필터도 `contentTypeId` 로 판단합니다.
            남겨 둔 것은 이 필드가 "계약이 아는 값인가" 를 그 자체로 말해 주기 때문입니다 —
            있으면 여섯 중 하나이고, 없으면 KTO 가 그 밖의 값을 준 것입니다. 두 필드가
            같은 것을 두 가지로 말하지 않도록 여기 적어 둡니다(#210 `Places-high-3`).
        contentTypeId:
          type: [string, "null"]
          example: "12"
          description: |
            KTO 콘텐츠타입(12관광지/14문화/28레포츠/32숙박/38쇼핑/39음식점).

            **앱이 실제로 보는 필드가 이것입니다.** `category` 가 아닙니다 —
            `category` 설명을 참고하세요.

            **`kto` 가 아닌 출처에서는 `null` 입니다.** 오늘 서버가 만드는 출처는 `kto`
            하나뿐이라 아직 그런 행이 없지만, `vet`/`shop`/`trail` 이 붙는 날 이 필드는
            채울 값이 없습니다 — KTO 체계의 값이기 때문입니다.
        lat: { type: number, format: double, example: 37.5445 }
        lng: { type: number, format: double, example: 127.0374 }
        addr: { type: string, example: "서울특별시 성동구 뚝섬로 273" }
        tel: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        distM:
          type: number
          format: double
          description: |
            조회 기준점으로부터 거리(m). **`/nearby` 에서만 채워집니다** — 상세에는
            기준점이 없어서(사용자가 어디서 눌렀는지 서버가 모릅니다) 생략됩니다.

            KTO 가 준 `dist` 를 그대로 싣지 않고 **요청 좌표로 다시 계산**합니다.
            스냅샷은 셀 중심에서 받은 것이라 그대로 실으면 같은 셀의 모든 사용자가 같은
            거리를 봅니다(최대 1.4km 틀립니다).
          example: 320

    # 값의 출처가 둘이다 — 이 enum 과 PlaceDto.KNOWN_CATEGORIES.
    # 갈리면 KTO 가 준 값을 서버가 실어 보내고 앱이 라벨을 못 찾는다.
    # PlacesContractSpecTest 가 둘을 대조한다 (#210 Places-low-1).
    ReportReason:
      type: string
      enum: [spam, abuse, sexual, fraud, other]
      description: |
        신고 사유. **채팅과 커뮤니티가 같은 어휘를 씁니다** — 값이 두 벌이 되면 앱이 분기를
        두 번 짜고, 운영자가 세는 숫자가 두 표에서 다른 뜻이 됩니다.

        **목록에 없는 값은 `400` `REPORT_REASON_UNKNOWN`** 이고 `other` 로 눕히지 않습니다 —
        오타가 조용히 통과하면 운영자가 세는 숫자가 소리 없이 틀어집니다.

        2026-09-03 이전에는 채팅 신고 안에 **인라인 enum** 이었습니다. 그러면 계약·서버 상수·
        DB CHECK·앱까지 어휘가 네 벌이 되는데 잠글 자리가 없습니다 — `Board`·`ReactionType` 은
        컴포넌트로 뽑아 셋을 대조합니다(#166).

    ReportInput:
      type: object
      required: [reason]
      description: |
        커뮤니티 글·댓글 신고. 대상은 **경로가 지목**합니다.
      properties:
        reason: { $ref: '#/components/schemas/ReportReason' }
        memo:
          type: string
          maxLength: 500
          description: |
            덧붙이는 말. **500자를 넘기면 `400` 이 아니라 잘립니다** — 거절하면 사용자가 쓴
            신고가 통째로 사라지는데, 잘린 메모로도 운영자의 판단에는 충분합니다.
            채팅 신고와 같은 판단입니다.

    ReportReceipt:
      type: object
      required: [reportId, createdAt]
      description: |
        접수증. **이것이 응답의 전부입니다.**

        **신고자는 익명이고 피신고자에게는 아무 알림도 가지 않습니다.** 피신고자 id 도
        안 돌려줍니다 — 응답에 무엇이 더 실리면 그것으로 남의 상태를 물어볼 수 있게 됩니다.
      properties:
        reportId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, example: "2026-09-02T15:30:00Z" }

    PlaceCategory:
      type: string
      description: >
        프론트 카테고리 키. 숫자는 KTO contentTypeId. `vet`·`shop`·`trail` 은 공공데이터
        레이어 자리인데 **아직 데이터가 없습니다** — 서버는 그 값에 빈 목록을 주고, 앱은
        #282 부터 그 칩을 보여 주지 않습니다. 실데이터(LOCALDATA·두루누비)가 붙는 날 돌아옵니다.
      enum: ['12', '14', '28', '32', '38', '39', 'vet', 'shop', 'trail']

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            overview: { type: [string, "null"], description: 개요 }
            petInfo:
              type: object
              description: 반려동물 동반 상세(KTO detailPetTour2 — 대부분 자유텍스트)
              properties:
                acmpyPsblCpam: { type: [string, "null"], description: 동반 가능 반려동물 }
                acmpyNeedMtr: { type: [string, "null"], description: 동반 시 필요사항 }
                etcAcmpyInfo: { type: [string, "null"], description: 기타 유의사항 }

    Walk:
      type: object
      required: [id, dogId, clientWalkId, startedAt, distanceM, durationS]
      properties:
        id: { type: integer, format: int64 }
        dogId: { type: integer, format: int64 }
        clientWalkId:
          type: string
          description: |
            앱이 이 산책에 붙인 멱등키. 되돌려 주는 이유는 앱이 **전송 대기 큐의 어느 항목이
            저장된 것인지** 맞춰 볼 수 있어야 하기 때문입니다.
          example: "6d2f8b1a-3c4e-4a7f-9b0d-1e2f3a4b5c6d"
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        distanceM: { type: integer, example: 2400 }
        durationS: { type: integer, example: 2280 }
        path:
          type: [array, "null"]
          description: |
            GPS 경로. **`[경도, 위도]` 순서**입니다(GeoJSON LineString 의 coordinates 와 같고,
            사람이 흔히 말하는 "위도, 경도" 와 **반대**입니다). DB 에는 `LINESTRING SRID 4326`
            으로 저장합니다.

            **`null` 일 수 있습니다.** 손으로 입력한 기록이나 위치 권한 없이 남긴 기록에는
            경로가 없습니다. 목록(`GET /api/walks`)에서는 응답 크기 때문에 **항상 `null`** 이고,
            상세(`GET /api/walks/{walkId}`)에서만 실제 경로가 옵니다.
          items:
            type: array
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0402, 37.5455]]
        memo: { type: [string, "null"] }
        weather: { type: [string, "null"], example: "맑음 24°C" }

    WalkMemoInput:
      type: object
      required: [memo]
      description: |
        `PUT /api/walks/{walkId}/memo` 의 본문. 필드가 하나뿐입니다.

        `memo` 를 **필수로 둔 것은 의도입니다.** 선택으로 두면 `{}` 가 "안 바꾼다" 인지
        "지운다" 인지 계약이 말해 주지 않습니다. 지울 때는 `""` 또는 `null` 을 보냅니다.
      properties:
        memo:
          type: string
          nullable: true
          maxLength: 500
          description: 새 회고 글. 빈 문자열이나 `null` 이면 지웁니다.

    WalkInput:
      type: object
      description: |
        **이 값들은 전부 앱이 스스로 신고한 것입니다.** 서버는 범위를 검사하지만, 범위 검사는
        "말이 되는 값인가" 만 말하지 **"진짜 걸었는가" 는 말해 주지 않습니다.** 순위표나 보상에
        쓰려면 그때 별도의 근거가 필요합니다.
      required: [dogId, clientWalkId, startedAt, distanceM, durationS]
      properties:
        dogId: { type: integer, format: int64 }
        clientWalkId:
          type: string
          description: |
            **앱이 만드는 멱등키(UUID v4 권장).** 산책이 끝나는 순간 한 번 만들고, 재전송에도
            같은 값을 씁니다.

            없으면 전송이 타임아웃 났을 때 앱이 두 가지를 구분할 수 없습니다 — 서버에 안 닿은
            것인지, 저장은 됐는데 응답만 못 받은 것인지. 다시 보내면 같은 산책이 두 줄이 되고,
            안 보내면 사라집니다. **둘 다 사용자가 겪으면 안 되는 일이라 키가 필요합니다.**
          minLength: 8
          maxLength: 64
          example: "6d2f8b1a-3c4e-4a7f-9b0d-1e2f3a4b5c6d"
        startedAt:
          type: string
          format: date-time
          description: 지금보다 5분 넘게 미래면 400 입니다.
        endedAt:
          type: string
          format: date-time
          description: 주면 `startedAt` 보다 뒤여야 합니다.
        distanceM:
          type: integer
          minimum: 0
          maximum: 200000
          description: 총 거리(m). 상한 200km 는 하루 산책으로 말이 되는 범위의 바깥 경계입니다.
        durationS:
          type: integer
          minimum: 0
          maximum: 86400
          description: 총 소요(초). 상한은 24시간입니다.
        path:
          type: array
          description: |
            GPS 경로. **`[경도, 위도]` 순서**입니다 — 응답 `Walk.path` 와 같습니다.

            뒤집어 보내면 서버가 400 으로 거절합니다(둘째 값의 절댓값이 90 을 넘으면 위도일 수
            없습니다). 다만 **한국 안에서는 두 값이 모두 90 미만인 경우가 없어 이 검사가 걸리지만,
            적도 근처 좌표라면 뒤집혀도 통과합니다.** 검사는 그물이지 보증이 아닙니다.

            생략하거나 빈 배열이면 경로 없이 저장합니다(손입력 기록·위치 권한 거부).
            점이 하나뿐이면 선이 아니므로 경로 없이 저장합니다.
          minItems: 0
          maxItems: 20000
          items:
            type: array
            description: '[경도, 위도]'
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0402, 37.5455]]
        pathT:
          type: array
          description: |
            점별 시각 — **시작 시각 기준 델타 초**입니다. 이슈 #155.

            **`path` 와 길이가 같아야 합니다.** 다르면 400 입니다 — 짝이 안 맞는 배열은 어느
            점이 언제인지 말해 주지 못하므로 저장할 가치가 없습니다. `path` 없이 이것만 보내도
            400 입니다(경로 없는 시각은 뜻이 없습니다).

            음수이거나 뒤로 흐르면 400 입니다. 음수는 시작 전이고 뒤로 흐르는 것은 시계가
            거꾸로 간 것이라, 둘 다 이 배열로 할 수 있는 계산(구간 페이스)이 의미를 잃습니다.

            **일시정지 동안은 초가 안 흐릅니다.** 그래서 델타가 건너뛰면 그 사이가 멈춘
            구간이라는 것을 화면이 추론할 수 있습니다 — 별도 플래그를 두지 않는 이유입니다.

            > **응답에는 실리지 않습니다.** 지금 이 값을 그리는 화면이 없어서, 목록에서
            > `path` 를 뺀 것과 같은 이유로 뺐습니다. 필요해지는 날 상세 응답에 넣습니다.
            > 그때까지 **저장은 됩니다** — 시각은 그 순간에만 있는 정보라 나중에 만들 수
            > 없고, 안 받으면 쌓인 행 전체에 대해 구간 페이스·일시정지 복원·거리 재계산이
            > 영원히 불가능해집니다.
          minItems: 0
          maxItems: 20000
          items: { type: integer, minimum: 0 }
          example: [0, 3, 7]
        memo: { type: string, maxLength: 500 }
        weather: { type: string, maxLength: 30 }

    WalkStats:
      type: object
      description: |
        **두 기간이 한 응답에 들어 있습니다.** `week*` 는 이번 주(월~일), `allTime*` 는 전체
        기간입니다. 주 경계는 **KST 월요일 00:00** 입니다 — 서버 타임존이 아니라 한국 시각으로
        자릅니다.
      required: [weekKm, totalKm, walkCount, avgKm, allTimeKm, allTimeCount, allTimeMinutes]
      properties:
        weekKm:
          type: array
          description: 이번 주 요일별 거리(km). **월요일부터** 길이 7. 산책이 없는 요일은 0.
          minItems: 7
          maxItems: 7
          items: { type: number, format: double }
          example: [2.1, 2.9, 1.2, 0, 1.8, 3.1, 2.4]
        totalKm: { type: number, format: double, description: 이번 주 합계 거리(km), example: 13.5 }
        walkCount:
          type: integer
          description: |
            이번 주 산책 **건수**입니다. "산책한 날 수" 가 아닙니다 — 하루에 두 번 걸으면 2 입니다.
            (예전 더미 화면은 `weekKm` 에서 0 이 아닌 요일을 세어 날 수를 보여 줬습니다.)
          example: 6
        avgKm:
          type: number
          format: double
          description: '`totalKm / walkCount`. 건수가 0 이면 0 입니다(나눗셈을 하지 않습니다).'
          example: 2.3
        allTimeKm: { type: number, format: double, description: 전체 기간 누적 거리(km), example: 128.4 }
        allTimeCount: { type: integer, description: 전체 기간 산책 건수, example: 57 }
        allTimeMinutes: { type: integer, description: 전체 기간 누적 시간(분), example: 2310 }
        topPlaces:
          type: array
          description: |
            자주 간 곳 상위.

            **지금은 항상 빈 배열입니다.** `Walk` 에 장소 축이 없어서 셀 근거가 없습니다.
            산책과 장소를 잇는 결정이 나오기 전까지 채우지 않습니다 — 그럴듯한 값을 만들어
            넣으면 화면이 거짓말을 합니다.
          items:
            type: object
            properties:
              place: { type: string, example: "서울숲" }
              count: { type: integer, example: 3 }

    Board:
      type: string
      enum: [walk_review, pet_place, health, free, brag]
      description: |
        게시판. **값은 ASCII 키이고 화면 문구는 앱이 든다.**

        | 값 | 화면 문구 |
        |---|---|
        | `walk_review` | 산책로 후기 |
        | `pet_place` | 동반장소 |
        | `health` | 건강·병원 |
        | `free` | 자유 |
        | `brag` | 자랑 |

        2026-09 이전에는 값 자체가 한글 표시 문자열이었습니다(`"산책로 후기"` 등). 그것을
        바꾼 이유가 셋입니다.

        1. **이 계약의 다른 enum 은 전부 ASCII 입니다** — `DogSize`·`PetSpecies`·`GroupRole`·
           `CareType`·`ReactionType`. `Board` 하나만 달랐습니다.
        2. **이 값이 query 파라미터로 나갑니다.** 공백과 가운뎃점(`·`)을 품은 문자열이라
           인코딩을 한 군데라도 빠뜨리면 조용히 안 걸립니다.
        3. **이 값이 DB 컬럼에 들어갑니다.** 표시 문구를 저장하면 게시판 이름을 다듬는 날
           **쌓인 행을 전부 고쳐야** 합니다. 값과 문구를 갈라 두면 문구만 바꿉니다.

        `CareType` 이 이미 같은 모양입니다 — `water|meal|walk|med|vet` 이고 "물/밥/산책/투약/병원"
        은 앱이 붙입니다.

    ReactionType:
      type: string
      enum: [help, cute, empathy]
      description: 도움돼요/귀여워요/공감

    ReactionSummary:
      type: object
      # mine 은 required 가 아니다 — 게스트에게는 채워질 수 없다(ADR-0017 규약 1·6).
      required: [help, cute, empathy]
      properties:
        help: { type: integer }
        cute: { type: integer }
        empathy: { type: integer }
        mine:
          type: ["array", "null"]
          items: { $ref: '#/components/schemas/ReactionType' }
          description: |
            **내가 누른 반응들.** 배열인 것은 셋을 동시에 누를 수 있기 때문입니다(ADR-0016 결정 2).
            2026-09 이전에는 단수 문자열이었습니다.

            **`null` 과 `[]` 는 다릅니다.**

            | 값 | 뜻 |
            |---|---|
            | `null` | **비인증 요청**입니다. 누가 눌렀는지 물을 대상이 없습니다 |
            | `[]` | 로그인했고, **아무것도 안 눌렀습니다** |

            둘을 같게 두면 `[]` 가 "아무것도 안 눌렀다" 로 읽혀 게스트에게 거짓말을 합니다.

            이 필드가 값을 가지려면 요청에 토큰이 있어야 하고, 그래서 조회 오퍼레이션들이
            `security: [{}, {bearerAuth: []}]`(인증 선택)로 선언돼 있습니다 — ADR-0017 규약 6.
            `required` 가 아닌 이유도 이것입니다.

            **토큰이 있는데 만료됐으면 `null` 입니다.** 인증 선택 경로에서는 필터가 깨진 토큰을
            조용히 무시하므로 `401` 이 아니라 `200` 이 나갑니다. 앱은 `401` 에서만 토큰을
            갱신하므로 **그 화면에서는 세션 복구가 일어나지 않습니다** — 다만 앱을 다시 켜면
            `GET /auth/me` 가 반드시 `401` 을 주므로 창은 한 세션입니다(ADR-0016 결정 3).

    Post:
      type: object
      required: [id, author, board, title, body, commentCount, reactions, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author:
          $ref: '#/components/schemas/PersonRef'
          description: |
            **2026-09 이전에는 인라인 `{id, nickname}`** 이었습니다. 키 이름이 `id` 라
            같은 개념인 `CareDoer.userId`·`GroupMember.userId` 와 갈렸습니다 — ADR-0017 규약 5.
        board: { $ref: '#/components/schemas/Board' }
        loc:
          type: [string, "null"]
          example: "서울숲"
          description: |
            표시용 장소 이름. **서버가 보낸 대로 돌려줍니다.**

            `contentId` 가 있어도 서버가 이 값을 채우거나 덮지 않습니다 — 장소는 KTO 프록시
            **캐시**라 사용자가 고른 것의 행이 아직 없을 수 있고, 그때 이름을 못 찾아 조용히
            빈 값이 됩니다. 즉 **둘이 어긋나도 서버는 모릅니다.** 어긋난 값을 고치는 것은
            보낸 쪽의 일입니다.

            둘 중 이름을 그리는 데 쓰는 것은 이 값입니다 — `contentId` 로 장소를 다시 조회해
            제목을 쓰면 캐시가 없을 때 빈 칸이 됩니다.
        contentId:
          type: [string, "null"]
          description: |
            연결된 장소(선택). **`Place.contentId` 와 같은 키**입니다.

            2026-09 이전에는 `placeId` 였습니다. 같은 개념이 조회에서는 `contentId`,
            여기서는 `placeId` 로 갈려 있었습니다 — ADR-0017 이 `contentId` 로 통일했습니다.
        title: { type: string, example: "서울숲 아침 산책 코스 추천" }
        body: { type: string }
        commentCount: { type: integer, example: 4 }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        createdAt: { type: string, format: date-time }
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람이 이 작성자를 가렸는가**(#166). 읽는 사람마다 다른 값입니다.

            **목록에서 빼지 않습니다.** 빼면 커서가 그 글을 건너뛰어 페이지 경계가
            어긋나고, 가린 자리에 "보기" 를 두려면 본문이 이미 와 있어야 합니다 —
            `ChatMessage.hiddenByBlock` 과 같은 규약입니다. **접는 것은 화면의 일입니다.**

            게스트에게는 항상 `false` 입니다 — 가린 사람이 없습니다.
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            마지막 수정 시각. **`null` 이면 한 번도 안 고쳤습니다.**

            `createdAt` 을 복사해 채우지 않습니다 — 그러면 "만들자마자 고쳐진 글" 과 구별이
            안 되고 화면이 모든 글에 '수정됨' 을 붙입니다.

            **같은 값을 다시 보낸 `PATCH` 는 이 값을 바꾸지 않습니다.** 아무것도 안 바뀐 글에
            '수정됨' 이 붙으면 그 표시는 읽는 사람에게 아무것도 말해 주지 않습니다.

            `Comment` 에는 없습니다 — 댓글 수정 경로가 계약에 없습니다.

    PostPatch:
      type: object
      minProperties: 1
      description: |
        글 부분 수정(#211). **`PostInput` 을 재사용하지 않습니다** — 그쪽은
        `required: [board, title, body]` 라, 제목만 고치려는 사람도 본문을 다시 보내야 하고
        그 사이 다른 기기에서 고친 본문을 조용히 되돌립니다(ADR-0017 규약 4).

        **키가 없으면 안 바꿉니다.** 비우기가 아닙니다. 세 필드 다 `NOT NULL` 컬럼이라
        비울 수 있어야 할 이유도 없고, 공백만 보내면 `400` 입니다.

        **`loc`·`contentId` 는 여기 없습니다.** 그 둘은 비울 수 있어야 하는데(장소 연결
        해제), 그러려면 JSON 의 "키가 없음" 과 "명시적 `null`" 을 구별해야 합니다 — 저장소
        최초의 `PATCH` 를 그 결정과 함께 들이지 않았습니다. 지금 필요한 것은 잘못 쓴 글을
        고쳐 쓰는 것이고, 장소 연결은 지우고 다시 쓰면 됩니다.
      properties:
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string, maxLength: 200, minLength: 1 }
        body: { type: string, maxLength: 5000, minLength: 1 }

    PostInput:
      type: object
      required: [board, title, body]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string, maxLength: 200 }
        body:
          type: string
          maxLength: 5000
          description: |
            본문. **상한이 컬럼이 아니라 제품이 정한 수입니다.**

            `post.body` 는 `TEXT` 라 안 막으면 65535**바이트**까지 들어갑니다(한글은
            utf8mb4 에서 한 자가 3바이트라 실질 약 21,800자). 그 수는 컬럼 타입이 흘린
            것이지 제품이 고른 것이 아니고, 상한이 없으면 로그인한 사람 누구나 수십 MB 짜리
            본문을 밀어 넣을 수 있습니다.

            2026-09-03 이전에는 이 상한이 계약에도 서버에도 없었습니다(#172 에서 찾음).
        loc:
          type: string
          maxLength: 100
          description: |
            표시용 장소 이름. **서버는 받은 값을 그대로 저장합니다.**

            `contentId` 가 있어도 서버가 이 값을 채우거나 덮지 않습니다 — 장소는 KTO 프록시
            **캐시**라 사용자가 고른 것의 행이 아직 없을 수 있고(`contentId` 설명 참조),
            그때 이름을 못 찾아 조용히 빈 값이 됩니다. 둘을 함께 보낼지, 이름만 보낼지는
            앱이 정합니다.

            앱은 지도의 장소 시트에서 올 때 둘을 같은 장소에서 뽑아 함께 보냅니다.
        contentId:
          type: string
          maxLength: 64
          description: 연결된 장소(선택). `Place.contentId` 와 같은 키입니다.

    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author:
          $ref: '#/components/schemas/PersonRef'
          description: |
            **2026-09 이전에는 `{nickname}` 뿐이라 사용자 식별자가 아예 없었습니다.**
            그래서 "내 댓글인가" 판별·프로필 이동·차단이 계약상 불가능했고, 앱은
            `post_detail_screen.dart` 에서 문자열 `'나'` 를 내 댓글 표식으로 쓰고 있었습니다.
            ADR-0017 규약 5 가 `PersonRef` 로 통일했습니다.
        body: { type: string }
        createdAt: { type: string, format: date-time }
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람이 이 작성자를 가렸는가**(#166). 규칙은 `Post.hiddenByBlock` 과 같습니다 —
            목록에서 빼지 않고 화면이 접습니다.

    GroupRole:
      type: string
      enum: [OWNER, MEMBER]
      description: |
        그룹 내 역할(생성자 `OWNER` / 참여자 `MEMBER`). **`chat_room_member.role` 그대로입니다** —
        2026-08 이전에는 소문자 `owner`/`member` 였는데, 값의 출처가 하나인데 표기가 둘이면
        앱이 어느 쪽으로 분기해야 하는지를 매번 물어야 합니다(이슈 #75).

    GroupMember:
      type: object
      description: |
        가족 그룹 멤버. **`group_member` 테이블은 만들지 않습니다** — 멤버십 표는
        `chat_room_member` 하나이고 이 스키마는 그 한 줄을 가족 그룹의 언어로 다시 적은
        것입니다. 둘을 두면 "가족인데 방에 없는 사람" 이라는 상태가 생기고 강퇴·차단이
        어느 쪽인지를 매번 물어야 합니다.
        근거: [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)
      required: [userId, nickname, role, joinedAt]
      properties:
        userId: { type: integer, format: int64 }
        nickname:
          type: string
          description: '`users` 의 현재 닉네임. 탈퇴했으면 `알 수 없음` 입니다'
          example: "보리아빠"
        role: { $ref: '#/components/schemas/GroupRole' }
        joinedAt: { type: string, format: date-time }

    Group:
      type: object
      description: |
        가족 그룹(family_group). 이름과 생성 시각만 드는 표이고, 초대코드도 멤버십도 여기
        없습니다.

        **`inviteCode` 필드가 없습니다.** 초대코드는 `chat_room_invite` 로 옮겼습니다 —
        그룹이 아니라 **방**에 붙고 만료·사용횟수·회수를 가집니다. 발급은
        `POST /api/chat/rooms/{roomId}/invites` 이고, 그 `roomId` 가 아래 필드입니다.
        근거: [ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72) · 이슈 #75
      required: [id, name, roomId, members, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리네 가족" }
        roomId:
          type: integer
          format: int64
          description: 이 그룹의 방. 초대 발급·회수·채팅이 전부 이 id 로 갑니다
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        createdAt: { type: string, format: date-time }

    CareType:
      type: string
      enum: [water, meal, walk, med, vet]
      description: 물 갈아주기/밥/산책/약/병원

    CareDoer:
      type: object
      description: |
        케어를 한 사람 / 주의사항을 고친 사람.

        이름만으로는 부족해서 `userId` 를 함께 싣습니다 — 앱은 "아빠가 줬습니다" 와 "내가
        줬습니다" 를 갈라 그리고, 그 판정은 닉네임이 아니라 id 로 합니다(닉네임은 겹칠 수도
        바뀔 수도 있습니다).

        **탈퇴한 계정이면 `userId` 가 `0`, `nickname` 이 `알 수 없음` 입니다.**
        `care_log.done_by` 와 `walk_note.updated_by` 는 `ON DELETE SET NULL` 이라
        (한 사람의 탈퇴가 가족이 함께 보는 기록과 메모를 지우지 않습니다) **사람은 없는데
        기록은 있는** 상태가 정상으로 존재합니다. `0` 은 어떤 `users.id` 와도 같지 않아서
        앱의 "내가 했는가" 판정이 조용히 참이 되지 않습니다.
      required: [userId, nickname]
      properties:
        userId:
          type: integer
          format: int64
          description: 수행자의 `users.id`. 탈퇴했으면 `0`
        nickname:
          type: string
          description: 현재 닉네임. 없으면 이름, 그것도 없으면 `알 수 없음`(탈퇴한 계정 포함)
          example: "보리엄마"

    CareLog:
      type: object
      description: "케어 기록(care_log): 누가·언제 어떤 케어를 했는지 가족과 공유."
      # dogId·memo 는 선택 입력이라 비어 있을 수 있다.
      # groupId 는 group-scoped 경로에서만 채워진다.
      required: [id, type, doneBy, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        dogId:
          type: [integer, "null"]
          format: int64
          description: |
            대상 강아지. **지금은 항상 `null` 입니다** — `dog` 표가 정본 스키마에 없어서
            (`docs/03-database/schema.md §3` 은 계획입니다) 서버가 검증할 수 있는 강아지 id 가
            존재하지 않습니다. 필드를 미리 두는 것은 그 표가 생기는 날 앱이 스키마를 바꾸지
            않아도 되게 하려는 것입니다.
        groupId: { type: [integer, "null"], format: int64, description: 가족 그룹(개인 기록이면 null) }
        type: { $ref: '#/components/schemas/CareType' }
        doneBy: { $ref: '#/components/schemas/CareDoer' }
        occurredAt:
          type: string
          format: date-time
          example: "2026-09-02T15:30:00Z"
          description: |
            **오프셋이 붙습니다.** 예시의 `Z` 는 KST 2026-09-03 00:30 입니다 — 하루 경계는
            `Asia/Seoul` 이므로 이 기록은 **9월 3일의 케어**입니다(info 의 시각 규약 참조).

            2026-09-03 이전에는 오프셋 없이 나갔습니다. `format: date-time` 은 RFC3339
            오프셋을 요구하므로 계약 위반이었고, 앱은 그것을 기기 지역 시각으로 읽었습니다.
        memo: { type: [string, "null"], maxLength: 500, example: "사료 반 컵 + 습식 토핑" }

    CareLogInput:
      type: object
      description: |
        필드가 둘뿐입니다. `dogId` 는 확인할 표가 없어서(위 `CareLog.dogId` 참조) 필수로 두면
        앱이 더미 id 를 지어내야 하고, `occurredAt`·`doneBy` 는 서버가 정합니다 — 그 둘이 곧
        "오늘 누가 했는지" 를 가르는 기준이라 클라이언트가 정하면 화면의 문구를 믿을 수 없게
        됩니다. 지난 일을 나중에 적는 화면은 M4 입니다.
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/CareType' }
        memo: { type: string, maxLength: 500 }

    ChatRoom:
      type: object
      description: |
        채팅방(chat_room). **가족 그룹 전용이 아닙니다** — 출처는 `originKind`/`originRef`
        쌍이고, 가족 그룹은 그 여러 출처 중 하나입니다.
      # myRole 은 입장 응답에서 null 이 될 수 있다(내 멤버 행을 못 찾은 방어적 기본값).
      # lastMessage 는 아직 아무 말도 없는 방에서 null 이다.
      # isDefault·members 는 서버가 아예 안 싣는다 — 방 상세 조회가 미구현이다.
      required: [id, title, tag, originKind, originRef, lastSeq, lastReadSeq, unread, memberCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: "우리 가족" }
        tag:
          type: string
          description: 화면이 방 종류를 표시할 때 쓰는 값. `originKind` 를 그대로 내려줍니다
          example: "가족"
        originKind: { type: string, example: "FAMILY" }
        originRef:
          type: string
          description: 출처 도메인의 id 를 문자열로. **FK 가 아닙니다**
          example: "12"
        isDefault:
          type: boolean
          description: |
            기본방(가족방) 표식. **서버가 아직 내려주지 않습니다** — "가족방이 기본" 이라는
            판단은 `originKind` 를 해석하는 것이라 chat 이 답할 수 없습니다(ADR-0011).
            앱은 `originKind` 로 직접 가릅니다.
        lastSeq:
          type: integer
          format: int64
          description: 방의 마지막 `room_seq`. 발급 카운터와 같은 컬럼입니다
        lastReadSeq: { type: integer, format: int64, description: 내 읽음 워터마크 }
        unread:
          type: integer
          description: |
            `lastSeq − lastReadSeq`. 서버가 뺄셈으로 냅니다 — 읽음 표를 두지 않습니다.
        memberCount: { type: integer, example: 3 }
        myRole: { type: string, enum: [OWNER, MEMBER] }
        lastMessage:
          description: |
            마지막 메시지 미리보기. 아직 아무 말도 없는 방과 **입장 응답**
            (`POST /api/chat/invites/{code}/join`)에서는 `null` 입니다 — 뒤의 것은 방금 들어온
            사람에게 조회를 하나 더 붙일 이유가 없어서입니다(앱은 곧바로 방 화면으로 갑니다).
          allOf:
            - $ref: '#/components/schemas/ChatMessage'
        members:
          type: array
          description: 방 상세 조회(`GET /api/chat/rooms/{roomId}`)에만 실립니다
          items: { $ref: '#/components/schemas/ChatRoomMember' }
        createdAt: { type: string, format: date-time }

    ChatRoomMember:
      type: object
      description: 방 멤버십(chat_room_member). 멤버십 표는 이것 하나입니다
      # 이 스키마를 내보내는 구현이 아직 없다(방 상세 조회가 x-status: planned).
      # 그래서 이 목록은 코드가 아니라 **의도**에서 왔다 — 같은 개념인 GroupMember 와
      # 글자까지 같게 맞춘다. 구현이 붙는 날 실제 응답 DTO 와 대조할 것.
      # removedAt·rejoinBlocked 는 강퇴된 멤버에게만 뜻이 있다.
      required: [userId, nickname, role, joinedAt]
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string, example: "보리아빠" }
        role: { type: string, enum: [OWNER, MEMBER] }
        lastReadSeq: { type: integer, format: int64 }
        joinedAt: { type: string, format: date-time }
        removedAt:
          type: [string, "null"]
          format: date-time
          description: 강퇴 시각. **행은 지우지 않습니다** — 미읽음이 이 행의 뺄셈입니다
        rejoinBlocked:
          type: boolean
          description: 강퇴 = 재입장 금지. 유효한 초대코드로도 들어오지 못합니다

    ChatInvite:
      type: object
      description: 초대코드(chat_room_invite). 그룹 행의 컬럼이 아니라 별도 표입니다
      # expiresAt·maxUses 는 무제한일 수 있고, revokedAt 은 회수된 코드에만 있다.
      required: [code, roomId, usedCount, createdAt]
      properties:
        code: { type: string, example: "PAW-2K7Q" }
        roomId: { type: integer, format: int64 }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: '`null` 이면 무기한. 기본은 발급 + 7일'
        maxUses:
          type: [integer, "null"]
          description: '`null` 이면 무제한(기본)'
        usedCount: { type: integer }
        revokedAt:
          type: [string, "null"]
          format: date-time
          description: |
            회수(`DELETE`) 시각. 찍히면 이 코드는 즉시 막히고 기존 멤버는 남습니다.
            **재발급은 이전 코드를 회수하지 않습니다** — 발급을 두 번 하면 코드 둘이
            각각 TTL 동안 독립된 열쇠로 삽니다. 유출 대응은 그 코드를 지목해 `DELETE`
            하는 것입니다
        createdAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      description: |
        채팅 메시지(chat_message). 순서·델타·미읽음의 기준은 방별 `roomSeq` 하나이고,
        `id` 는 커서가 아닙니다.
      # deletedAt 은 지워진 메시지에만 있다.
      required: [id, roomId, roomSeq, senderUserId, senderName, contentType, body, createdAt, hiddenByBlock]
      properties:
        id:
          type: integer
          format: int64
          description: '**커서로 쓰지 마세요.** 배정 시점과 가시성 시점이 다릅니다'
        roomId: { type: integer, format: int64 }
        roomSeq:
          type: integer
          format: int64
          description: 방 안에서 빈틈 없이 1씩 증가. 델타·순서·미읽음의 유일한 근거
        senderUserId: { type: integer, format: int64 }
        senderName:
          type: string
          description: |
            `users` 에 있으면 현재 닉네임, 없으면(탈퇴) `알 수 없음` 입니다.
            `"익명"` 은 쓰지 않습니다 — 커뮤니티 화면에서 이미 다른 뜻으로 쓰이고 있습니다.
          example: "보리아빠"
        contentType: { type: string, default: text }
        body: { type: string, example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶" }
        createdAt: { type: string, format: date-time }
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: 소프트 삭제. 행을 지우면 뺀 자리가 `roomSeq` 빈틈이 됩니다
        hiddenByBlock:
          type: boolean
          default: false
          description: |
            **읽는 사람마다 다른 값입니다.** 이 요청을 보낸 사람이 발신자를 가렸으면 `true` 고,
            같은 메시지가 다른 사람에게는 `false` 입니다 — 가리기는 내 화면에서만 접는 것입니다.

            **`true` 여도 목록에서 빠지지 않고 `body` 도 그대로 옵니다.** 빼면 그 `roomSeq` 가
            도달하지 않아 미읽음 뱃지가 영원히 남고(`deletedAt` 과 같은 이유), 본문을 지워
            내리면 "보기" 를 누를 때 요청이 한 번 더 필요해집니다.

            앱은 이 자리에 **"가린 사람의 메시지입니다. 보기"** 를 그리고, "보기" 는 이미 받아
            둔 `body` 를 펼칩니다.

    ChatMessagePage:
      type: object
      description: |
        채팅 목록 응답. 공용 `Page`(`nextCursor`)를 쓰지 않습니다 — 커서가 `roomSeq` 이고,
        클라이언트가 미읽음을 맞추려면 방의 현재 `lastSeq` 가 함께 필요하기 때문입니다.
      required: [items, lastSeq, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        lastSeq:
          type: integer
          format: int64
          description: 방의 현재 마지막 `room_seq`
        hasMore: { type: boolean }

    WalkNote:
      type: object
      description: |
        산책 시 주의사항(`walk_note`) — **그룹당 한 장**입니다.

        `id` 를 싣지 않습니다. 그룹당 한 장이라 그 id 로 갈 수 있는 경로가 없고, 아무 데도 못
        쓰는 식별자를 두면 앱이 그걸 키로 삼습니다. 아직 아무도 안 쓴 그룹은 `body` 가 빈
        문자열이고 `updatedBy`·`updatedAt` 이 `null` 입니다.
      required: [groupId, body]
      properties:
        groupId: { type: integer, format: int64 }
        body:
          type: string
          maxLength: 500
          description: 메모 전문. 앱은 줄바꿈으로 나눠 목록처럼 그립니다
          example: "횡단보도 앞에서 오토바이에 짖어요"
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/CareDoer'
            - type: "null"
          description: |
            마지막으로 고친 사람. **아직 아무도 안 썼으면 `null`** 입니다(그때는 `body` 도
            빈 문자열입니다). 메모는 있는데 고친 사람이 **탈퇴한** 경우는 `null` 이 아니라
            `알 수 없음` 인 `CareDoer` 입니다 — 둘을 같은 모양으로 뭉개면 "가족이 쓴 안전
            메모" 와 "빈 그룹" 이 화면에서 구별되지 않습니다.
        updatedAt:
          type: [string, "null"]
          format: date-time
          example: "2026-09-02T15:30:00Z"
          description: |
            **오프셋이 붙습니다** — `CareLog.occurredAt` 과 같은 규약입니다(#209).
            아직 아무도 안 썼으면 `null` 입니다.

    WalkNoteInput:
      type: object
      description: |
        전체 교체 본문. 빈 문자열은 "다 지웠다" 는 정상 요청입니다.
      required: [body]
      properties:
        body:
          type: string
          maxLength: 500
          example: "횡단보도 앞에서 오토바이에 짖어요"
