  # ─────────────────────────── Groups ───────────────────────────
  /api/groups:
    post:
      tags: [Groups]
      summary: 가족 그룹 생성
      description: |
        가족 그룹을 만들고 초대코드를 발급합니다. 생성자는 `owner` 역할로 자동 참여합니다.
        가족 간 케어 공유로 이중 급여(밥 두 번)·산책 누락을 막는 기능의 시작점입니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "보리네 가족" }
      responses:
        '201':
          description: 생성됨(초대코드 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/join:
    post:
      tags: [Groups]
      summary: 초대코드로 그룹 참여
      description: 가족에게 받은 초대코드로 그룹에 `member` 역할로 참여합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string, example: "PAW-2K7Q" }
      responses:
        '200':
          description: 참여됨(그룹 + 멤버 목록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/me:
    get:
      tags: [Groups]
      summary: 내 그룹 조회(멤버 목록 포함)
      description: 내가 속한 가족 그룹과 멤버 목록을 반환합니다. 속한 그룹이 없으면 404.
      responses:
        '200':
          description: 내 그룹
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/{groupId}/care-logs:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 오늘의 케어 조회
      description: |
        그룹의 케어 기록(물 갈아주기/밥/산책 등)을 조회합니다. 기본은 오늘(KST) —
        누가·언제 했는지 가족이 함께 봅니다.
      parameters:
        - name: date
          in: query
          description: 조회 날짜(생략 시 오늘, KST)
          schema: { type: string, format: date, example: "2026-07-10" }
        - name: type
          in: query
          description: 케어 종류 필터(생략 시 전체)
          schema: { $ref: '#/components/schemas/CareType' }
      responses:
        '200':
          description: 케어 기록 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CareLog' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Groups]
      summary: 케어 기록 남기기
      description: "물/밥/산책 등을 기록합니다. done_by(수행자)는 토큰의 사용자로 서버가 기록합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareLogInput' }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

