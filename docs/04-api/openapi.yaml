openapi: 3.1.0
info:
  title: Pawloop API
  version: 0.1.0
  description: |
    Pawloop(포루프) — 반려동물 산책·동반장소·커뮤니티 앱의 REST API 계약.

    이 문서는 **design-first(계약 우선)** 로 작성되었습니다. 프론트엔드(Flutter)가 먼저 만들어졌고,
    프론트가 실제로 필요로 하는 데이터를 기준으로 이 계약을 정의합니다. 백엔드(Spring Boot + MySQL 공간형)는
    이 계약을 구현합니다.

    **이 파일이 API 계약의 단일 출처(SSOT)입니다.** 같은 폴더의 `api-spec.md` 는 사람이 읽는 요약이며,
    두 문서의 값이 충돌하면 **언제나 이 파일이 우선**합니다.

    - 인증: JWT Bearer(HS256). `sub` 는 서버가 발급한 **불투명 사용자 키**입니다.
      이메일이라고 가정하거나 문자열을 파싱하지 마세요. 사용자 식별 정보가 필요하면 `GET /auth/me` 로 조회합니다.
      (발급 규칙은 서버 내부 사항이며 예고 없이 바뀝니다. 클라이언트 계약은 어느 쪽이든
       "파싱하지 않는 불투명 키"입니다.)
    - 소셜 로그인 계정과 이메일 가입 계정은 **같은 경로로 동작합니다.** 어느 쪽 토큰으로든
      `GET /auth/me`·`PUT /auth/me`·`DELETE /auth/me`·`POST /auth/logout` 이 200/204 입니다.
      (2026-08 이전에는 소셜 계정에서 400 이었습니다. #5 에서 해소되었습니다.)
    - 인증 요구 여부는 **각 오퍼레이션의 `security` 선언이 정본**입니다. 아래 한 줄은 요약일 뿐입니다:
      MVP에선 읽기(장소 조회 등)는 비인증 허용, 쓰기(산책 저장·글 작성)는 인증 필요.
    - **오류 응답 규약** (#44 · #10)
      - `401` 은 **본문이 없습니다.** 인증 계층이 상태 코드만 돌려줍니다 — 토큰 없음·위조·만료·
        탈퇴한 계정의 살아 있는 토큰·이메일 로그인의 자격증명 실패가 전부 같은 모양입니다.
      - 그 밖의 오류는 **전부** `Error` 스키마(`{ error: { code, message, traceId } }`)입니다.
        `code` 는 HTTP 상태 하나당 하나로 고정된 닫힌 목록입니다(`Error.code` 의 enum 참조).
        (2026-08 이전에는 `{status, error, message, path, timestamp}` 였고, `SocialController` 는
         또 다른 `{ "error": "문자열" }` 을 돌려줬습니다. #10 이 하나로 합쳤습니다.)
      - **알 수 없는 경로는 `404`** 입니다. `message` 는 `요청한 경로를 찾을 수 없습니다.`
      - `500` 의 `message` 에는 **원인이 실리지 않습니다.** 고정 문구이고, 이 요청을 지목하는
        열쇠는 `error.traceId`(= `X-Correlation-Id` 응답 헤더)입니다. 서버 로그에서 그 ID 로
        원인을 찾습니다 — 예외 메시지를 그대로 실으면 SQL 조각·경로·이메일이 새어 나갑니다.
      - 컨트롤러가 `403`·`404`·`409` 를 명시적으로 정해 던지면 그 코드가 그대로 나갑니다.
        (2026-08 이전에는 전부 `500` 이었습니다.)
    - 목록은 커서 페이지네이션(`items`/`nextCursor`/`hasMore`).
    - 좌표: `lat`(위도), `lng`(경도). (관광공사 원본은 mapy=위도, mapx=경도)
    - 리네임 진행 중: 제품명은 Pawloop, 도메인·딥링크 스킴은 당분간 heattrip 을 유지합니다
      (`https://api.heattrip.link`, `heattrip://login-callback`).
    - `미구현` 이라고 적힌 오퍼레이션은 계약만 있고 백엔드 핸들러가 없습니다(2026-08 기준).
      Prism 목 서버로는 통과하지만 실서버에서는 404 입니다.
servers:
  - url: https://api.heattrip.link
    description: 운영(예정 — 패키지/도메인 리네임 전까지 기존 유지)
  - url: http://localhost:4010
    description: Prism 목 서버 (design-first mock)
  - url: http://10.0.2.2:8080
    description: 로컬 백엔드 (안드로이드 에뮬레이터 → 호스트)

tags:
  - name: Auth
    description: |
      소셜 로그인(카카오·구글) · 이메일 가입/로그인 · 토큰 · 내 정보.
      네이버는 백엔드 설정이 남아 있으나 제품 결정상 **보류**입니다(#15).
      지원 공급자의 단일 출처는 `components.parameters.Provider` 의 enum 입니다.

      **인가 경계** — 비인증 허용은 `/auth/signup`, `/auth/login`, `/auth/oauth/**`,
      `/auth/token/refresh`, 그리고 Spring Security 가 처리하는 `/oauth2/**`·`/login/oauth2/**` 뿐입니다.
      `/auth/me`(GET·PUT·DELETE)와 `/auth/logout` 은 **반드시 bearerAuth 검증을 거쳐야 합니다.**
      (구현 참조: `SecurityConfig` 의 permitAll 목록에 `/auth/**` 를 통째로 넣지 말 것 — 이슈 #23)
  - name: Dogs
    description: 반려견 프로필
  - name: Places
    description: 반려동반 장소(관광공사) · 동물병원/펫샵/산책로 레이어
  - name: Walks
    description: 산책 기록(GPS 경로) · 통계
  - name: Community
    description: 게시판 · 댓글 · 반응
  - name: Bookmarks
    description: 저장한 장소
  - name: Groups
    description: |
      가족 그룹 · 오늘의 케어 공유 · 산책 주의사항

      **초대와 멤버십은 이 태그에 없습니다.** 초대코드는 `chat_room_invite`, 멤버십은
      `chat_room_member` 이고 둘 다 Chat 태그의 경로가 다룹니다
      ([ADR-0011](https://github.com/sanghyunbang/heattrip/issues/72)).
      2026-08 이전에는 `POST /api/groups/join` 과 `Group.inviteCode` 가 여기 있었습니다 —
      그룹당 코드 하나가 영구히 사는 모양이라 만료·사용횟수·회수를 걸 자리가 없었고,
      멤버십 표가 둘이면 "가족인데 방에 없는 사람" 이라는 상태가 생깁니다. 이슈 #75 가
      정리했습니다. 지금 참여는 `POST /api/chat/invites/{code}/join` 입니다.
  - name: Chat
    description: |
      범용 다중 방 채팅. **가족 그룹 전용이 아닙니다** — 방은 `chat_room` 이고,
      가족 그룹은 `origin_kind`/`origin_ref` 로 방과 이어진 여러 출처 중 하나입니다.

      **순서·델타·미읽음은 전부 방별 `roomSeq` 하나로 풉니다.** `id`(AUTO_INCREMENT)를
      커서로 쓰지 않습니다 — 배정 시점과 가시성 시점이 달라 `afterId` 폴링이 메시지를
      영구히 건너뜁니다. 그래서 이 태그의 목록 응답은 공용 `Page`(`nextCursor`)를
      쓰지 않고 `lastSeq`/`hasMore` 를 직접 돌려줍니다.

      MVP 는 **폴링**(`afterSeq`)입니다. 소켓은 실측 트리거가 걸릴 때만 엽니다(M2.9).

security:
  - bearerAuth: []

paths:
  # ─────────────────────────── Auth ───────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: |
        `AuthController.signup` 이 처리합니다. 성공은 **201 + `User`** 입니다(이슈 #10 에서 구현).

        > ⚠️ **2026-08 이전에는 `200 OK` + 본문 `"회원가입 성공"`(평문)이었습니다.**
        > 상태 코드와 본문 형태가 함께 바뀌었습니다. 200 만 성공으로 보던 클라이언트는
        > 201 도 성공으로 받아야 하고, 본문을 문자열로 읽던 코드는 JSON 으로 읽어야 합니다.

        같은 이메일이 이미 있으면 **409** 입니다. 예전에는 400 이었고, 앱은 "입력이 틀렸다"와
        "이미 가입돼 있다"를 구분할 수 없었습니다. 오류 본문은 공통 `Error` 이며
        409 의 `error.code` 는 `CONFLICT` 입니다.

        **이 응답에는 토큰이 없습니다.** 가입 직후 로그인 상태로 만들려면 클라이언트가
        `POST /auth/login` 을 한 번 더 호출해야 합니다 — 가입과 인증을 한 응답에 묶지 않는 것은
        의도입니다(가입 폼의 재시도가 토큰 발급을 반복하지 않습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupInput' }
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일/비밀번호 로그인
      description: |
        `AuthController.login` 이 처리합니다. 응답은 `AuthTokens` JSON 입니다(이슈 #10 에서 구현).

        > ⚠️ **2026-08 이전에는 본문이 JSON 이 아니라 JWT 원문 문자열이었습니다.**
        > `response.body` 를 그대로 토큰으로 저장하던 클라이언트는 이제 `accessToken` 필드를
        > 읽어야 합니다. 그렇게 고치지 않으면 JSON 전체가 토큰으로 저장되어 모든 요청이 401 이 됩니다.

        `refreshToken` 이 여기에 실립니다 — 서버는 #9 부터 발급·저장하고 있었지만 응답에 실을
        자리가 없어 아무에게도 전달되지 않았습니다. `isNew` 는 이 경로에서 **항상 `false`** 입니다
        (이미 있는 계정으로 들어오는 경로라 답이 정해져 있습니다).

        **자격증명 실패는 본문 없는 401 입니다.** 가입되지 않은 이메일과 비밀번호 오류를
        구분하지 않습니다 — 구분해 주면 그 자체가 가입 여부를 묻는 조회 수단이 됩니다(#6).
        예전에는 두 경우 모두 **500** 이었습니다(`IllegalAccessException` 이 전역 처리기의
        catch-all 에 잡혔습니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /oauth2/authorization/{provider}:
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작(302 리다이렉트) — Spring Security OAuth2 진입점
      description: |
        앱(`flutter_web_auth_2`)이 실제로 여는 URL 입니다. 공급자 인증 화면으로 302 리다이렉트됩니다.
        인증 성공 시 백엔드가 앱 딥링크로 리다이렉트합니다:
        `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` (이슈 #14).

        **딥링크에는 토큰이 없습니다.** 쿼리 파라미터는 정확히 `code` 와 `state` 둘뿐입니다.
        앱은 받은 `code` 를 `POST /auth/oauth/{provider}/callback` 으로 교환해 `AuthTokens` 를
        받습니다. 코드는 **60초 살고 한 번 쓰면 죽습니다** — 두 번째 교환은 401 입니다.

        > **2026-08 이전에는 이 딥링크가 `?token=<JWT>&refresh=<refreshToken>` 이었습니다(#9).**
        > 커스텀 스킴(`heattrip://`)은 어느 앱이든 등록할 수 있고, URL 은 302 응답의 `Location`
        > 헤더(액세스·프록시 로그)와 브라우저 히스토리에 남습니다. 그 채널로 1시간짜리 액세스
        > 토큰과 14일짜리 refresh 토큰이 함께 나가고 있었습니다. 지금 나가는 것은 60초짜리
        > 1회용 난수뿐이라, 가로채도 쓸 수 있는 창이 사실상 없습니다. 서버는 이 리다이렉트에
        > 여전히 `Cache-Control: no-store` 를 붙입니다.

        > ⚠️ **`state` 는 앱이 만들어 앱이 대조합니다.** 인증을 시작할 때
        > `GET /oauth2/authorization/{provider}?state=<난수>` 로 보내면 서버가 그 값을 왕복 동안
        > 붙들었다가 딥링크에 그대로 실어 돌려줍니다. 돌아온 값이 보낸 값과 다르면 **로그인 실패로
        > 처리하세요** — 응답 바꿔치기를 막는 장치가 그것뿐입니다. `[A-Za-z0-9_-]{1,128}` 만
        > 통과합니다(그 밖의 값은 없는 것으로 취급되어 빈 `state` 가 돌아옵니다).
        >
        > ⚠️ **`state` 없이 시작한 로그인은 교환 단계에서 401 입니다(#14).** 빈 `state` 로 발급된
        > 코드는 `POST /auth/oauth/{provider}/callback` 이 거부합니다 — 그렇지 않으면 서버쪽
        > 대조의 존재 여부를 왕복을 시작한 쪽이 정하게 되어, `state` 를 생략하기만 하면
        > 두 번째 줄이 사라집니다. **항상 `state` 를 보내세요.**

        **실패도 같은 딥링크로 돌아옵니다**: `heattrip://login-callback?error=<code>`.
        앱은 `code` 와 `error` 중 어느 쪽이 실려 있는지로 성공/실패를 가릅니다.
        현재 서버가 보내는 `code` 는 다음이 전부입니다.

        | `error` | 뜻 | 앱이 할 일 |
        |:---|:---|:---|
        | `email_already_registered` | 같은 이메일이 다른 경로로 이미 가입돼 있다 (#7) | 기존 가입 방식으로 로그인하도록 안내 |
        | `account_state_invalid` | 인증 주체에 `users.id` 가 없어 토큰을 발급할 수 없다 (#5) | 일반 오류 안내 후 재시도 |
        | `authentication_failed` | 그 밖의 모든 실패(공급자 오류·사용자 취소 등)의 기본값 | 일반 오류 안내 후 재시도 |

        공급자가 돌려준 오류 코드가 `[a-z0-9_]{1,64}` 를 만족하면 그대로 전달될 수 있습니다.
        즉 목록은 닫혀 있지 않습니다 — **모르는 `code` 는 일반 오류로 처리**하세요.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 성공 딥링크에 그대로 실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}`.
            보내지 않으면 딥링크의 `state` 는 빈 값이고, 그 코드는 교환 단계에서 401 입니다(#14).
            사실상 필수입니다 — `required: false` 인 것은 이 경로가 302 를 막지 않기 때문입니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: 공급자 로그인 페이지로 리다이렉트
          headers:
            Location:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }

  /login/oauth2/code/{provider}:
    get:
      tags: [Auth]
      summary: 공급자 리디렉션 수신(Spring Security 내부 콜백)
      description: |
        공급자 콘솔에 등록해야 하는 승인 리디렉션 URI 입니다. 값은 `{server.url}/login/oauth2/code/{provider}`.
        성공 시 앱 딥링크 `heattrip://login-callback?code=<1회용 코드>&state=<앱이 만든 난수>` 로
        302 합니다(#14). 클라이언트가 직접 호출하는 경로가 아닙니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '302':
          description: 앱 딥링크로 리다이렉트
          headers:
            Location:
              schema: { type: string }

  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작 — `/oauth2/authorization/{provider}` 로의 302 래퍼
      description: |
        `AuthController.startOAuth` 가 처리합니다(이슈 #10 에서 구현). **인증 로직을 다시
        구현하지 않습니다** — `Location: /oauth2/authorization/{provider}` 로 302 를 줄 뿐이고,
        공급자 왕복과 딥링크 복귀는 그쪽(Spring Security `oauth2Login`)이 그대로 처리합니다.

        > **2026-08 이전 이 절은 "백엔드에 이 경로의 핸들러가 없습니다" 라고 적었습니다. 거짓이었습니다.**
        > 핸들러는 있었고 **빈 200** 을 돌려줬습니다. 계약과 구현이 서로 다른 거짓을 말하고
        > 있었고, `AuthContractSpecTest.unimplementedOperations_areMarkedAsSuch` 가 그 거짓을
        > 초록불로 고정하고 있었습니다. 셋을 함께 고쳤습니다.

        앱은 이 경로를 쓸 필요가 없습니다 — `GET /oauth2/authorization/{provider}` 를 직접 열면
        리다이렉트 한 번을 아낍니다. 이 경로는 계약을 보고 구현한 클라이언트가 막다른 길에
        빠지지 않게 하는 호환 표면입니다.

        `provider` 가 아래 enum 에 없으면 302 가 아니라 **400** 이고, 본문은 공통 `Error`
        (`error.code` = `VALIDATION`)입니다. 302 로 넘겨 봐야 등록이 없는 공급자는 그쪽에서
        원인을 알 수 없는 오류가 됩니다. 대소문자와 앞뒤 공백은 가리지 않습니다.

        > ⚠️ **`state` 는 이 래퍼를 통과해 전달됩니다(#14).** `GET /auth/oauth/kakao?state=S` 는
        > `Location: /oauth2/authorization/kakao?state=S` 로 302 합니다. **2026-08 초에는 이 래퍼가
        > 쿼리를 옮기지 않았고**, 그래서 이 경로로 시작한 로그인은 딥링크에 빈 `state` 를 받아
        > 앱쪽 대조에서 **항상** 실패했습니다 — 계약이 이 경로를 호환 표면이라고 광고하면서
        > 따르면 반드시 실패하는 함정이었습니다.
        >
        > `[A-Za-z0-9_-]{1,128}` 를 만족하지 않는 `state` 는 **붙지 않습니다**(잘라 쓰거나
        > 인코딩하지 않습니다). 이 값은 `Location` 헤더에 그대로 들어가므로 검증 없이 이어
        > 붙이면 헤더·파라미터 주입이 됩니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: state
          in: query
          required: false
          description: |
            앱이 만든 난수. 통과하면 302 대상의 쿼리로 그대로 옮겨지고, 성공 딥링크에
            실려 돌아옵니다. `[A-Za-z0-9_-]{1,128}` 를 만족하지 않으면 붙지 않습니다.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '302':
          description: |
            Spring Security 진입점으로 리다이렉트. `Location` 은
            `/oauth2/authorization/{provider}`(소문자로 정규화된 값)이고, 화이트리스트를
            통과한 `state` 가 있으면 `?state=<값>` 이 이어 붙습니다.
          headers:
            Location:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/oauth/{provider}/callback:
    post:
      tags: [Auth]
      summary: 1회용 코드 → 토큰 교환 (소셜 로그인의 마지막 단계)
      description: |
        `AuthController.exchangeOAuthCode` 가 처리합니다(이슈 #14). **소셜 로그인에서 토큰이
        클라이언트에 도달하는 유일한 통로입니다** — 딥링크에는 `code` 와 `state` 만 실립니다.

        > **2026-08 이전 이 절은 "미구현 — 백엔드에 핸들러가 없습니다" 였고, 소셜 로그인은
        > 302 딥링크로 액세스 토큰과 refresh 토큰을 함께 전달했습니다(#9).** 그래서
        > `AuthTokens` 의 `expiresIn`·`isNew`·`user` 는 소셜 경로에서 클라이언트에 도달할
        > 방법이 없었고, 소셜 신규 가입자는 온보딩으로 가지 못했습니다. 지금은 도달합니다.

        `code` 는 딥링크로 받은 **1회용 인가 코드**입니다. 공급자가 준 인가코드가 아닙니다 —
        공급자와의 코드 교환은 백엔드(Spring Security)가 이미 끝냈습니다. 그래서 이 흐름에는
        PKCE 가 없습니다(앱이 공급자와 직접 말하게 바꾸는 날 필수가 됩니다).
        그 판단의 근거와 트리거는 `docs/99-decisions/decision-log.md` 의 **ADR-0009** 에 있습니다.

        **코드는 60초 살고 한 번 쓰면 죽습니다.** 재사용·만료·공급자 불일치·`state` 부재·
        `state` 불일치는 전부 **본문 없는 401** 입니다. 구분해 주면 그 응답 차이가 "그 코드가 존재하긴 했는가"를
        알려 주는 오라클이 됩니다. 실패한 교환도 코드를 죽입니다 — 코드 하나에 시도 한 번입니다.

        `state` 는 앱이 인증을 시작할 때 만들어 보낸 값과 같아야 합니다. 앱쪽 대조를 대신하지
        않습니다 — 코드를 그것이 시작된 인증 왕복에 묶어 두는 두 번째 줄입니다.

        > ⚠️ **빈 `state` 로 발급된 코드는 교환되지 않습니다(401).** 2026-08 초에는 "양쪽 다
        > 비어 있으면 통과" 였는데, 그러면 이 검사를 켜고 끄는 스위치를 클라이언트가 쥐게 됩니다 —
        > `state` 를 생략하기만 하면 서버쪽 두 번째 줄이 사라집니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 딥링크로 받은 1회용 코드(패딩 없는 Base64URL 43자)
                state:
                  type: string
                  description: 인증 시작 때 앱이 만들어 저장해 둔 난수
                redirectUri:
                  type: string
                  example: "heattrip://login-callback"
                  description: |
                    **리다이렉트 대상으로 쓰이지 않습니다.** 이 시점에는 리다이렉트가 이미
                    끝났고, 대상은 서버 설정(`app.security.oauth.redirect-allowlist`)이 정합니다.
      responses:
        '200':
          description: 토큰 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: 액세스 토큰 갱신(refresh 토큰 회전)
      description: |
        `AuthController.refresh` 가 처리합니다(이슈 #9). 인증이 필요 없습니다 — 주체는 본문의
        refresh 토큰 자체가 증명합니다.

        **회전합니다.** 성공하면 옛 refresh 토큰은 그 자리에서 폐기되고 응답에 **새 refresh
        토큰**이 함께 실립니다. 클라이언트는 받은 새 값으로 반드시 교체 저장해야 합니다.

        **재사용 감지.** 이미 폐기된 refresh 토큰이 다시 오면 유출로 간주해 **그 사용자의 모든
        세션을 폐기**하고 401 을 돌려줍니다. 즉 옛 토큰으로 한 번 재시도하면 방금 정상적으로
        받았던 새 토큰도 함께 죽습니다. 만료·미존재는 그냥 401 이며 다른 세션을 끊지 않습니다.

        > ⚠️ **클라이언트는 갱신 요청을 직렬화(single-flight)해야 합니다.** 같은 refresh 토큰으로
        > 동시에 두 번 보내면 한쪽만 이기고 다른 쪽은 재사용으로 처리되어 전 기기가 끊깁니다.
        > 서버는 유예 창을 두지 않습니다 — 유예를 두면 정당한 클라이언트와 탈취자를 구분하지
        > 못한 채 탈취자에게도 유예를 주게 됩니다.

        **형식이 맞는 요청**의 실패는 원인과 무관하게 **본문 없는 401** 입니다 — 없는 토큰,
        빈 문자열, `{}`(필드 생략), 만료, 폐기, 재사용이 전부 같은 모양입니다.

        **형식 자체가 깨진 요청**은 401 이 아니라 400·415·405 입니다(이슈 #9). 읽을 수 없는
        JSON·배열 본문·`refreshToken` 이 문자열이 아닌 경우는 **400**, `Content-Type` 이
        `application/json` 이 아니면 **415**, `POST` 가 아닌 메서드는 **405** 입니다.
        이 세 응답의 본문은 공통 `Error`(`{ error: { code, message, traceId } }`)이며
        **예외 메시지를 싣지 않습니다** — 파서 메시지에 요청 본문(= refresh 토큰 원문)
        조각이 섞이기 때문입니다(#6). `message` 는 상태마다 고정 문구입니다.
        (2026-08 이전에는 `{ status, error, message, path, timestamp }` 였습니다 — #10 에서
        전역 오류 본문을 계약의 `Error` 하나로 통일했습니다.)

        > 앱에게: **400·415·405 를 401 처럼 다루지 마세요.** 그건 재로그인 사유가 아니라
        > 클라이언트 요청이 잘못됐다는 신호이고, 재시도해도 결과가 같습니다.

        refresh 토큰은 JWT 가 아니라 256bit 난수를 패딩 없는 Base64URL 로 적은 43자 불투명
        문자열이며, 서버에는 SHA-256 해시만 저장됩니다. 파싱하지 마세요.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400':
          description: |
            요청 본문을 읽을 수 없음(깨진 JSON·배열 본문·타입 불일치). `message` 는 고정
            문구입니다 — 파서 메시지를 그대로 실으면 refresh 토큰 원문 조각이 새어 나갑니다(#6).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415':
          description: |
            `Content-Type` 이 `application/json` 이 아님. 본문 형태는 400 과 같습니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Auth]
      summary: 내 정보 수정(부분 수정 — 보낸 필드만 반영, 생략한 필드는 유지)
      description: |
        시맨틱이 부분 수정이므로 장기적으로는 `PATCH /auth/me` 가 옳습니다.
        현행 구현이 `PUT` 이라 계약도 `PUT` 으로 적되, `PATCH` 전환은 별도 정리 이슈로 남깁니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: 회원 탈퇴
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃(전 기기 — 해당 사용자의 모든 세션을 폐기)
      description: |
        `AuthController.logout` 이 인증된 주체를 받아 204 를 돌려줍니다.
        어느 쪽 토큰(소셜·이메일 가입)으로 불러도 204 이고, 토큰이 없으면 401 입니다.

        **서버측 폐기가 실제로 일어납니다**(이슈 #9 에서 구현되었습니다). Authorization 헤더의
        액세스 토큰으로 주체를 식별해 그 사용자의 서버측 세션(refresh 토큰)을 **전부** 폐기합니다.
        범위는 **전 기기 로그아웃**입니다 — 특정 기기 하나만 끊는 요청 본문은 정의하지 않습니다.
        멱등입니다 — 이미 폐기된 상태여도 204 를 반환합니다.

        **알려진 한계: 이미 발급된 액세스 토큰은 만료(≤1시간)까지 유효합니다.** 토큰 단위
        무효화에는 `jti` 클레임과 블록리스트 저장소가 필요한데, 그것은 이 작업의 범위가
        아닙니다(아래 `bearerAuth` 참고). 그러므로 클라이언트는 저장한 토큰을 반드시 스스로
        삭제해야 합니다.

        한계: 액세스 토큰이 이미 만료된 상태에서는 이 계약으로 로그아웃을 호출할 수 없습니다.
        refresh 토큰만으로 폐기하는 경로는 정의돼 있지 않습니다 — 그 상태의 클라이언트는
        저장한 토큰을 지우기만 하면 되고, 서버의 refresh 토큰은 14일 뒤 만료됩니다.
      responses:
        '204': { description: 로그아웃됨(멱등) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Dogs ───────────────────────────
  /api/dogs:
