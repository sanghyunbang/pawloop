        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/dogs/{dogId}:
    parameters:
      - name: dogId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Dogs]
