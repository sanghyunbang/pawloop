  # ─────────────────────────── Places ───────────────────────────
  /api/places/nearby:
    get:
      tags: [Places]
      summary: 내 주변 장소 조회
      description: |
        현위치 좌표 기준 주변의 반려동반 가능 장소를 거리순으로 반환합니다.
        `source=kto`는 관광공사 KorPetTourService2 캐시, `vet`/`shop`은 LOCALDATA(동물병원/펫샵),
        `trail`은 두루누비(산책로) 레이어입니다. (현재 프론트는 KTO 직접호출 + 병원/펫샵/산책로 더미)
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, example: 37.5665 }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double, example: 126.9816 }
        - name: radius
          in: query
          description: 반경(m)
          schema: { type: integer, default: 8000, maximum: 20000 }
        - name: category
          in: query
          description: 카테고리 필터(생략 시 전체). KTO contentTypeId 또는 레이어 키.
          schema:
            type: string
            enum: ['12', '14', '28', '32', '38', '39', 'vet', 'shop', 'trail']
        - name: limit
          in: query
          schema: { type: integer, default: 80, maximum: 200 }
      responses:
        '200':
          description: 장소 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/places/{contentId}:
    get:
      tags: [Places]
      summary: 장소 상세
      security: []
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 장소 상세(반려동반 상세정보 포함)
