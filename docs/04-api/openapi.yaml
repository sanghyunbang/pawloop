        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Groups]
      summary: 메시지 전송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶" }
      responses:
        '201':
          description: 전송됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/groups/{groupId}/walk-notes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: 산책 주의사항 조회(가족 공유 메모)
      responses:
        '200':
          description: 주의사항 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalkNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Groups]
      summary: 산책 주의사항 전체 교체
      description: 그룹의 공유 메모를 통째로 교체합니다(간단한 MVP 규약).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: array
                  items: { type: string }
                  example: ["횡단보도 앞에서 오토바이에 짖어요", "저녁 산책은 목줄 짧게"]
      responses:
        '200':
          description: 교체 후 최신 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalkNote' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <JWT>`. 서명 알고리즘은 HS256.

        현재 발급되는 클레임은 다음 4개뿐입니다.

        | 클레임 | 값 | 비고 |
        |:---|:---|:---|
        | `sub` | 불투명 사용자 키 | **파싱 금지.** 이메일이라고 가정하지 마세요 |
        | `role` | 예: `ROLE_USER` | |
        | `iat` | 발급 시각 | |
        | `exp` | 만료 시각 | |

        아직 **없는** 클레임: `jti`(토큰 단위 무효화 불가 — 로그아웃해도 액세스 토큰은 만료까지 유효),
        `prv`(공급자).

        `jti` 는 이슈 #9 에서 도입하지 않기로 했습니다. 그 클레임은 **블록리스트 저장소라는
        소비자가 있어야** 의미가 있는데, MySQL 블록리스트는 모든 인증 요청마다 DB 조회를 1회
        더하면서 고작 1시간짜리 창을 줄입니다. #9 는 refresh 토큰 원장까지이며, Redis 로
        뒷받침되는 액세스 토큰 블록리스트는 M2 이후 별도 Epic 입니다.
        `prv` 는 읽는 코드가 없고, 가변 값을 불변 토큰에 복제하는 형태라 도입 계획이 없습니다
        (`provider` 는 `GET /auth/me` 가 DB 에서 돌려줍니다).

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: |
        MVP 지원 공급자는 `kakao` · `google` 입니다. `naver` 는 백엔드 설정과 매핑 코드가
        남아 있어 enum 에 유지하지만 제품 결정상 **보류** 상태입니다(#15).
      schema: { type: string, enum: [kakao, naver, google] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: 이전 응답의 nextCursor
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: |
        인증 필요/무효. **본문이 없습니다** — 상태 코드 401 만 돌아오고 `Content-Type` 도 없습니다.

        토큰 없음·서명 위조·만료·옛 형식 subject·탈퇴한 계정의 살아 있는 토큰이 전부 같은 모양입니다.
        인증 실패의 원인을 본문으로 알려 주면 그 자체가 탐색 수단이 되기 때문입니다(#6).
        클라이언트는 `error.code` 를 읽어 분기하지 말고 **상태 코드 401 만 보고** 재로그인으로 보내세요.
        (2026-08 이전에는 이 절이 JSON `Error` 본문을 선언했지만 서버는 그때도 본문을 주지 않았습니다.
         계약 쪽을 실제 동작에 맞춥니다 — #5.)
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 요청 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 중복
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: "외부 데이터 한도 초과(예: KTO 1000콜/일)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "해당 장소를 찾을 수 없습니다." }
            traceId: { type: string }

    Page:
      type: object
      # nextCursor 는 마지막 페이지에서 null 이므로 required 에 넣지 않는다.
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {}
        nextCursor: { type: [string, "null"], example: "eyJpZCI6MTIzfQ==" }
        hasMore: { type: boolean }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: |
            폐기 가능한 불투명 문자열(JWT 아님, 패딩 없는 Base64URL 43자). 수명은 14일이며
            `POST /auth/token/refresh` 를 쓸 때마다 회전합니다 — 응답의 새 값으로 교체 저장하세요.

            **어디에 실리는가(2026-08 현재):** 소셜 로그인 딥링크의 `refresh` 파라미터와
            `POST /auth/token/refresh` 의 200 응답입니다. `POST /auth/login`·`/auth/signup` 의
            현행 구현은 아직 JWT 원문 문자열을 반환하므로 여기에 실리지 않습니다 — 그 응답을
            이 스키마로 맞추는 것은 이슈 #10 입니다(서버는 이미 발급·저장하고 있습니다).
        expiresIn: { type: integer, description: 초, example: 3600 }
        isNew:
          type: boolean
          default: false
          description: |
            이번 인증으로 계정이 새로 생성되었으면 true. **로그인 응답 1회성 이벤트 속성**이며
            사용자 프로필의 영속 속성이 아닙니다(그래서 `User` 가 아니라 여기에 있습니다).
            true 면 프론트는 온보딩(반려견 프로필 등록)으로 유도합니다.
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      # 최소 보장. id 가 없으면 클라이언트가 아무것도 할 수 없다.
      # `{}` 가 유효한 User 로 통과하던 상태를 막기 위한 것이다(이슈 #23-A).
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        email:
          type: [string, "null"]
          format: email
          description: 로그인 ID. 소셜 공급자가 이메일을 주지 않으면 null 일 수 있습니다.
        name: { type: [string, "null"] }
        nickname:
          type: [string, "null"]
          example: "보리아빠"
          description: 소셜 가입 경로에서는 설정되지 않아 null 일 수 있습니다(#7).
        gender: { type: [string, "null"], enum: [MALE, FEMALE, OTHER, null] }
        age: { type: [integer, "null"] }
        travelType: { type: [string, "null"], description: 현재 스키마는 단일 문자열 }
        imageUrl: { type: [string, "null"], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        provider:
          type: [string, "null"]
          enum: [local, kakao, naver, google, null]
          description: |
            계정 출처. `local` = 이메일/비밀번호 가입.
            `users.provider` 컬럼과 `UserResponse.provider` 로 구현돼 있습니다(#7).
            소셜 계정의 식별 키는 `(provider, social_id)` 이며 이메일이 아닙니다.
            백필 SQL 이 아직 실행되지 않은 환경의 옛 행은 `null` 일 수 있습니다.

    SignupInput:
      type: object
      required: [email, password, nickname, agreeTos, agreePrivacy]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        nickname: { type: string }
        name: { type: string }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            선택. **안 보내면 `User.gender` 가 `null`(미지정)로 저장됩니다** — '기타'와 구분됩니다.
            대소문자를 가리지 않습니다(`male` 도 됩니다). 목록에 없는 값은 **400** 입니다
            — 조용히 OTHER 로 바꾸지 않습니다(#42).
        ageGroup:
          type: string
          enum: [under14, over14]
          default: over14
          description: >
            선택. 안 보내면 `over14` 입니다. 대소문자를 가리지 않습니다.
            목록에 없는 값은 **400** 입니다 — `over14` 로 떨어뜨리면 미성년자를
            성인으로 취급하게 됩니다(#42).
        agreeTos: { type: boolean, description: 필수 — false/null 이면 400 }
        agreePrivacy: { type: boolean, description: 필수 — false/null 이면 400 }
        agreeMarketing: { type: boolean, description: 선택 }
        tosVersion: { type: string, default: "v1.0" }
        privacyVersion: { type: string, default: "v1.0" }
        marketingVersion: { type: string, default: "v1.0" }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    UserUpdate:
      type: object
      # 부분 수정 — 보낸 필드만 반영한다. 빈 객체는 의미가 없으므로 최소 1개를 요구한다.
      minProperties: 1
      properties:
        name: { type: string }
        nickname: { type: string }
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
          description: >
            보내면 바꿉니다. 안 보내면 그대로 둡니다(부분 수정).
            목록에 없는 값은 **400** 입니다(#42).
        age: { type: integer }
        travelType: { type: string }
        imageUrl: { type: string, format: uri }
        agreeMarketing: { type: boolean }

    DogSize:
      type: string
      enum: [small, medium, large]
      description: 소형견/중형견/대형견

    Dog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리" }
        breed: { type: string, example: "믹스견" }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date, example: "2024-01-15" }
        ageMonths: { type: integer, description: birth로부터 계산(응답 편의), example: 30 }
        neutered: { type: boolean }
        avatarUrl: { type: [string, "null"] }

    DogInput:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        breed: { type: string }
        size: { $ref: '#/components/schemas/DogSize' }
        birth: { type: [string, "null"], format: date }
        neutered: { type: boolean, default: false }

    Place:
      type: object
      description: 지도/리스트에 뿌리는 장소(프론트 PetPlace와 대응).
      properties:
        contentId: { type: string, example: "2733967" }
        title: { type: string, example: "서울숲" }
        source: { type: string, enum: [kto, vet, shop, trail], example: kto }
        category: { $ref: '#/components/schemas/PlaceCategory' }
        contentTypeId: { type: string, example: "12", description: "KTO 콘텐츠타입(12관광지/14문화/28레포츠/32숙박/38쇼핑/39음식점)" }
        lat: { type: number, format: double, example: 37.5445 }
        lng: { type: number, format: double, example: 127.0374 }
        addr: { type: string, example: "서울특별시 성동구 뚝섬로 273" }
        tel: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        distM: { type: number, format: double, description: 조회 기준점으로부터 거리(m), example: 320 }

    PlaceCategory:
      type: string
      description: 프론트 카테고리 키(KTO contentTypeId 또는 레이어 키)
      enum: ['12', '14', '28', '32', '38', '39', 'vet', 'shop', 'trail']

    PlaceDetail:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          properties:
            overview: { type: [string, "null"], description: 개요 }
            petInfo:
              type: object
              description: 반려동물 동반 상세(KTO detailPetTour2 — 대부분 자유텍스트)
              properties:
                acmpyPsblCpam: { type: [string, "null"], description: 동반 가능 반려동물 }
                acmpyNeedMtr: { type: [string, "null"], description: 동반 시 필요사항 }
                etcAcmpyInfo: { type: [string, "null"], description: 기타 유의사항 }

    Walk:
      type: object
      properties:
        id: { type: integer, format: int64 }
        dogId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        distanceM: { type: integer, example: 2400 }
        durationS: { type: integer, example: 2280 }
        path:
          type: array
          description: GPS 경로. [경도, 위도] 좌표 배열(GeoJSON LineString의 coordinates). DB엔 LINESTRING으로 저장.
          items:
            type: array
            items: { type: number, format: double }
            minItems: 2
            maxItems: 2
          example: [[127.0374, 37.5445], [127.0402, 37.5455]]
        memo: { type: [string, "null"] }
        weather: { type: [string, "null"], example: "맑음 24°C" }

    WalkInput:
      type: object
      required: [dogId, startedAt, distanceM, durationS]
      properties:
        dogId: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        distanceM: { type: integer }
        durationS: { type: integer }
        path:
          type: array
          items:
            type: array
            items: { type: number, format: double }
        memo: { type: string }
        weather: { type: string }

    WalkStats:
      type: object
      properties:
        weekKm:
          type: array
          description: 월~일 요일별 거리(km). 길이 7.
          items: { type: number, format: double }
          example: [2.1, 2.9, 1.2, 0, 1.8, 3.1, 2.4]
        totalKm: { type: number, format: double, example: 13.5 }
        walkCount: { type: integer, example: 6 }
        avgKm: { type: number, format: double, example: 2.3 }
        topPlaces:
          type: array
          description: 자주 간 곳 상위
          items:
            type: object
            properties:
              place: { type: string, example: "서울숲" }
              count: { type: integer, example: 3 }

    Board:
      type: string
      enum: ["산책로 후기", "동반장소", "건강·병원", "자유", "자랑"]

    ReactionType:
      type: string
      enum: [help, cute, empathy]
      description: 도움돼요/귀여워요/공감

    ReactionSummary:
      type: object
      properties:
        help: { type: integer }
        cute: { type: integer }
        empathy: { type: integer }
        mine: { type: [string, "null"], description: "내가 누른 반응(없으면 null)" }

    Post:
      type: object
      properties:
        id: { type: integer, format: int64 }
        author:
          type: object
          properties:
            id: { type: integer, format: int64 }
            nickname: { type: string, example: "보리아빠" }
        board: { $ref: '#/components/schemas/Board' }
        loc: { type: [string, "null"], example: "서울숲" }
        placeId: { type: [string, "null"], description: 연결된 장소(선택) }
        title: { type: string, example: "서울숲 아침 산책 코스 추천" }
        body: { type: string }
        commentCount: { type: integer, example: 4 }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        createdAt: { type: string, format: date-time }

    PostInput:
      type: object
      required: [board, title, body]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string }
        body: { type: string }
        loc: { type: string }
        placeId: { type: string }

    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        author:
          type: object
          properties:
            nickname: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    GroupRole:
      type: string
      enum: [owner, member]
      description: 그룹 내 역할(생성자 owner / 참여자 member)

    GroupMember:
      type: object
      description: 가족 그룹 멤버(group_member)
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        nickname: { type: string, example: "보리아빠" }
        role: { $ref: '#/components/schemas/GroupRole' }
        joinedAt: { type: string, format: date-time }

    Group:
      type: object
      description: 가족 그룹(family_group). 초대코드로 가족을 초대한다.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "보리네 가족" }
        inviteCode: { type: string, example: "PAW-2K7Q" }
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        createdAt: { type: string, format: date-time }

    CareType:
      type: string
      enum: [water, meal, walk, med, vet]
      description: 물 갈아주기/밥/산책/약/병원

    CareLog:
      type: object
      description: "케어 기록(care_log): 누가·언제 어떤 케어를 했는지 가족과 공유."
      properties:
        id: { type: integer, format: int64 }
        dogId: { type: integer, format: int64 }
        groupId: { type: [integer, "null"], format: int64, description: 가족 그룹(개인 기록이면 null) }
        type: { $ref: '#/components/schemas/CareType' }
        doneBy:
          type: object
          description: 수행한 가족 구성원
          properties:
            userId: { type: integer, format: int64 }
            nickname: { type: string, example: "보리엄마" }
        occurredAt: { type: string, format: date-time }
        memo: { type: [string, "null"], example: "사료 반 컵 + 습식 토핑" }

    CareLogInput:
      type: object
      required: [dogId, type]
      properties:
        dogId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/CareType' }
        occurredAt: { type: string, format: date-time, description: 생략 시 서버 현재 시각 }
        memo: { type: string }

    ChatMessage:
      type: object
      description: 가족 채팅 메시지(chat_message)
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        author:
          type: object
          properties:
            userId: { type: integer, format: int64 }
            nickname: { type: string, example: "보리아빠" }
        body: { type: string, example: "보리 저녁밥 방금 줬어요! 또 주지 마세요 🐶" }
        createdAt: { type: string, format: date-time }

    WalkNote:
      type: object
      description: 산책 시 주의사항(walk_note — 가족 공유 메모)
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        body: { type: string, example: "횡단보도 앞에서 오토바이에 짖어요" }
        createdAt: { type: string, format: date-time }
