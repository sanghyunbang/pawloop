<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690" id="architecture" role="img" aria-labelledby="architecture-t architecture-d">
<title id="architecture-t">Pawloop 시스템 구성</title>
<desc id="architecture-d">Flutter 앱이 HTTPS 443 으로 EC2 의 Caddy 에 붙는다. Caddy 는 같은 EC2 안의 Spring Boot 두 벌(app-blue · app-green) 앞에 서고, 평소에는 한 벌만 돈다. Spring Boot 는 같은 EC2 의 MySQL 컨테이너(데이터는 별도 EBS)와 S3 를 쓰고, 공공데이터·OpenAI·푸시·소셜 로그인은 서버만 키를 들고 부른다. 운영 설정은 부팅 때 SSM 파라미터에서 받는다.</desc>
<defs>
  <marker id="architecture-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#b7ab94"/>
  </marker>
</defs>
<style>
  #architecture .bg{fill:#f7f4ed}
  #architecture .band{fill:#f1ece1;stroke:#cdc4b2;stroke-width:1.5}
  #architecture .card{fill:#ffffff;stroke:#cdc4b2;stroke-width:1.5}
  #architecture .mine{fill:#fbf1dc;stroke:#9a6b12;stroke-width:2}
  #architecture .keyb{fill:#e6f2ef;stroke:#2f7d74;stroke-width:2}
  #architecture .warnb{fill:#fdecea;stroke:#b3261e;stroke-width:2}
  #architecture .idle{fill:#ffffff;stroke:#b7ab94;stroke-width:1.5;stroke-dasharray:6 5}
  #architecture .t{font:600 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#1f1d1a}
  #architecture .tb{font:700 16px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#1f1d1a}
  #architecture .h{font:700 13px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#6b6457;letter-spacing:.06em}
  #architecture .s{font:400 12.5px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#6b6457}
  #architecture .m{font:500 12px 'SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#6b6457}
  #architecture .mine-t{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#9a6b12}
  #architecture .key-t{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#2f7d74}
  #architecture .key-n{font:800 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#2f7d74}
  #architecture .warn-t{font:700 15px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#b3261e}
  #architecture .warn-n{font:800 26px 'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;fill:#b3261e}
  #architecture .ln{fill:none;stroke:#b7ab94;stroke-width:1.8}
  #architecture .ln-key{fill:none;stroke:#2f7d74;stroke-width:2.4}
  #architecture .ln-warn{fill:none;stroke:#b3261e;stroke-width:2.4}
  #architecture .dash{fill:none;stroke:#b7ab94;stroke-width:1.5;stroke-dasharray:6 5}
</style>
<rect width="920" height="690" class="bg"/>
<text x="40" y="40" class="tb">시스템 구성</text>
<text x="40" y="62" class="s">앱은 키를 들지 않는다 · 계약은 openapi.yaml 하나</text>
<rect x="40" y="84" width="540" height="108" rx="10" class="band"/>
<text x="56" y="106" class="h">사용자 기기</text>
<rect x="56" y="116" width="508" height="62" rx="10" class="mine"/>
<text x="72" y="140" class="mine-t">Flutter 앱</text>
<text x="176" y="136" class="m">v2/screens</text>
<text x="176" y="154" class="s">화면</text>
<text x="274" y="136" class="m">v2/domain</text>
<text x="274" y="154" class="s">순수 규칙</text>
<text x="372" y="136" class="m">v2/data</text>
<text x="372" y="154" class="s">저장소·정책</text>
<text x="470" y="136" class="m">AuthedClient</text>
<text x="470" y="154" class="s">401 자동 갱신</text>
<path d="M310 192 L310 236" class="ln" marker-end="url(#architecture-a)"/>
<text x="322" y="214" class="m">HTTPS 443</text>
<rect x="40" y="240" width="540" height="392" rx="10" class="band"/>
<text x="56" y="262" class="h">AWS EC2 · t3.medium</text>
<rect x="56" y="274" width="508" height="54" rx="10" class="card"/>
<text x="72" y="299" class="t">Caddy</text>
<text x="72" y="317" class="s">TLS 종료 · 앞단 하나</text>
<text x="548" y="299" class="m" text-anchor="end">:443</text>
<text x="548" y="317" class="s" text-anchor="end">lb_policy first · health 3초</text>
<path d="M180 328 H180 V362" class="ln" marker-end="url(#architecture-a)"/>
<path d="M440 328 H440 V362" class="dash" marker-end="url(#architecture-a)"/>
<rect x="56" y="366" width="248" height="86" rx="10" class="mine"/>
<text x="72" y="390" class="mine-t">app-blue</text>
<text x="72" y="410" class="s">Spring Boot 3.5.4 · Java 21</text>
<text x="72" y="428" class="s">지금 서비스 중</text>
<rect x="316" y="366" width="248" height="86" rx="10" class="idle"/>
<text x="332" y="390" class="t">app-green</text>
<text x="332" y="410" class="s">같은 이미지, 다음 판</text>
<text x="332" y="428" class="s">평소에는 꺼져 있다</text>
<rect x="56" y="462" width="508" height="46" rx="10" class="card"/>
<text x="72" y="481" class="h">Spring Modulith 경계 — 22개 중 도메인 7</text>
<text x="72" y="500" class="m">chat · walk · community · place · schedule · moderation · family</text>
<path d="M180 508 L180 542" class="ln" marker-end="url(#architecture-a)"/>
<rect x="56" y="546" width="508" height="66" rx="10" class="card"/>
<text x="72" y="572" class="t">MySQL 8</text>
<text x="72" y="592" class="s">경로는 LINESTRING · 장소는 0.02° 격자 캐시</text>
<text x="548" y="572" class="s" text-anchor="end">같은 EC2 · 컨테이너</text>
<text x="548" y="592" class="s" text-anchor="end">데이터는 별도 EBS (/mnt/data)</text>
<rect x="610" y="84" width="270" height="548" rx="10" class="band"/>
<text x="626" y="106" class="h">바깥 — 서버만 키를 들고 부른다</text>
<rect x="626" y="116" width="238" height="78" rx="10" class="card"/>
<text x="642" y="140" class="t">S3</text>
<text x="642" y="160" class="s">사진·영상. 좌표와 EXIF 는</text>
<text x="642" y="178" class="s">기기에서 지우고 올린다</text>
<rect x="626" y="204" width="238" height="78" rx="10" class="mine"/>
<text x="642" y="228" class="mine-t">공공데이터</text>
<text x="642" y="248" class="s">관광공사 · 행정안전부 · 두루누비</text>
<text x="642" y="266" class="s">키는 서버에만 있다</text>
<rect x="626" y="292" width="238" height="78" rx="10" class="card"/>
<text x="642" y="316" class="t">OpenAI</text>
<text x="642" y="336" class="s">주간 요약 두 문장</text>
<text x="642" y="354" class="s">규칙 문장이 먼저 뜬다</text>
<rect x="626" y="380" width="238" height="62" rx="10" class="card"/>
<text x="642" y="404" class="t">FCM · SES</text>
<text x="642" y="424" class="s">푸시와 메일</text>
<rect x="626" y="452" width="238" height="62" rx="10" class="card"/>
<text x="642" y="476" class="t">소셜 로그인</text>
<text x="642" y="496" class="s">구글 · 카카오 · 네이버 · 애플</text>
<rect x="626" y="524" width="238" height="78" rx="10" class="mine"/>
<text x="642" y="548" class="mine-t">SSM 파라미터</text>
<text x="642" y="568" class="s">운영 .env 정본</text>
<text x="642" y="586" class="s">부팅 때 받아 간다</text>
