# Gradle 설정 — 이슈 #46
#
# 값마다 왜 그 값인지 남긴다. 근거 없는 튜닝은 다음 사람이 지울 수 없다.

# 태스크 출력 재사용. test 태스크의 입력이 #46 에서 정확해졌기 때문에 켤 수 있다.
# 입력이 부정확한 채로 캐시를 켜면 "안 바뀌었다"는 오판이 더 자주, 더 조용히 일어난다.
org.gradle.caching=true

# 단일 모듈이라 프로젝트 간 병렬화 이득은 없지만, 같은 모듈 안 독립 태스크
# (compileJava / processResources 등)는 겹쳐 돈다. 해가 없어 켠다.
org.gradle.parallel=true

# 설정 캐시는 켜지 않는다. Spring Boot 플러그인과 jacoco 태스크가 설정 시점에
# 프로젝트를 참조하는 부분이 있어 경고가 쏟아진다. 검증 없이 켜면 빌드가
# 조용히 다르게 동작할 수 있다. 필요해지면 그때 측정하고 켠다.
# org.gradle.configuration-cache=true
