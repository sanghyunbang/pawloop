plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id 'jacoco'
	id "org.jetbrains.kotlin.plugin.spring" version '2.2.20'
}

group = 'com.heattrip'
version = '2.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
		// Testcontainers 버전은 여기 한 곳에서만 정한다. 개별 모듈에 버전을 적으면
		// mysql / junit-jupiter 가 서로 다른 버전으로 갈라진다. 이슈 #26.
		//
		// Spring Boot 3.5.4 가 관리하는 값은 1.21.3 인데, 그걸 쓰면 Docker Engine 29 에서
		// 컨테이너가 아예 뜨지 않는다("Could not find a valid Docker environment", /info 가 400).
		// Docker 29 는 API 버전 1.44 미만을 거부하는데 1.21.3 은 더 낮은 버전으로 붙는다.
		// 그래서 Boot 의 관리 버전을 덮어쓴다. 되돌리려면 Docker 29 에서 먼저 확인할 것.
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.4'
	}
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok (먼저 처리되어야 함)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // MapStruct (Lombok 이후 처리)
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // Lombok ↔ MapStruct 바인딩 (마지막에 추가)
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JWT 관련 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// webFlux -> api호출 관련
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// AWS S3
	// implementation 'software.amazon.awssdk:s3:2.20.89'
	implementation ('com.amazonaws:aws-java-sdk-s3:1.12.574') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// csv 주입 관련
	implementation ('com.opencsv:opencsv:5.9') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}


    // Swagger (springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // 잭슨 어노테이션
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    // Spring AI (OpenAI)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
	implementation "org.jetbrains.kotlin:kotlin-stdlib"

	// TEST관련
	testRuntimeOnly 'com.h2database:h2'

	// Testcontainers — 검색의 핵심 경로가 MySQL FULLTEXT(MATCH ... AGAINST) 전용이라
	// H2 로는 검증할 수 없다. 실제 MySQL 8.0 컨테이너를 띄워서 돌린다. 이슈 #26.
	// 컨테이너는 src/test/java/.../support/MySqlTestContainer 에서 JVM 당 한 번만 뜬다.
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	// 태그 제외 없음. MySQL 전용 경로(FULLTEXT MATCH...AGAINST)는 이슈 #26 에서
    // Testcontainers 로 실제 MySQL 8.0 위에서 돌게 했다. 다시 제외하지 말 것 —
    // 제외하면 검색의 핵심 경로가 CI 에서 한 번도 검증되지 않는 상태로 돌아간다.
    // 전제: Docker 가 있어야 한다(GitHub Actions ubuntu-latest 는 기본 탑재).
    useJUnitPlatform()

    // 테스트는 'test' 프로파일로 돈다 → src/test/resources/application-test.properties.
    // 이게 없으면 jwt.secret 등 기본값 없는 플레이스홀더 10개가 해결되지 않아
    // @SpringBootTest 컨텍스트가 뜨지 않는다. 이슈 #22 참조.
    systemProperty 'spring.profiles.active', 'test'

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

// 커버리지 하한선. 정책은 이슈 #21, 도입 이슈는 #22.
//
// 전역 하한을 걸지 않는 이유: 레거시가 많아 첫날부터 실패한다. 실패하는
// 게이트는 며칠 안에 무시당하고, 그러면 없느니만 못하다. 대신 이번
// 마일스톤(M2)에서 손대는 인증 패키지만 범위로 잡는다.
//
// 하한 이력 (올릴 때는 근거를 남긴다. **내리는 것은 금지.**)
//   0.17  2026-08 도입(#22). 당시 실측 17.2% 를 그대로 하한으로 삼았다.
//         목표 80% 에 바로 걸면 첫 PR부터 빨강이라 "내려가지 않게" 막는 것부터 했다.
//   0.80  2026-08-29(#21). #7(소셜 계정 모델)이 68.1%, #26 머지 후 실측 83.3% 가 되어
//         #21 이 정한 목표치를 넘겼다. 하한이 0.17 에 머물면 게이트가 아무것도 지키지
//         못한다 — 그 상태에서는 이 두 패키지의 테스트를 절반 넘게 지워도 CI 가 통과했다.
def authCoveragePackages = [
        'com/heattrip/heat_trip_backend/OAuth/**',
        'com/heattrip/heat_trip_backend/user/**'
]

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    // 게이트 대상을 인증 패키지로 좁힌다. 나머지는 리포트에만 남는다.
    classDirectories.setFrom(
            files(sourceSets.main.output.classesDirs.collect { dir ->
                fileTree(dir: dir, includes: authCoveragePackages)
            })
    )

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80   // 실측 83.3% (2026-08-29). 이력은 위 주석 참조 (#21)
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}
