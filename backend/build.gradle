plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id 'jacoco'
	id "org.jetbrains.kotlin.plugin.spring" version '2.2.20'
}

group = 'com.heattrip'
version = '2.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
	}
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok (먼저 처리되어야 함)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // MapStruct (Lombok 이후 처리)
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // Lombok ↔ MapStruct 바인딩 (마지막에 추가)
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JWT 관련 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// webFlux -> api호출 관련
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// AWS S3
	// implementation 'software.amazon.awssdk:s3:2.20.89'
	implementation ('com.amazonaws:aws-java-sdk-s3:1.12.574') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// csv 주입 관련
	implementation ('com.opencsv:opencsv:5.9') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}


    // Swagger (springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // 잭슨 어노테이션
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    // Spring AI (OpenAI)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
	implementation "org.jetbrains.kotlin:kotlin-stdlib"

	// TEST관련
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform {
        // 'mysql' 태그는 MySQL 전용 기능(FULLTEXT MATCH...AGAINST)에 의존한다.
        // H2 로는 500 이 나므로 기본 실행에서 제외한다. 되살리려면:
        //   ./gradlew test -PincludeTags=mysql   (실제 MySQL 필요)
        // 근본 해결(Testcontainers)은 이슈 #26.
        if (!project.hasProperty('includeTags')) {
            excludeTags 'mysql'
        } else {
            includeTags project.property('includeTags')
        }
    }

    // 테스트는 'test' 프로파일로 돈다 → src/test/resources/application-test.properties.
    // 이게 없으면 jwt.secret 등 기본값 없는 플레이스홀더 10개가 해결되지 않아
    // @SpringBootTest 컨텍스트가 뜨지 않는다. 이슈 #22 참조.
    systemProperty 'spring.profiles.active', 'test'

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

// 커버리지 하한선. 정책은 이슈 #21, 도입 이슈는 #22.
//
// 전역 하한을 걸지 않는 이유: 레거시가 많아 첫날부터 실패한다. 실패하는
// 게이트는 며칠 안에 무시당하고, 그러면 없느니만 못하다. 대신 이번
// 마일스톤(M2)에서 손대는 인증 패키지만 범위로 잡는다.
//
// 하한을 현재값(17.2%)에 맞춘 이유: 목표는 #21이 정한 80%지만 지금
// 거기에 걸면 첫 PR부터 빨강이다. 우선 "내려가지 않게" 막고,
// #13(OAuth 회귀 테스트)이 들어오는 대로 단계적으로 올린다.
// 올릴 때는 이슈에 근거를 남긴다. **내리는 것은 금지.**
def authCoveragePackages = [
        'com/heattrip/heat_trip_backend/OAuth/**',
        'com/heattrip/heat_trip_backend/user/**'
]

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    // 게이트 대상을 인증 패키지로 좁힌다. 나머지는 리포트에만 남는다.
    classDirectories.setFrom(
            files(sourceSets.main.output.classesDirs.collect { dir ->
                fileTree(dir: dir, includes: authCoveragePackages)
            })
    )

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.17   // 2026-08 실측 17.2% → 목표 0.80 (#13, #21)
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}
