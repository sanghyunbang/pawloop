import org.gradle.api.tasks.PathSensitivity

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.heattrip'
version = '2.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
		// Testcontainers 버전은 여기 한 곳에서만 정한다. 개별 모듈에 버전을 적으면
		// mysql / junit-jupiter 가 서로 다른 버전으로 갈라진다. 이슈 #26.
		//
		// Spring Boot 3.5.4 가 관리하는 값은 1.21.3 인데, 그걸 쓰면 Docker Engine 29 에서
		// 컨테이너가 아예 뜨지 않는다("Could not find a valid Docker environment", /info 가 400).
		// Docker 29 는 API 버전 1.44 미만을 거부하는데 1.21.3 은 더 낮은 버전으로 붙는다.
		// 그래서 Boot 의 관리 버전을 덮어쓴다. 되돌리려면 Docker 29 에서 먼저 확인할 것.
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.4'

		// 모듈 경계 검사(#100 · ADR-0012). 1.4 계열인 이유는 부록 호환표가 1.4 를 Boot 3.5
		// 기준으로 적고 있고 이 빌드가 3.5.4 이기 때문이다(위 plugins 블록). 2.x 는 Boot 4.0 을
		// 겨냥한 줄기라 지금 올리면 안 된다.
		// https://docs.spring.io/spring-modulith/reference/1.4/appendix.html
		mavenBom 'org.springframework.modulith:spring-modulith-bom:1.4.13'
	}
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok (먼저 처리되어야 함)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // MapStruct (Lombok 이후 처리)
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // Lombok ↔ MapStruct 바인딩 (마지막에 추가)
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 스키마 마이그레이션 (#592). 버전은 스프링 부트 BOM 이 정한다.
	//
	// 부팅할 때 db/migration 의 V 파일 중 **아직 안 돌린 것만** 돌리고, 하나라도 실패하면
	// 부팅을 멈춘다. 어디까지 갔는지는 flyway_schema_history 가 DB 안에 기억한다 —
	// 그전까지는 mysql/post-start/*.sql 쉰두 개를 손으로 돌렸고, 어디까지 돌았는지
	// 아무도 몰라서 scripts/check-migrations.sh 가 컬럼 존재를 하나씩 확인했다.
	//
	// flyway-mysql 이 따로 필요하다 — flyway-core 는 10.x 부터 DB 별 지원을 분리했다.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 모듈 경계 검사(#100 · ADR-0012). **테스트 스코프만이다** — 운영 클래스패스에 아무것도
	// 올라가지 않고 애플리케이션 동작이 바뀌지 않는다.
	//
	// starter-test 가 아니라 core 인 이유: starter-test 는 문서 생성(spring-modulith-docs)과
	// 모듈 단위 테스트(spring-modulith-test)를 같이 끌고 오는데, 뒤엣것은 스프링 컨텍스트를
	// 새로 띄워 컨텍스트 캐시 항목을 늘린다. 이번에 필요한 것은 정적 분석뿐이다.
	testImplementation 'org.springframework.modulith:spring-modulith-core'

	// package-info.java 의 @ApplicationModule / @NamedInterface (#103 · ADR-0012).
	// **런타임 동작이 없다** — 스프링이 이 애노테이션을 읽고 무언가를 하지는 않는다.
	// 구조 검사(테스트 스코프)가 읽는 메타데이터일 뿐이다. 다만 애노테이션이
	// main 소스의 package-info.java 에 붙으므로 컴파일 클래스패스에 있어야 한다.
	implementation 'org.springframework.modulith:spring-modulith-api'

	// 산책 경로를 LINESTRING 으로 다룬다 (#145 · ADR-0015). 버전은 Boot BOM 이 관리한다.
	//
	// ADR-0013 이 이 의존성을 기각했던 근거 둘 중 하나("SchemaDdlDriftTest 의 geometry 대조
	// 문제")는 성립하지 않는 것으로 실측됐다 — @Column(columnDefinition = "linestring srid 4326")
	// 을 **명시하면** SHOW CREATE TABLE 이 그대로 뽑고 빈 DB 에 재적용된다. 명시를 빼면
	// geometry 가 되고 그때는 그 문제가 실제로 생긴다.
	//
	// 다른 하나("공간 인덱스가 할 일이 없다")는 walk 에도 유효하다 — SPATIAL INDEX 는
	// 만들지 않는다. place 를 공간 컬럼으로 바꾸는 것은 여전히 별도 판단이다.
	implementation 'org.hibernate.orm:hibernate-spatial'

	// JWT 관련 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// webFlux -> api호출 관련
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// AWS S3
	// implementation 'software.amazon.awssdk:s3:2.20.89'
	implementation ('com.amazonaws:aws-java-sdk-s3:1.12.574') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// 좌표계 변환 — 행정안전부 인허가 데이터의 EPSG:5174(Bessel 중부원점 TM)를 WGS84 로 (이슈 #291).
	// EPSG 파라미터 DB(proj4j-epsg)는 안 든다 — 정의 문자열 하나를 Tm5174 가 직접 든다.
	implementation 'org.locationtech.proj4j:proj4j:1.4.3'

	// 푸시 발송 — Firebase Cloud Messaging HTTP v1 (이슈 #83). 레거시 서버 키 API 는 2024 년에 끝났다.
	// 키가 없으면 PushConfig 가 발송을 끈 클라이언트를 든다 — 의존성은 있어도 부팅에 키가 필요 없다.
	implementation 'com.google.firebase:firebase-admin:9.9.0'


    // Swagger (springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // 잭슨 어노테이션
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    // Spring AI (OpenAI)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'


	// TEST관련
	// H2 는 걷어냈다 (이슈 #49). 스프링 컨텍스트를 띄우는 테스트는 전부
	// AbstractMySqlIntegrationTest 로 실제 MySQL 8.0 컨테이너 위에서 돈다.
	// H2 를 다시 넣지 말 것 — 넣는 순간 베이스 클래스를 빼먹은 테스트가
	// 에러 없이 근사치 DB 로 돌아가고, 그 초록불은 거짓말이 된다.

	// Testcontainers — 검색의 핵심 경로가 MySQL FULLTEXT(MATCH ... AGAINST) 전용이라
	// H2 로는 검증할 수 없다. 실제 MySQL 8.0 컨테이너를 띄워서 돌린다. 이슈 #26.
	// 컨테이너는 src/test/java/.../support/MySqlTestContainer 에서 JVM 당 한 번만 뜬다.
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	// 태그 제외 없음. MySQL 전용 경로(FULLTEXT MATCH...AGAINST)는 이슈 #26 에서
    // Testcontainers 로 실제 MySQL 8.0 위에서 돌게 했다. 다시 제외하지 말 것 —
    // 제외하면 검색의 핵심 경로가 CI 에서 한 번도 검증되지 않는 상태로 돌아간다.
    // 전제: Docker 가 있어야 한다(GitHub Actions ubuntu-latest 는 기본 탑재).
    useJUnitPlatform()

    // ── 테스트 JVM 힙 (이슈 #560) ───────────────────────────────────
    //
    // 정하지 않으면 Gradle 기본값(512MB)이다. 2026-09-16 에 그 값에서 OutOfMemoryError 가
    // 났다 — 스프링 컨텍스트 여러 벌이 캐시에 살아 있는 채로 테스트가 늘어난 결과다.
    //
    // **증상이 OOM 으로 안 보인다는 것이 이 줄을 적는 이유다.** 겉으로는 관계도 없는
    // WalkSafetyEndpointIntegrationTest 다섯 개가 "Failed to load ApplicationContext" 로
    // 죽었고, 사슬을 끝까지 따라가야 Java heap space 가 나온다. 게다가 어느 테스트가
    // 죽는지는 실행 순서에 따라 바뀐다 — 고치는 사람이 자기 코드를 의심하며 하루를 쓴다.
    //
    // 2g 인 이유: 실측에서 죽던 조합이 여유 있게 지나가는 가장 작은 값이다. 올리기 전에
    // 컨텍스트를 줄일 수 있는지부터 보라 — 힙을 키우는 것은 원인이 아니라 여유를 주는 것뿐이다.
    maxHeapSize = '2g'

    // SchemaDdlDriftTest 가 Hibernate 로 DDL 을 뽑아 쓰는 파일. (이슈 #58)
    // Hibernate 의 schema-generation.scripts.create-target 은 **덮어쓰지 않고 append 한다** —
    // 지우지 않으면 실행마다 문장이 누적되고, 이어붙는 경계에서 두 문장이 붙어
    // 깨진 문장이 생긴다(실측: 52 → 104 → 156). 매 실행 전에 지운다.
    doFirst {
        delete file('build/generated-schema.sql')
    }

    // ── 스펙 테스트가 읽는 저장소 파일을 태스크 입력으로 선언한다 (이슈 #46) ──
    //
    // 왜 필요한가: AuthContractSpecTest 는 docs/04-api/openapi.yaml 을,
    // UserSchemaMigrationSpecTest 는 mysql/post-start/*.sql 과 mysql/README.md 를,
    // MySqlComposeParityTest 는 docker-compose.yml 을 읽는다. 그런데 Gradle 은 그
    // 파일들을 모르므로, 자바 소스가 그대로인 채 계약 문서만 바뀌면 test 태스크가
    // UP-TO-DATE 로 건너뛴다 — **계약이 깨졌는데 초록불이다.**
    //
    // 그걸 알기 때문에 지금까지는 매번 cleanTest 를 붙였고, 그러면 한 파일만 바뀌어도
    // 전체가 재실행된다. 입력을 선언하면 정확성과 속도가 함께 해결된다.
    //
    // 파일을 새로 읽는 스펙 테스트를 만들면 여기에 그 경로도 추가할 것.
    inputs.files(fileTree(dir: file('mysql'), include: '**/*'))
            .withPropertyName('operationalSqlAndRunbook')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(file('docker-compose.yml'))
            .withPropertyName('dockerCompose')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // prod 의 바깥문과 DB 볼륨 분리 (#609). CaddyIsTheOnlyDoorTest 와
    // ComposeWaitsAndReportsHealthTest 가 읽는다.
    //
    // 둘 다 "지워도 아무 에러가 안 나는" 설정이다 — Caddy 가 X-Real-IP 를 안 붙이면
    // rate limit 이 무너지고, 덧붙임이 없으면 배포마다 DB 가 날아간다. 선언하지 않으면
    // 그 파일만 고쳤을 때 test 가 UP-TO-DATE 로 건너뛴다.
    inputs.files(file('Caddyfile'), file('docker-compose.prod.yml'))
            .withPropertyName('prodEdge')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // BootAssetsTravelWithTheCloneTest 가 읽는 무시 규칙(#591·#601). 이 검사가 지키는 것은
    // "부팅 자산이 클론과 이미지를 따라간다" 인데, 선언이 없으면 무시 규칙만 고쳤을 때
    // test 가 UP-TO-DATE 로 건너뛴다 — 규칙을 다시 넓혀 놓고도 초록불이 난다.
    //
    // #593 때 .gitignore 쪽 검사를 만들면서 이 선언을 빠뜨렸다. 그래서 그 검사의
    // 빨간불을 보려면 --rerun-tasks 가 필요했다. 빨간불을 보기 어려운 게이트는
    // 있으나 마나다.
    inputs.files(file('.gitignore'), file('.dockerignore'))
            .withPropertyName('ignoreRules')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Ec2BootstrapInstallsWhatComposeNeedsTest 가 읽는 EC2 부팅 스크립트 템플릿(#601).
    // 이 스크립트의 실패는 그 서버 안 로그에만 남는다 — 밖에서는 "안 뜬다" 로만 보인다.
    // 그래서 여기서 막는 것이 특히 싸다.
    inputs.files(fileTree(dir: file('infra/terraform'), include: '**/*.tftpl'))
            .withPropertyName('bootstrapTemplates')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(dir: file('../docs/04-api'), include: '**/*'))
            .withPropertyName('apiContract')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // AuthBlueprintDocSpecTest 가 읽는 구현 청사진(이슈 #9). 계약과 달리 "다음 사람이 무엇을
    // 만들어야 하는가" 를 적은 문서라, 낡으면 계약은 멀쩡한 채 틀린 설계가 지시된다.
    inputs.files(fileTree(dir: file('../docs/02-architecture/backend'), include: '**/*'))
            .withPropertyName('backendBlueprints')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // PackageConventionDocTest 가 읽는 패키지 구조 규약(이슈 #108). 이 문서는 "무엇을 어디에
    // 두는가" 를 정하는데, 낡으면 다음 사람이 틀린 구조로 만들고도 아무도 안 알려 준다.
    // 규약이 없어서 chat 과 chatweb 이 뭉갠 것이 정확히 그 실패였다(#93).
    inputs.file(file('../docs/02-architecture/backend-implementation-guide.md'))
            .withPropertyName('packageConvention')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // DecisionLogTest 가 읽는 ADR 로그(이슈 #15). 인덱스 앵커와 본문이 어긋나도 렌더링은
    // 실패하지 않는다 — 링크가 죽어도 아무도 모른다. 그래서 테스트가 지키는데, 입력으로
    // 선언하지 않으면 ADR 만 고쳤을 때 그 테스트가 아예 돌지 않는다.
    inputs.files(fileTree(dir: file('../docs/99-decisions'), include: '**/*'))
            .withPropertyName('decisionLog')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // DocDriftTest 가 읽는 로드맵·구현현황(이슈 #15).
    inputs.files(fileTree(dir: file('../docs/05-build'), include: '**/*'))
            .withPropertyName('roadmapAndStatus')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // DocDriftTest 가 읽는 ERD·테이블 스키마(이슈 #15).
    inputs.files(fileTree(dir: file('../docs/03-database'), include: '**/*'))
            .withPropertyName('databaseDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // StructureDocDriftTest 가 읽는 화면 목록·탭 정의(이슈 #201·#177). 여기가 빠져 있어서
    // main_shell.dart 의 탭 라벨을 '통계' 로 되돌려 놓고도 test 가 UP-TO-DATE 로 건너뛰어
    // 초록불이 났다 — 빨간불을 확인하다 두 번 속았다. cleanTest 도 안 통했다(캐시에서 복원).
    //
    // 대가는 안다 — 화면 파일 하나만 고쳐도 백엔드 test 태스크가 다시 돈다. 그래도
    // 선언하는 쪽이 맞다. 이 검사들이 지키는 것은 '문서가 코드와 갈리지 않았다' 인데,
    // 코드가 바뀌었는데 안 도는 검사는 지키는 것이 없다.
    inputs.files(fileTree(dir: file('../app/lib/v2'), include: '**/*.dart'))
            .withPropertyName('appV2')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // 같은 테스트가 읽는 화면 명세·정보구조·프론트 구조. 02-architecture 는 backend/ 만
    // 선언돼 있었어서 바로 아래 .md(frontend-structure.md)가 빠져 있었다.
    inputs.files(fileTree(dir: file('../docs/01-design'), include: '**/*'))
            .withPropertyName('designDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree(dir: file('../docs/02-architecture'), include: '*.md'))
            .withPropertyName('architectureDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // MigrationChecksAreCompleteTest 가 읽는 운영 스크립트. 여기가 빠지면 스크립트에서
    // 검사 한 줄을 지워도 test 가 UP-TO-DATE 로 건너뛴다 — 그 테스트가 지키는 것이 바로
    // "빠뜨린 마이그레이션이 없다" 라서, 안 도는 순간 지키는 것이 없어진다(#177 과 같은 함정).
    inputs.files(fileTree(dir: file('../scripts'), include: '**/*.sh'))
            .withPropertyName('opsScripts')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // 테스트는 'test' 프로파일로 돈다 → src/test/resources/application-test.properties.
    // 이게 없으면 jwt.secret 등 기본값 없는 플레이스홀더 10개가 해결되지 않아
    // @SpringBootTest 컨텍스트가 뜨지 않는다. 이슈 #22 참조.
    systemProperty 'spring.profiles.active', 'test'

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

// 커버리지 하한선. 정책은 이슈 #21, 도입 이슈는 #22.
//
// 전역 하한을 걸지 않는 이유: 레거시가 많아 첫날부터 실패한다. 실패하는
// 게이트는 며칠 안에 무시당하고, 그러면 없느니만 못하다. 대신 이번
// 마일스톤(M2)에서 손대는 인증 패키지만 범위로 잡는다.
//
// 하한 이력 (올릴 때는 근거를 남긴다. **내리는 것은 금지.**)
//   0.17  2026-08 도입(#22). 당시 실측 17.2% 를 그대로 하한으로 삼았다.
//         목표 80% 에 바로 걸면 첫 PR부터 빨강이라 "내려가지 않게" 막는 것부터 했다.
//   0.80  2026-08-29(#21). #7(소셜 계정 모델)이 68.1%, #26 머지 후 실측 83.3% 가 되어
//         #21 이 정한 목표치를 넘겼다. 하한이 0.17 에 머물면 게이트가 아무것도 지키지
//         못한다 — 그 상태에서는 이 두 패키지의 테스트를 절반 넘게 지워도 CI 가 통과했다.
def authCoveragePackages = [
        'com/heattrip/heat_trip_backend/OAuth/**',
        'com/heattrip/heat_trip_backend/user/**'
]

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    // 게이트 대상을 인증 패키지로 좁힌다. 나머지는 리포트에만 남는다.
    classDirectories.setFrom(
            files(sourceSets.main.output.classesDirs.collect { dir ->
                fileTree(dir: dir, includes: authCoveragePackages)
            })
    )

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80   // 실측 83.3% (2026-08-29). 이력은 위 주석 참조 (#21)
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}
