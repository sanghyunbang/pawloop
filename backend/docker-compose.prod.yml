# prod 에서만 얹는 것 — 이슈 #609
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 두 가지를 바꾼다.
#   1. DB 데이터를 서버 디스크가 아니라 **별도 EBS 볼륨**(/mnt/data)에 둔다
#   2. 앞에 **Caddy** 를 세워 HTTPS 를 받고, actuator 를 막고, X-Real-IP 를 붙인다
#
# staging 에서는 이 파일을 쓰지 않는다. 거기는 IP 하나만 열린 상태라 프록시가 필요 없고,
# DB 가 날아가도 되는 곳이다.

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: pawloop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddyfile 이 {$PAWLOOP_DOMAIN} · {$ACME_EMAIL} 로 읽는다. 값은 terraform 이
      # 정본이고 부팅 스크립트가 .env 에 써 넣는다.
      PAWLOOP_DOMAIN: ${PAWLOOP_DOMAIN}
      # 소개·약관 페이지의 도메인 (#611). api 와 달리 꼭짓점(apex)이다.
      PAWLOOP_SITE_DOMAIN: ${PAWLOOP_SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 소개·약관 페이지 (#611). `doc` 은 **앱이 읽는 그 파일들**이다 — 사본이 아니다.
      - ./site:/srv/site:ro
      - ../app/assets/terms:/srv/site/doc:ro
      # 발급받은 인증서는 EBS 볼륨에 둔다. 인스턴스를 교체할 때마다 다시 받으면
      # Let's Encrypt 의 발급 한도에 걸린다 — 같은 이름으로 주당 5장이다.
      - /mnt/data/caddy/data:/data
      - /mnt/data/caddy/config:/config
    depends_on:
      # 앱의 healthy 를 기다리지 않는다. 앱이 뜨는 데 1분 넘게 걸리는데, 그동안
      # Caddy 는 인증서를 받아 둘 수 있다. 그 사이 요청은 502 를 받는다 — 맞는 동작이다.
      - app
    healthcheck:
      # 80 을 두드리면 https 로 되돌리는 308 이라 판정이 애매하다. Caddyfile 이
      # 8081 에 200 만 돌려주는 자리를 따로 열어 뒀다.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # 같은 이름의 볼륨을 다시 정의해 **저장 위치만** 바꾼다. 서비스의 volumes 목록은
  # 건드리지 않는다 — 목록을 덮어쓰려 하면 병합 규칙에 기대게 되고, 그건 조용히
  # 틀리는 종류다. 최상위 volumes 는 맵이라 키 단위로 확실하게 덮인다.
  #
  # /mnt/data 는 별도 EBS 볼륨이다. 부팅 스크립트가 붙이고, **이미 파일시스템이
  # 있으면 포맷하지 않는다.** 인스턴스를 교체해도 이 데이터는 남는다.
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/mysql
