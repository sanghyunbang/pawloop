# 테스트 전용 설정. 이슈 #22(CI) 참조.
#
# 왜 필요한가: application.properties 에는 jwt.secret 등 기본값 없는
# 플레이스홀더가 10개 있고, 그 값들은 application-dev/prod.properties 에만
# 있다. 테스트는 프로파일 없이 돌아서 @SpringBootTest 컨텍스트가
# "Could not resolve placeholder 'jwt.secret'" 로 죽고 있었다.
#
# 여기 있는 값은 전부 **가짜**다. 실제 자격증명을 절대 넣지 말 것.
# 테스트가 진짜 키를 요구한다면 그 테스트 자체가 잘못 설계된 것이다.

# --- DB: 여기에 데이터소스를 적지 않는다 (이슈 #49) ---
# 스프링 컨텍스트를 띄우는 테스트는 전부 AbstractMySqlIntegrationTest 를 상속하고,
# 데이터소스·dialect·ddl-auto 는 그 @DynamicPropertySource 가 실제 MySQL 8.0
# 컨테이너로 넣는다.
#
# 예전에는 여기에 H2(MODE=MySQL)가 있었다. 그게 모든 스프링 테스트의 기본값이었고,
# 실 MySQL 을 쓰는 건 검색 테스트 한 클래스뿐이었다. H2 는 근사치라 FULLTEXT
# MATCH...AGAINST · 공간 함수 · 콜레이션 · information_schema 가 전부 다르다.
#
# 여기에 다시 적지 말 것 — 적는 순간, 베이스 클래스 상속을 빼먹은 테스트가
# 에러 없이 H2 로 돌아간다. 그건 초록불이 거짓말을 하는 형태다.
# IntegrationTestsRunOnMySqlTest 가 상속 누락을 잡는다.

# --- JWT ---
# HS256 은 최소 32바이트 키를 요구한다. 아래는 정확히 그 길이의 더미.
jwt.secret=test-only-secret-key-32bytes-min!!
jwt.expiration=3600000
# 14일. 운영 기본값과 같은 값을 쓴다 — 만료 경계는 고정 Clock 으로 테스트한다. (이슈 #9)
jwt.refresh-expiration=1209600000

# --- OAuth2: oauth2Login() 이 ClientRegistrationRepository 를 요구한다 ---
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-client-secret
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# --- 외부 API: 전부 더미. 테스트는 네트워크를 타면 안 된다 ---
TOUR.API.SECRET=test-tour-api-secret
kakao.api.base-url=http://localhost:0
kakao.api.rest-key=test-kakao-rest-key
llm.recommender.base-url=http://localhost:0

cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=test-bucket
cloud.aws.cloudfront.domain=https://cdn.test.local

# --- 배치·스케줄러는 테스트에서 끈다 ---
backfill.kakao.enabled=false

# --- 관측: 외부 전송 끄기 ---
observability.slack.enabled=false
observability.openai.enabled=false

# --- 로그: 테스트 출력이 SQL 로 뒤덮이지 않게 ---
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# --- Rate limit: 인증 버킷만 테스트에서 넉넉히 (이슈 #14) ---
# 통합 테스트 한 클래스가 한 창(60초) 안에 POST /auth/token/refresh 와 소셜 코드 교환을
# 수십 번 두드린다. 운영 기본값(20)을 그대로 쓰면 테스트들이 서로의 카운터를 소진해 429 로
# 깨지는데, 그건 각 테스트가 검사하려는 것과 아무 관계 없는 실패다.
#
# 필터를 끄지 않는 이유: 끄면 필터가 체인에 붙어 있는지조차 확인되지 않는다. 한도 자체는
# ApiRateLimitFilterTest 가 필터 단위로 잠근다.
app.security.rate-limit.auth-max-requests=100000

# login 버킷도 같은 이유다. #14 이후 `POST /auth/signup` 이 이 버킷을 함께 쓰는데,
# AuthContractIntegrationTest 한 클래스가 계정을 11개 만든다. 운영 기본값(10)이면
# 11번째 가입이 429 가 되고, 그 테스트가 검사하려던 것(계약의 401·User 스키마)은
# 확인조차 되지 않는다 — 실제로 그렇게 두 건이 깨졌다.
#
# 여기서도 필터를 끄지 않는다. 한도 자체는 ApiRateLimitFilterTest 가 필터 단위로
# 잠그고(`signupEndpoint_isRateLimited`·`signupAndLogin_shareTheSameBucket`),
# 체인 배선은 ApiRateLimitFilterChainOrderIntegrationTest 가 잠근다.
app.security.rate-limit.login-max-requests=100000

# group-write 버킷도 같은 이유다 (이슈 #75). #75 가 `POST /api/groups` 와
# `POST /api/chat/rooms/{roomId}/invites` 를 이 버킷에 등록했는데,
# FamilyGroupInviteIntegrationTest 한 클래스가 가족을 20개 넘게 만들고 초대코드를 그보다
# 더 많이 발급한다. MockMvc 요청은 전부 같은 IP(127.0.0.1)라 한 카운터를 쓰므로 운영
# 기본값(30)이면 절반이 429 가 되고, 그 테스트들이 검사하려던 것(동시 참여·멱등·인가)은
# 확인조차 되지 않는다 — 실제로 그렇게 9건이 깨졌다.
#
# 여기서도 필터를 끄지 않는다. 한도 자체는 ApiRateLimitFilterTest 가 필터 단위로 잠그고
# (`groupCreation_isRateLimited`·`inviteIssuing_isRateLimited`·
# `groupCreationAndInviteIssuing_shareTheSameBucket`), 그 버킷이 읽기·회수·참여를 잘못
# 잡지 않는다는 것도 같은 파일이 잠근다(`readsAndRevokeAndJoin_areNotInTheGroupWriteBucket`).
app.security.rate-limit.group-write-max-requests=100000

# 커뮤니티 두 버킷도 같은 이유다 (이슈 #170 에서 만들고 #211 에서 넘쳤다).
# CommunityIntegrationTest 한 클래스가 글·댓글·반응·삭제를 60번 넘게 쓴다 — 동시 반응
# 테스트 하나만 해도 열여섯이다. MockMvc 요청은 전부 같은 IP(127.0.0.1)라 한 카운터를
# 쓰므로 운영 기본값(쓰기 60)이면 뒤쪽 절반이 429 가 되고, 그 테스트들이 검사하려던
# 것(삭제 인가·멱등·시각 오프셋)은 확인조차 되지 않는다 — 실제로 그렇게 일곱이 깨졌다.
#
# 여기서도 필터를 끄지 않는다. 한도 자체는 ApiRateLimitFilterTest 가 필터 단위로 잠근다
# (`communityFeed_isRateLimited`·`communityWrites_shareOneBucket`·
# `communityReadAndWrite_areSeparateBuckets`), 그리고 숫자가 아닌 글 id 도 읽기 버킷이
# 덮는다는 것을 같은 파일이 잠근다 — permitAll 과 같은 집합이어야 하기 때문이다.
app.security.rate-limit.community-read-max-requests=100000
app.security.rate-limit.community-write-max-requests=100000
