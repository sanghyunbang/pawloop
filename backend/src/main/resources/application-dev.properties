# Development profile.
# Load local .env values when present. Real secrets must stay out of Git.
spring.config.import=optional:file:./.env[.properties],optional:file:/config/.env[.properties]

server.port=${SERVER_PORT:8080}
app.base-url=${APP_BASE_URL:http://10.0.2.2:8080}

# --- datasource ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${MYSQL_DATABASE:heat_trip_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# --- JWT ---
jwt.secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me-1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}
# refresh 토큰 수명. 기본 14일(1209600000ms). 액세스 토큰(jwt.expiration, 1시간)과 달리
# 이 값은 '재로그인 없이 앱을 쓸 수 있는 기간'이다. RefreshTokenService 가 이 값으로
# refresh_token.expires_at 을 계산하고, 야간 정리 잡이 그 시각이 지난 행을 지운다. (이슈 #9)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# --- OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${app.base-url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:dev-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:dev-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${app.base-url}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id


# --- Apple — Sign in with Apple (#301, ADR-0022 결정 3) ---
# 키 셋(APPLE_TEAM_ID · APPLE_KEY_ID · APPLE_PRIVATE_KEY)은 사장님이 Apple Developer 에서 발급한다 —
# .env.example 의 절차. 비어 있으면 서버는 뜨고 카카오·구글은 그대로이며, Apple 버튼만
# error=apple_not_configured 로 앱에 돌아간다.
spring.security.oauth2.client.registration.apple.client-id=${APPLE_CLIENT_ID:dev-apple-services-id}
# 자리표시다 — 실제 client_secret 은 요청마다 AppleClientSecret 이 .p8 로 서명해 끼운다(ES256 JWT, 10분).
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET_PLACEHOLDER:signed-at-runtime}
spring.security.oauth2.client.registration.apple.client-name=Apple
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri=${app.base-url}/login/oauth2/code/apple
# openid 가 있어야 Spring 이 OIDC 경로(id_token 검증)를 탄다. Apple 은 userinfo 엔드포인트가 없다.
# name 은 안 받는다 — 첫 응답의 폼 필드로만 오고 두 번째부터 갱신할 길이 없다(AppleOAuth2User).
spring.security.oauth2.client.registration.apple.scope=openid,email
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
# email 을 받으려면 Apple 이 form_post 를 요구한다 — 콜백이 cross-site POST 로 온다. 그 POST 에
# 세션 쿠키가 실리려면 SameSite=None; Secure 여야 한다(prod 프로퍼티의 server.servlet.session.cookie.*).
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize?response_mode=form_post
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub
# issuer-uri 는 일부러 안 적는다 — 적으면 기동 때 Apple 의 discovery 문서를 받으러 가서 망이 없는
# CI·개발기에서 부팅이 실패한다. 발급자 검사는 AppleSignInConfig 가 손으로 건다.

app.security.oauth.apple.team-id=${APPLE_TEAM_ID:}
app.security.oauth.apple.key-id=${APPLE_KEY_ID:}
app.security.oauth.apple.private-key=${APPLE_PRIVATE_KEY:}

# 네이버 클라이언트 등록은 **없다.** ADR-0010 이 보류로 확정했다 (#15).
# 등록이 살아 있으면 /oauth2/authorization/naver 가 열려서, 계약(openapi.yaml)이
# provider 를 kakao·google 로 광고하는데 서버는 naver 를 응답에 실을 수 있게 된다 —
# 계약이 지킬 수 없는 약속을 하는 상태다. 되살리려면 ADR-0010 을 먼저 고쳐라.
# 매핑 파서(NaverOAuth2User)도 함께 걷어냈다.


# --- Tour API ---
TOUR.API.SECRET=${TOUR_API_SECRET:dev-tour-api-secret}

# --- AWS / S3 ---
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:dev-access-key}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:dev-secret-key}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${AWS_S3_BUCKET:dev-bucket}
cloud.aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN:https://cdn.example.local}
