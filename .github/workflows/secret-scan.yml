# 비밀값이 커밋에 섞여 들어오는지 본다 — 이슈 #796.
#
# ## ⚠️ 이 파일이 왜 루트에 있나
#
# 깃헙 액션은 **저장소 루트의 `.github/workflows/`** 만 읽는다. 다른 자리에 두면
# 등록조차 되지 않고, **아무 에러도 안 난다.**
#
# 이 파일은 2026-06-29 부터 2026-10-22 까지 `backend/.github/workflows/` 에 있었다.
# `backend/` 가 독립 저장소였을 때는 그 자리가 루트였으니 돌았다. 모노레포로 합칠 때
# 한 칸 내려앉았고, 그때부터 **한 번도 돈 적이 없다.** 그런데 문서에는 "GitHub Actions
# gitleaks secret scan 추가" 라고 적혀 있었다.
#
# 파일이 있고, 문서에 적혀 있고, 에러도 안 난다 — **없는 것보다 나쁘다.** 있다고 믿게
# 되니까. 2026-10-22 공개 전환 점검에서 비밀값을 손으로 다 훑어야 했던 이유다.
#
# ## 이것이 전부가 아니다
#
# 이 스캔은 **들어오는 커밋**을 본다. 깃헙이 저장소 설정으로 제공하는 비밀값 스캔과
# 푸시 차단은 별개이고, 그쪽이 푸시 시점에 막아 준다. 둘 다 켜 두는 것이 맞다.
#
# 그리고 패턴 검사는 **접두사가 있는 키**만 잡는다. `supersecret` 같은 평범한 낱말
# 비밀번호는 어떤 패턴에도 안 걸린다 — 그 한계와 대신 쓸 방법은
# `backend/docs/operations/public-operation-transition/README.md` 에 있다.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks:
    name: 비밀값 스캔
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 히스토리를 다 가져온다. 얕게 받으면 과거 커밋을 못 본다.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 오탐 허용 목록은 루트의 `.gitleaks.toml` 이다. gitleaks 가 거기서 읽는다.
