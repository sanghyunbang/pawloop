name: 버그 (Bug)
description: 의도대로 동작하지 않음
title: ""
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        **재현 절차가 없는 버그 리포트는 고칠 수 없습니다.** 재현이 안 되면 그것도 적어주세요.

        **목표(🎯) 아래에 만듭니다.** 만든 뒤 오른쪽 `Relationships` 에서 부모 이슈로 목표를 고르거나, 목표 이슈의 `Sub-issues` 에서 붙입니다.
        라벨은 **3개까지** — 기능 `area/` 1 · 종류 `type/` 1 · 우선순위 `prio/` 1. 규칙은 [프로젝트 규약 #4](https://github.com/sanghyunbang/pawloop/issues/4) 에 있습니다.
  - type: textarea
    id: symptom
    attributes:
      label: 증상 — 무슨 일이 일어나나
      placeholder: 소셜 로그인 후 홈에 진입하면 프로필이 비어 있고, 서버 로그에 500이 찍힌다.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작 vs 실제 동작
      value: |
        **기대**: 
        **실제**: 
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 원인 (아는 만큼)
      description: 파일 경로·줄 번호·로그·스택트레이스. 추측이면 추측이라고 적어주세요.
  - type: dropdown
    id: env
    attributes:
      label: 환경
      multiple: true
      options:
        - Android
        - iOS
        - 백엔드 (로컬)
        - 백엔드 (운영)
        - 상관없음
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: 완료 조건 (DoD)
      description: 무엇이 참이 되면 이 버그가 고쳐진 것인가. 회귀 테스트가 있으면 더 좋습니다.
    validations:
      required: true
