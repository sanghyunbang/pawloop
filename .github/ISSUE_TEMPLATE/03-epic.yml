name: 목표(🎯) — 하위 이슈를 묶는 큰 일
description: 끝이 있는 큰 일 — 하위 이슈가 모두 닫히면 끝난다
title: "🎯 "
labels: ["meta/epic"]
body:
  - type: markdown
    attributes:
      value: |
        모든 작업은 어느 목표의 하위 이슈입니다. 만든 뒤 `Sub-issues` 섹션에서 하위 이슈를 연결하면 진행률이 자동으로 표시됩니다.
        라벨은 `meta/epic`(자동) · 기능 `area/` 1 · 우선순위 `prio/` 1 — 우선순위는 **목표끼리의 순서**입니다.
        만든 뒤 [목표 목록 #20](https://github.com/sanghyunbang/pawloop/issues/20) 의 표에 한 줄 더해 주세요.
  - type: textarea
    id: goal
    attributes:
      label: 무엇이 끝나면 이 목표가 닫히나
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 상태 (as-is)
      description: 이미 있는 자산과 안 되는 것. 표나 mermaid 다이어그램을 권장합니다.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 목표 설계 (to-be)
      description: 어떤 모양으로 만들 것인가. 다이어그램으로.
  - type: textarea
    id: breakdown
    attributes:
      label: 쪼개기 계획
      description: 어떤 서브이슈로 나눌지. 만든 뒤 실제 서브이슈로 연결하고 여기는 지워도 됩니다.
  - type: textarea
    id: dod
    attributes:
      label: 목표 완료 조건
      description: 서브이슈 전체를 관통하는 인수 조건. 사용자가 실제로 할 수 있게 되는 일로 쓰면 좋습니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위 밖
      description: 이번에 하지 않는 것. 나중에 "왜 이건 안 했지"를 막아줍니다.
